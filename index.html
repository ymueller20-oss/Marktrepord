  ['Das Kolbenring-Beispiel','Ein neutrales Teil, das ein Mechaniker einbaut, wenn etwas kaputt ist. Daraus wird: ein Sportwagen, eine blitzsaubere Fachwerkstatt, ein ruhiger Experte und ein Besitzer, der Rennen fährt. Die Ringe werden als Hochleistungsteil eingebaut, nicht als Reparatur.'],
  ['Bilder statt Worte','Solche Bilder würden ausgesprochen kitschig klingen. Als Bild werden sie nur angedeutet und dringen unbemerkt ein.']],
 qs:[
  {t:'mc',q:'Was ist das primäre Bild eines Produkts?',o:['Das Bild, das es in den Köpfen der Kunden bereits hat','Das Hauptfoto der Anzeige','Das Logo','Das erste Produkt einer Marke'],a:0,w:'Es ist der Rohstoff, mit dem du arbeiten musst.'},
  {t:'tf',q:'Ein ungünstiges Produktbild kann man einfach durch ein schöneres ersetzen.',a:false,w:'Menschen glauben nicht, dass ein Produkt ist, was es nicht ist.'},
  {t:'mc',q:'Welche zwei Schritte nennt Schwartz, um neue Bilder in ein Produkt einzubauen?',o:['Intensität des primären Bildes ändern und es als Brücke zu günstigeren Bildern nutzen','Bild löschen und neu anfangen','Preis senken und Rabatt geben','Logo ändern und Farbe wechseln'],a:0,w:'Das primäre Bild bleibt die Grundlage.'},
  {t:'sc',s:'Eine Anzeige zeigt einen Kolbenring nicht beim Reparieren eines alten Autos, sondern als Tuning-Teil in einem Sportwagen in einer Profiwerkstatt.',q:'Was passiert hier?',o:['Ein neutrales primäres Bild wird mit aufregenden Bildern verwoben','Das Produkt wird verleugnet','Der Preis wird gesenkt','Die Konkurrenz wird angegriffen'],a:0,w:'Die Grundlage (Mechaniker, Einbau) bleibt, wird aber dramatisiert.'},
  {t:'gap',q:'Die neuen Bilder müssen aus dem primären Bild ___ und logisch zu ihm passen.',o:['hervorgehen','verschwinden','streiten','fliehen'],a:0,w:'Sonst glaubt man sie nicht.'},
  {t:'why',q:'Warum wirken Identifikationsbilder oft besser als Bild denn als Text?',o:['Weil sie angedeutet statt ausgesprochen werden und deshalb ohne Widerstand angenommen werden','Weil Bilder billiger sind','Weil niemand liest','Weil Text verboten ist'],a:0,w:'Ausgesprochen würden sie kitschig wirken.'},
  {t:'err',s:'Eine Marke für günstige Haushaltsreiniger zeigt plötzlich nur noch Adlige in Schlössern.',q:'Was wird wahrscheinlich passieren?',o:['Die Kunden können den Sprung nicht nachvollziehen, die Unglaubwürdigkeit schadet auch den Leistungsversprechen','Der Umsatz explodiert','Nichts','Die Konkurrenz kopiert es'],a:0,w:'Ohne Brücke vom primären Bild scheitert die Identifikation.'}],
 ex:{q:'Erkläre, was das primäre Bild eines Produkts ist und warum man ein negatives Bild nicht einfach ersetzen kann. Was tut man stattdessen?',k:['Das primäre Bild ist die Persönlichkeit, die das Produkt in den Köpfen schon hat','Menschen glauben nicht, dass ein Produkt ist, was es nicht ist, Werbung kann akzeptierte Bilder nicht widerlegen','Stattdessen die Intensität ändern: Gutes verstärken, Negatives abschwächen','Das primäre Bild als Brücke nutzen, um passende, günstigere Bilder einzuweben']}},
 {title:'Grenzen und Quellen',cards:[
  ['Unglaubwürdige Bilder schaden doppelt','Eine Seife für den Massenmarkt warb mit einem Bild der feinen Gesellschaft. Die Kunden konnten sich nicht damit identifizieren. Der Unglaube sprang sogar auf die Leistungsversprechen über, der Umsatz brach ein.'],
  ['Prüffrage 1','Glauben die Menschen heute schon, dass das Produkt diese Eigenschaften hat? Und können sie sich mit ihrem jetzigen Leben oder ihrem nächsten Schritt damit identifizieren? Wenn beides ja ist, kannst du das Bild direkt nutzen.'],
  ['Prüffrage 2: die Brücke','Wenn nicht: Welches Bild, das der Leser schon akzeptiert, verbindet sein jetziges Denken mit dem, was er am Ende glauben soll? Wer verlangt, über eine Schlucht zu springen, scheitert. Wer eine Brücke von seiner Seite aus baut, kann ihn fast überallhin führen.'],
  ['Bilder aus dem Produkt selbst','Das physische Produkt liefert Bildquellen: sein Aussehen, seine Bestandteile und seine technische Herkunft. Familienautos übernahmen Formen von Renn- und Sportwagen.'],
  ['Herkunft zeigen','Ein Mundwasser kam in einer Flasche, die wie ein Gefäß aus der Arztpraxis aussah, mit eisblauer Flüssigkeit. Das sagte sofort: Das ist Medizin, das wirkt. Elektronische Bauteile kann man mit Radar und Raumfahrt verbinden und so Abenteuer in den Alltag holen.']],
 qs:[
  {t:'mc',q:'Was geschah mit der Massenseife, die mit feiner Gesellschaft warb?',o:['Die Kunden glaubten es nicht, und der Unglaube übertrug sich auf die Leistungsversprechen','Der Umsatz stieg stark','Die Kampagne wurde verboten','Nichts'],a:0,w:'Unglaubwürdige Identifikation schadet dem ganzen Produkt.'},
  {t:'mc',q:'Was ist eine Glaubwürdigkeitsbrücke?',o:['Ein Bild, das der Leser schon akzeptiert und das zum Zielbild führt','Ein Rabatt','Ein Prominenter','Eine Garantie'],a:0,w:'Sie beginnt auf der Seite des Lesers.'},
  {t:'tf',q:'Auch Aussehen, Bestandteile und Herkunft des physischen Produkts können Identifikationsbilder liefern.',a:true,w:'Etwa Laborflaschen-Form oder Bauteile aus der Raumfahrt.'},
  {t:'sc',s:'Ein Gesichtsspray wird in einer schlichten Flasche verkauft, die an Laborgefäße erinnert.',q:'Welche Bildquelle wird genutzt?',o:['Die Herkunft bzw. der technische Hintergrund','Eine Charakterrolle','Ein Preis','Eine Fallgeschichte'],a:0,w:'Die Form sagt: wissenschaftlich, wirksam.'},
  {t:'gap',q:'Wer verlangt, dass der Leser über eine Glaubwürdigkeits-___ springt, scheitert.',o:['Schlucht','Mauer','Hürde','Treppe'],a:0,w:'Die Brücke muss auf seiner Seite beginnen.'},
  {t:'why',q:'Warum muss eine Brücke auf der Seite des Lesers beginnen?',o:['Weil er nur von dem aus weitergeht, was er schon glaubt','Weil es kürzer ist','Weil es billiger ist','Weil Brücken symmetrisch sind'],a:0,w:'Von dort lässt er sich fast überallhin führen.'},
  {t:'err',s:'Ein Texter sagt: „Das Produkt ist neutral und langweilig, also lasse ich das Produkt einfach weg und zeige nur Glamour.“',q:'Was würde Schwartz einwenden?',o:['Die neuen Bilder müssen auf dem primären Bild aufbauen, sonst glaubt sie niemand','Gute Idee','Er braucht mehr Glamour','Produkte sind egal'],a:0,w:'Das Kolbenring-Beispiel zeigt, wie man das Neutrale dramatisiert, statt es zu verstecken.'},
  {t:'match',q:'Ordne zu.',p:[['Belesen','Charakterrolle'],['Führungskraft','Leistungsrolle'],['Laborflasche','Herkunft'],['Tattoo','Intensivierung']]}],
 ex:{q:'Erkläre, was eine Glaubwürdigkeitsbrücke ist und wann du sie brauchst.',k:['Man braucht sie, wenn Kunden nicht glauben, dass das Produkt die gewünschten Eigenschaften hat','Oder wenn sie die Eigenschaften nicht auf ihr eigenes Leben beziehen','Die Brücke ist ein Bild, das der Leser schon akzeptiert, und von dort führt man zum Zielbild','Ohne Brücke scheitert die Anzeige, der Unglaube kann sogar die Leistungsversprechen beschädigen']}}
]},
{key:'b7',col:'yel',title:'Graduierung',sub:'Glauben aufbauen, bevor du behauptest',lessons:[
 {title:'Was Glaube ist',cards:[
  ['Die dritte Kraft','Wunsch und Identifikation reichen nie allein. Erst wenn sie mit Glauben verschmelzen, entsteht absolute Überzeugung: das Gefühl, richtig zu entscheiden.'],
  ['Glaube ist Sicherheit','Glaube ist das Bild der Welt plus das tröstende Gefühl, dass sie Sinn ergibt und vorhersehbar ist. Die Grundmuster lernen wir als Kinder. Eine Überzeugung zu zerschlagen hieße, wieder zum Kind zu werden, und das tun Erwachsene nicht freiwillig.'],
  ['Die Grundregel','Verletzt du die bestehenden Überzeugungen deines Lesers auch nur ein wenig, kann dich kein Versprechen retten. Bündelst du die Kraft seines Glaubens hinter nur einer einzigen Behauptung, verkauft sie mehr als alle halb geglaubten Versprechen der Konkurrenz.'],
  ['Graduierung','Beginne mit Fakten, die der Leser schon akzeptiert, und führe ihn Schritt für Schritt zu immer entfernteren Fakten, auf die er jeweils vorbereitet ist. Graduierung bestimmt nicht den Inhalt, sondern die Architektur der Anzeige.'],
  ['Zwei Kraftquellen','Jede Aussage hat zwei Kraftquellen: ihren Inhalt und die Vorbereitung davor. Du kannst sie stärken, indem du den Inhalt steigerst oder indem du sie an die richtige Stelle setzt und besser vorbereitest.'],
  ['Bewusstsein heißt Bereitschaft','Schwartz definiert Bewusstsein neu als Bereitschaft zu akzeptieren. Deshalb ist die stärkste Behauptung nicht immer die stärkste Headline. Versandhändler testen eine Power-Headline gegen eine glaubwürdigere, die dann Schritt für Schritt zu denselben Behauptungen führt.']],
 qs:[
  {t:'mc',q:'Was entsteht, wenn Wunsch mit Glauben verschmilzt?',o:['Absolute Überzeugung','Misstrauen','Langeweile','Kaufreue'],a:0,w:'Das Gefühl, mit der Wahl richtig zu liegen.'},
  {t:'mc',q:'Was ist die Grundregel des Glaubens laut Schwartz?',o:['Verletzt du bestehende Überzeugungen, rettet dich kein Versprechen','Je mehr Versprechen, desto besser','Leser glauben alles, was gedruckt ist','Überzeugungen sind leicht zu ändern'],a:0,w:'Dafür ist ein einziger voll geglaubter Punkt enorm stark.'},
  {t:'mc',q:'Was bestimmt die Graduierung?',o:['Die Architektur der Anzeige, also die Reihenfolge und Vorbereitung','Den Inhalt der Versprechen','Die Farbe','Den Preis'],a:0,w:'Inhalt kommt vom Wunsch, Bilder von der Identifikation, der Aufbau von der Graduierung.'},
  {t:'tf',q:'Die stärkste Behauptung gehört immer in die Headline.',a:false,w:'Ohne Vorbereitung wird sie oft nicht geglaubt. Dann ist eine glaubwürdigere Headline mit Brücke besser.'},
  {t:'gap',q:'Jede Aussage hat zwei Kraftquellen: ihren Inhalt und ihre ___.',o:['Vorbereitung','Länge','Schrift','Farbe'],a:0,w:'Die richtige Stelle macht eine Aussage glaubwürdiger.'},
  {t:'why',q:'Warum ändern Erwachsene ihre Grundüberzeugungen so ungern?',o:['Weil diese Sicherheit geben und ihr Zerfall bedeuten würde, wieder unsicher wie ein Kind zu sein','Weil sie stur sind','Weil sie nichts lernen wollen','Weil es anstrengend ist zu lesen'],a:0,w:'Glaube ist ein starkes emotionales Bedürfnis.'},
  {t:'err',s:'Ein Texter sagt: „Je mehr Versprechen ich stapele, desto überzeugender wird die Anzeige.“',q:'Was zeigt Schwartz?',o:['Ein voll geglaubtes Versprechen ist viel stärker als viele halb geglaubte','Er hat recht','Versprechen sind unwichtig','Man braucht genau zehn'],a:0,w:'Besser die Glaubwürdigkeitsstruktur eines Versprechens stärken.'}],
 ex:{q:'Erkläre die Grundidee der Graduierung und warum die stärkste Behauptung oft nicht in die Headline gehört.',k:['Beginnen mit Aussagen, die der Leser schon glaubt','Ihn Schritt für Schritt zu weiteren Aussagen führen, auf die er jeweils vorbereitet ist','Bewusstsein ist Bereitschaft zu akzeptieren: Eine unvorbereitete starke Behauptung wird nicht geglaubt','Darum oft eine glaubwürdigere Headline und die starke Behauptung später, wenn sie vorbereitet ist']}},
 {title:'Die TV-Handbuch-Anzeige',cards:[
  ['Das Problem','1951 sollte ein Handbuch für Fernsehreparaturen verkauft werden. Die direkte Headline „Spare bis zu 100 Dollar im Jahr bei Reparaturen“ brachte keinen Gewinn. Die Leute hielten sich nicht für Bastler und den Fernseher für ein kompliziertes Monster.'],
  ['Die neue Headline','Statt eines Versprechens fragte sie, warum man Fernsehbesitzern bestimmte Fakten verschwiegen habe. Sie versprach nur Enthüllung und spiegelte den Ärger und Verdacht, den viele über Reparaturkosten schon hatten.'],
  ['Die Ja-Kette','Dann eine Einschlussfrage, auf die 95 Prozent mit Ja antworten: Wurde Ihr Gerät nach 1947 gekauft? Erst danach das erste Versprechen, eingeleitet mit „Dann …“, mit Symptomen, die jeder kennt. Wie die Ersparnis entsteht, bleibt bewusst offen.'],
  ['Ziel 1: Geräte sind robust','Zuerst muss der Leser glauben, dass Fernseher gar nicht so empfindlich sind. Dafür: Dauertests der Hersteller und eine logische Kette, die mit „Wenn Ihr Gerät richtig gepflegt würde …“ beginnt.'],
  ['Ziel 2: Ich kann das selbst','Erst jetzt kommt der neue Gedanke, dass man kein Bastler sein muss. Er wird so eingeleitet, als sei er nur die Fortsetzung des schon Akzeptierten: mit „Und“, mit „am wichtigsten“ und mit dem Echo „diese Experten haben entdeckt“.'],
  ['Der Schluss','Man bezahlt den Techniker nicht für seine Arbeit, sondern für sein Wissen. Hat man das Wissen selbst, muss man ihn nicht bezahlen. Erst an diesem Punkt kommt das Buch ins Spiel.']],
 qs:[
  {t:'mc',q:'Warum scheiterte die erste Headline „Spare bis zu 100 Dollar bei TV-Reparaturen“?',o:['Die Leser glaubten nicht, dass sie selbst reparieren können','Der Betrag war zu klein','Die Anzeige war zu bunt','Es gab keine Fernseher'],a:0,w:'Die Behauptung war wahr, aber nicht vorbereitet.'},
  {t:'mc',q:'Was ist eine Einschlussfrage?',o:['Eine Frage, die fast alle mit Ja beantworten und die den Leser einbezieht','Eine Frage, die niemand beantworten kann','Eine rhetorische Frage ohne Antwort','Eine Frage nach dem Preis'],a:0,w:'Sie startet eine Ja-Kette.'},
  {t:'tf',q:'Die Anzeige erwähnt das Selbstreparieren gleich im ersten Absatz.',a:false,w:'Sie vermeidet es lange, weil der Leser sonst umblättern würde.'},
  {t:'mc',q:'Welche zwei Ziel-Schlussfolgerungen baut die Anzeige auf?',o:['Geräte sind robust, und kleine Störungen kann man selbst beheben','Reparaturen sind teuer und Techniker unehrlich','Neue Geräte sind besser und billiger','Bücher sind nützlich und günstig'],a:0,w:'Erst danach folgt der logische Schluss: das Wissen kaufen.'},
  {t:'gap',q:'Man zahlt den Techniker nicht für seine Arbeit, sondern für sein ___.',o:['Wissen','Werkzeug','Auto','Lächeln'],a:0,w:'Daraus folgt: Wer das Wissen hat, spart das Geld.'},
  {t:'why',q:'Warum wird der neue Gedanke „Ich kann das selbst“ mit „Und, am wichtigsten …“ eingeleitet?',o:['Damit er wie die Fortsetzung der schon akzeptierten Aussagen wirkt und deren Glaubwürdigkeit erbt','Weil es höflich ist','Weil es kürzer ist','Zufall'],a:0,w:'So entsteht kein Bruch im Fluss der Zustimmung.'},
  {t:'err',s:'Ein Texter sagt: „Bei der TV-Anzeige hätte man doch direkt schreiben können: Reparieren ist kinderleicht!“',q:'Warum hätte das wahrscheinlich nicht gewirkt?',o:['Die Leser hätten es nicht geglaubt, weil es ihren Überzeugungen widersprach und nicht vorbereitet war','Weil kinderleicht verboten ist','Es hätte besser gewirkt','Weil es zu kurz ist'],a:0,w:'Laut Buch stand genau so ein Satz in der ersten Version, und sie scheiterte.'}],
 ex:{q:'Erkläre, warum die TV-Anzeige das Thema Selbstreparieren so lange vermeidet und wie sie den Leser stattdessen zum Ziel führt.',k:['Die Leser hielten sich nicht für fähig zu reparieren, eine direkte Aussage hätte sie vertrieben','Sie beginnt mit akzeptierten Gefühlen (Ärger über Kosten) und Fragen, auf die fast alle mit Ja antworten','Sie beweist zuerst, dass Geräte robust sind, und dann, dass man kleine Störungen selbst beheben kann','Erst am Ende folgt der Schluss: Wer das Wissen hat, spart das Geld, also das Buch kaufen']}},
 {title:'Werkzeuge des Glaubens',cards:[
  ['1. Die Einschlussfrage','Eine Frage, auf die dein Interessent Ja sagt. Er merkt: Hier geht es um mich. Nach den ersten Zustimmungen haben deine Empfehlungen besonderes Gewicht.'],
  ['2. Detaillierte Identifikation','Statt zu fragen, beschreibst du die Symptome und Probleme des Lesers so genau, dass er denkt: Der kennt sich aus. Dafür braucht es Recherche, jedes Wort muss stimmen.'],
  ['3. Falschen Überzeugungen widersprechen','„Vergiss alles, was du über … gehört hast.“ Das lockert alte Grenzen und bereitet starke Behauptungen vor. Funktioniert vor allem mit einer starken Autorität im Rücken.'],
  ['4. Die Sprache der Logik','Wörter wie „deshalb“, „hier ist der Grund“, „bewiesen von Tausenden“ oder „unmöglich? Keineswegs“ tragen nach Jahrhunderten in Gericht und Wissenschaft selbst den Klang von Beweis.'],
  ['5. Syllogistisches Denken','Eine Kette logischer Gleichungen: Größerer Funke bedeutet stärkere Explosion, stärkere Explosion bedeutet mehr Kraft. Und dieses Produkt liefert den größten Funken. Der Leser spürt, dass es funktionieren muss.'],
  ['6. Weitere Formen','Wenn-dann-Strukturen. Echo-Wiederholung („diese Experten fanden …“). Versprechen-Beweis-Versprechen, damit keine Zeit zum Zweifeln bleibt. Absatz-Parallelismus, der die Akzeptanz eines Satzes auf den nächsten überträgt.']],
 qs:[
  {t:'sc',s:'Eine Anzeige beginnt: „Wachst du manchmal um 3 Uhr nachts auf und kannst nicht wieder einschlafen?“',q:'Welches Werkzeug ist das?',o:['Einschlussfrage','Syllogismus','Widerspruch gegen falsche Überzeugungen','Echo-Wiederholung'],a:0,w:'Wer Ja sagt, fühlt sich gemeint.'},
  {t:'sc',s:'„Vergessen Sie alles, was man Ihnen über Muskelaufbau ab 50 erzählt hat.“',q:'Welches Werkzeug ist das?',o:['Widerspruch gegen falsche Überzeugungen','Einschlussfrage','Detaillierte Identifikation','Sprache der Logik'],a:0,w:'Alte Grenzen werden gelockert, am besten mit Autorität.'},
  {t:'mc',q:'Warum wirken Wörter wie „deshalb“ oder „hier ist der Grund“?',o:['Sie tragen durch jahrhundertelangen Gebrauch in Logik und Recht selbst den Klang von Beweis','Sie sind kurz','Sie sind modern','Sie wirken nicht'],a:0,w:'Sie geben Versprechen den Geschmack von Überzeugung.'},
  {t:'mc',q:'Was macht eine syllogistische Kette?',o:['Sie verbindet Aussagen logisch so, dass das Ergebnis unausweichlich wirkt','Sie wiederholt den Preis','Sie zitiert Prominente','Sie stellt Fragen'],a:0,w:'Funke → Explosion → Kraft.'},
  {t:'tf',q:'Detaillierte Identifikation funktioniert auch ohne Kenntnis der Kunden.',a:false,w:'Jedes Wort muss stimmen, sonst zerreißt das Glaubwürdigkeitsnetz.'},
  {t:'why',q:'Warum hilft die Abfolge Versprechen-Beweis-Versprechen?',o:['Der Leser bekommt keine Pause, um zu zweifeln','Weil sie kürzer ist','Weil sie lustig ist','Weil sie billig ist'],a:0,w:'Jedem Versprechen folgt sofort ein Beleg.'},
  {t:'err',s:'Ein Texter sagt: „Ein Satz bekommt seine Glaubwürdigkeit nur durch seinen Inhalt. Wo er steht, ist egal.“',q:'Was zeigt die Graduierung?',o:['Position und Vorbereitung sind genauso wichtig wie der Inhalt','Er hat recht','Nur die Schrift zählt','Nur Bilder zählen'],a:0,w:'Glaube hängt von der Struktur ab, nicht nur vom Inhalt.'},
  {t:'match',q:'Ordne zu.',p:[['Ja-Frage','Einschlussfrage'],['„Deshalb …“','Sprache der Logik'],['Funke → Kraft','Syllogismus'],['„Diese Experten …“','Echo']]}],
 ex:{q:'Erkläre zwei Werkzeuge des Glaubens aus dem Buch und warum sie wirken.',k:['Zwei konkrete Werkzeuge werden richtig beschrieben (z. B. Einschlussfrage, detaillierte Identifikation, Widerspruch, Sprache der Logik, Syllogismus, Echo, Parallelismus)','Sie schaffen Zustimmung oder das Gefühl, dass der Text vom Leser handelt bzw. logisch zwingend ist','Diese Zustimmung überträgt sich auf die folgenden Versprechen','Glaube hängt von Struktur und Vorbereitung ab, nicht nur vom Inhalt']}}
]},
{key:'b8',col:'ink',title:'Neudefinition und Mechanismus',sub:'Hindernisse beseitigen und zeigen, wie es funktioniert',lessons:[
 {title:'Neudefinition',cards:[
  ['Drei Hindernisse','Manche Produkte schrecken ab: Sie wirken zu kompliziert, sie sind nicht wichtig genug für einen großen Markt, oder sie kosten zu viel. Gegen alle drei hilft Neudefinition: Das Produkt ist dies, nicht das.'],
  ['Konzept-Judo','Eine Seife hatte einen starken medizinischen Geruch. Statt ihn zu verstecken, lenkte die Werbung den Blick auf Körpergeruch. Nur eine sehr starke Seife hilft dagegen, und der Geruch beim Öffnen beweist diese Stärke. Aus dem Nachteil wurde ein Vorteil.'],
  ['1. Vereinfachung','Die TV-Anzeige nannte Störungen „Warnsignale“ wie einen Schnupfen und Reparaturen „kleine Einstellungen“ an den Knöpfen außen. Ein Englischkurs zeigte: Wenige Wörter machen die Hälfte der Sprache aus, ein Dutzend Regeln das Komma, 25 typische Fehler fast alle Fehler. Also genügen 15 Minuten am Tag.'],
  ['2. Eskalation','Das Produkt wichtiger machen. Gutes Englisch wird vom Selbstzweck zum Werkzeug, um andere zu gewinnen. Ein 99-Cent-Teil raubt dem teuren Auto die Kraft. Dein ganzes Leben versuchst du, andere zu etwas zu bewegen, also brauchst du diese Fähigkeit jeden Tag.'],
  ['3. Preisreduktion','Der Preis wirkt hoch, weil er mit ähnlichen Produkten verglichen wird. Also den Vergleich wechseln: Zündkerzen für 1,49 Dollar wurden mit handgefertigten für 5 Dollar und 30 bis 40 Dollar pro Satz verglichen, und sie „bezahlen sich zwölfmal im Jahr“. Dazu Worte wie „Sie können haben“ statt „kaufen“.'],
  ['Innovation braucht Akzeptanz','Eine Neuerung ohne Akzeptanz ist wertlos. Je neuer das Produkt, desto mehr musst du das ganze Feld neu definieren, bevor du es vorstellst.']],
 qs:[
  {t:'mc',q:'Welche drei Hindernisse beseitigt Neudefinition?',o:['Zu kompliziert, nicht wichtig genug, zu teuer','Zu alt, zu neu, zu bunt','Zu klein, zu groß, zu schwer','Zu leise, zu laut, zu schnell'],a:0,w:'Für jedes gibt es eine eigene Form der Neudefinition.'},
  {t:'sc',s:'Eine Seife riecht stark nach Medizin. Die Werbung sagt: Genau dieser Geruch zeigt, wie stark sie gegen Körpergeruch wirkt.',q:'Was passiert hier?',o:['Ein Nachteil wird durch Neudefinition zum Vorteil','Kontrast','Tarnung','Ein neuer Mechanismus'],a:0,w:'Konzept-Judo: eine komplette Umkehr.'},
  {t:'sc',s:'Eine Sprach-App sagt: „800 Wörter machen 80 % aller Alltagsgespräche aus, mehr brauchst du am Anfang nicht.“',q:'Welche Art der Neudefinition ist das?',o:['Vereinfachung','Eskalation','Preisreduktion','Konzentration'],a:0,w:'Das Schwere wird leicht gemacht, wie beim Englischkurs im Buch.'},
  {t:'sc',s:'„Du gibst 1.000 € für dein Fahrrad aus, und ein 5-€-Schlauch entscheidet, ob du ankommst.“',q:'Welche Art der Neudefinition ist das?',o:['Eskalation','Vereinfachung','Preisreduktion','Tarnung'],a:0,w:'Das kleine Produkt wird mit etwas Großem verbunden.'},
  {t:'mc',q:'Wie macht man laut Schwartz einen hohen Preis kleiner?',o:['Den Vergleichsmaßstab wechseln und mit etwas Teurerem vergleichen','Den Preis verschweigen','Nur Rabatt geben','Den Preis klein drucken'],a:0,w:'Etwa mit Handarbeit oder mit der Ersparnis im Jahr.'},
  {t:'why',q:'Warum muss ein revolutionär einfaches Produkt erst das Feld neu definieren?',o:['Weil die Menschen gelernt haben, dass das Thema schwer ist, und einfache Behauptungen nicht glauben','Weil es Pflicht ist','Weil einfache Produkte teuer sind','Weil es lustiger ist'],a:0,w:'Laut „einfach!“ zu rufen reicht nicht.'},
  {t:'err',s:'Ein Texter schreibt bei einem teuren Produkt: „Es kostet etwas mehr, ist aber jeden Cent wert.“',q:'Was würde der Zündkerzen-Texter aus dem Buch anders machen?',o:['Den Vergleich wechseln, sodass der Preis von vornherein niedrig wirkt','Den Preis höher nennen','Nichts','Den Preis weglassen'],a:0,w:'Er machte die Kerzen durch Vergleich billig, statt sie zu verteidigen.'}],
 ex:{q:'Wähle eine der drei Arten der Neudefinition (Vereinfachung, Eskalation oder Preisreduktion) und erkläre sie an einem eigenen Beispiel.',k:['Die gewählte Art wird richtig beschrieben','Sie beseitigt ein bestimmtes Hindernis (zu schwer, nicht wichtig genug oder zu teuer)','Ein eigenes, passendes Beispiel','Das Produkt wird in einem neuen Rahmen gesehen, ohne die Wahrheit zu verbiegen']}},
 {title:'Mechanisierung',cards:[
  ['Ein stiller Dialog','Beim Lesen stellt der Leser drei Forderungen: Erzähl mir mehr. Wer sagt das? Wie funktioniert das? Der Texter muss gleichzeitig Leser sein und spüren, wann welche Frage kommt.'],
  ['Wie viel Mechanismus?','Die Frage ist nie ob, sondern wie viel. Das hängt vom Bewusstsein des Marktes ab: Kennt er den Mechanismus schon, und akzeptiert er ihn?'],
  ['Stufe 1: Mechanismus nennen','Kennen die Leute den Mechanismus schon, reicht es, ihn zu benennen, etwa die Ausstattung einer Kamera, und dann mit dem Preis zu konkurrieren. Mehr Details würden langweilen.'],
  ['Stufe 2: Mechanismus beschreiben','Wenn der Leser ihn nicht versteht oder alle denselben haben: Versprechen, dann der Grund dafür. Ein Waschmittel versprach weißere Wäsche ohne Schrubben und erklärte dann, dass der Schmutz im Schaum einfach davonschwimmt. Wichtig: Auch Mechanismus-Text muss verkaufen, nicht trocken erklären.'],
  ['Stufe 3: Mechanismus herausstellen','In gesättigten Märkten wird der Mechanismus selbst zum Hauptversprechen und rückt in die Headline: ein Auto ohne Zündkerzen, eine Behandlung ohne Operation.'],
  ['Rabatte brauchen einen Grund','Eine Preissenkung ohne Begründung glaubt niemand. Ein Briefeschreiber erklärte erst, wie schlechtes Wetter eine Weberei auf ihrem Stoff sitzen ließ, die ihn deshalb billig abgab, und erst sechs Absätze später kam das Schnäppchen.']],
 qs:[
  {t:'mc',q:'Welche drei Forderungen stellt der Leser im stillen Dialog?',o:['Mehr erfahren, Beweis, Mechanismus','Preis, Farbe, Größe','Lob, Rabatt, Geschenk','Name, Adresse, Telefon'],a:0,w:'„Erzähl mehr“, „Wer sagt das?“, „Wie funktioniert das?“'},
  {t:'mc',q:'Wovon hängt ab, wie viel Mechanismus ein Text braucht?',o:['Vom Bewusstsein und der Marktreife: ob der Mechanismus bekannt und akzeptiert ist','Vom Budget','Von der Schriftgröße','Vom Wetter'],a:0,w:'Bekannt: nennen. Unbekannt: beschreiben. Gesättigter Markt: herausstellen.'},
  {t:'sc',s:'Ein Mixer wird beworben mit: „1200 Watt, Edelstahlklingen, 5 Stufen – nur 49 €“.',q:'Welche Stufe der Mechanisierung ist das?',o:['Stufe 1: Mechanismen nur benennen','Stufe 2','Stufe 3','Gar keine'],a:0,w:'Die Leute wissen, was diese Merkmale bedeuten.'},
  {t:'tf',q:'Mechanismus-Text darf trocken und rein sachlich sein, er soll ja nur erklären.',a:false,w:'Jedes Wort verkauft, auch hier. Der Mechanismus wird genauso verkauft wie das Hauptversprechen.'},
  {t:'sc',s:'Ein Shop schreibt nur: „Alles 50 % reduziert!“ Der Umsatz steigt kaum.',q:'Was fehlt laut Schwartz?',o:['Ein glaubwürdiger Grund für den Rabatt','Ein größerer Rabatt','Bunte Farben','Ein Countdown'],a:0,w:'Ohne Mechanismus wirkt ein Rabatt verdächtig oder belanglos.'},
  {t:'why',q:'Warum rückt der Mechanismus in gesättigten Märkten in die Headline?',o:['Weil er das Neue ist, das das alte Versprechen wieder glaubwürdig macht','Weil er kürzer ist','Weil Leser Technik lieben','Weil Versprechen verboten sind'],a:0,w:'Das verbindet Mechanisierung mit Stufe 3 der Marktreife.'},
  {t:'err',s:'Ein Texter erklärt einen allgemein bekannten Mechanismus (z. B. Autofokus) seitenlang im Detail.',q:'Was ist das Problem?',o:['Bei bekannten Mechanismen langweilen Details, es reicht, sie zu nennen','Es ist zu kurz','Nichts','Er sollte noch mehr erklären'],a:0,w:'Andere Werbung hat ihn schon bekannt gemacht.'}],
 ex:{q:'Erkläre die drei Stufen der Mechanisierung und wovon abhängt, welche du brauchst.',k:['Stufe 1: Ist der Mechanismus bekannt, reicht es, ihn zu benennen','Stufe 2: Ist er unbekannt oder haben alle denselben, wird er im Text beschrieben (Versprechen, dann Grund)','Stufe 3: In gesättigten Märkten wird er herausgestellt und rückt bis in die Headline','Welche Stufe passt, hängt vom Bewusstsein und der Marktreife ab']}}
]},
{key:'b9',col:'red',title:'Konzentration und Tarnung',sub:'Alternativen entkräften, Glaubwürdigkeit leihen',lessons:[
 {title:'Konzentration',cards:[
  ['Fünf Waffen gegen Konkurrenz','Das bessere Produkt, die ultimative Waffe. Das bessere Versprechen. Die bessere Rolle für den Käufer. Schnelle Reaktion: Ansprüche steigern, Mechanismen wechseln, neue Märkte. Und der direkte Angriff, die Konzentration.'],
  ['Wenn der Text besser ist als das Produkt','Schwartz rät: Dann schick den Text an den Hersteller statt an die Kunden, und lass ihn das Produkt so machen. Große Anzeigen gehören fast immer zu großen Produkten.'],
  ['Wann angreifen?','Beherrschst du den Markt, ignoriere die Konkurrenz und gib ihr nicht die Ehre eines Angriffs. Bist du kleiner und sind die meisten Kunden schon bei ihr, musst du oft erst ihr Bild knacken, bevor du den Wunsch zu dir lenken kannst.'],
  ['Die goldene Regel','Greife nie eine Schwäche an, ohne gleichzeitig die Lösung zu bieten. Ein Angriff nur zu deinem Vorteil wirkt voreingenommen und erzeugt Misstrauen. Ein Angriff zum Wohl des Kunden wird akzeptiert.'],
  ['Struktur 1: schlecht, gut','Punkt für Punkt: die Schwäche des alten Produkts, dann sofort die Stärke des neuen, mit einem Mechanismus, der erklärt, warum. Schlecht, gut, schlecht, gut.'],
  ['Struktur 2: jetzt und dann','Was dir mit deiner jetzigen Lösung passiert, und was passiert, wenn du wechselst. Etwa: Herkömmliche Diätmittel sind passiv und hängen nur an deiner Willenskraft. Die bricht irgendwann, und das Gewicht kommt zurück. Dann erst der Held.']],
 qs:[
  {t:'mc',q:'Was ist laut Schwartz die ultimative Waffe im Wettbewerb?',o:['Ein besseres Produkt','Ein größeres Budget','Ein Prominenter','Ein niedriger Preis'],a:0,w:'Ist der Text besser als das Produkt, soll der Hersteller das Produkt verbessern.'},
  {t:'mc',q:'Was ist die goldene Regel der Konzentration?',o:['Nie eine Schwäche angreifen, ohne gleichzeitig die Lösung zu bieten','Immer zuerst angreifen','Nie über Konkurrenz sprechen','Nur Preise vergleichen'],a:0,w:'Sonst wirkt der Angriff nur voreingenommen.'},
  {t:'tf',q:'Ein Marktführer sollte seine kleineren Konkurrenten möglichst oft direkt angreifen.',a:false,w:'Er würde ihnen nur Aufmerksamkeit und Prestige schenken.'},
  {t:'sc',s:'„Normale Zahnbürsten erreichen nur 60 % der Zahnflächen. Unsere Bürste mit schrägen Borsten erreicht auch die Zwischenräume. Normale Bürsten …“',q:'Welche Struktur ist das?',o:['Schlecht, gut, schlecht, gut','Jetzt und dann','Tarnung','Einschlussfrage'],a:0,w:'Punkt-für-Punkt-Kontrast mit Mechanismus.'},
  {t:'sc',s:'„Du hast es mit Apps versucht. Du warst motiviert. Dann kam der stressige Monat, und alles war wieder wie vorher …“',q:'Welche Struktur ist das?',o:['Jetzt und dann: die vertraute Enttäuschung, bevor die Lösung kommt','Schlecht, gut','Syllogismus','Preisreduktion'],a:0,w:'Der Leser nickt bei jeder Station, bis die alten Wege entkräftet sind.'},
  {t:'why',q:'Warum wird ein Angriff auf die Konkurrenz eher akzeptiert, wenn er dem Kunden eine Lösung bietet?',o:['Weil er dann im Interesse des Kunden wirkt statt nur im eigenen','Weil er dann lauter ist','Weil er kürzer ist','Weil es Pflicht ist'],a:0,w:'Dann kann er sogar tiefe Markentreue ins Wanken bringen.'},
  {t:'err',s:'Eine Marke schreibt: „Die Konkurrenz ist schlecht. Punkt.“',q:'Was fehlt?',o:['Die eigene Lösung für die genannte Schwäche, sonst wirkt es nur gehässig','Ein Ausrufezeichen','Nichts','Ein Preis'],a:0,w:'Ohne Lösung erzeugt der Angriff Skepsis und Abneigung.'}],
 ex:{q:'Erkläre, warum man bei der Konzentration nie nur angreifen darf, und beschreibe eine der beiden Strukturen aus dem Buch.',k:['Ein reiner Angriff wirkt voreingenommen und erzeugt Skepsis','Er muss im Interesse des Kunden stehen und gleichzeitig die eigene Lösung zeigen','Eine Struktur richtig beschrieben: Punkt-für-Punkt schlecht/gut oder jetzt/nach dem Wechsel','Dabei werden andere Techniken genutzt (z. B. Mechanismus, Intensivierung, Logik)']}},
 {title:'Tarnung',cards:[
  ['Geliehene Glaubwürdigkeit','Leser kaufen eine Zeitung, weil sie ihr vertrauen. Dieses Vertrauen färbt auf die Anzeigen darin ab. Mit der Zeit wird sogar der Stil der Zeitung selbst zum Zeichen für Wahrheit.'],
  ['1. Format übernehmen','Eine Buchanzeige wurde für das Wall Street Journal genau im Stil der Zeitung gesetzt: gleiche Schrift, altmodische Zwischenüberschriften, Strichzeichnung statt Foto. Sie wirkte etwa doppelt so gut wie die Standardanzeige und lief 19 Mal ohne Abnutzung.'],
  ['2. Sprache übernehmen','Der Nachrichtenstil mit Ort, Datum und Autorenzeile lässt eine Anzeige wie einen Bericht wirken. In Direktwerbung: die Form von Post, die man immer sofort öffnet.'],
  ['3a. Understatement','Wenige Adjektive, kurze Sätze, Selbstironie, ein Ton, der eher fällt als steigt. Die VW-Anzeigen zeigten, wie viel Kraft in Schlichtheit liegt.'],
  ['3b. Tödliche Aufrichtigkeit','Die Schwächen eines Angebots offen ansprechen, sodass die Vorteile danach umso mehr geglaubt werden. Ein Karriere-Ratgeber sprach nur „den einen von hundert“ an, der zu großen Opfern bereit ist.'],
  ['Heute zu beachten','Werbung, die wie redaktioneller Inhalt aussieht, muss heute in vielen Ländern klar als Werbung gekennzeichnet werden, in Deutschland zum Beispiel mit „Anzeige“. Die Idee, Ton und Stil des Mediums zu treffen, bleibt trotzdem nützlich.']],
 qs:[
  {t:'mc',q:'Was meint Schwartz mit Tarnung?',o:['Glaubwürdigkeit leihen, indem man Format, Sprache oder Ton vertrauenswürdiger Medien übernimmt','Das Produkt verstecken','Falsche Angaben machen','Die Konkurrenz kopieren'],a:0,w:'Das Vertrauen ins Medium färbt auf die Anzeige ab.'},
  {t:'mc',q:'Wie wirkte die im Stil des Wall Street Journal gesetzte Anzeige?',o:['Etwa doppelt so stark und lief 19 Mal ohne Abnutzung','Schlechter','Gleich','Sie wurde verboten'],a:0,w:'Kein „Achtung, Werbung!“-Signal beim Lesen.'},
  {t:'sc',s:'Eine Anzeige beginnt: „Hamburg. Ein Hautarzt zeigte gestern vor Publikum, wie …“',q:'Welcher Weg der Tarnung ist das?',o:['Die Sprache des Mediums (Nachrichtenstil) übernehmen','Understatement','Konzentration','Einschlussfrage'],a:0,w:'Der Text wirkt wie ein Bericht statt wie eine Verkaufsrede.'},
  {t:'sc',s:'Eine Anzeige sagt: „Dieses Buch ist schlecht geschrieben, und der Autor ist kein Profi. Aber es enthält Ideen, die Sie nirgendwo sonst finden.“',q:'Welche Stimmung ist das?',o:['Tödliche Aufrichtigkeit','Understatement durch Selbstironie','Nachrichtenstil','Kontrast'],a:0,w:'Die offene Schwäche macht das Lob glaubwürdiger.'},
  {t:'tf',q:'Understatement bedeutet viele Superlative und lange Sätze.',a:false,w:'Im Gegenteil: wenige Adjektive, kurze Sätze, ruhiger Ton.'},
  {t:'why',q:'Warum wirken Anzeigen im Stil des Mediums glaubwürdiger?',o:['Weil der typische Werbe-Stil automatisch Skepsis auslöst und der Medien-Stil Vertrauen trägt','Weil sie bunter sind','Weil sie billiger sind','Weil Leser sie nicht bemerken müssen'],a:0,w:'Die Leser haben gelernt, Werbesprache zu misstrauen.'},
  {t:'err',s:'Jemand sagt: „Wenn ich meine Anzeige wie einen Zeitungsartikel gestalte, muss ich sie nicht als Werbung kennzeichnen.“',q:'Was ist daran falsch?',o:['Heute muss redaktionell aufgemachte Werbung vielerorts klar gekennzeichnet sein, etwa mit „Anzeige“','Nichts','Man darf das nie','Nur Fernsehen muss kennzeichnen'],a:0,w:'Der Stil darf passen, die Kennzeichnung bleibt Pflicht.'},
  {t:'match',q:'Ordne zu.',p:[['Schlecht/gut','Konzentration'],['Zeitungsformat','Tarnung'],['Schwäche zugeben','Aufrichtigkeit'],['Wenige Adjektive','Understatement']]}],
 ex:{q:'Erkläre, was Schwartz mit Tarnung meint und welche drei Wege er nennt.',k:['Tarnung heißt, Glaubwürdigkeit zu leihen, die im Vertrauen zu einem Medium gespeichert ist','Erstens das Format des Mediums übernehmen','Zweitens seine Sprache bzw. Formulierungen übernehmen','Drittens eine Stimmung, die vom Werbe-Stil weg führt: Understatement oder tödliche Aufrichtigkeit']}}
]},
{key:'b10',col:'teal',title:'Der letzte Schliff',sub:'Alles zu einer Anzeige verweben',lessons:[
 {title:'Beweis und Verstärkung',cards:[
  ['Verifikation','Belege sind Statistiken, Tests, Zeugnisse, Autoritäten, Auszeichnungen. Entscheidend ist nicht nur ihr Inhalt, sondern wo sie stehen. Ein Beweis wirkt am stärksten, wenn der Leser ihn unbewusst gerade verlangt.'],
  ['Belege inszenieren','Belege sind von Natur aus langweilig. Mach sie zum Helden eines Dramas: In der TV-Anzeige kamen die Herstellertests genau dann, als der Leser nach einer Lösung suchte. Dieselben Zahlen früher wären nur trockene Statistik gewesen.'],
  ['Drei Begriffe','Dokumentation sind die Belege selbst. Mechanisierung ist die logische Demonstration, dass das Produkt funktioniert, und braucht keine externen Belege. Verifikation ist die Kunst, die Belege so anzuordnen, dass sie maximal wirken.'],
  ['Verstärkung: 1 + 1 = 10','Zwei Gefühlsbilder, richtig verbunden, wirken viel stärker als einzeln. Ein Autovermieter verband „Wir sind nur die Nummer zwei“ mit „Deshalb strengen wir uns mehr an“. Zusammen ergab das viel mehr als die Summe.'],
  ['Verweben','Jeder Satz sollte möglichst Versprechen, Bild, Logik und Gefühl zugleich tragen. Ein einziger Satz kann Stimmung, Autorität, wissenschaftlichen Klang und mehrere Versprechen enthalten.'],
  ['Neue Ungeschicklichkeit','Das klingt mechanisch, ist es aber nicht. Wie beim Golftraining macht die bewusste Analyse erst ungeschickt. Mit Übung wird sie zu einer neuen, besseren Intuition.']],
 qs:[
  {t:'mc',q:'Wann wirkt ein Beweis laut Schwartz am stärksten?',o:['Wenn der Leser ihn gerade unbewusst verlangt','Immer ganz am Anfang','In einem separaten Kasten','Ganz am Ende'],a:0,w:'Position erhöht die Kraft.'},
  {t:'mc',q:'Was unterscheidet Mechanisierung von Dokumentation?',o:['Mechanisierung beweist durch Logik und Struktur, Dokumentation durch externe Belege','Es gibt keinen Unterschied','Dokumentation ist logischer','Mechanisierung braucht Statistiken'],a:0,w:'Verifikation wiederum ordnet die Belege an.'},
  {t:'sc',s:'„Wir sind nur die Nummer zwei. Deshalb geben wir uns mehr Mühe.“',q:'Welches Prinzip zeigt das?',o:['Verstärkung: zwei Ideen ergeben zusammen viel mehr','Tarnung','Einschlussfrage','Vereinfachung'],a:0,w:'1 + 1 kann in emotionalem Schreiben 10 ergeben.'},
  {t:'tf',q:'Belege sollten möglichst trocken und sachlich präsentiert werden, damit sie seriös wirken.',a:false,w:'Belege müssen auch verkaufen und brauchen eine Inszenierung.'},
  {t:'gap',q:'Beim Verweben soll jeder Satz Versprechen, Bild, Logik und ___ enthalten.',o:['Gefühl','Preis','Namen','Datum'],a:0,w:'So wird jeder Satz dichter und stärker.'},
  {t:'why',q:'Warum lehrt Schwartz die Techniken so analytisch, obwohl Schreiben intuitiv sein soll?',o:['Weil bewusste Übung zu einer neuen, besseren Intuition führt','Weil er Schreiben mechanisch findet','Weil Intuition nichts taugt','Zufall'],a:0,w:'Wie beim Golf: erst bewusst, dann automatisch.'},
  {t:'err',s:'Ein Texter packt alle Testergebnisse in einen Kasten „Hier sind die Beweise“ ganz unten.',q:'Was würde Schwartz vorschlagen?',o:['Die Belege dorthin verweben, wo der Leser nach ihnen verlangt','Den Kasten größer machen','Die Belege weglassen','Nichts'],a:0,w:'Platzierung ist genauso wichtig wie Inhalt.'}],
 ex:{q:'Erkläre den Unterschied zwischen Dokumentation, Mechanisierung und Verifikation.',k:['Dokumentation sind die Belege selbst: Statistiken, Tests, Zeugnisse, Autoritäten','Mechanisierung ist die logische Demonstration, wie und dass das Produkt funktioniert, auch ohne externe Belege','Verifikation ist die Anordnung der Belege im Text für maximale Akzeptanz und Wirkung','Belege wirken am stärksten, wenn der Leser sie gerade verlangt']}},
 {title:'Fluss, Sog und Stimmung',cards:[
  ['Sensibilität','Spür, wann der Leser genug von einem Element hat und etwas anderes will, etwa Beweis statt noch mehr Versprechen, oder wieder Versprechen statt Statistik. Jede Anzeige hat eine Architektur aus Blöcken und Übergängen.'],
  ['Eine neue Struktur ist eine neue Anzeige','Wenn der Text stockt und tot wirkt, such eine neue Richtung. Wirf die Headline weg und fang um 180 Grad gedreht an. Vielleicht gehört etwas aus dem Kleingedruckten nach oben.'],
  ['Momentum 1: Sog-Sätze','An Übergängen halten Sätze den Leser im Text: „Hier ist der Grund.“ „Lass mich erklären.“ „Und das ist erst der Anfang.“ „Zum Beispiel:“'],
  ['Momentum 2: offene Fragen','Interesse an einem Punkt wecken, eine Frage dazu aufwerfen und die Antwort für später andeuten. Gute Beispiele verkaufen gleichzeitig, nichts ist bloße Spannung.'],
  ['Stimmung','Wörter und Rhythmus sind für den Texter, was Linie und Farbe für den Maler sind. Bildschärfer machen Bilder konkret, Gefühlswörter sagen dem Leser, was er fühlen soll. Sie dürfen nicht auffallen, sonst wirkt der Text kitschig. Kenne dein Publikum.'],
  ['Viele Tonlagen','Maschinengewehr-Rhythmus mit Verb, Verb, Verb. Die schlichte Ehrlichkeit kurzer Sätze ohne Adjektive. Oder bewusst ungelenke, lange Sätze, die nicht nach Texter klingen und dadurch aufrichtig wirken. Schwartz schließt: weiterlesen, analysieren, schreiben.']],
 qs:[
  {t:'mc',q:'Was versteht Schwartz unter Sensibilität beim Schreiben?',o:['Spüren, wann der Leser ein anderes Element verlangt, und die Richtung wechseln','Besonders gefühlvoll schreiben','Leise Werbung','Rücksicht auf Konkurrenten'],a:0,w:'Der Texter ist gleichzeitig Leser.'},
  {t:'mc',q:'Welche zwei Arten von Momentum nennt Schwartz?',o:['Sog-Sätze an Übergängen und unvollständige Aussagen, die eine Frage offen lassen','Lautstärke und Farbe','Rabatte und Fristen','Bilder und Videos'],a:0,w:'Beide halten den Leser im Text.'},

function bkSents(t){return(String(t).replace(/\s+/g,' ').match(/[^.!?]+[.!?]+(?=\s|$)/g)||[]).map(s=>s.trim()).filter(s=>s.length>=45&&s.length<=260)}

function bkPickN(a,n){const o=[],c=a.slice();while(o.length<n&&c.length)o.push(c.splice(Math.random()*c.length|0,1)[0]);return o}
function bkLocalLesson(title,text,poolWords,poolSents){
  const paras=String(text).split(/\n\s*\n/).map(p=>p.replace(/\s+/g,' ').trim()).filter(p=>p.length>40);
  const sents=bkSents(text);
  let groups=paras.length>=3?paras:[];
  if(groups.length<3){groups=[];for(let i=0;i<sents.length;i+=3)groups.push(sents.slice(i,i+3).join(' '))}
  groups=groups.filter(g=>g.length>40).slice(0,5);
  if(!groups.length)groups=[bkStr(text,600)];
  const cards=groups.map((g,i)=>{const first=(bkSents(g)[0]||g);const w=first.split(' ').slice(0,7).join(' ').replace(/[.,;:!?]+$/,'');return[w+(first.split(' ').length>7?' …':''),bkStr(g,700)]});
  const qs=[];const used=new Set();

  const mk=(s)=>{const ws=bkWords(s).filter(w=>s.indexOf(w)>s.length*.15);if(!ws.length)return null;const tgt=ws.sort((a,b)=>b.length-a.length)[0];
    const dis=bkPickN(poolWords.filter(w=>w.toLowerCase()!==tgt.toLowerCase()&&Math.abs(w.length-tgt.length)<=4),3);if(dis.length<3)return null;return{tgt,dis}};
  bkPickN(cand,6).forEach(s=>{if(qs.length>=5||used.has(s))return;const m=mk(s);if(!m)return;used.add(s);
    if(qs.filter(x=>x.t==='gap').length<3)qs.push({t:'gap',q:s.replace(m.tgt,'___'),o:[m.tgt,...m.dis],a:0,w:'Im Text: „'+s+'“'});

async function bkPdfText(file,onProg){

function bkPlanKeys(plan,startIdx){plan.forEach((pu,i)=>{pu.key='u'+(startIdx+i);pu.col=BKCOLS[(startIdx+i)%BKCOLS.length]});return plan}
async function bkGenerate(b,plan,mode,startUnit){ // b: Buch (BKD), plan: [{title,sub,lessons:[{title,src|topic}]}]
  const G=BKV.gen={bid:b.id,n:plan.reduce((s,u)=>s+u.lessons.length,0),done:0,stop:false,err:'',ai:mode==='ai'||mode==='title',fallback:0};
  b.gen=true;const slots={};const jobs=[];plan.forEach((pu,ui)=>pu.lessons.forEach((pl,li)=>jobs.push([ui,li,pu,pl])));
  const poolWords=[],poolSents=[];if(mode==='local'){plan.forEach(pu=>pu.lessons.forEach(pl=>{poolWords.push(...bkWords(pl.src));poolSents.push(...bkSents(pl.src))}))}
  const keep=b.units.slice();
  const publish=()=>{b.units=[...keep,...bkFilledUnits(plan,slots)];bkIndexIds(b);bkSave();if(current==='buecher')bkRender()};
  let ji=0;
  const work=async()=>{while(ji<jobs.length&&!G.stop){const [ui,li,pu,pl]=jobs[ji++];let les=null;
    if(mode==='local'){les=bkLocalLesson(pl.title,pl.src,poolWords,poolSents)}
    else{for(let t=0;t<2&&!les&&!G.stop;t++){try{const r=await AI.fn.json(bkLessonPrompt(b,pl.title,pl.src,pl.topic),{cache:false});les=bkFixLesson(r,pl.title)}catch(e){if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed','rate_limited','session_expired'].includes(e&&e.code)){G.err=aiErrText(e);G.stop=true;break}}}
      if(!les&&!G.stop&&pl.src){les=bkLocalLesson(pl.title,pl.src,bkWords(pl.src),bkSents(pl.src));G.fallback++}}
    if(les){if(pl.title&&/^(Teil|Abschnitt)\b/.test(pl.title)===false)les.title=pl.title;slots[ui+'.'+li]=les;G.done++}else G.done++;
    publish()}};
  await Promise.all([work(),mode==='local'?null:work()]);
  b.gen=false;
  if(!b.units.length){BKD=BKD.filter(x=>x.id!==b.id);BK.cur=BK.cur===b.id?null:BK.cur;BKV.mode='lib';G.err=G.err||'Es konnte keine Lektion erstellt werden.'}
  BKV.genEnd={bid:b.id,err:G.err,fallback:G.fallback,stopped:G.stop&&!G.err};BKV.gen=null;bkSave();if(current==='buecher')bkRender()}
async function bkOutline(b){ // Nur Titel und Autor: KI entwirft die Gliederung
  const r=await AI.fn.json(`Du planst einen Lernkurs zum Buch „${b.title}“${b.author?' von '+b.author:''} für eine Lern-App.
Gib eine Gliederung der wichtigsten Ideen des Buchs in der Reihenfolge, in der sie aufeinander aufbauen: 4 bis 6 Kapitel mit je 2 bis 3 Lektionen. Nutze nur Inhalte, die du sicher kennst. Wenn du das Buch nicht kennst, antworte mit {"unbekannt":true}.
Antworte nur mit JSON: {"kapitel":[{"titel":"Kapitelname","sub":"ein Satz","lektionen":[{"titel":"Lektionstitel","thema":"1 bis 2 Sätze, was diese Lektion vermittelt"}]}]}`,{cache:false});
  if(!r||r.unbekannt||!Array.isArray(r.kapitel))throw{code:'unknown'};
  const plan=r.kapitel.slice(0,6).map(k=>({title:bkStr(k.titel,60)||'Kapitel',sub:bkStr(k.sub,100),lessons:(Array.isArray(k.lektionen)?k.lektionen:[]).slice(0,3).map(l=>({title:bkStr(l.titel,60)||'Lektion',topic:bkStr(l.thema,300)}))})).filter(k=>k.lessons.length);
  if(!plan.length)throw{code:'invalid_json'};return plan}
async function bkCreate(){
  const F=BKV.form;const title=F.title.trim(),author=F.author.trim();
  if(!title||BKV.gen)return;
  let b,plan,mode;
  if(F.more){b=bkBook(F.more);if(!b)return}
  else{b={id:'b'+Date.now().toString(36)+(Math.random()*1e3|0),title,author,units:[],created:Date.now()};}
  BKV.err='';
  if(F.kind==='title'){
    if(AI.state!=='on'){BKV.err='Für Kurse nur aus Titel und Autor braucht es die KI-Verbindung.';return bkRender()}
    BKV.gen={bid:b.id,n:0,done:0,stop:false,outline:true};bkRender();
    try{plan=await bkOutline(b)}catch(e){BKV.gen=null;BKV.err=e&&e.code==='unknown'?'Die KI kennt dieses Buch nicht sicher genug. Füge lieber Text aus dem Buch ein.':aiErrText(e)||'Die Gliederung hat nicht geklappt.';return bkRender()}
    mode='title'}
  else{
    const txt=F.text.trim();if(txt.length<400){BKV.err='Der Text ist zu kurz. Füge mindestens ein paar Absätze ein (ab etwa 400 Zeichen).';return bkRender()}
    plan=bkSplit(txt.slice(0,400000));mode=AI.state==='on'?'ai':'local'}
  const start=F.more?b.units.length:0;bkPlanKeys(plan,start);
  if(!F.more){BKD.push(b);BK.cur=b.id}
  BKV.mode='book';BKV.bid=b.id;BKV.tab='path';BKV.form={kind:'text',title:'',author:'',text:'',more:null};
  bkGenerate(b,plan,mode,start);bkRender()}

function bkShuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

const SFX={ctx:null,on(){return!(P.fx&&P.fx.mute)},
  ac(){if(!this.ctx){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});return this.ctx},
  tone(f,d,type,vol,when){const a=this.ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+(when||0);o.type=type||'square';o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(vol||0.05,t0);g.gain.exponentialRampToValueAtTime(0.0008,t0+d);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d+0.02)},
  seq(notes,type,vol,step){if(!this.on())return;notes.forEach((f,i)=>{if(f)this.tone(f,(step||0.07)*1.6,type,vol,i*(step||0.07))})},
  coin(){this.seq([988,1319],'square',0.045,0.06)},up(){this.seq([523,659,784,1047],'square',0.04,0.06)},down(){this.seq([392,311,247,196],'triangle',0.08,0.09)},
  levelup(){this.seq([523,523,523,659,784,0,659,784,1047],'square',0.045,0.08)},chest(){this.seq([392,494,587,784,988,1175],'square',0.04,0.06)},
  blip(){this.seq([1568],'square',0.02,0.03)},wrong(){this.seq([220,185],'sawtooth',0.035,0.1)}};
const FX={
  layer(){let l=$('#fxLayer');if(!l){l=document.createElement('div');l.id='fxLayer';l.setAttribute('aria-hidden','true');document.body.appendChild(l)}return l},
  pt(el){if(el&&el.getBoundingClientRect){const r=el.getBoundingClientRect();if(r.width)return[r.left+r.width/2,r.top+r.height/2]}return[innerWidth/2,innerHeight*0.38]},
  float(text,kind,el){if(fxLevel()==='off')return;const [x,y]=this.pt(el);const d=document.createElement('div');d.className='fxf '+(kind||'gain')+(fxLevel()==='full'?'':' calm');d.textContent=text;const n=this.layer().querySelectorAll('.fxf').length;d.style.left=(x+(n?(n%2?24:-24):0))+'px';d.style.top=(y-n*30)+'px';this.layer().appendChild(d);setTimeout(()=>d.remove(),1300)},
  coins(n,el){if(fxLevel()!=='full')return;const [x,y]=this.pt(el);const L=this.layer();for(let i=0;i<Math.min(n,14);i++){const d=document.createElement('i');d.className='fxc';d.style.left=x+'px';d.style.top=y+'px';d.style.setProperty('--dx',(Math.random()*160-80)+'px');d.style.setProperty('--dy',(-60-Math.random()*90)+'px');d.style.animationDelay=(i*25)+'ms';L.appendChild(d);setTimeout(()=>d.remove(),1200)}},
  flash(kind){if(fxLevel()==='off')return;const d=document.createElement('div');d.className='fxflash '+kind;this.layer().appendChild(d);setTimeout(()=>d.remove(),600)},
  shake(){if(fxLevel()!=='full')return;const v=$('#view');v.classList.remove('shake');void v.offsetWidth;v.classList.add('shake');setTimeout(()=>v.classList.remove('shake'),420)},
  banner(title,sub,kind,art){if(fxLevel()==='off'){toast(title+(sub?' · '+sub:''));return}const d=document.createElement('div');d.className='fxban '+(kind||'');d.innerHTML=`${art?`<canvas class="pxs" data-scene="${art}" width="${PXW}" height="${PXH}"></canvas>`:''}<b>${esc(title)}</b>${sub?`<span>${esc(sub)}</span>`:''}`;this.layer().appendChild(d);pxMount(d);d.querySelectorAll('canvas').forEach(cv=>PXRT.hov.add(cv));setTimeout(()=>{d.classList.add('out');setTimeout(()=>{d.querySelectorAll('canvas').forEach(cv=>PXRT.hov.delete(cv));d.remove()},400)},1900)},
  gain(amount,label,el){this.float('+'+label,'gain',el);this.coins(6+Math.min(8,Math.round(Math.log10(Math.max(10,Math.abs(amount))))),el);this.flash('good');SFX.coin()},
  loss(label,el,big){this.float('−'+label,'loss',el);this.flash('bad');if(big)this.shake();SFX.down()},
  result(delta,fmt,el){if(delta>0)this.gain(delta,fmt(Math.abs(delta)),el);else if(delta<0)this.loss(fmt(Math.abs(delta)),el)},

/* Zahlen hochzählen + spürbare Ergebnisse */
const CNT={prev:new Map(),view:null,first:true,vseen:new Set()};
const CNT_FLOW=/^(Gewinn( (Woche|Monat|Quartal))?|Deckungsbeitrag − Spend|Veränderung)$/,CNT_STOCK=/^(Kasse|Gewinn (gesamt|kumuliert)|Unternehmenswert|Punkte diesen Sprint|Follower gesamt|Neue Follower|Kund:innen gesamt|Kundenbasis|Marktanteil|Honorare pro Monat)$/;
function cntParse(s){const m=String(s).trim().match(/^([−-]?)([\d.]+)(?:,(\d+))?\s*(.*)$/);if(!m)return null;const v=parseFloat(m[2].replace(/\./g,'')+(m[3]?'.'+m[3]:''))*(m[1]?-1:1);return{v,dec:m[3]?m[3].length:0,unit:m[4]}}
function cntRun(){const key=current;if(CNT.view!==key){CNT.prev.clear();CNT.vseen.clear();CNT.view=key;CNT.first=true}const lvl=fxLevel();let ev=null;const occ={};
  $$('#view .kpi').forEach(k=>{const lab=k.querySelector('.k'),val=k.querySelector('.v');if(!lab||!val||val.dataset.cnt)return;const name=lab.textContent.trim();occ[name]=(occ[name]||0)+1;const id=name+'#'+occ[name];const txt=val.textContent.trim(),cur=cntParse(txt),old=CNT.prev.get(id);CNT.prev.set(id,txt);val.dataset.cnt='1';
    if(!old||old===txt||!cur)return;const o=cntParse(old);if(!o||o.unit!==cur.unit||o.dec!==cur.dec)return;const up=cur.v>o.v;val.classList.add(up?'cnt-up':'cnt-down');setTimeout(()=>val.classList.remove('cnt-up','cnt-down'),900);
    const fmt=v=>(v<0?'−':'')+de(Math.abs(v),cur.dec)+(cur.unit?' '+cur.unit:'');
    if(!ev){if(CNT_FLOW.test(name))ev={d:cur.v,txt:fmt(Math.abs(cur.v)),el:val,big:cur.v<0&&o.v>=0};else if(CNT_STOCK.test(name)&&cur.v!==o.v)ev={d:cur.v-o.v,txt:fmt(Math.abs(cur.v-o.v)),el:val,big:Math.abs(cur.v-o.v)>Math.abs(o.v)*0.12}}
    if(lvl==='off')return;const t0=performance.now(),dur=650;
    const step=n=>{const p=Math.min(1,(n-t0)/dur),e=1-Math.pow(1-p,3);val.textContent=fmt(o.v+(cur.v-o.v)*e);if(p<1&&val.isConnected)requestAnimationFrame(step);else val.textContent=txt};requestAnimationFrame(step)});
  let vd=null;$$('#view .verdict').forEach(v=>{const sig=v.className+'|'+v.textContent.trim().slice(0,80);if(CNT.vseen.has(sig))return;CNT.vseen.add(sig);if(!CNT.first&&!vd)vd=v});
  CNT.first=false;
  if(vd){if(vd.classList.contains('ok'))FX.right(vd);else if(vd.classList.contains('mid')){FX.float('Okay','mid',vd);SFX.blip()}else FX.wrong(vd)}
  else if(ev){if(ev.d>0)FX.gain(ev.d,ev.txt,ev.el);else if(ev.d<0)FX.loss(ev.txt,ev.el,ev.big)}}
