<title>Marktlabor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky lab header, home = player card + module grid; each module is a focused "experiment bench" view */
:root{
  --bg:#ECEFF4; --surface:#FFFFFF; --sunk:#E2E6EE; --ink:#131A2C; --muted:#5A6378; --line:#D3D8E2;
  --accent:#E2492F; --accent-ink:#FFFFFF; --data:#16807C;
  --good:#23824F; --warn:#B87A0C; --bad:#C23447;
  --c1:#2457C5; --c2:#D2467A; --c3:#7D8496; --c4:#D0841A; --c5:#7B4FC9; --c6:#1F9A8A;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body:"Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1220; --surface:#171D2D; --sunk:#111626; --ink:#E7EAF2; --muted:#98A1B6; --line:#283149;
  --accent:#FF6A4D; --accent-ink:#1A0C08; --data:#3FC2BC;
  --good:#4CC384; --warn:#E9B04A; --bad:#FF6B7F;
  --c1:#6E95F0; --c2:#F07AA2; --c3:#A3A9B8; --c4:#F0B04E; --c5:#A98AF0; --c6:#45C9B6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1220; --surface:#171D2D; --sunk:#111626; --ink:#E7EAF2; --muted:#98A1B6; --line:#283149;
  --accent:#FF6A4D; --accent-ink:#1A0C08; --data:#3FC2BC;
  --good:#4CC384; --warn:#E9B04A; --bad:#FF6B7F;
  --c1:#6E95F0; --c2:#F07AA2; --c3:#A3A9B8; --c4:#F0B04E; --c5:#A98AF0; --c6:#45C9B6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-0.01em}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:18px 60px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{font-family:var(--f-display);font-weight:800;font-size:20px;display:flex;align-items:center;gap:8px;cursor:pointer;background:none;border:0;padding:0}
.logo-mark{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center}
.logo-mark svg{width:16px;height:16px}
.top-sp{flex:1}
.xp-pill{font-family:var(--f-mono);font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:99px;background:var(--surface);white-space:nowrap}
.ai-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.ai-dot.on{background:var(--good)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:14px;transition:transform .08s, background .15s}
.btn:hover{background:var(--sunk)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05);background:var(--accent)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:13px}
.back{background:none;border:0;color:var(--muted);cursor:pointer;padding:0;font-size:14px;margin-bottom:12px}
.back:hover{color:var(--ink)}

.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);max-width:62ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}

/* home */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:end;margin-bottom:22px}
.hero h1{font-size:clamp(34px,7vw,58px);font-weight:800;line-height:.95}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .lead{margin-top:12px}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.player .lvl{font-family:var(--f-display);font-size:22px;font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:12px;padding:3px 8px;border-radius:99px;border:1px dashed var(--line);color:var(--muted)}
.badge.got{border-style:solid;border-color:var(--data);color:var(--data);font-weight:600}

.mods{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.mod{grid-column:span 2;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:border-color .15s, transform .15s;min-width:0}
.mod:hover{border-color:var(--ink);transform:translateY(-2px)}
.mod.feat{grid-column:span 4;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mod.feat .eyebrow,.mod.feat .mod-d{color:color-mix(in srgb,var(--bg) 70%,var(--ink))}
.mod.feat:hover{border-color:var(--accent)}
.mod h3{font-size:21px;font-weight:700}
.mod-d{color:var(--muted);font-size:14px}
.mod-f{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding-top:6px}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.mod.feat .tag{background:color-mix(in srgb,var(--bg) 14%,var(--ink));color:var(--bg)}
.tag.ki{background:var(--accent);color:var(--accent-ink)}
.best{font-family:var(--f-mono);font-size:12px}
@media (max-width:820px){.mod,.mod.feat{grid-column:span 3!important}}
@media (max-width:560px){.mods{grid-template-columns:1fr}.mod,.mod.feat{grid-column:auto!important}}
.mini-curve{width:100%;height:70px;margin-top:4px}

/* game chrome */
.ghead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.ghead h2{font-size:clamp(26px,5vw,36px);font-weight:800}
.event{display:flex;gap:12px;align-items:flex-start;border-left:3px solid var(--accent);background:var(--surface);padding:12px 14px;border-radius:0 var(--r) var(--r) 0}
.event b{font-family:var(--f-display)}
details.concept{background:var(--sunk);border-radius:var(--r);padding:10px 14px}
details.concept summary{cursor:pointer;font-weight:600}
details.concept p{margin-top:8px;color:var(--muted);max-width:70ch}
details.concept p b{color:var(--ink)}

.ch-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr) 110px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ch-row:last-child{border-bottom:0}
.ch-name{font-weight:600;display:flex;align-items:center;gap:8px}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.ch-note{font-size:12.5px;color:var(--muted)}
.ch-val{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ch-est{font-family:var(--f-mono);font-size:11.5px;display:block;margin-top:2px}
input[type=range]{width:100%;accent-color:var(--accent)}
@media (max-width:560px){.ch-row{grid-template-columns:1fr 92px}.ch-row .ch-sl{grid-column:1 / -1;order:3}}

.budgetbar{position:sticky;bottom:0;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px -14px rgba(0,0,0,.35)}
.budgetbar .meter{flex:1;min-width:160px}
.over{color:var(--bad)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--sunk);border-radius:8px;padding:10px 12px;min-width:0}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--f-mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pos{color:var(--good)} .neg{color:var(--bad)}

.tbl-wrap{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:13.5px}
table.data th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
table.data td{padding:7px 8px;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line);white-space:nowrap}
table.data th:first-child,table.data td:first-child{text-align:left;font-family:var(--f-body)}

svg.chart{width:100%;height:auto;display:block}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .tick{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
svg.chart .diag{stroke:var(--muted);stroke-dasharray:4 4;stroke-width:1.2}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

.ai-box{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface)}
.ai-box .out{white-space:pre-wrap;margin-top:8px;max-width:70ch}
.ai-label{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:6px}
.thinking::after{content:"";display:inline-block;width:1em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

/* A/B */
.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:520px){.choice{grid-template-columns:1fr}}
.choice .btn{padding:12px}
.verdict{border-radius:var(--r);padding:14px;border:1px solid var(--line)}
.verdict.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 9%,var(--surface))}
.verdict.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.verdict.mid{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--surface))}
.verdict h3{font-size:18px;margin-bottom:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;cursor:pointer;font-size:13px;font-weight:600}
.seg button.on{background:var(--ink);color:var(--bg)}
.hidden-stat{filter:blur(5px);user-select:none}

/* churn */
.cm{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px;font-size:13px;max-width:420px}
.cm div{padding:9px 10px;border-radius:6px;background:var(--sunk);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.cm .h{background:none;font-family:var(--f-body);color:var(--muted);font-size:12px;padding:4px}
.cm .tp{background:color-mix(in srgb,var(--good) 18%,var(--surface))}
.cm .fp{background:color-mix(in srgb,var(--bad) 15%,var(--surface))}
.cm .fn{background:color-mix(in srgb,var(--warn) 16%,var(--surface))}

/* arena */
label.fld{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:13.5px}
label.fld small{font-weight:400;color:var(--muted)}
input[type=text],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:110px;resize:vertical}
.brief dl{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:10px 0 0;font-size:14px}
.brief dt{color:var(--muted);font-size:12.5px}
.brief dd{margin:0}
@media (max-width:480px){.brief dl{grid-template-columns:1fr}.brief dt{margin-top:6px}}
.score-row{display:grid;grid-template-columns:120px 1fr 34px;gap:10px;align-items:center;font-size:13.5px}
.score-row .bar>i{background:var(--data)}
.ad-preview{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--sunk)}
.ad-preview .h{font-weight:700;font-family:var(--f-display);font-size:17px}
.cnt{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:400}
.cnt.over{color:var(--bad)}

/* quiz */
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-size:15px}
.opt:hover{border-color:var(--ink)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.opt[disabled]{cursor:default}
.q{font-family:var(--f-display);font-size:clamp(19px,3.4vw,24px);font-weight:700;line-height:1.25}

/* mentor */
.chat{display:flex;flex-direction:column;gap:10px;min-height:260px}
.msg{max-width:85%;padding:10px 13px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:3px}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 11px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.composer{display:flex;gap:8px}
.composer input{flex:1;min-width:0}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:50;font-family:var(--f-mono)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.note{font-size:12.5px;color:var(--muted)}

/* decision games */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:34px 0 12px}
.sec-h h2{font-size:clamp(24px,4.5vw,32px);font-weight:800}
.mod.wide{grid-column:span 6;flex-direction:row;align-items:center;gap:18px;flex-wrap:wrap}
.mod.wide>div{flex:1;min-width:220px;display:flex;flex-direction:column;gap:8px}
@media (max-width:820px){.mod.wide{grid-column:span 6}}
@media (max-width:560px){.mod.wide{grid-column:auto}}
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:400px;margin:0 auto}
.meter{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;color:var(--muted)}
.meter svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.8}
.mdot{width:7px;height:7px;border-radius:50%;background:var(--ink);opacity:0;transition:opacity .15s}
.mdot.big{width:12px;height:12px}
.mdot.show{opacity:1}
.mtube{width:30px;height:62px;border-radius:8px;background:var(--sunk);position:relative;overflow:hidden;border:1px solid var(--line)}
.mtube i{position:absolute;left:0;right:0;bottom:0;background:var(--ink);transition:height .45s}
.mtube.low i{background:var(--bad)}
.mtube.high i{background:var(--warn)}
.deck{position:relative;max-width:380px;margin:18px auto 0;height:370px}
.scard{position:absolute;inset:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;transition:transform .32s, opacity .32s;box-shadow:0 22px 40px -26px rgba(0,0,0,.5)}
.scard:active{cursor:grabbing}
.scard.under{transform:scale(.94) translateY(12px);opacity:.55;pointer-events:none}
.who{display:flex;align-items:center;gap:10px}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--bg);flex:none}
.who b{display:block;font-family:var(--f-display);font-size:16px}
.who span{font-size:12.5px;color:var(--muted)}
.scard .txt{font-family:var(--f-display);font-size:clamp(18px,4.6vw,21px);font-weight:600;line-height:1.28;flex:1}
.choice-hint{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}
.choice-hint div{padding:8px 10px;border-radius:8px;background:var(--sunk);transition:background .15s,color .15s}
.choice-hint div:last-child{text-align:right}
.choice-hint div.act{background:var(--ink);color:var(--bg)}
.swipe-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:380px;margin:12px auto 0}
.lesson{max-width:520px;margin:16px auto 0;font-size:14px}
.timer{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);transition:width 1s linear}
.timer.urgent i{background:var(--bad)}
.feed{border-left:3px solid var(--line);padding-left:12px;display:flex;flex-direction:column;gap:10px}
.feed .t{font-size:13.5px}
/* compass */
.compass{display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:22px;align-items:center;margin-bottom:22px}
@media (max-width:680px){.compass{grid-template-columns:1fr}}
.nextstep{border-left:3px solid var(--accent);padding:6px 0 6px 12px;display:flex;flex-direction:column;gap:2px}
.dimrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.4fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.dimrow:last-child{border-bottom:0}
.dimbar{display:grid;grid-template-columns:1fr 34px 96px;gap:10px;align-items:center}
.chip-s{font-size:11.5px;padding:3px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);text-align:center;white-space:nowrap}
.chip-s.ok{background:color-mix(in srgb,var(--good) 16%,var(--surface));color:var(--good);font-weight:600}
@media (max-width:640px){.dimrow{grid-template-columns:1fr}.dimrow .row{justify-content:flex-start!important}}
/* glossary */
.term{text-decoration:underline dotted;text-decoration-color:var(--accent);text-decoration-thickness:1.5px;text-underline-offset:3px;cursor:help;border-radius:3px;transition:background .12s}
.term:hover,.term:focus-visible{background:color-mix(in srgb,var(--accent) 16%,transparent);outline:none}
.gl-back{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,#0B0F1A 46%,transparent);display:flex;align-items:center;justify-content:center;padding:16px}
.gl-back[hidden]{display:none}
.gl{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;max-width:540px;width:100%;max-height:min(86vh,760px);overflow:auto;padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 60px -30px rgba(0,0,0,.6);animation:glIn .18s ease-out}
@keyframes glIn{from{transform:translateY(10px);opacity:0}}
@media (max-width:560px){.gl-back{align-items:flex-end;padding:0}.gl{border-radius:18px 18px 0 0;max-height:88vh;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}}
.gl-abbr{font-family:var(--f-mono);font-weight:600;font-size:13px;padding:3px 9px;border-radius:6px;background:var(--ink);color:var(--bg);letter-spacing:.04em}
.gl-names{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:14px}
.gl-names dt{color:var(--muted);font-size:12.5px;padding-top:1px}
.gl-names dd{margin:0;font-weight:600}
.gl-d{font-size:15.5px;line-height:1.55}
.gl-sec{display:flex;flex-direction:column;gap:5px}

/* ========== 16-BIT-LOOK ========== */
:root{--f-px:var(--f-mono);--pxsh:#1B1F33;--gold:#F6C744;--dlg1:#3550C8;--dlg2:#121C66}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pxsh:#000}}
:root[data-theme="dark"]{--pxsh:#000}
h1,h2,h3,.lvl{font-family:var(--f-display);letter-spacing:.01em}
h1 em{font-style:normal}
.pxera{font-family:var(--f-mono);letter-spacing:.06em}
.panel,.mod,.kpi,.event{border-radius:4px}
.panel,.mod{box-shadow:4px 4px 0 var(--pxsh);border-width:2px;border-color:var(--pxsh)}
.mod:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--pxsh)}
.mod.feat{box-shadow:4px 4px 0 var(--accent)}
.kpi{box-shadow:inset 0 -3px 0 color-mix(in srgb,var(--pxsh) 18%,transparent)}
.btn{border-radius:4px;border-width:2px;border-color:var(--pxsh);box-shadow:3px 3px 0 var(--pxsh)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--pxsh)}
.btn.ghost{box-shadow:none;border-color:var(--line)}
.opt{border-radius:4px}
.bar{border-radius:2px;image-rendering:pixelated}
.bar i{border-radius:0;background:repeating-linear-gradient(90deg,var(--accent) 0 8px,color-mix(in srgb,var(--accent) 80%,#fff) 8px 10px)}
.pxs{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.pxban{position:relative;margin:0 0 16px;border:3px solid var(--pxsh);box-shadow:4px 4px 0 var(--pxsh);border-radius:4px;overflow:hidden;background:#101428}
.pxban canvas{width:100%;height:clamp(92px,20vw,190px);object-fit:cover;object-position:50% 100%}
.pxera{position:absolute;left:8px;bottom:6px;font-size:10px;color:#fff;background:rgba(10,12,30,.72);padding:3px 7px;border-radius:2px;text-transform:uppercase}
.hero-px{grid-column:1/-1;margin-bottom:0}
.hero-px canvas{height:clamp(110px,24vw,230px)}
.pxthumb{width:100%;height:auto;aspect-ratio:256/72;border:2px solid var(--pxsh);border-radius:3px;background:#101428}
.mod.wide>.pxthumb{width:min(300px,100%);flex:0 0 auto}
/* Dialogboxen wie im Rollenspiel */
.coach{background:linear-gradient(180deg,var(--dlg1),var(--dlg2));color:#F4F6FF;border:3px solid #fff;outline:3px solid var(--pxsh);box-shadow:5px 5px 0 var(--pxsh);border-radius:6px;margin:18px 3px 6px}
.coach .coach-h{color:#FFE680;font-family:var(--f-display);font-size:16px;display:flex;align-items:center;gap:10px}
.coach .coach-h svg{display:none}
.coach .coach-h canvas{width:44px;height:44px;border:2px solid #fff;border-radius:3px;flex:0 0 auto}
.coach a,.coach .term{color:#FFE680;text-decoration-color:#FFE680}
.coach .note,.coach .muted{color:#C8D0FF}
.coach details,.coach .rules{background:rgba(6,10,48,.4)!important;color:#F4F6FF!important;border-color:rgba(255,255,255,.35)!important}.coach details *:not(.term):not(.btn){color:inherit!important}.coach summary{color:#FFE680!important}
@media (max-width:520px){.pxera{font-size:8px;left:5px;bottom:4px;padding:2px 5px}}
.toast{background:linear-gradient(180deg,var(--dlg1),var(--dlg2));color:#fff;border:3px solid #fff;outline:2px solid var(--pxsh);border-radius:5px;font-family:var(--f-display);font-size:16px;font-weight:500}
.event{border-left-width:6px;box-shadow:3px 3px 0 color-mix(in srgb,var(--pxsh) 35%,transparent)}
.verdict.ok{animation:pxpop .35s steps(4)}
.verdict.no{animation:pxshk .3s steps(3)}
@keyframes pxpop{0%{transform:scale(.92)}60%{transform:scale(1.04)}100%{transform:none}}
@keyframes pxshk{0%,100%{transform:none}33%{transform:translateX(-4px)}66%{transform:translateX(4px)}}
/* Effekte */
#fxLayer{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.fxf{position:fixed;transform:translate(-50%,-50%);font-family:var(--f-display);font-weight:700;font-size:26px;white-space:nowrap;text-shadow:2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;animation:fxup 1.25s ease-out forwards}
.fxf.gain{color:var(--gold)}.fxf.loss{color:#FF5A4A}.fxf.mid{color:#9AD0FF}
@keyframes fxup{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-70%) scale(1.15)}30%{transform:translate(-50%,-80%) scale(1)}100%{opacity:0;transform:translate(-50%,-190%)}}
.fxc{position:fixed;width:10px;height:10px;margin:-5px;background:var(--gold);box-shadow:inset -2px -2px 0 #B07A10,inset 2px 2px 0 #FFF2A8,0 0 0 1px #5A3A00;animation:fxcoin 1.1s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fxcoin{0%{transform:translate(0,0)}45%{transform:translate(calc(var(--dx)*.6),var(--dy))}100%{transform:translate(var(--dx),40px);opacity:0}}
.fxflash{position:fixed;inset:0;animation:fxfl .55s steps(5) forwards}
.fxflash.good{background:radial-gradient(circle at 50% 40%,rgba(255,215,80,.28),transparent 65%)}
.fxflash.bad{background:radial-gradient(circle at 50% 40%,transparent 35%,rgba(230,30,30,.32));}
@keyframes fxfl{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
#view.shake{animation:fxshake .4s steps(6)}
@keyframes fxshake{0%,100%{transform:none}20%{transform:translate(-5px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,0)}}
.fxban{position:fixed;left:50%;top:18%;transform:translateX(-50%);width:min(520px,92vw);background:linear-gradient(180deg,var(--dlg1),var(--dlg2));border:3px solid #fff;outline:3px solid #000;box-shadow:6px 6px 0 #000;border-radius:6px;padding:10px;color:#fff;text-align:center;animation:fxbin .35s steps(5)}
.fxban canvas{width:100%;height:auto;border:2px solid #fff;border-radius:3px;margin-bottom:8px}
.fxban b{display:block;font-family:var(--f-display);font-size:30px;color:var(--gold);text-shadow:2px 2px 0 #000}
.fxban span{font-family:var(--f-px);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.fxban.out{animation:fxbout .4s steps(4) forwards}
@keyframes fxbin{0%{transform:translateX(-50%) scale(.3);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
@keyframes fxbout{to{transform:translateX(-50%) translateY(-30px);opacity:0}}
.cnt-up{color:var(--good,#1F9A50)!important;text-shadow:0 0 0 currentColor}
.cnt-down{color:#E0362C!important}
.kpi .v.cnt-up,.kpi .v.cnt-down{transition:color .2s}
/* Einstellungen */
.fxset{position:fixed;right:12px;top:58px;z-index:70;background:var(--surface);border:2px solid var(--pxsh);box-shadow:4px 4px 0 var(--pxsh);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:8px;width:min(270px,calc(100vw - 24px))}
.fxset[hidden]{display:none}
.fxset b{font-family:var(--f-px);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.fxset .seg{display:flex;gap:4px}
.fxset .seg button{flex:1;border:2px solid var(--pxsh);background:var(--sunk);border-radius:3px;padding:6px 4px;font:600 13px var(--f-body);cursor:pointer;color:var(--ink)}
.fxset .seg button.on{background:var(--accent);color:var(--accent-ink)}
@media (max-width:520px){.top-in{gap:6px;padding-left:12px;padding-right:12px}.top .xp-pill{padding:5px 8px}.logo{font-size:0;gap:0}}
@media (max-width:360px){#aiTxt{display:none}}
@keyframes fxfade{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
.fxf.calm{animation:fxfade 1.2s forwards;transform:translate(-50%,-90%)}
@media (prefers-reduced-motion:reduce){.fxc,.fxban,#view.shake,.verdict.ok,.verdict.no{animation-duration:.01s!important}}

<script>
/* ---------- utilities ---------- */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const de=(n,d=0)=>Number(n).toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const eur=n=>(n<0?'−':'')+de(Math.abs(Math.round(n)))+' €';
const keur=n=>(n<0?'−':'')+de(Math.abs(n)/1000,0)+'k';
const pct=(n,d=1)=>de(n*100,d)+' %';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function erf(x){const t=1/(1+0.3275911*Math.abs(x));const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return x>=0?y:-y}
const Phi=z=>0.5*(1+erf(z/Math.SQRT2));
function niceStep(x){if(x<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(x)));const f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
let toastT;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2200)}
const COLORS=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)'];

/* ---------- player state ---------- */
const LEVELS=[[0,'Praktikant:in'],[300,'Junior Marketer'],[800,'Performance Manager'],[1600,'Growth Lead'],[3000,'Head of Marketing'],[5000,'CMO']];
const BADGES=[
  ['first','Erste Kampagne'],['eff90','Budget-Effizienz ≥ 90 %'],['stat','Statistik-Profi'],
  ['sniper','Schwellen-Sniper'],['prompt','Prompt-Artist'],['quiz','KI-Kenner:in'],['mentor','Neugierig'],
  ['thron','20 Entscheidungen überlebt'],['preis','Preisstrateg:in'],['krise','Krisenfest'],['meister','Handwerk verstanden'],['lexikon','30 Begriffe entdeckt'],['metapro','Meta-Profi'],['social','Content-Strateg:in'],['tycoon','Kategorie-Champion'],['agency','Agentur-Gründer:in']];
let P={xp:0,badges:[],best:{}};
try{const s=JSON.parse(localStorage.getItem('marktlabor_v1'));if(s&&typeof s.xp==='number')P=Object.assign(P,s)}catch(e){}
if(!P.sk)P.sk={};if(!Array.isArray(P.seen))P.seen=[];if(!P.gx||typeof P.gx!=='object')P.gx={};if(!P.lessons)P.lessons={};if(!P.tutSkip)P.tutSkip={};if(!P.exam)P.exam={best:0,passed:false};
function save(){try{localStorage.setItem('marktlabor_v1',JSON.stringify(P))}catch(e){}if(typeof svSchedule==='function')svSchedule()}
const DIMS=[
 {k:'strategie',n:'Strategie & Positionierung',s:'Strategie',g:'markt'},
 {k:'analytics',n:'Analytics & Modelle',s:'Analytics',g:'churn'},
 {k:'experimente',n:'Experimente & Statistik',s:'Experimente',g:'ab'},
 {k:'media',n:'Media & Budget',s:'Media',g:'budget'},
 {k:'pricing',n:'Pricing',s:'Pricing',g:'preis'},
 {k:'creative',n:'Creative & Copy',s:'Creative',g:'arena'},
 {k:'krise',n:'Kommunikation & Krise',s:'Krise',g:'krise'},
 {k:'ki',n:'KI-Einsatz & Ethik',s:'KI & Ethik',g:'quiz'}];
const GNAME={tycoon:'Markenimperium',agency:'Agentur-Tycoon',funnel:'Funnel-Doktor',attr:'Attributions-Detektiv',nego:'KI-Verhandlung',bass:'Produktlebenszyklus',social:'Social-Media-Simulator',meta:'Meta-Ads-Simulator',markt:'Marktkampf',churn:'Churn-Radar',ab:'A/B-Test-Labor',budget:'Budget-Simulator',preis:'Preiskrieg',arena:'KI-Arena',krise:'Krisenstab',quiz:'KI im Marketing',thron:'CMO-Thron'};
function evid(k,v){const d=P.sk[k]||{s:0,n:0};v=clamp(+v||0,0,100);d.s=d.n===0?v:d.s+(v-d.s)*Math.max(0.2,1/(d.n+1));d.n++;P.sk[k]=d;save()}
function skState(k){const d=P.sk[k];if(!d||!d.n)return{s:0,n:0,lab:'Ungetestet'};const s=d.s;return{s,n:d.n,lab:s>=80?'Meisterhaft':s>=65?'Solide':s>=40?'Basis':'Lücke'}}
function mastered(k){const x=skState(k);return x.n>=3&&x.s>=75}
function nextStep(){const un=DIMS.find(d=>!skState(d.k).n);if(un)return{d:un,why:'Dazu gibt es noch keine Daten über dich.'};
  const weak=DIMS.filter(d=>!mastered(d.k)).sort((a,b)=>skState(a.k).s-skState(b.k).s)[0];
  if(weak)return{d:weak,why:skState(weak.k).n<3&&skState(weak.k).s>=75?'Stark, aber noch zu wenig Daten für ein sicheres Urteil.':`Deine schwächste offene Disziplin (${Math.round(skState(weak.k).s)} Punkte).`};return null}
function level(xp=P.xp){let i=0;LEVELS.forEach((l,k)=>{if(xp>=l[0])i=k});const cur=LEVELS[i],nxt=LEVELS[i+1];return{i,name:cur[1],from:cur[0],to:nxt?nxt[0]:null,next:nxt?nxt[1]:null}}
function addXP(n,why){if(n<=0)return;const before=level().i;P.xp+=n;save();toast(`+${n} XP · ${why}`);renderTop();if(level().i>before)setTimeout(()=>{FX.banner('Level-up!',level().name,'lvl','home');SFX.levelup()},1200)}
function badge(id){if(!P.badges.includes(id)){P.badges.push(id);save();const b=BADGES.find(x=>x[0]===id);setTimeout(()=>{FX.banner('Abzeichen!',b?b[1]:id,'chest','saves');SFX.chest()},900)}}
function setBest(k,v){if(P.best[k]==null||v>P.best[k]){P.best[k]=v;save()}}
function renderTop(){$('#xpPill').innerHTML=`${de(P.xp)} XP<span class="hide-sm"> · ${esc(level().name)}</span>`;
  $('#aiDot').className='ai-dot'+(AI.state==='on'?' on':'');
  $('#aiTxt').textContent=AI.state==='on'?'KI aktiv':AI.state==='pending'?'KI verbindet…':'KI offline'}

/* ---------- Claude (sample capability) ---------- */
const AI={fn:null,state:'pending'};
(async()=>{await Promise.resolve();try{
  if(!window.claude||typeof window.claude.use!=='function'){AI.state='off';renderTop();rerender();return}
  const s=await window.claude.use('sample');AI.fn=s;AI.state=s?'on':'off';
}catch(e){AI.state='off'}renderTop();rerender()})();
function aiErrText(e){const c=e&&e.code;
  if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c)){AI.state='off';renderTop();return 'KI ist in dieser Ansicht nicht freigegeben. Die Spiele funktionieren trotzdem, die Bewertung läuft dann offline.'}
  if(c==='rate_limited')return 'Gerade zu viele Anfragen. Versuch es in einer Minute noch einmal.';
  if(c==='session_expired')return 'Bitte melde dich erneut an.';
  if(c==='refused')return 'Diese Eingabe wurde abgelehnt. Formuliere sie anders.';
  if(c==='invalid_json')return 'Die Antwort war unvollständig. Tippe noch einmal auf den Button.';
  if(c==='cancelled')return '';
  return 'Verbindung unterbrochen. Tippe noch einmal auf den Button.'}

/* ---------- charts ---------- */
function lineChart({series,xmax,ymax,ymin=0,xfmt,yfmt,marks=[],diag=false,h=230}){
  const W=640,H=h,L=58,R=14,T=14,Bt=28,iw=W-L-R,ih=H-T-Bt;
  const X=v=>L+v/xmax*iw,Y=v=>T+ih-(v-ymin)/(ymax-ymin)*ih;
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">`;
  const yt=niceStep((ymax-ymin)/4);
  for(let v=Math.ceil(ymin/yt)*yt;v<=ymax+1e-9;v+=yt){s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${L-7}" y="${Y(v)+4}" class="tick" text-anchor="end">${yfmt(v)}</text>`}
  const xt=niceStep(xmax/5);
  for(let v=0;v<=xmax+1e-9;v+=xt){s+=`<text x="${X(v)}" y="${H-8}" class="tick" text-anchor="${v===0?'start':'middle'}">${xfmt(v)}</text>`}
  if(diag){const m=Math.min(xmax,ymax);s+=`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(m)}" y2="${Y(m)}" class="diag"/>`}
  series.forEach(se=>{const d=se.pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(clamp(p[1],ymin,ymax)).toFixed(1)).join('');
    if(se.area){s+=`<path d="${d}L${X(se.pts[se.pts.length-1][0])} ${Y(Math.max(0,ymin))}L${X(se.pts[0][0])} ${Y(Math.max(0,ymin))}Z" fill="${se.color}" opacity=".12"/>`}
    s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2.4" stroke-linejoin="round"/>`;
    (se.dots||[]).forEach(p=>{s+=`<circle cx="${X(p[0])}" cy="${Y(clamp(p[1],ymin,ymax))}" r="4.5" fill="${se.color}" stroke="var(--surface)" stroke-width="2"/>`})});
  marks.forEach(m=>{const x=X(m.x);s+=`<line x1="${x}" x2="${x}" y1="${T}" y2="${T+ih}" stroke="${m.color}" stroke-width="1.6" ${m.dash?'stroke-dasharray="4 3"':''}/>`;
    if(m.label){const right=x>W-130;s+=`<text x="${right?x-5:x+5}" y="${T+12+(m.dy||0)}" class="tick" text-anchor="${right?'end':'start'}" style="fill:${m.color};font-weight:600">${m.label}</text>`}});
  if(ymin<0)s+=`<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)" stroke-width="1"/>`;
  return s+'</svg>'}
function barChart(rows,{yfmt,h=210}){
  const W=640,H=h,L=58,R=10,T=12,Bt=26,iw=W-L-R,ih=H-T-Bt;
  let mx=0,mn=0;rows.forEach(r=>r.vals.forEach(v=>{mx=Math.max(mx,v.v);mn=Math.min(mn,v.v)}));
  const st=niceStep((mx-mn||1)/4);mx=Math.ceil(mx/st)*st||st;mn=Math.floor(mn/st)*st;
  const Y=v=>T+ih-(v-mn)/(mx-mn)*ih;
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">`;
  for(let v=mn;v<=mx+1e-9;v+=st)s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${L-7}" y="${Y(v)+4}" class="tick" text-anchor="end">${yfmt(v)}</text>`;
  const gw=iw/rows.length,n=rows[0]?rows[0].vals.length:1,bw=Math.min(28,(gw-14)/n);
  rows.forEach((r,i)=>{const cx=L+gw*i+gw/2;r.vals.forEach((v,j)=>{const x=cx-(n*bw)/2+j*bw;const y0=Y(0),y1=Y(v.v);s+=`<rect x="${x+1}" y="${Math.min(y0,y1)}" width="${bw-2}" height="${Math.max(1,Math.abs(y1-y0))}" rx="3" fill="${v.color}" ${v.ghost?'opacity=".35"':''}/>`});
    s+=`<text x="${cx}" y="${H-8}" class="tick" text-anchor="middle">${esc(r.label)}</text>`});
  s+=`<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)"/>`;
  return s+'</svg>'}

/* ---------- router ---------- */
let current='home';
function go(v){current=v;window.scrollTo(0,0);rerender()}
function rerender(){if(current!=='krise'&&KR&&KR.timer){clearInterval(KR.timer);KR.timer=null}
  ({home,budget:viewBudget,ab:viewAB,churn:viewChurn,arena:viewArena,quiz:viewQuiz,mentor:viewMentor,thron:viewThron,preis:viewPreis,krise:viewKrise,kompass:viewKompass,exam:viewExam,markt:viewMarkt,lexikon:viewLexikon,akademie:viewAkademie,lesson:viewLesson,meta:viewMeta,social:viewSocial,saves:viewSaves,tycoon:viewTycoon,agency:viewAgency,funnel:viewFunnel,attr:viewAttr,nego:viewNego,bass:viewBass}[current]||home)()}
$('#logo').onclick=()=>go('home');
$('#lexBtn').onclick=()=>go('lexikon');
$('#saveBtn').onclick=()=>go('saves');
function bindGo(){$$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}

/* ========== HOME ========== */
function home(){
  const L=level();const prog=L.to?(P.xp-L.from)/(L.to-L.from):1;
  const best=k=>P.best[k]!=null?P.best[k]:null;
  const curve=(()=>{const pts=[];for(let x=0;x<=60;x+=2){const y=1400*Math.pow(x,1.3)/(Math.pow(x,1.3)+Math.pow(18,1.3));pts.push([x,y])}
    const W=300,H=70;let d=pts.map((p,i)=>(i?'L':'M')+(p[0]/60*W).toFixed(1)+' '+(H-4-p[1]/1400*(H-10)).toFixed(1)).join('');
    return `<svg class="mini-curve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5"/><line x1="0" y1="${H-4}" x2="${W}" y2="${H-50}" stroke="currentColor" stroke-dasharray="4 4" opacity=".4"/></svg>`})();
  $('#view').innerHTML=`
  <section class="hero">
    <div class="pxban hero-px"><canvas class="pxs" data-scene="home" width="256" height="72" aria-hidden="true"></canvas><span class="pxera">Von Rom bis heute · Märkte aller Epochen</span></div>
    <div>
      <div class="eyebrow">Marketing · Daten · KI</div>
      <h1>Triff Entscheidungen.<br>Die <em>Daten</em> antworten.</h1>
      <p class="lead">Labore und Entscheidungsspiele gegen KI-gesteuerte Konkurrenz. Jede Entscheidung fließt in dein Kompetenzprofil, und der Kompass zeigt dir den schnellsten Weg zu einer ehrlichen Antwort: Hast du das Handwerk verstanden? Neu hier: Starte in der Akademie. Gepunktet unterstrichene Fachbegriffe kannst du überall antippen.</p>
    </div>
    <div class="panel player stack" style="gap:10px">
      <div class="row" style="justify-content:space-between"><span class="eyebrow">Dein Level</span><span class="num" style="font-size:13px">${de(P.xp)} XP</span></div>
      <div class="lvl">${esc(L.name)}</div>
      <div class="bar"><i style="width:${(prog*100).toFixed(1)}%"></i></div>
      <div class="note">${L.to?`Noch ${de(L.to-P.xp)} XP bis ${esc(L.next)}`:'Höchstes Level erreicht'}</div>
      <div class="badges">${BADGES.map(b=>`<span class="badge ${P.badges.includes(b[0])?'got':''}">${esc(b[1])}</span>`).join('')}</div>
    </div>
  </section>
  ${continueStrip()}
  ${akadStrip()}
  ${compassPanel()}
  <div class="sec-h" style="margin-top:8px"><h2>Wirtschaftssimulationen</h2><span class="note">Lange Spiele über Monate und Jahre. Je drei Spielstände, automatisch gespeichert.</span></div>
  <section class="mods">
    <button class="mod feat wide sim" data-go="tycoon">
      <div><div class="eyebrow">36 Monate · Echtzeit · Lager, Konkurrenz & Cash</div>
      <h3>Markenimperium</h3>
      <p class="mod-d">Baue Fjord, eine nachhaltige Zahnpflege-Marke, vom Start-up zum Kategorie-Champion. Du siehst deine Firma live wachsen: Marketing-Büro, Labor, Lager, Service, Plakate im Park und Kund:innen auf der Straße. Dazu ein Konkurrent, der auf dich reagiert, ein Lager, das Geld bindet, und Krisen, bei denen du entscheiden musst. Mit Kohorten-Heatmap, Marktkarte und Cash-Kurve.</p></div>
      <svg class="simart" viewBox="0 0 300 64" preserveAspectRatio="none" aria-hidden="true"><path d="M0 30 C40 30 50 52 90 54 S150 40 190 24 S260 6 300 2" fill="none" stroke="var(--accent)" stroke-width="3"/><line x1="0" y1="30" x2="300" y2="30" stroke="currentColor" opacity=".3" stroke-dasharray="4 4"/></svg>
      <div class="mod-f" style="margin-top:0"><div class="tags"><span class="tag">Unit Economics</span><span class="tag">Lieferkette</span><span class="tag">Wettbewerb</span></div><span class="best">${best('tycoon')!=null?'Bestwert '+eur(best('tycoon')):'Neu'}</span></div>
    </button>
    <button class="mod" data-go="agency" style="grid-column:span 3">
      <div class="eyebrow">24 Monate · Agentur führen</div>
      <h3>Agentur-Tycoon</h3>
      <p class="mod-d">Einstellen, pitchen, Kapazität verteilen, Preise setzen. Halte Kunden zufrieden und dein Team gesund. KI-Werkzeuge bringen Kapazität und Preisdruck.</p>
      <div class="mod-f"><div class="tags"><span class="tag">Auslastung</span><span class="tag">Pitches</span></div><span class="best">${best('agency')!=null?'Bestwert '+eur(best('agency')):'Neu'}</span></div>
    </button>
    <button class="mod" data-go="bass" style="grid-column:span 3">
      <div class="eyebrow">5 Jahre · Produkt-Launch</div>
      <h3>Produktlebenszyklus</h3>
      <p class="mod-d">Ein Smart-Ring erobert den Markt: Innovatoren, Imitatoren und die S-Kurve. Preis, Werbung, Kapazität, Erfahrungskurve und die zweite Generation.</p>
      <div class="mod-f"><div class="tags"><span class="tag">Bass-Modell</span><span class="tag">Lebenszyklus</span></div><span class="best">${best('bass')!=null?'Bestwert '+eur(best('bass')):'Neu'}</span></div>
    </button>
  </section>
  <div class="sec-h" style="margin-top:8px"><h2>Labore</h2><span class="note">Einzelne Disziplinen gezielt trainieren.</span></div>
  <section class="mods">
    <button class="mod feat" data-go="budget">
      <div class="eyebrow">Labor 1 · Media-Mix · 6 Monate</div>
      <h3>Budget-Simulator</h3>
      <p class="mod-d">120.000 € pro Monat auf sechs Kanäle. Sättigung, Nachhall, Cookie-Aus und ein Sale. Kauf dir eine KI-MMM-Schätzung oder vertrau dem Bauch.</p>
      ${curve}
      <div class="mod-f"><div class="tags"><span class="tag">MMM</span><span class="tag">Grenzertrag</span><span class="tag">Adstock</span><span class="tag ki">KI-Analyst</span></div><span class="best">${best('budget')!=null?'Bestwert '+pct(best('budget'),0)+' Effizienz':'Noch nicht gespielt'}</span></div>
    </button>
    <button class="mod" data-go="arena">
      <div class="eyebrow">Labor 2 · Creative & Prompting</div>
      <h3>KI-Arena</h3>
      <p class="mod-d">Echte Briefings. Du textest Anzeigen oder baust Prompts, Claude bewertet wie eine strenge Jury.</p>
      <div class="mod-f"><div class="tags"><span class="tag ki">Live-KI</span><span class="tag">Copy</span></div><span class="best">${best('arena')!=null?'Bestwert '+de(best('arena'),1)+'/10':''}</span></div>
    </button>
    <button class="mod" data-go="ab">

/* ========== LABOR 3: A/B ========== */
const IDEAS=[
 ['Neuer CTA „Jetzt sichern“ statt „In den Warenkorb“','Dringlichkeit im Button-Text steigert die Klickrate.'],
 ['Gratis-Versand ab 30 € statt ab 50 €','Niedrigere Schwelle senkt Kaufabbrüche.'],
 ['KI-generierte Produktbeschreibungen','LLM-Texte sind ausführlicher und beantworten mehr Fragen.'],
 ['Social-Proof-Badge „1.200 Käufe diese Woche“','Soziale Bewährtheit reduziert Unsicherheit.'],
 ['Checkout mit 2 statt 4 Schritten','Weniger Reibung, weniger Abbrüche.'],
 ['ML-Empfehlungen „Passt dazu“ auf der Produktseite','Personalisierte Empfehlungen erhöhen den Warenkorbwert und die Kaufquote.'],
 ['Preis mit Streichpreis darstellen','Ankereffekt lässt den Preis günstiger wirken.'],
 ['Hero-Video statt Hero-Bild','Bewegtbild erklärt das Produkt schneller.'],
 ['Chatbot-Popup nach 20 Sekunden','Proaktive Hilfe klärt Fragen vor dem Kauf.'],

let A=null;
function binom(n,p){return clamp(Math.round(n*p+Math.sqrt(n*p*(1-p))*gauss()),0,n)}
function abStats(n,cA,cB){const pA=cA/n,pB=cB/n,pp=(cA+cB)/(2*n);const se0=Math.sqrt(pp*(1-pp)*2/n)||1e-9;const z=(pB-pA)/se0;const p=2*(1-Phi(Math.abs(z)));
  const se=Math.sqrt(pA*(1-pA)/n+pB*(1-pB)/n)||1e-9;return{pA,pB,lift:pA?pB/pA-1:0,p,lo:pB-pA-1.96*se,hi:pB-pA+1.96*se,pB_A:Phi((pB-pA)/se)}}
function genAB(i,peekIdx){const idea=IDEAS[(A.order[i])];
  if(i===peekIdx){let s,cA,cB,base,n=700;for(let t=0;t<400;t++){base=0.03+Math.random()*0.02;cA=binom(n,base);cB=binom(n,base);s=abStats(n,cA,cB);if(s.p<0.05&&cB>cA)break}
    return{idea,n,cA,cB,base,L:0,peek:true,day:2,days:14,s}}
  const base=0.02+Math.random()*0.04;const L=pick([-0.1,0,0,0.06,0.12,0.2]);const n=pick([600,2500,8000,25000]);
  const cA=binom(n,base),cB=binom(n,base*(1+L));return{idea,n,cA,cB,base,L,peek:false,day:14,days:14,s:abStats(n,cA,cB)}}
function newAB(){A={i:0,score:0,hard:A?A.hard:false,order:shuffle(IDEAS.map((_,k)=>k)),choice:null,log:[]};A.peekIdx=2+Math.floor(Math.random()*5);A.cur=genAB(0,A.peekIdx)}
function abBest(c){const s=c.s;if(c.peek)return{more:100};if(s.p<0.05)return s.lift>0?{B:100,more:30}:{A:100,more:30};if(c.n<=2500)return{more:100,A:40};if(c.n<=8000)return{more:100,A:100};return{A:100,more:50}}
function reqN(c){const pA=c.base,pB=c.base*(1+(c.L||0.1));return Math.ceil(Math.pow(1.96+0.84,2)*(pA*(1-pA)+pB*(1-pB))/Math.pow(pB-pA,2))}
function abJudge(c,ch){const m=abBest(c),pts=m[ch]||0,best=Object.keys(m).sort((x,y)=>m[y]-m[x])[0],s=c.s;
  const good=pts>=100,luck=c.peek?ch==='more':ch==='B'?c.L>0:ch==='A'?c.L<=0:true;
  const cls=good?'ok':pts>=30?'mid':'no',head=good?(luck?'Richtig gelesen':'Richtig gelesen, Pech im Ausgang'):pts>=30?'Vertretbar, aber nicht optimal':'Die Daten sagten etwas anderes';
  const read=c.peek?`Zwischenstand an Tag ${c.day} von ${c.days}. Vor dem geplanten Ende wird nicht entschieden, egal wie der p-Wert aussieht.`:s.p<0.05?`p = ${de(s.p,3)} liegt unter 0,05, und das Konfidenzintervall (${de(s.lo*100,2)} … ${de(s.hi*100,2)} pp) liegt komplett ${s.lift>0?'über':'unter'} 0. Die Daten sprechen klar für ${s.lift>0?'B':'A'}.`:c.n<=2500?`p = ${de(s.p,3)} bei nur ${de(c.n)} Besuchern je Variante. „Nicht signifikant“ heißt hier „zu wenig Daten“, nicht „kein Effekt“. Also weitertesten.`:c.n<=8000?`p = ${de(s.p,3)} bei ${de(c.n)} Besuchern je Variante: kein belegter Effekt. A behalten oder weitertesten ist beides vertretbar.`:`p = ${de(s.p,3)} bei ${de(c.n)} Besuchern je Variante. Mit so vielen Daten wäre ein relevanter Effekt sichtbar. A behalten.`;
  let truth=c.peek?'Die Wahrheit: Es war ein A/A-Test, beide Varianten waren identisch. Der frühe „Gewinner“ war Zufall.':`Die Wahrheit: Der echte Effekt von B war ${c.L>0?'+':''}${pct(c.L,0)}.`;
  if(good&&!luck)truth+=' Deine Entscheidung war trotzdem richtig: Auch bei sauberer Lesart passiert so etwas gelegentlich. Bewertet wird der Prozess, nicht das Glück.';
  if(!good&&luck&&!c.peek)truth+=' Mit deiner Wahl hättest du diesmal Glück gehabt, aber die Daten gaben das nicht her. Darum gibt es keine vollen Punkte.';
  if(!c.peek&&c.n<=2500&&c.L)truth+=` Für diesen Effekt hätte man rund ${de(reqN(c))} Besucher je Variante gebraucht.`;
  return{pts,cls,head,ex:`<b>Was die Daten sagten:</b> ${read}<br><br>${truth}`,best}}
function viewAB(){

  let h=`${backBtn}<div class="ghead"><div><div class="eyebrow">Labor 3 · Experimente</div><h2>A/B-Test-Labor</h2></div>

  <details class="concept"><summary>Spielregeln & Statistik</summary><p>Du bekommst acht Tests. Für jeden entscheidest du: <b>B ausrollen</b>, <b>A behalten</b> oder <b>weitertesten</b>. Hinter jedem Test steckt ein wahrer Effekt, den du erst nach deiner Entscheidung siehst. Bewertet wird, ob du die Daten richtig gelesen hast, nicht ob du Glück hattest. Der <b>p-Wert</b> sagt, wie überraschend die Daten wären, wenn es keinen Effekt gäbe. Das <b>Konfidenzintervall</b> zeigt die plausible Spanne des Effekts. Im <b>Hardcore-Modus</b> siehst du nur Rohdaten und musst selbst einschätzen.</p></details>`;
  if(A.i>=8){const max=800;setBest('ab',A.score);
    h+=`<div class="panel stack" style="margin-top:14px"><div class="eyebrow">Ergebnis</div><div style="font-family:var(--f-display);font-size:44px;font-weight:800">${de(A.score)} <span style="font-size:20px;color:var(--muted)">/ ${max}</span></div>
      <div class="tbl-wrap"><table class="data"><thead><tr><th>Test</th><th>n</th><th>wahrer Effekt</th><th>du</th><th>Pkt</th></tr></thead><tbody>${A.log.map(l=>`<tr><td style="white-space:normal">${esc(l.t)}</td><td>${de(l.n)}</td><td>${l.peek?'A/A':(l.L>0?'+':'')+pct(l.L,0)}</td><td>${{A:'A',B:'B',more:'weiter'}[l.ch]}</td><td class="${l.pts>=100?'pos':l.pts<=0?'neg':''}">${l.pts}</td></tr>`).join('')}</tbody></table></div>
      <button class="btn primary" id="abAgain">Neue Testreihe</button></div>`;
    $('#view').innerHTML=h;bindGo();$('#abAgain').onclick=()=>{A=null;newAB();viewAB()};bindAbMode();return}
  const c=A.cur,s=c.s,shown=!A.hard||A.choice;
  const ciChart=(()=>{const W=640,H=120,L=110,R=20;const seA=Math.sqrt(s.pA*(1-s.pA)/c.n),seB=Math.sqrt(s.pB*(1-s.pB)/c.n);
    const lo=Math.max(0,Math.min(s.pA-2.5*seA,s.pB-2.5*seB)),hi=Math.max(s.pA+2.5*seA,s.pB+2.5*seB);const X=v=>L+(v-lo)/(hi-lo)*(W-L-R);
    const bar=(y,p,se,col,lab)=>`<text x="${L-10}" y="${y+4}" class="tick" text-anchor="end">${lab}</text><line x1="${X(p-1.96*se)}" x2="${X(p+1.96*se)}" y1="${y}" y2="${y}" stroke="${col}" stroke-width="6" stroke-linecap="round" opacity=".35"/><circle cx="${X(p)}" cy="${y}" r="6" fill="${col}"/>`;
    let t='';const st=niceStep((hi-lo)/4);for(let v=Math.ceil(lo/st)*st;v<=hi;v+=st)t+=`<line x1="${X(v)}" x2="${X(v)}" y1="14" y2="${H-26}" class="grid"/><text x="${X(v)}" y="${H-8}" class="tick" text-anchor="middle">${de(v*100,1)}%</text>`;
    return `<svg viewBox="0 0 ${W} ${H}" class="chart">${t}${bar(36,s.pA,seA,'var(--c3)','A · Kontrolle')}${bar(70,s.pB,seB,'var(--accent)','B · Variante')}</svg>`})();
  h+=`<div class="panel stack" style="margin-top:14px">
    <div class="row" style="justify-content:space-between"><span class="eyebrow">Test ${A.i+1} von 8</span><span class="xp-pill">Tag ${c.day} von ${c.days}${c.peek?' · Zwischenstand':''}</span></div>
    <div><h3 style="font-size:22px">${esc(c.idea[0])}</h3><p class="lead" style="margin-top:4px">Hypothese: ${esc(c.idea[1])}</p></div>
    <div class="tbl-wrap"><table class="data"><thead><tr><th>Variante</th><th>Besucher</th><th>Conversions</th><th>Conv.-Rate</th></tr></thead><tbody>
      <tr><td>A · Kontrolle</td><td>${de(c.n)}</td><td>${de(c.cA)}</td><td>${pct(s.pA,2)}</td></tr>
      <tr><td>B · Variante</td><td>${de(c.n)}</td><td>${de(c.cB)}</td><td>${pct(s.pB,2)}</td></tr></tbody></table></div>
    <div class="kpis ${shown?'':'hidden-stat'}" aria-hidden="${shown?'false':'true'}">
      <div class="kpi"><div class="k">Beob. Lift</div><div class="v">${s.lift>=0?'+':''}${pct(s.lift,1)}</div></div>
      <div class="kpi"><div class="k">p-Wert</div><div class="v ${s.p<0.05?'pos':''}">${de(s.p,3)}</div></div>
      <div class="kpi"><div class="k">95 %-Konfidenzintervall</div><div class="v" style="font-size:15px">${de(s.lo*100,2)} … ${de(s.hi*100,2)} pp</div></div>
      <div class="kpi"><div class="k">P(B &gt; A)</div><div class="v">${pct(s.pB_A,0)}</div></div></div>

  $$('[data-ch]').forEach(b=>b.onclick=()=>{A.choice=b.dataset.ch;A.judge=abJudge(c,A.choice);const bonus=A.hard&&A.judge.pts>=100?20:0;A.judge.pts+=bonus;A.score+=A.judge.pts;
    A.log.push({t:c.idea[0],n:c.n,L:c.L,peek:c.peek,ch:A.choice,pts:A.judge.pts});evid('experimente',A.judge.pts>=100?100:A.judge.pts>=40?50:0);if(A.judge.pts>0)addXP(Math.round(A.judge.pts/5),'Testentscheidung');viewAB()});

function bindAbMode(){const n=$('#mN'),h=$('#mH');if(!n)return;n.onclick=()=>{A.hard=false;viewAB()};h.onclick=()=>{A.hard=true;viewAB()}}

const SCEN=[
 {id:'a',name:'Streaming-Abo',clv:220,cost:15,save:0.35,txt:'Rabatt-Mail mit 1 Monat gratis. Günstig, aber nicht jeder bleibt.'},
 {id:'b',name:'Mobilfunk',clv:220,cost:45,save:0.30,txt:'Persönlicher Rückruf mit Gerätebonus. Teuer pro Kontakt.'},
 {id:'c',name:'B2B-Software',clv:900,cost:25,save:0.25,txt:'Customer-Success-Call. Kunden sind sehr wertvoll.'}];
let CHN=null;
function genChurn(){const pop=[];for(let i=0;i<2000;i++){const y=Math.random()<0.15;const sc=clamp(y?0.62+0.17*gauss():0.30+0.16*gauss(),0,1);pop.push({y,sc})}
  const pos=pop.filter(p=>p.y),neg=pop.filter(p=>!p.y);let w=0;const sn=neg.map(p=>p.sc).sort((a,b)=>a-b);
  pos.forEach(p=>{let lo=0,hi=sn.length;while(lo<hi){const m=(lo+hi)>>1;if(sn[m]<p.sc)lo=m+1;else hi=m}w+=lo});return{pop,auc:w/(pos.length*neg.length)}}
function cmAt(t){let tp=0,fp=0,fn=0,tn=0;CHN.data.pop.forEach(p=>{const pr=p.sc>=t;if(pr&&p.y)tp++;else if(pr)fp++;else if(p.y)fn++;else tn++});return{tp,fp,fn,tn}}
function profitAt(t,sc){const m=cmAt(t);return m.tp*sc.clv*sc.save-(m.tp+m.fp)*sc.cost}
function newChurn(){CHN={data:genChurn(),sc:0,t:0.5,locked:{}}}
function viewChurn(){
  if(!CHN)newChurn();const sc=SCEN[CHN.sc];const m=cmAt(CHN.t);const pr=profitAt(CHN.t,sc);
  const curve=[];let best={t:0,p:-Infinity};for(let t=0;t<=1.0001;t+=0.01){const p=profitAt(t,sc);curve.push([t,p]);if(p>best.p)best={t,p}}
  const pmin=Math.min(0,...curve.map(c=>c[1])),pmax=Math.max(...curve.map(c=>c[1]));const lock=CHN.locked[sc.id];
  const prec=m.tp+m.fp?m.tp/(m.tp+m.fp):0,rec=m.tp/(m.tp+m.fn);
  let h=`${backBtn}<div class="ghead"><div><div class="eyebrow">Labor 4 · Predictive Analytics</div><h2>Churn-Radar</h2></div>
    <div class="seg" role="group" aria-label="Szenario">${SCEN.map((s,i)=>`<button data-sc="${i}" class="${i===CHN.sc?'on':''}">${s.name}${CHN.locked[s.id]?' ✓':''}</button>`).join('')}</div></div>
  <details class="concept"><summary>Worum geht's?</summary><p>Ein Machine-Learning-Modell gibt jedem der <b>2.000 Kunden</b> einen Churn-Score zwischen 0 und 1. Etwa 15 % kündigen wirklich. Du legst fest, ab welchem Score ein Kunde ein Halte-Angebot bekommt. <b>Precision</b>: Wie viele Angeschriebene wären wirklich gegangen? <b>Recall</b>: Wie viele echte Kündiger erreichst du? Welche Schwelle richtig ist, entscheidet nicht die Statistik, sondern das Verhältnis von <b>Kundenwert, Kosten und Rettungsquote</b>.</p><p>Profi-Hinweis: Selbst die beste Schwelle bezahlt auch Kunden, die sowieso geblieben wären oder trotzdem gehen. <b>Uplift-Modelle</b> zielen deshalb direkt auf die Kunden, die sich durch das Angebot umstimmen lassen.</p></details>
  <div class="panel stack" style="margin-top:14px">
    <div class="row" style="justify-content:space-between;align-items:flex-start"><div><b style="font-family:var(--f-display);font-size:19px">${sc.name}</b><p class="note">${sc.txt}</p></div><span class="xp-pill">Modell-AUC ${de(CHN.data.auc,2)}</span></div>
    <div class="kpis"><div class="kpi"><div class="k">Kundenwert (CLV)</div><div class="v">${eur(sc.clv)}</div></div><div class="kpi"><div class="k">Kosten je Kontakt</div><div class="v">${eur(sc.cost)}</div></div><div class="kpi"><div class="k">Rettungsquote</div><div class="v">${pct(sc.save,0)}</div></div></div>
    <label class="fld" for="thr">Schwelle: Score ≥ <span class="num" id="thrV">${de(CHN.t,2)}</span> bekommt das Angebot
      <input type="range" id="thr" min="0" max="1" step="0.01" value="${CHN.t}" ${lock?'disabled':''}></label>

    <div id="ccoach"></div>
    ${lineChart({series:[{color:'var(--data)',pts:curve,area:!!lock}],xmax:1,ymax:Math.max(pmax*1.1,1000),ymin:pmin<0?pmin*1.1:0,xfmt:v=>de(v,1),yfmt:keur,marks:[{x:CHN.t,color:'var(--accent)',label:'Du'},...(lock?[{x:best.t,color:'var(--good)',label:'Optimum',dash:true,dy:16}]:[])],h:240}).replace('<svg','<svg id="pc"')}

  upd();
  const sl=$('#thr');sl.oninput=()=>{CHN.t=+sl.value;$('#thrV').textContent=de(CHN.t,2);upd();
    const svg=$('#pc'),ln=svg.querySelector('line[stroke="var(--accent)"]');if(ln){const x=58+CHN.t*(640-58-14);ln.setAttribute('x1',x);ln.setAttribute('x2',x);const tx=ln.nextElementSibling;if(tx&&tx.tagName==='text'){const right=x>640-130;tx.setAttribute('x',right?x-5:x+5);tx.setAttribute('text-anchor',right?'end':'start')}}};

function heuristic(br,mode,hl,tx,pr){
  const all=(hl+' '+tx+' '+pr).toLowerCase();const has=re=>re.test(all);
  if(mode==='ad'){const sc={zielgruppenfit:4,nutzen:4,klarheit:5,cta:3,kanalfit:5};
    if(has(/\b(du|dein|dir|ihr|euer)\b/))sc.zielgruppenfit+=2;
    if(has(/\d/))sc.nutzen+=2;if(has(/(spar|schnell|ohne|endlich|minuten|sicher|gratis|garant)/))sc.nutzen+=2;
    if(has(/(jetzt|hol|teste|buch|sicher dir|probier|lade|bestell|starte)/))sc.cta+=4;
    if(hl.length&&hl.length<=br.hl)sc.kanalfit+=2;else if(hl.length>br.hl)sc.kanalfit-=2;if(tx.length>br.tx)sc.kanalfit-=2;
    if(hl.split(' ').length<=8)sc.klarheit+=2;
    Object.keys(sc).forEach(k=>sc[k]=clamp(sc[k],0,10));
    return{scores:sc,staerken:['Bewertet offline mit einfachen Regeln (Länge, Ansprache, Zahlen, Call-to-Action).'],schwaechen:['Inhaltliche Qualität kann die Heuristik nicht beurteilen. Mit aktiver KI bekommst du echtes Feedback.'],verbessert:null,lektion:'Konkreter Nutzen + klare Handlungsaufforderung + Kanal-Limits einhalten: das ist das Minimum jeder Performance-Anzeige.',ctr:null,offline:true}}
  const sc={rolle:has(/(du bist|agiere als|rolle)/)?8:3,kontext:pr.length>200?7:pr.length>100?5:3,zielgruppe:has(/(zielgruppe|persona|für (menschen|leute|kunden))/)?8:3,format:has(/(format|zeichen|stichpunkt|tabelle|varianten|json|liste)/)?8:3,constraints:has(/(nicht|keine|max|maximal|vermeide|tonalität|ton)/)?7:3};
  return{scores:sc,staerken:['Bewertet offline mit einfachen Regeln (Rolle, Kontext, Zielgruppe, Format, Einschränkungen).'],schwaechen:['Mit aktiver KI wird dein Prompt auch ausgeführt und das Ergebnis bewertet.'],verbessert:null,lektion:'Ein guter Prompt ist ein gutes Briefing: Rolle, Ziel, Zielgruppe, Kontext, Format und Grenzen.',offline:true}}

  const ev=PEV[w];const pe=promo?Math.round(p*0.8):p;
  const refE=st.ref>pe?0.02*(st.ref-pe):0.045*(st.ref-pe);
  const promoE=promo?0.25:(ev.bw?-0.25:0);const wait=-0.15*st.hang;
  const Uy=4-PZ.beta*pe+0.25*Math.log(1+ad/1000)+refE+promoE+wait;
  const pcE=ev.bw?Math.round(st.pc*0.85):st.pc;
  const Uc=4-PZ.beta*pcE+0.25*Math.log(11)+ev.cb;
  const ey=Math.exp(Uy),ec=Math.exp(Uc),s=ey/(ey+ec+1),sc=ec/(ey+ec+1);
  const units=Math.max(0,Math.round(PZ.market*ev.m*s*(noise?1+0.04*gauss():1)));
  const profit=units*(pe-PZ.cost)-ad;
  const next={ref:0.75*st.ref+0.25*pe,hang:Math.max(0,st.hang*0.5+(promo?1:0)),pc:clamp(Math.round(st.pc+0.5*(p-st.pc)+(noise?gauss()*1.5:0)),PZ.cost+10,115)};
  return{pe,pcE,units,profit,share:s,shareC:sc,next,ref:st.ref}}
function preisBench(){let best=-Infinity,bp=0;for(let p=59;p<=119;p++)for(const bwPromo of [false,true]){let st={ref:89,hang:0,pc:89},tot=0;
  for(let w=0;w<PZ.weeks;w++){const r=preisStep(st,w,p,10000,bwPromo&&PEV[w].bw,false);tot+=r.profit;st=r.next}if(tot>best){best=tot;bp=p}}return{profit:best,p:bp}}
function newPreis(){PR={w:0,st:{ref:89,hang:0,pc:89},p:89,ad:10000,promo:false,hist:[],done:false,bench:preisBench()}}
function elasticity(){const pts=PR.hist.map(h=>[Math.log(h.pe),Math.log(h.units/PEV[h.w].m)]);if(pts.length<3)return null;
  const mx=pts.reduce((a,p)=>a+p[0],0)/pts.length,my=pts.reduce((a,p)=>a+p[1],0)/pts.length;let sxy=0,sxx=0;pts.forEach(p=>{sxy+=(p[0]-mx)*(p[1]-my);sxx+=(p[0]-mx)**2});
  if(sxx<1e-4)return{none:true};return{e:sxy/sxx,n:pts.length}}
function preisRun(){const r=preisStep(PR.st,PR.w,PR.p,PR.ad,PR.promo,true);PR.hist.push(Object.assign({w:PR.w,p:PR.p,ad:PR.ad,promo:PR.promo},r));PR.st=r.next;PR.w++;PR.promo=false;
  if(PR.w>=PZ.weeks){PR.done=true;const tot=PR.hist.reduce((a,h)=>a+h.profit,0);PR.score=tot/PR.bench.profit;setBest('preis',PR.score);evid('pricing',clamp((PR.score-0.6)/0.4,0,1)*100);if(PR.score>=0.95)badge('preis');addXP(Math.round(clamp(PR.score,0,1.1)*200)+30,'Preisspiel beendet')}else addXP(10,'Woche gespielt');viewPreis()}

    if(PR.done)h+=`<div class="panel stack"><div class="eyebrow">Ergebnis gegen die beste Konstant-Strategie</div><div style="font-family:var(--f-display);font-size:44px;font-weight:800">${pct(PR.score,0)}</div>

function radar(compact){
  const W=360,H=compact?300:320,cx=180,cy=H/2,R=compact?92:104,n=DIMS.length;
  const ang=i=>-Math.PI/2+i*2*Math.PI/n,pt=(i,r)=>[cx+Math.cos(ang(i))*r,cy+Math.sin(ang(i))*r];
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Kompetenzprofil über acht Disziplinen">`;
  [25,50,75,100].forEach(v=>{s+=`<polygon points="${DIMS.map((_,i)=>pt(i,R*v/100).map(x=>x.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${v===75?'var(--data)':'var(--line)'}" ${v===75?'stroke-dasharray="3 3"':''}/>`});
  DIMS.forEach((_,i)=>{const [x,y]=pt(i,R);s+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)"/>`});
  const poly=DIMS.map((d,i)=>pt(i,R*Math.max(3,skState(d.k).s)/100).map(x=>x.toFixed(1)).join(',')).join(' ');
  s+=`<polygon points="${poly}" fill="var(--accent)" fill-opacity=".18" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
  DIMS.forEach((d,i)=>{const st=skState(d.k);const [x,y]=pt(i,R*Math.max(3,st.s)/100);s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${st.n?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="1.5"/>`;
    const [lx,ly]=pt(i,R+16);const anc=Math.abs(lx-cx)<8?'middle':lx>cx?'start':'end';
    s+=`<text x="${lx.toFixed(1)}" y="${(ly+(ly<cy-R*0.6?-2:ly>cy+R*0.6?10:4)).toFixed(1)}" text-anchor="${anc}" class="tick" style="fill:var(--ink);font-size:11.5px">${d.s}</text>`;
    s+=`<text x="${lx.toFixed(1)}" y="${(ly+(ly<cy-R*0.6?-2:ly>cy+R*0.6?10:4)+13).toFixed(1)}" text-anchor="${anc}" class="tick">${st.n?Math.round(st.s):'–'}</text>`});
  return s+'</svg>'}

  if(m===8)return{m,title:'Fast. Die Meisterprüfung steht aus.',text:'Deine Spieldaten sagen ja. Jetzt muss es auch in freien Fallaufgaben ohne Spielmechanik halten.'};
  return{m,title:`Noch nicht. ${m} von 8 Disziplinen belegt.`,text:`${sorted.length?`Stärkste Disziplin: ${sorted[0].n} (${Math.round(skState(sorted[0].k).s)}). `:''}${sorted.length>1?`Größte Lücke bisher: ${sorted[sorted.length-1].n} (${Math.round(skState(sorted[sorted.length-1].k).s)}).`:''} ${t<8?`${8-t} Disziplinen sind noch ungetestet.`:''}`}}

Antworte ausschließlich mit einem JSON-Array, alle Texte auf Deutsch, Antworten je max. 15 Wörter:
[{"frage":"…","richtig":"…","falsch":["…","…","…"],"erklaerung":"2 Sätze: warum richtig und welche Fehlannahme in der verlockendsten falschen Antwort steckt"}]`;
