  const H={q:S.q,sold,dem,lost,innov:innov*shareNew,imit:imit*shareNew,d2:d2*shareNew,N:S.N+S.N2,M,price:S.price,uc,rev,profit,cash:S.cash,cap:S.cap};S.hist.push(H);if(ev.t)S.news.push({q:S.q,t:ev.t,txt:ev.txt});if(lost>500)S.news.push({q:S.q,t:'Lieferengpass',txt:`${de(lost)} Kund:innen konnten nicht beliefert werden und kaufen woanders.`});
  S.q++;if(S.cash<0){S.done=true;S.dead=true}else if(S.q>=BSQ)S.done=true;return H}
let BS=null;
const bsQn=i=>'Q'+(i%4+1)+'/J'+(Math.floor(i/4)+1);
function viewBass(){if(!BS)BS=bsNew();const S=BS,H=S.hist,last=H[H.length-1];
  let h=`${backBtn}<div class="ghead"><div><div class="eyebrow">Simulation · 5 Jahre</div><h2>Produktlebenszyklus</h2></div><div class="row"><span class="xp-pill">${S.done?'Abgeschlossen':bsQn(S.q)+' · Quartal '+(S.q+1)+' / 20'}</span><button class="btn sm ghost" id="bsReset">Neu starten</button></div></div>
  <details class="concept"><summary>Das Modell</summary><p>Wie verbreitet sich ein neues Produkt? Das <b>Bass-Modell</b> (Frank Bass, 1969) unterscheidet <b>Innovatoren</b>, die durch Werbung und Neugier kaufen, und <b>Imitatoren</b>, die kaufen, weil andere es schon haben. Am Anfang dominieren Innovatoren, dann beschleunigen Imitatoren die Verbreitung zur typischen S-Kurve, bis der Markt gesättigt ist. Du steuerst Preis (größerer oder kleinerer Markt, mehr oder weniger Marge), Werbung (mehr Innovatoren), ein Empfehlungsprogramm (mehr Imitation), Produktionskapazität (Ausbau dauert 2 Quartale) und eine zweite Produktgeneration. Stückkosten sinken mit der Erfahrung: um rund 15 % bei jeder Verdopplung der Gesamtmenge.</p></details>
  <div class="kpis" style="margin-top:14px"><div class="kpi"><div class="k">Kasse</div><div class="v ${S.cash<500000?'neg':''}">${eur(S.cash)}</div></div><div class="kpi"><div class="k">Kund:innen gesamt</div><div class="v">${de(S.N+S.N2)}</div></div><div class="kpi"><div class="k">Marktpotenzial</div><div class="v">${last?de(last.M):de(bsM(S,S.price))}</div></div><div class="kpi"><div class="k">Stückkosten</div><div class="v">${last?eur(last.uc):eur(115)}</div></div></div>`;
  if(H.length){const xmax=Math.max(8,H.length);h+=`<div class="grid2" style="margin-top:14px"><div class="panel"><b>Verbreitung: die S-Kurve</b>${lineChart({series:[{color:'var(--muted)',pts:H.map((x,i)=>[i+1,x.M])},{color:'var(--accent)',pts:H.map((x,i)=>[i+1,x.N]),area:true,dots:[[H.length,H[H.length-1].N]]}],xmax,ymax:Math.max(...H.map(x=>Math.max(x.M,x.N)))*1.1,xfmt:v=>v?'Q'+v:'',yfmt:v=>de(v/1000)+'k',h:220})}<div class="legend"><span><span class="sw" style="background:var(--accent)"></span>Kund:innen kumuliert</span><span><span class="sw" style="background:var(--muted)"></span>Marktpotenzial</span></div></div>
   <div class="panel"><b>Verkäufe pro Quartal</b>${chStack([{c:'var(--c1)',v:H.map(x=>x.innov)},{c:'var(--accent)',v:H.map(x=>x.imit)},{c:'var(--c6)',v:H.map(x=>x.d2)}],{xfmt:i=>'Q'+(i+1),yfmt:v=>de(v/1000)+'k',label:'Verkäufe nach Käufertyp',h:220})}<div class="legend"><span><span class="sw" style="background:var(--c1)"></span>Innovatoren</span><span><span class="sw" style="background:var(--accent)"></span>Imitatoren</span><span><span class="sw" style="background:var(--c6)"></span>Generation 2</span></div></div></div>
   <div class="panel" style="margin-top:14px"><b>Gewinn und Kasse</b>${barChart(H.map(x=>({label:'Q'+(x.q+1),vals:[{v:x.profit,color:x.profit>=0?'var(--data)':'var(--bad)'}]})),{yfmt:keur,h:180})}</div>`}
  if(coachOn()&&!S.done){const it=[];if(!last)it.push('<b>Launch:</b> Am Anfang kennt niemand das Produkt. Werbung erzeugt Innovatoren, die die Lawine anstoßen. Achte auf die Kapazität: Ein Ausbau braucht 2 Quartale.');
    else{if(last.lost>1000)it.push(`<b>Lieferengpass:</b> ${de(last.lost)} Menschen wollten kaufen und gingen leer aus. Diese Nachfrage ist verloren. Kapazität ausbauen, und zwar vorausschauend.`);if(last.sold<S.cap*0.6&&S.q>4)it.push(`<b>Überkapazität:</b> Nur ${pct(last.sold/S.cap,0)} ausgelastet. Jede ungenutzte Einheit Kapazität kostet 6 € pro Quartal.`);
      const share=(S.N+S.N2)/last.M;it.push(`<b>Marktdurchdringung ${pct(share,0)}:</b> ${share<0.2?'Frühe Phase: Innovatoren dominieren. Werbung wirkt jetzt am stärksten.':share<0.6?'Wachstumsphase: Imitatoren übernehmen. Empfehlungen wirken stark, Werbung kann sinken.':'Reife Phase: Der Markt ist bald gesättigt. Zeit für Generation 2, Kosten senken oder Preis anpassen.'}`);
      it.push(`<b>Stückkosten ${eur(last.uc)}:</b> Sie sinken mit jeder Verdopplung der Gesamtmenge um rund 15 %. Ein niedrigerer Preis kann sich über Menge und Lernkurve selbst finanzieren.`)}
    h+=coachBox('Wo du im Lebenszyklus stehst',it,'strategie')}
  if(!S.done){const ev=BSEV[S.q];if(ev)h+=`<div class="event" style="margin-top:14px"><div><b>Dieses Quartal · ${esc(ev.t)}.</b> ${esc(ev.txt)}</div></div>`;
    h+=`<section class="panel stack" style="margin-top:14px"><div class="grid2"><label class="fld" for="bsP">Preis: <span class="num" id="bsPV">${eur(S.price)}</span><small>Marktpotenzial bei diesem Preis: ${de(bsM(S,S.price))}</small><input type="range" id="bsP" min="149" max="449" step="10" value="${S.price}"></label>
     <label class="fld" for="bsA">Werbung pro Quartal: <span class="num" id="bsAV">${eur(S.ad)}</span><input type="range" id="bsA" min="0" max="2000000" step="50000" value="${S.ad}"></label></div>
     <label class="ropt"><input type="checkbox" id="bsR" ${S.ref?'checked':''}><span><b>Empfehlungsprogramm (20 € pro geworbener Person, in den Stückkosten enthalten)</b><small>Verstärkt die Imitation: Kund:innen werben Kund:innen.</small></span></label>
     <div class="row"><span class="note">Kapazität: ${de(S.cap)} pro Quartal${S.capQ.length?' · im Bau: +'+de(S.capQ.reduce((a,c)=>a+c.u,0)):''}</span><button class="btn sm" id="bsCap">+30.000 Kapazität · 600.000 €</button></div>
     ${S.gen2Done?'<p class="note">Generation 2 ist auf dem Markt.</p>':`<label class="fld" for="bsG">Entwicklung Generation 2 pro Quartal: <span class="num" id="bsGV">${eur(S.gen2)}</span><small>Braucht insgesamt 2,5 Mio. € (bisher ${eur(S.g2acc||0)}).</small><input type="range" id="bsG" min="0" max="1500000" step="100000" value="${S.gen2}"></label>`}</section>
     <div class="row" style="margin-top:14px"><button class="btn primary" id="bsGo">Quartal abschließen</button><button class="btn" id="bsGo4">Ein Jahr vorspulen</button></div>`}
  else{const tot=H.reduce((a,x)=>a+x.profit,0);h+=`<div class="panel stack" style="margin-top:14px"><div class="eyebrow">Ergebnis nach 5 Jahren</div><div style="font-family:var(--f-display);font-size:40px;font-weight:800">${S.dead?'Pleite':eur(tot)+' Gewinn'}</div><p class="lead">${de(S.N+S.N2)} Kund:innen. Gute Strategien starten mit genug Werbung für die Innovatoren, bauen Kapazität vor der Welle aus, senken Werbung, wenn die Imitatoren übernehmen, und bringen die nächste Generation, bevor der Markt gesättigt ist.</p><button class="btn primary" id="bsAgain">Nochmal</button></div>`}
  h+=`<div class="panel" style="margin-top:14px"><b>Chronik</b><div class="feed" style="margin-top:8px">${S.news.slice(-6).reverse().map(n=>`<div class="t"><b>${bsQn(n.q)} · ${esc(n.t)}</b>${esc(n.txt)}</div>`).join('')}</div></div>`;
  $('#view').innerHTML=h;bindGo();const rr=()=>{const y=window.scrollY;viewBass();window.scrollTo(0,y);svSchedule()};
  $('#bsReset').onclick=()=>{BS=bsNew();viewBass()};const ag=$('#bsAgain');if(ag)ag.onclick=()=>{BS=bsNew();viewBass()};
  const sl=(id,k,fmt,after)=>{const el=$('#'+id);if(el)el.oninput=()=>{S[k]=+el.value;$('#'+id+'V').textContent=fmt(S[k]);if(after)after();svSchedule()}};
  sl('bsP','price',eur,()=>{});sl('bsA','ad',eur);sl('bsG','gen2',eur);const r=$('#bsR');if(r)r.onchange=()=>{S.ref=r.checked;svSchedule()};
  const c=$('#bsCap');if(c)c.onclick=()=>{S.cash-=600000;S.capQ.push({u:30000,w:2});S.news.push({q:S.q,t:'Ausbau',txt:'Eine neue Fertigungslinie wird gebaut (fertig in 2 Quartalen).'});rr()};
  const step=n=>{for(let i=0;i<n&&!S.done;i++){bsQuarter(S,true);if(BSEV[S.q])break}addXP(n*3,'Quartal abgeschlossen');if(S.done){const tot=S.hist.reduce((a,x)=>a+x.profit,0);setBest('bass',tot);evid('strategie',S.dead?10:clamp(tot/100e6,0,1)*100);evid('pricing',S.dead?10:clamp(tot/100e6,0,1)*100);addXP(80,'Produktlebenszyklus beendet')}svSchedule();viewBass();window.scrollTo(0,0)};
  const g=$('#bsGo');if(g)g.onclick=()=>step(1);const g4=$('#bsGo4');if(g4)g4.onclick=()=>step(4)}

const UNIT_LESSON={k:'unit',t:'Unit Economics und Wachstum',sub:'Kundenwert, CAC, Kohorten, Amortisation, Cash',min:7,g:'tycoon',dim:'strategie',steps:[
 {type:'text',h:'Warum wachsende Firmen pleitegehen',body:`<p>Eine Kundin, die 30 € Akquisekosten verursacht und über zwei Jahre 80 € Deckungsbeitrag bringt, ist ein gutes Geschäft. Trotzdem kostet sie dich heute 30 € und zahlt erst über Monate zurück. Wer schnell wächst, gibt also heute viel Geld für Gewinne von morgen aus. Diese Lücke heißt <b>J-Kurve</b>: erst Verlust, dann Gewinn.</p>
  <p>Drei Fragen entscheiden, ob Wachstum gesund ist:</p><ol class="steps"><li><b>Kundenwert gegen Akquisekosten:</b> Bringt eine Kundin über ihre Lebenszeit deutlich mehr, als sie kostet? Faustregel: Verhältnis 3 : 1.</li><li><b>Amortisation:</b> Nach wie vielen Monaten ist der CAC wieder drin? Je kürzer, desto weniger Cash bindet das Wachstum.</li><li><b>Reichweite des Geldes (Runway):</b> Wie lange reicht die Kasse beim aktuellen Verlust?</li></ol>`},
 {type:'widget',w:'ltv',h:'Rechne deinen Kundenwert',body:`<p>Stell Bindung, Bestellhäufigkeit, Deckungsbeitrag und CAC ein. Beobachte, wie stark die monatliche Bindung den Kundenwert verändert.</p>`},
 {type:'q',h:'Kohorten lesen',body:`${tbl(['Kohorte','Monat 0','+1','+2','+3','+6'],[['Januar','100 %','78 %','70 %','65 %','55 %'],['Februar (mit −30 % Rabatt gewonnen)','100 %','61 %','48 %','40 %','28 %'],['März','100 %','80 %','72 %','67 %','–']])}<p>Was sagt dir diese Kohortentabelle?</p>`,opts:['Die Rabatt-Kohorte bleibt deutlich schlechter. Der Rabatt hat Schnäppchenjäger geholt, deren Kundenwert viel niedriger ist','Februar war ein besonders guter Monat, weil mehr Neukund:innen kamen','Alle Kohorten verhalten sich gleich','Die Bindung steigt mit der Zeit'],ex:`<p>Kohorten zeigen, was ein Durchschnitt versteckt: Gleiche Neukundenzahl, aber völlig andere Qualität. Nach 6 Monaten sind von Februar nur 28 % aktiv, von Januar 55 %. Der echte CAC der Rabatt-Kohorte ist also viel höher, als er auf dem Papier aussieht.</p>`},
 {type:'q',h:'Amortisation',body:`<p>Eine Neukundin kostet <b>30 € CAC</b>. Sie bestellt im Schnitt <b>0,55-mal pro Monat</b>, jede Bestellung bringt <b>13 € Deckungsbeitrag</b>. Wann hat sie die Akquisekosten wieder eingespielt?</p>`,opts:['Nach gut 4 Monaten','Sofort mit der ersten Bestellung','Nach etwa 12 Monaten','Nie'],ex:`<div class="gl-fx">13 € × 0,55 ≈ 7,15 € pro Monat\n30 € ÷ 7,15 € ≈ 4,2 Monate</div><p>In diesen 4 Monaten ist das Geld gebunden. Wachstum von 1.000 Neukund:innen pro Monat bindet so dauerhaft rund 30.000 € bis 120.000 € Cash. Genau das macht die J-Kurve im Markenimperium aus.</p>`},
 {type:'q',h:'Der größte Hebel',body:`<p>Bei 90 % Bindung pro Monat ist der Kundenwert 80 €. Was passiert bei <b>93 %</b> Bindung (alles andere gleich)?</p>`,opts:['Er steigt um etwa 40 %, weil Kund:innen im Schnitt deutlich länger bleiben','Er steigt um 3 %','Er bleibt gleich','Er sinkt'],ex:`<p>Die erwartete Lebensdauer ist ungefähr 1 ÷ (1 − Bindung): 10 Monate bei 90 %, gut 14 Monate bei 93 %. Kleine Verbesserungen bei der Bindung (CRM, Service, bessere Produkte) wirken auf alle Kund:innen gleichzeitig. Deshalb lohnen sich CRM- und Service-Leute im Markenimperium so stark.</p>`},
 {type:'q',h:'Investor:innen und Bewertung',body:`<p>Zwei Firmen machen beide 1 Mio. € Umsatz pro Jahr. A wächst 5 % pro Monat bei einem Verhältnis Kundenwert zu CAC von 3,5. B wächst 1 % pro Monat bei einem Verhältnis von 1,2. Wer bekommt die höhere Bewertung?</p>`,opts:['A: Investor:innen bezahlen für profitables Wachstum, also für ein Vielfaches des Umsatzes, das mit Wachstum und Unit Economics steigt','B, weil sie vorsichtiger ist','Beide gleich, der Umsatz ist gleich','Keine, Umsatz zählt nicht'],ex:`<p>Bewertungen junger Firmen sind meist ein Vielfaches (Multiple) des Jahresumsatzes. Dieses Vielfache steigt mit Wachstum, Marge und gesunden Unit Economics. Eine Finanzierungsrunde bringt Geld für schnelleres Wachstum, kostet aber Anteile.</p>`},
 {type:'rules',h:'Deine Checkliste für das Markenimperium',items:['<b>Kundenwert : CAC</b> über 3 halten, bevor du stark skalierst.','<b>Amortisation</b> unter 6 Monaten halten, sonst frisst Wachstum dein Geld.','<b>Reichweite des Geldes</b> immer über 6 Monate. Kredit oder Investor:innen rechtzeitig nutzen, nicht erst im Notfall.','<b>Bindung zuerst:</b> CRM, Service und neue Produkte erhöhen den Wert aller Kund:innen auf einmal.','<b>Marke früh genug, aber nicht zu früh:</b> Marken-Budget senkt später alle Akquisekosten, kostet aber heute Cash.','<b>Rabatte sparsam:</b> Sie holen Kund:innen mit schlechterer Bindung.','<b>Kohorten lesen,</b> nicht nur Monatsumsätze.']}]};
LESSONS.push(UNIT_LESSON);
WS.r=0.9;WS.f=0.55;WS.dbo=13;WS.cac=30;
WIDGETS.ltv={html(){const sl=(id,lab,v,min,max,st)=>`<label class="fld" for="${id}">${lab}: <span class="num" id="${id}V"></span><input type="range" id="${id}" min="${min}" max="${max}" step="${st}" value="${v}"></label>`;return `<div class="grid2">${sl('wr','Bindung pro Monat',WS.r,0.7,0.97,0.01)}${sl('wf','Bestellungen pro aktiver Kundin und Monat',WS.f,0.2,1.2,0.05)}${sl('wd','Deckungsbeitrag pro Bestellung',WS.dbo,5,30,1)}${sl('wc','CAC',WS.cac,5,90,1)}</div><div id="wOut"></div>`},
 out(){$('#wrV').textContent=pct(WS.r,0);$('#wfV').textContent=de(WS.f,2);$('#wdV').textContent=eur(WS.dbo);$('#wcV').textContent=eur(WS.cac);
  const m=WS.dbo*WS.f,ltv=WS.dbo+m*WS.r/(1-WS.r),ratio=ltv/WS.cac,pb=Math.max(0,(WS.cac-WS.dbo))/m+1,life=1/(1-WS.r);
  const pts=[],cum=[];let a=1,c=-WS.cac+WS.dbo;for(let k=0;k<=24;k++){pts.push([k,a*100]);cum.push([k,c]);a*=WS.r;c+=a*m}
  $('#wOut').innerHTML=`<div class="kpis"><div class="kpi"><div class="k">Kundenwert</div><div class="v">${eur(ltv)}</div></div><div class="kpi"><div class="k">Kundenwert : CAC</div><div class="v ${ratio>=3?'pos':ratio<1.5?'neg':''}">${de(ratio,1)}</div></div><div class="kpi"><div class="k">Amortisation</div><div class="v">${pb>24?'> 24 Monate':de(pb,1)+' Monate'}</div></div><div class="kpi"><div class="k">Ø Lebensdauer</div><div class="v">${de(life,1)} Monate</div></div></div>
   ${lineChart({series:[{color:'var(--data)',pts:cum,area:true}],xmax:24,ymax:Math.max(20,...cum.map(x=>x[1]))*1.1,ymin:Math.min(0,-WS.cac)*1.1,xfmt:v=>'M'+v,yfmt:v=>de(v)+' €',h:200})}
   <p class="note">Kumulierter Gewinn aus einer Kundin: Start bei minus CAC plus erster Bestellung, dann monatliche Wiederkäufe mal Bindung.</p><div class="wmsg">${ratio>=3?'Gesund: Jede Kundin bringt mindestens das Dreifache ihrer Kosten. Hier lohnt es sich, mehr zu investieren.':ratio>=1.5?'Machbar, aber knapp: Bindung oder Deckungsbeitrag verbessern, bevor du skalierst.':'Jede neue Kundin vernichtet Geld. Erst Bindung, Preis oder CAC reparieren.'} ${pb>8?' Die lange Amortisation bindet viel Cash.':''}</div>`},
 bind(){WIDGETS.ltv.out();[['wr','r'],['wf','f'],['wd','dbo'],['wc','cac']].forEach(([id,k])=>{const el=$('#'+id);el.oninput=()=>{WS[k]=+el.value;WIDGETS.ltv.out()}})}};
LMAP.unit=UNIT_LESSON;Object.assign(GAME_LESSON,{tycoon:'unit',funnel:'experimente',attr:'zahlen',bass:'strategie'});







const BKS_U=[
{key:'b1',col:'red',title:'Massenbegehren',sub:'Die Kraft, die Werbung wirken lässt',lessons:[
 {title:'Die Kraft kommt vom Markt',cards:[
  ['Werbung erzeugt kein Verlangen','Die Kraft hinter erfolgreicher Werbung kommt aus dem Markt, nicht aus dem Text. Ein Texter kann keine Wünsche erschaffen. Er kann nur Hoffnungen, Ängste und Wünsche, die Millionen Menschen schon haben, auf ein bestimmtes Produkt lenken.'],
  ['Gegen den Strom geht schief','Chrysler baute 1948 kürzere Autos, als alle längere wollten. Ford warb Mitte der 50er mit Sicherheit, als alle auf PS schauten. Der Edsel scheiterte am Trend zu kleinen, sparsamen Autos. Gute Produkte und teure Kampagnen halfen nichts gegen das Massenbegehren.'],
  ['Was Massenbegehren ist','Schwartz definiert es als die öffentliche Verbreitung eines privaten Wunsches. Ein Markt entsteht in dem Moment, in dem genug Menschen denselben Wunsch teilen, dass es sich lohnt, ihnen etwas zu verkaufen.'],
  ['Der Verstärkereffekt','Weil Werbung vorhandene Kräfte nutzt, kann ein Dollar Werbung 50 oder 100 Dollar Umsatz bringen. Versucht Werbung, einen Wunsch erst zu erzeugen, wird sie zu Erziehung und bringt bestenfalls einen Dollar pro Dollar.'],
  ['Zwei Arten von Kräften','Dauerhafte Kräfte: Instinkte wie Gesundheit oder Attraktivität und ungelöste technische Probleme. Hier musst du dich von Konkurrenten abheben. Kräfte des Wandels: Trends, Mode, Vorbilder, Medien. Hier zählt Timing, den Trend früh erkennen und als Erster da sein.']],
 qs:[
  {t:'tf',q:'Ein guter Werbetext kann ein Verlangen nach einem Produkt erschaffen, das vorher niemand hatte.',a:false,w:'Text kann nur vorhandene Wünsche aufgreifen und lenken. Erschaffen können sie nur große gesellschaftliche und technische Kräfte.'},
  {t:'mc',q:'Woran scheiterte der Edsel laut Schwartz?',o:['Am Trend zu kleinen, sparsamen Autos','An schlechter Werbung','An zu hohen Preisen','An technischen Mängeln'],a:0,w:'Ein gutes Auto mit viel guter Werbung kam gegen das Massenbegehren nicht an.'},
  {t:'mc',q:'Wie definiert Schwartz Massenbegehren?',o:['Die öffentliche Verbreitung eines privaten Wunsches','Die Summe aller Werbebudgets','Der Wunsch der Hersteller nach Umsatz','Eine Mode, die von Prominenten ausgeht'],a:0,w:'Ein Markt entsteht, wenn genug Menschen privat dasselbe wollen.'},
  {t:'mc',q:'Was ist der Verstärkereffekt?',o:['Ein Werbedollar bringt ein Vielfaches an Umsatz, weil er vorhandene Wünsche nutzt','Werbung wird durch Wiederholung stärker','Große Anzeigen wirken stärker als kleine','Prominente verstärken jede Botschaft'],a:0,w:'Wer Wünsche erst erzeugen will, betreibt teure Erziehung statt Werbung.'},
  {t:'sc',s:'Ein Hersteller verkauft Schmerztabletten. Kopfschmerzen gibt es immer, und alle Konkurrenten versprechen schnelle Hilfe.',q:'Mit welcher Art von Kraft hat der Texter es zu tun?',o:['Einer dauerhaften Kraft, er muss sich von der Konkurrenz abheben','Einer Kraft des Wandels, er muss den Trend früh erkennen','Gar keiner, er muss den Wunsch erst erzeugen','Einer Mode, die bald vorbei ist'],a:0,w:'Bei dauerhaften Kräften ist der Wunsch klar. Die Aufgabe ist ein frischer, glaubwürdiger Unterschied.'},
  {t:'why',q:'Warum ist es so gefährlich, mit Werbung gegen das Massenbegehren anzutreten?',o:['Weil der Wunsch über Jahre von Kräften geformt wird, die viel größer sind als jedes Werbebudget','Weil Kunden Werbung grundsätzlich misstrauen','Weil Konkurrenten dann klagen','Weil Werbung nur bei jungen Menschen wirkt'],a:0,w:'Kein einzelner Werbetreibender kann gegen gesellschaftliche, wirtschaftliche und technische Kräfte ankommen.'},
  {t:'err',s:'Eine Agentur sagt: „Unser Produkt ist super, also bauen wir die Nachfrage einfach mit genug Werbegeld auf.“',q:'Was übersieht die Agentur?',o:['Werbung, die Nachfrage erst erzeugen muss, ist teure Erziehung ohne Verstärkereffekt','Sie braucht mehr Prominente','Sie hat völlig recht','Sie sollte nur Radio nutzen'],a:0,w:'Besser: einen vorhandenen Wunsch finden, den das Produkt erfüllt.'}],
 ex:{q:'Erkläre, warum Schwartz sagt, Werbung könne kein Verlangen erschaffen, und was das für die Arbeit eines Texters bedeutet.',k:['Wünsche entstehen über Jahre durch große gesellschaftliche, wirtschaftliche oder technische Kräfte','Der Texter kann vorhandene Wünsche nur aufgreifen, kanalisieren und auf ein Produkt lenken','Wer gegen das Massenbegehren wirbt, scheitert (z. B. Edsel, Chrysler, Ford)','Nur wer vorhandene Wünsche nutzt, bekommt den Verstärkereffekt']}},
 {title:'Den stärksten Wunsch wählen',cards:[
  ['Drei Dimensionen','Jeder Massenwunsch hat drei Dimensionen. Dringlichkeit: Wie stark drängt er (Arthritis gegen leichtes Kopfweh)? Ausdauer: Wird er nie satt (Hunger gegen Lust auf Delikatessen)? Reichweite: Wie viele Menschen teilen ihn?'],
  ['Nur einer darf vorne stehen','Jedes Produkt spricht zwei, drei oder vier Wünsche an. Aber nur einer kann die Headline tragen. Die Wahl dieses Wunsches ist der wichtigste Schritt. Ist sie falsch, rettet nichts anderes in der Anzeige sie.'],
  ['Die drei Arbeitsschritte','1. Den stärksten Wunsch wählen, der zum Produkt passt. 2. Ihn in einem Satz in der Headline anerkennen, verstärken oder einen Weg zur Erfüllung anbieten. 3. Zeigen, wie die Leistungen des Produkts diesen Wunsch zwangsläufig erfüllen.'],
  ['Wo die Headline anfängt','Weiß der Kunde, dass dein Produkt seinen Wunsch erfüllt, beginnt sie mit dem Produkt. Kennt er nur den Wunsch, beginnt sie mit dem Wunsch. Spürt er nur ein vages Problem, beginnt sie mit dem Problem und spitzt es zu einem klaren Bedürfnis zu.'],
  ['Ein einziger Blick','Der Leser ist abgelenkt und sucht nicht nach dir. In diesem einen Blick dringt nur ein Gedanke durch. Hält ihn der erste, liest er den zweiten. Hält ihn der dritte, liest er wahrscheinlich die ganze Anzeige.']],
 qs:[
  {t:'mc',q:'Welche drei Dimensionen hat jeder Massenwunsch?',o:['Dringlichkeit, Ausdauer, Reichweite','Preis, Qualität, Marke','Bild, Text, Farbe','Alter, Geschlecht, Einkommen'],a:0,w:'Gesucht ist der Wunsch mit der meisten Kraft in allen drei Dimensionen.'},
  {t:'mc',q:'Was ist laut Schwartz der wichtigste Schritt beim Schreiben einer Anzeige?',o:['Die Wahl des einen Wunsches, den die Headline anspricht','Die Wahl der Schriftart','Das Foto','Der Preis'],a:0,w:'Ist diese Wahl falsch, hilft der Rest der Anzeige nicht mehr.'},
  {t:'sc',s:'Ein Mittel gegen Rückenschmerzen könnte mit „Hilft beim Einschlafen“, „Spart Arztbesuche“ oder „Endlich schmerzfrei bücken“ werben.',q:'Wie gehst du laut Schwartz vor?',o:['Den einen Wunsch mit der größten Dringlichkeit, Ausdauer und Reichweite in die Headline, die anderen stützen später','Alle drei gleich groß in die Headline','Den originellsten Satz nehmen','Den kürzesten Satz nehmen'],a:0,w:'Nur ein Schlüssel passt ins Schloss. Die anderen Leistungen untermauern das Hauptversprechen im Text.'},
  {t:'tf',q:'Kennt der Kunde nur ein vages Problem, sollte die Headline mit dem Produktnamen beginnen.',a:false,w:'Dann beginnt sie mit dem Problem und spitzt es zu einem konkreten Bedürfnis zu.'},
  {t:'gap',q:'In einem einzigen Blick dringt nur ___ Gedanke zum Leser durch.',o:['ein','kein','jeder','fast jeder'],a:0,w:'Deshalb muss die Headline sich auf eine Sache konzentrieren.'},
  {t:'why',q:'Warum sollte eine Headline nur einen Wunsch ansprechen, obwohl das Produkt viele erfüllt?',o:['Weil der abgelenkte Leser in einem Blick nur einen Gedanken aufnimmt','Weil mehr Wünsche zu teuer sind','Weil es Gesetz ist','Weil Kunden nur einen Wunsch haben'],a:0,w:'Ein Gedanke kann die Gleichgültigkeit durchbrechen, mehrere nicht.'},
  {t:'err',s:'Ein Texter sagt: „Ich packe alle zehn Vorteile in die Headline, dann ist für jeden etwas dabei.“',q:'Was ist der Denkfehler?',o:['Er verwässert die Headline: Nur ein dominanter Wunsch kann den Leser stoppen','Zehn ist zu wenig','Nichts, das ist ideal','Er sollte nur den Preis nennen'],a:0,w:'Die übrigen Vorteile gehören in den Text, wo sie das Hauptversprechen stützen.'}],
 ex:{q:'Du sollst eine Anzeige für ein neues E-Bike schreiben. Erkläre, wie du nach Schwartz entscheidest, welcher Wunsch in die Headline kommt.',k:['Erst alle Wünsche und Leistungen sammeln, die das Produkt erfüllt','Sie nach Dringlichkeit, Ausdauer und Reichweite bewerten','Nur den einen stärksten Wunsch für die Headline wählen','Die anderen Leistungen stützen das Hauptversprechen später im Text']}},
 {title:'Was das Produkt tut',cards:[
  ['Zwei Produkte in einem','Jedes Produkt ist eigentlich zwei: das physische (Stahl, Glas, Papier) und das funktionale, also das, was es für den Käufer tut. Gekauft wird das funktionale. Niemand kauft den Stahl eines Autos.'],
  ['Physisches nie in die Headline','Größe der Fabrik, Gewicht des Stahls, Sorgfalt der Herstellung: Das gehört nie in die Headline. Diese Fakten kommen später und stützen das Hauptversprechen.'],
  ['Wofür physische Fakten taugen','Sie rechtfertigen den Preis, belegen Qualität, versprechen lange Haltbarkeit und schärfen das Bild. Vor allem aber liefern sie einen neuen Grund zu glauben, etwa einen neuen Mechanismus oder eine neue Freiheit von alten Grenzen.'],
  ['Ein Auto, viele Leistungen','Ein Auto bietet Transport, Zuverlässigkeit, Sparsamkeit, Kraft, Anerkennung, Wert und Neuheit. Jede Leistung spricht einen anderen Wunsch und ein anderes Publikum an. Die Anzeige kann aber nur eine davon ins Zentrum stellen.'],
  ['Der Unterschied','In Märkten, wo alle dasselbe versprechen, braucht das Produkt einen Unterschied: einen neuen Mechanismus, eine neue Qualität oder eine neue Freiheit. Oft denkt ihn sich der Texter aus und der Hersteller baut ihn ein.']],
 qs:[
  {t:'mc',q:'Was kauft der Kunde laut Schwartz eigentlich?',o:['Das funktionale Produkt, also was es für ihn tut','Das Material','Die Verpackung','Den Namen des Herstellers'],a:0,w:'Das Physische ist nur die Begründung für den Preis.'},
  {t:'tf',q:'Die Größe der Fabrik eignet sich gut als Headline.',a:false,w:'Physische Fakten gehören nie in die Headline. Sie stützen später das Versprechen.'},
  {t:'mc',q:'Wofür sind physische Produktfakten besonders wertvoll?',o:['Als neuer Grund, dem Versprechen zu glauben','Als Hauptversprechen','Für die Headline','Gar nicht'],a:0,w:'Vor allem in umkämpften Märkten liefern sie den Unterschied.'},
  {t:'sc',s:'Ein Gesichtscreme-Hersteller betont, dass seine Creme in fünf Schritten gereinigt wird.',q:'Welche Funktion hat diese physische Tatsache?',o:['Sie belegt die Qualität der versprochenen Leistung, die Haut zu reinigen','Sie ist das Hauptversprechen','Sie rechtfertigt keinen Preis','Sie ist überflüssig'],a:0,w:'Physische Fakten machen das funktionale Versprechen glaubwürdiger.'},
  {t:'gap',q:'Wenn alle dasselbe versprechen, braucht das Produkt einen ___.',o:['Unterschied','Rabatt','Prominenten','Slogan'],a:0,w:'Etwa einen neuen Mechanismus oder die Befreiung von alten Grenzen.'},
  {t:'why',q:'Warum gehört das physische Produkt nicht in die Headline?',o:['Weil Menschen nicht das Material kaufen, sondern was das Produkt für sie tut','Weil es zu lang ist','Weil Konkurrenten es kopieren','Weil es geheim ist'],a:0,w:'Die Headline muss einen Wunsch treffen, und Wünsche richten sich auf Leistungen.'},
  {t:'err',s:'Ein Hersteller will die Headline: „Mit 2,5 mm starkem Spezialstahl“.',q:'Was würde Schwartz einwenden?',o:['Das ist ein physisches Detail. Die Headline sollte die Leistung nennen, etwa Schutz bei einem Unfall','Die Zahl ist zu klein','Nichts, perfekte Headline','Stahl ist unmodern'],a:0,w:'Die Stahlstärke kann später belegen, dass das Auto schützt.'}],
 ex:{q:'Erkläre den Unterschied zwischen physischem und funktionalem Produkt und wie man beide in einer Anzeige einsetzt.',k:['Das funktionale Produkt ist, was das Produkt für den Käufer tut, und das wird gekauft','Das physische Produkt ist Material und Bauweise','Die Headline stellt eine funktionale Leistung in den Mittelpunkt','Physische Fakten stützen später: Preis, Qualität, Haltbarkeit oder ein neuer Grund zu glauben']}}
]},
{key:'b2',col:'teal',title:'Bewusstseinsstufen',sub:'Wie viel weiß dein Kunde schon?',lessons:[
 {title:'Der Job der Headline',cards:[
  ['Drei Fragen','Vor jeder Headline stehen drei Fragen. Welches Massenbegehren steckt hinter dem Markt? Wie viel wissen die Menschen darüber, wie dein Produkt diesen Wunsch erfüllt (Bewusstsein)? Wie viele ähnliche Produkte kennen sie schon (Marktreife)?'],
  ['Die Headline muss nicht verkaufen','Ihr einziger Job: den Interessenten stoppen und dazu bringen, den zweiten Satz zu lesen. Der zweite Satz soll zum dritten führen und so weiter. Den ganzen Verkauf auf 10 bis 20 Prozent der Fläche zu packen, wäre Glücksspiel mit dem Geld des Kunden.'],
  ['Vom Markt zum Produkt','Eine Anzeige beginnt immer beim Markt und führt ihn zum Produkt. Die Headline beschäftigt sich ganz mit dem Markt. Sie muss das Produkt nicht einmal erwähnen.'],
  ['Mauern zwischen den Stufen','Es gibt fünf Bewusstseinsstufen. Zwischen ihnen stehen psychologische Mauern: Auf der einen Seite herrscht Gleichgültigkeit, auf der anderen starkes Interesse. Eine Headline, die in einer Stufe glänzt, versagt in einer anderen völlig.'],
  ['Kein Markt steht still','Selbst eine erfolgreiche Headline veraltet, sobald der Markt in die nächste Stufe weiterzieht. Man steigt nie zweimal in denselben Fluss.']],
 qs:[
  {t:'mc',q:'Was ist laut Schwartz der einzige Job der Headline?',o:['Den Interessenten stoppen und zum Weiterlesen bringen','Das Produkt komplett verkaufen','Den Preis nennen','Die Marke bekannt machen'],a:0,w:'Je mehr er liest, desto gründlicher kannst du ihn überzeugen.'},
  {t:'mc',q:'Welche drei Fragen bestimmen den Inhalt der Headline?',o:['Massenbegehren, Bewusstseinsstufe, Marktreife','Budget, Medium, Format','Preis, Rabatt, Lieferzeit','Farbe, Schrift, Bild'],a:0,w:'Die erste liefert die Kraft, die anderen beiden die Position des Marktes.'},
  {t:'tf',q:'Eine Headline muss immer den Produktnamen enthalten.',a:false,w:'Sie beschäftigt sich mit dem Markt. Das Produkt kann erst später kommen.'},
  {t:'tf',q:'Eine Headline, die in einer Bewusstseinsstufe funktioniert, funktioniert auch in allen anderen.',a:false,w:'Zwischen den Stufen stehen Mauern. Was hier Interesse weckt, lässt dort kalt.'},
  {t:'gap',q:'Der zweite Satz einer Anzeige hat nur eine Aufgabe: den Leser zum ___ Satz zu bringen.',o:['dritten','letzten','ersten','Bestell-'],a:0,w:'Jeder Satz verkauft vor allem den nächsten.'},
  {t:'why',q:'Warum ist es klug, die Headline nicht alles verkaufen zu lassen?',o:['Weil der Text viel mehr Raum hat, den Leser gründlich zu überzeugen','Weil Headlines verboten sind','Weil Leser Headlines überspringen','Weil kurze Texte mehr kosten'],a:0,w:'Mit zehn Worten statt hundert zu verkaufen, verschenkt Überzeugungskraft.'},
  {t:'err',s:'Ein Chef sagt: „Die Headline von letztem Jahr lief super, die nehmen wir einfach wieder.“',q:'Was übersieht er?',o:['Der Markt kann inzwischen in einer anderen Bewusstseinsstufe sein','Headlines nutzen sich nie ab','Nichts, gute Idee','Man sollte die Schrift ändern'],a:0,w:'Kein Markt steht still. Eine Headline veraltet mit ihm.'}],
 ex:{q:'Erkläre, warum Schwartz sagt, die Headline müsse nicht verkaufen. Was ist ihre eigentliche Aufgabe, und warum ist das klüger?',k:['Die Headline soll den Interessenten stoppen und zum Weiterlesen bringen','Jeder Satz soll den nächsten verkaufen','Im längeren Text kann viel gründlicher überzeugt werden als in wenigen Worten','Alles in die Headline zu packen, verschenkt Wirkung']}},
 {title:'Stufen 1 und 2',cards:[
  ['Stufe 1: am bewusstesten','Der Kunde kennt das Produkt, weiß was es tut und will es. Er hat es nur noch nicht gekauft. Die Anzeige braucht kaum mehr als Produktname und einen guten Preis. Die Neuigkeit ist der Preis, ein Geschenk oder schnelle Lieferung.'],
  ['Wenig Kreativität nötig','In Stufe 1 ist der Texter laut Schwartz nur der Phrasenschmied des Einkäufers. Er profitiert von all der Werbung, die vorher für das Produkt gelaufen ist.'],
  ['Stufe 2: kennt es, will es noch nicht','Der Kunde kennt das Produkt, ist aber nicht ganz überzeugt oder weiß nicht, wie viel besser es inzwischen ist. Hier spielt der Großteil aller Werbung. Der Produktname steht groß da, der Rest der Headline zeigt die Überlegenheit.'],
  ['Sieben Aufgaben in Stufe 2','Den Wunsch verstärken. Das Bild schärfen, wie das Produkt ihn erfüllt. Ausweiten, wo und wann es ihn erfüllt. Neue Beweise liefern. Einen neuen Mechanismus vorstellen. Einen Mechanismus vorstellen, der alte Grenzen beseitigt. Oder das Bild ganz ändern, um der Konkurrenz zu entkommen.'],
  ['Beispiele','Rolls-Royce schärfte das Bild: Bei voller Fahrt ist das lauteste Geräusch die Uhr. Coca-Cola weitete den Einsatz aus: Durst kennt keine Jahreszeit, also auch im Winter. Hoover stellte ein Gerät vor, das wischt und das Wasser gleich aufsaugt.']],
 qs:[
  {t:'mc',q:'Was braucht eine Anzeige für einen Markt in Stufe 1 vor allem?',o:['Produktname und Preis bzw. Angebot','Eine lange Geschichte','Eine Identifikations-Headline','Einen neuen Mechanismus'],a:0,w:'Der Kunde will das Produkt schon. Er braucht nur noch den Anstoß.'},
  {t:'sc',s:'Ein Kunde kennt eine bekannte Zahnpasta-Marke, nutzt aber noch eine andere.',q:'In welcher Bewusstseinsstufe ist er?',o:['Stufe 2: kennt das Produkt, will es noch nicht','Stufe 1','Stufe 5','Stufe 3'],a:0,w:'Hier zeigt die Anzeige, warum das Produkt besser ist.'},
  {t:'mc',q:'Wo spielt laut Schwartz der Großteil aller Werbung?',o:['In Stufe 2','In Stufe 1','In Stufe 5','In Stufe 4'],a:0,w:'Bekannte Marken, die ihre Überlegenheit zeigen.'},
  {t:'sc',s:'Eine Getränkemarke wirbt im Winter mit dem Satz, dass Durst keine Jahreszeit kennt.',q:'Welche der sieben Aufgaben erfüllt das?',o:['Ausweiten, wo und wann das Produkt den Wunsch erfüllt','Neue Beweise liefern','Einen neuen Mechanismus vorstellen','Den Preis senken'],a:0,w:'Das Produkt bekommt eine neue Gelegenheit zur Nutzung.'},
  {t:'sc',s:'Eine Anzeige sagt: Bei voller Geschwindigkeit ist in diesem Auto das lauteste Geräusch die Uhr.',q:'Was tut diese Headline?',o:['Sie schärft das Bild, wie das Produkt den Wunsch erfüllt','Sie nennt einen Preis','Sie spricht einen unbewussten Markt an','Sie greift die Konkurrenz an'],a:0,w:'Ein konkretes Bild macht „leise“ greifbar.'},
  {t:'why',q:'Warum braucht eine Stufe-1-Anzeige so wenig Kreativität?',o:['Weil der Kunde schon alles weiß und das Produkt will, frühere Werbung hat die Arbeit erledigt','Weil Kreativität verboten ist','Weil Preise langweilig sind','Weil es billig sein muss'],a:0,w:'Neu ist nur noch das Angebot.'},
  {t:'err',s:'Ein Texter schreibt für einen völlig unbekannten Kräutertee: „Nur 2,99 € – jetzt zugreifen!“',q:'Was ist das Problem?',o:['Ein Preis-Headline passt nur für Stufe 1. Wer das Produkt nicht kennt, interessiert sich nicht für den Preis','Der Preis ist zu niedrig','Nichts','Er sollte „jetzt“ weglassen'],a:0,w:'Der Preis bedeutet nichts für jemanden, der das Produkt nicht kennt oder will.'}],
 ex:{q:'Ein Kunde kennt deine Kaffeemaschine, hat sie aber nicht gekauft. In welcher Stufe ist er, und was kann deine Headline tun?',k:['Stufe 2: Er kennt das Produkt, will es aber noch nicht','Produktname groß zeigen','Die Überlegenheit des Produkts betonen','Eine der Aufgaben nennen: Wunsch verstärken, Bild schärfen, Nutzung ausweiten, neue Beweise, neuer Mechanismus oder Grenzen beseitigen']}},
 {title:'Stufen 3 und 4',cards:[
  ['Stufe 3: Wunsch ohne Produkt','Der Kunde weiß, dass er das Ergebnis will, kennt aber kein Produkt, das es liefert. Aufgabe: den noch unklaren Wunsch so scharf benennen, dass jeder ihn sofort wiedererkennt. Dann zeigen, dass es geht, und dass dein Produkt den Mechanismus hat.'],
  ['Hier beginnt der Ideenmensch','Ab Stufe 3 zählt die Ausführung mehr als die Mechanik. Der Texter braucht Analyse, Intuition, um einen Trend früh zu spüren, und Sprachgefühl, um einem Gefühl erstmals einen Namen zu geben.'],
  ['Stufe 4: Bedürfnis ohne Verbindung','Der Kunde hat ein Problem und erkennt es sofort, sieht aber die Verbindung zu deinem Produkt nicht. Das ist die Problemlösungs-Anzeige: Problem oder Lösung nennen, das Problem lebhaft machen, Produkt als Lösung zeigen.'],
  ['Varianten in Stufe 4','Manchmal reicht das Problem allein, etwa ein Wort wie „Hühneraugen?“. Oder Problem und Lösung. Oder eine Lösung ohne die üblichen Nachteile, etwa „ohne Operation“. Oder ein Ersatz für eine unangenehme Aufgabe. Oder Vorbeugung.'],
  ['Wenn das Versprechen abgenutzt ist','Ist die direkte Lösung schon oft versprochen worden, braucht es eine überraschende Wendung, etwa eine paradoxe Geschichte wie die eines Friseurs mit Glatze, der Haare rettete.']],
 qs:[
  {t:'mc',q:'Was weiß ein Kunde in Stufe 3?',o:['Er will das Ergebnis, kennt aber kein Produkt dafür','Er kennt das Produkt und will es','Er weiß nichts von seinem Wunsch','Er hat das Produkt schon gekauft'],a:0,w:'Der Wunsch ist da, aber noch unscharf und ohne Lösung.'},
  {t:'mc',q:'Was ist die Kernaufgabe in Stufe 3?',o:['Den unklaren Wunsch so scharf benennen, dass jeder ihn sofort erkennt','Den Preis senken','Die Konkurrenz angreifen','Den Produktnamen wiederholen'],a:0,w:'Danach beweisen, dass es möglich ist, und das Produkt als Mechanismus zeigen.'},
  {t:'sc',s:'Eine Headline lautet nur: „Schnarchen?“',q:'Für welche Stufe ist sie typisch?',o:['Stufe 4: Das Problem allein wird genannt','Stufe 1','Stufe 5','Stufe 2'],a:0,w:'Der Kunde erkennt das Problem sofort und will die Lösung wissen.'},
  {t:'tf',q:'Ab Stufe 3 wird die kreative Ausführung immer wichtiger.',a:true,w:'Hier verdient der „Ideenmensch“ sein Geld.'},
  {t:'sc',s:'Eine Headline verspricht: „Glatte Haut ohne teure Behandlungen“.',q:'Welche Variante der Stufe 4 ist das?',o:['Lösung ohne die üblichen Nachteile','Nur das Problem','Vorbeugung','Preis-Angebot'],a:0,w:'Grenzen bisheriger Lösungen fallen weg.'},
  {t:'why',q:'Warum braucht ein abgenutztes Versprechen eine überraschende Wendung?',o:['Weil die direkte Aussage keine Neuigkeit mehr ist und überlesen wird','Weil Wendungen billiger sind','Weil es gesetzlich nötig ist','Weil Kunden Rätsel lieben'],a:0,w:'Die Wendung macht das alte Versprechen wieder frisch.'},
  {t:'err',s:'Lena sagt: „Stufe 3 und 4 sind dasselbe, es geht immer um ein Problem.“',q:'Was ist der Unterschied?',o:['Stufe 3 dreht sich um einen Wunsch, Stufe 4 um ein Bedürfnis oder Problem','Es gibt keinen','Stufe 4 kennt das Produkt schon','Stufe 3 ist unbewusst'],a:0,w:'Die Technik ist ähnlich, der Ausgangspunkt nicht: Verlangen hier, Not dort.'}],
 ex:{q:'Erkläre den Unterschied zwischen Bewusstseinsstufe 3 und 4 und wie die Headline jeweils aufgebaut ist.',k:['Stufe 3: Der Kunde will ein Ergebnis, kennt aber kein Produkt dafür','Stufe 4: Der Kunde hat ein Problem, sieht aber die Verbindung zum Produkt nicht','In Stufe 3 wird der Wunsch scharf benannt, dann bewiesen, dann das Produkt als Mechanismus gezeigt','In Stufe 4 wird das Problem genannt, dramatisiert und das Produkt als Lösung präsentiert']}},
 {title:'Stufe 5: unbewusst',cards:[
  ['Die schwerste Stufe','Der Kunde ist sich seines Wunsches nicht bewusst, gibt ihn sich nicht zu, er ist zu vage oder ein Tabu. Hierher gehören auch Produkte, die aus der Gunst gefallen sind und neu geboren werden müssen.'],
  ['Drei Verbote','Kein Preis, denn er bedeutet nichts. Kein Produktname, denn er bedeutet nichts oder schadet sogar. Keine direkte Aussage über Funktion oder Wunsch, denn sie wirkt nicht. Was bleibt? Der Markt selbst.'],
  ['Die Identifikations-Headline','Du rufst deinen Markt zusammen. Du spiegelst ein Gefühl, eine Haltung, die Menschen aus der Masse herausholt. Du sagst ihnen, wer sie sind. Die Headline verkauft nichts außer dem nächsten Absatz.'],
  ['Wege in den unbewussten Markt','Einen versteckten Traum in Worte fassen (ein Fernkurs als „Universität der Nacht“). Eine versteckte Angst nutzen. Mit einem allgemein akzeptierten Bild in ein heikles Thema führen. Einen stillen Groll aufgreifen. Einen Triumph zeigen, mit dem man sich identifiziert. Die Folge eines Problems zeigen statt des Problems.'],
  ['Die Kardinalregel','Der Interessent muss sich mit der Headline identifizieren, bevor er kauft. Es muss seine Headline sein, sein Problem, seine Stimmung. Sie soll die Richtigen anziehen und ebenso viele abweisen. Bloß witzig oder hübsch reicht nicht.'],
  ['Stil vergeht, Strategie bleibt','Erzählstile wie die Ich-Geschichte der 20er Jahre wirken heute altmodisch. Die Wünsche dahinter gibt es aber noch, und neu erzählt könnten solche Anzeigen immer noch verkaufen.']],
 qs:[
  {t:'mc',q:'Was darf eine Headline für einen völlig unbewussten Markt nicht enthalten?',o:['Preis, Produktname und direkte Aussage über Funktion oder Wunsch','Eine Frage','Ein Gefühl','Eine Zielgruppe'],a:0,w:'Übrig bleibt nur der Markt selbst und seine Stimmung.'},
  {t:'mc',q:'Was tut eine Identifikations-Headline?',o:['Sie spiegelt ein Gefühl oder eine Haltung und sagt den Menschen, wer sie sind','Sie nennt den Rabatt','Sie erklärt den Mechanismus','Sie zitiert einen Experten'],a:0,w:'Sie verkauft nur den nächsten Absatz.'},
  {t:'sc',s:'Ein Fernkurs wirbt nicht mit „Mehr verdienen“, sondern erzählt von Menschen, die abends nach der Arbeit lernen, um im Leben weiterzukommen.',q:'Welcher Weg in den unbewussten Markt ist das?',o:['Einem versteckten Traum Worte geben','Einen Preis nennen','Konkurrenz angreifen','Mechanismus erklären'],a:0,w:'Der Traum vom Aufstieg wird ausgesprochen, ohne das Produkt zu nennen.'},
  {t:'sc',s:'Eine Mundwasser-Anzeige erzählt von einer Frau, die immer Brautjungfer, aber nie Braut ist, ohne zuerst Mundgeruch zu nennen.',q:'Welche Strategie steckt dahinter?',o:['Die Folge eines Problems zeigen, weil das Problem direkt zu peinlich wäre','Einen Preis betonen','Einen Experten zitieren','Eine Liste von Vorteilen'],a:0,w:'Die direkte Aussage würde abgelehnt. Die Folge fühlt jeder nach.'},
  {t:'tf',q:'In Stufe 5 soll die Headline möglichst viele Menschen ansprechen, auch die, die nie kaufen würden.',a:false,w:'Sie soll die richtigen Interessenten herausholen und ebenso viele abweisen.'},
  {t:'why',q:'Warum muss sich der Leser mit einer Stufe-5-Headline identifizieren?',o:['Weil es kein Produkt und kein Versprechen gibt, an das er anknüpfen könnte, nur sich selbst','Weil sie kurz ist','Weil sie lustig ist','Weil sie ein Bild hat'],a:0,w:'Die Headline muss sein Zustand in diesem Moment sein.'},
  {t:'err',s:'Ein Texter sagt: „Für einen unbewussten Markt mach ich einfach ein witziges Bild und eine schräge Headline.“',q:'Was warnt Schwartz?',o:['Eine bloß witzige oder hübsche Headline ist leer und verschwendet Geld','Witz ist verboten','Bilder wirken nie','Er hat recht'],a:0,w:'Die Headline muss sich ganz auf den Markt und seine Stimmung beziehen.'},
  {t:'match',q:'Ordne die Stufen zu.',p:[['Stufe 1','Name + Preis'],['Stufe 2','Überlegenheit zeigen'],['Stufe 4','Problem dramatisieren'],['Stufe 5','Identifikation']]}],
 ex:{q:'Warum darf eine Headline für einen völlig unbewussten Markt weder Preis noch Produkt noch die direkte Funktion nennen, und was tut sie stattdessen?',k:['Preis und Produktname bedeuten nichts für jemanden, der das Produkt nicht kennt oder will','Eine direkte Aussage über Funktion oder Wunsch wirkt in dieser Stufe nicht','Stattdessen spiegelt sie Gefühl, Haltung oder Lage des Marktes (Identifikation)','Sie verkauft nur den nächsten Absatz, der Text führt dann Schritt für Schritt zum Produkt']}}
]},
{key:'b3',col:'yel',title:'Marktreife',sub:'Wie viele waren schon vor dir da?',lessons:[
 {title:'Erster oder Zweiter',cards:[
  ['Die dritte Frage','Wie viele ähnliche Produkte wurden dem Markt schon angepriesen? Diese Frage ist am leichtesten zu beantworten: Konkurrenzanzeigen sammeln.'],
  ['Stufe 1: Du bist der Erste','Der Markt hat so etwas noch nie gehört. Er glaubt mehr und kauft schneller. Die Strategie: einfach und direkt sein, nicht verkünsteln. Bedürfnis oder Versprechen nennen, dramatisieren, Produkt zeigen, beweisen, dass es funktioniert.'],
  ['Wie man Erster wird','Durch einen technischen Durchbruch, ein radikal besseres Produkt oder einen sensationellen Preis. Oder durch einen neuen Markt für ein altes Produkt: Ein Malzgetränk wurde vom Einschlafmittel zum Kraftspender für dünne Kinder. Oder durch ein neues Medium oder eine neu entdeckte Leistung.'],
  ['Stufe 2: Du bist Zweiter','Funktioniert das direkte Versprechen noch, kopiere es, aber vergrößere es. Treibe es an die Grenze. Überbiete die Konkurrenz. Aus 25 Rosen pro Strauch wurden 600 Blüten, dann 17.000. Autos bekamen jedes Jahr 50 PS mehr.'],
  ['Das Ende der Übertreibung','Irgendwann stapelt sich Übertreibung auf Übertreibung. Worte verlieren ihre Bedeutung. Leser werden misstrauisch und ziehen von jedem Versprechen die Hälfte ab. Behörden ermitteln, der Umsatz fällt.']],
 qs:[
  {t:'mc',q:'Wie schreibt man laut Schwartz, wenn man der Erste im Markt ist?',o:['Einfach und direkt: Bedürfnis oder Versprechen nennen, nichts Verkünsteltes','Möglichst originell und verspielt','Mit Identifikations-Headline','Mit einem neuen Mechanismus in der Headline'],a:0,w:'Die Geschichte ist neu, mehr braucht es nicht.'},
  {t:'mc',q:'Was ist die Strategie in Stufe 2?',o:['Das erfolgreiche Versprechen kopieren und vergrößern','Das Versprechen weglassen','Nur den Preis senken','Den Markt ignorieren'],a:0,w:'Überbieten, solange es noch geglaubt wird.'},
  {t:'sc',s:'Erst versprach eine Rosensorte 25 bis 100 Rosen pro Strauch, Jahre später eine Chrysantheme 600 Blüten, dann eine Pflanze 17.000.',q:'Welche Stufe der Marktreife zeigt das?',o:['Stufe 2: Das Versprechen wird immer weiter vergrößert','Stufe 1','Stufe 3','Stufe 5'],a:0,w:'Ein klassischer Überbietungswettlauf.'},
  {t:'tf',q:'Ein Produkt kann auch dadurch Erster werden, dass es einen neuen Markt für sich entdeckt.',a:true,w:'Wie das Malzgetränk, das neu als Kraftspender für Kinder positioniert wurde.'},
  {t:'mc',q:'Was passiert, wenn die Übertreibung zu weit getrieben wird?',o:['Leser werden misstrauisch, ziehen Abstriche ab, der Umsatz fällt','Der Umsatz steigt immer weiter','Nichts','Konkurrenten geben auf'],a:0,w:'Dann ist der Markt reif für die nächste Stufe.'},
  {t:'why',q:'Warum reicht beim ersten Produkt im Markt eine schlichte Aussage?',o:['Weil die Botschaft für den Markt völlig neu ist und deshalb geglaubt wird','Weil Leser einfache Texte lieben','Weil Werbung damals billig war','Weil Konkurrenz verboten ist'],a:0,w:'Der Markt hat noch keine ähnlichen Versprechen gehört.'},
  {t:'err',s:'Ein Start-up mit einem völlig neuen Produkt will eine verschachtelte, ironische Headline mit Wortspiel.',q:'Was würde Schwartz raten?',o:['Als Erster einfach und direkt sein: Versprechen nennen und beweisen','Mehr Wortspiele','Einen Prominenten','Nur den Preis nennen'],a:0,w:'Verkünstelung ist nur nötig, wenn das direkte Versprechen schon abgenutzt ist.'}],
 ex:{q:'Erkläre die Strategien für Stufe 1 und Stufe 2 der Marktreife und warum Stufe 2 irgendwann von selbst endet.',k:['Stufe 1: Als Erster einfach und direkt das Versprechen nennen, dramatisieren und beweisen','Stufe 2: Das funktionierende Versprechen übernehmen und vergrößern bzw. überbieten','Irgendwann wird übertrieben, Worte verlieren Bedeutung','Die Leser werden misstrauisch, glauben nicht mehr und der Umsatz sinkt']}},
 {title:'Der neue Mechanismus',cards:[
  ['Stufe 3: alles schon gehört','Der Markt hat alle Versprechen in allen Übertreibungen gehört. Der Wunsch ist aber nicht verschwunden, etwa beim Abnehmen erneuert er sich ständig. Was jetzt hilft: ein neuer Mechanismus, ein neuer Weg, das alte Versprechen einzulösen.'],
  ['Vom Was zum Wie','In Stufe 3 verschiebt sich der Schwerpunkt von dem, was das Produkt leistet, zu dem, wie es funktioniert. Eine frische Chance, wo bisher nur Enttäuschung war.'],
  ['Die Headline wird umgebaut','In Stufe 2 füllt das Versprechen die Headline, der Mechanismus steht klein darunter. In Stufe 3 ist es umgekehrt: Der Mechanismus steht in der Headline, das bekannte Versprechen wird zur Kurzform und erst im ersten Absatz voll ausgeführt.'],
  ['Stufe 4: den Mechanismus ausbauen','Konkurrenten übernehmen den erfolgreichen Mechanismus. Die Antwort: ihn erweitern. Einfacher, schneller, sicherer, mehr Probleme lösen, weitere Grenzen beseitigen. Wie Stufe 2, nur diesmal am Mechanismus.'],
  ['Wieder an der Grenze','Auch der Ausbau verliert irgendwann Glaubwürdigkeit. Dann braucht es einen neuen Mechanismus, der nicht nur neu und legitim ist, sondern vom Markt auch als glaubwürdig akzeptiert wird. Jede Anzeige davor macht das schwerer.']],
 qs:[
  {t:'mc',q:'Was braucht ein Markt in Stufe 3 der Marktreife?',o:['Einen neuen Mechanismus, der das alte Versprechen frisch und glaubhaft macht','Ein noch größeres Versprechen','Einen niedrigeren Preis','Gar keine Werbung'],a:0,w:'Ein neuer Weg zum alten Ziel.'},
  {t:'mc',q:'Wie unterscheidet sich die Headline in Stufe 3 von Stufe 2?',o:['Der Mechanismus steht in der Headline, das Versprechen wird zur Kurzform','Sie ist kürzer','Sie hat keinen Produktnamen','Es gibt keinen Unterschied'],a:0,w:'Das Versprechen wird erst im ersten Absatz voll ausgeführt.'},
  {t:'sc',s:'Nach vielen „Bis zu 20 Kilo weniger“-Anzeigen wirbt ein Mittel mit: „Schwemmt Fett einfach aus dem Körper“.',q:'Welche Stufe der Marktreife ist das?',o:['Stufe 3: Der Mechanismus steht in der Headline','Stufe 1','Stufe 2','Stufe 5'],a:0,w:'Nicht mehr Was, sondern Wie.'},
  {t:'sc',s:'Ein Konkurrent übernimmt den neuen Mechanismus und wirbt: „Der erste Fettlöser ganz ohne Diät“.',q:'Welche Stufe ist das?',o:['Stufe 4: Der Mechanismus wird ausgebaut','Stufe 3','Stufe 1','Stufe 5'],a:0,w:'Wie Stufe 2, nur dass jetzt der Mechanismus überboten wird.'},
  {t:'tf',q:'Ein neuer Mechanismus muss nur neu sein, ob der Markt ihn glaubt, ist egal.',a:false,w:'Er muss neu, legitim und vom Markt als glaubwürdig akzeptiert sein.'},
  {t:'why',q:'Warum hilft ein neuer Mechanismus, wenn alle Versprechen schon gemacht sind?',o:['Er gibt Enttäuschten eine neue Chance, dass es diesmal klappt','Er ist billiger','Er klingt wissenschaftlich, das reicht immer','Er ersetzt den Wunsch'],a:0,w:'Der Wunsch ist ungebrochen, nur der Glaube an die alten Wege fehlt.'},
  {t:'err',s:'In einem übersättigten Markt sagt ein Texter: „Wir versprechen einfach noch mehr als alle anderen.“',q:'Warum wird das wahrscheinlich scheitern?',o:['In Stufe 3 glaubt der Markt keine größeren Versprechen mehr, er braucht einen neuen Mechanismus','Mehr ist immer besser','Es scheitert nicht','Weil Zahlen verboten sind'],a:0,w:'Überbieten ist die Strategie von Stufe 2, nicht von Stufe 3.'}],
 ex:{q:'Warum rückt in Stufe 3 der Marktreife der Mechanismus in die Headline? Erkläre es mit einem eigenen Beispiel.',k:['Der Markt hat alle Versprechen und Übertreibungen schon gehört und glaubt sie nicht mehr','Der Wunsch selbst ist aber noch da','Ein neuer Mechanismus bietet einen neuen Weg und damit neue Hoffnung, dass es diesmal klappt','Ein passendes eigenes Beispiel, in dem das Wie statt des Was in der Headline steht']}},
 {title:'Erschöpfte Märkte',cards:[
  ['Stufe 5: Niemand glaubt mehr','Der Markt glaubt keiner Werbung mehr und will von dem Produkt nichts wissen. Das entspricht der fünften Bewusstseinsstufe. Die Strategie: Identifikation mit dem Interessenten statt Versprechen und Mechanismus.'],
  ['Ein Beispiel','Ein Kaffeeersatz, dessen Gesundheits-, Energie- und Geschmacksversprechen nicht mehr zogen, gewann seinen Markt mit einer Anzeige zurück, die von gestressten Männern erzählte, die sich mit Aufputschmitteln überfordern.'],
  ['Zigaretten durch alle Stufen','Stufe 1: einfacher Genuss. Stufe 2: immer größere Vergleiche. Stufe 3: Mechanismen wie geröstet oder längerer Filterweg. Stufe 4: deren Ausbau. Stufe 5: Bilder von Männlichkeit, ganz ohne Versprechen, gestützt auf Motivationsforschung.'],
  ['Ein neuer Markt, ein neuer Kreislauf','Als Filterzigaretten zum Massenmarkt wurden, durchliefen sie dieselben Stufen noch einmal, und in Stufe 5 landete die Werbung wieder beim Geschmack.'],
  ['Eine persönliche Anmerkung','Schwartz betont, dass er Strategien wie das Kopieren erfolgreicher Ansätze nüchtern beschreibt. Er stellt sie ausdrücklich nicht als Empfehlung dar, sondern als mögliche Strategien, die man wählen oder ablehnen kann.']],
 qs:[
  {t:'mc',q:'Welche Strategie empfiehlt Schwartz für Stufe 5 der Marktreife?',o:['Identifikation mit dem Interessenten statt Versprechen','Noch größere Versprechen','Einen neuen Preis','Nur den Mechanismus nennen'],a:0,w:'Stufe 5 der Marktreife entspricht Stufe 5 des Bewusstseins.'},
  {t:'sc',s:'Eine Zigarettenmarke zeigt nur raue Männer in harten Berufen, ohne ein einziges Produktversprechen.',q:'Welche Stufe der Marktreife ist das?',o:['Stufe 5','Stufe 1','Stufe 2','Stufe 3'],a:0,w:'Reine Identifikation, kein Versprechen, kein Mechanismus.'},
  {t:'sc',s:'Eine Zigarettenmarke wirbt damit, dass ihr Tabak geröstet ist.',q:'Welche Stufe der Marktreife ist das?',o:['Stufe 3: ein neuer Mechanismus','Stufe 1','Stufe 5','Stufe 2'],a:0,w:'Der Mechanismus macht das alte Genussversprechen wieder frisch.'},
  {t:'tf',q:'Wenn ein neuer Teilmarkt entsteht, beginnt der Kreislauf der Marktreife dort von vorn.',a:true,w:'Filterzigaretten durchliefen alle Stufen noch einmal.'},
  {t:'gap',q:'Schwartz beschreibt Kopierstrategien nicht als ___, sondern als mögliche Strategien.',o:['Empfehlung','Verbot','Gesetz','Fehler'],a:0,w:'Er überlässt die ethische Wahl dem Leser.'},
  {t:'why',q:'Warum ähneln sich Stufe 5 der Marktreife und Stufe 5 des Bewusstseins?',o:['In beiden Fällen will der Markt vom Produkt nichts wissen, nur Identifikation erreicht ihn','Weil beide gleich heißen','Weil beide billig sind','Zufall'],a:0,w:'Einmal aus Unwissen, einmal aus Überdruss.'},
  {t:'err',s:'Jemand sagt: „Marktreife geht immer nur in eine Richtung, irgendwann ist ein Markt einfach tot.“',q:'Was zeigt das Zigarettenbeispiel?',o:['Durch Identifikation oder neue Teilmärkte kann ein erschöpfter Markt wieder belebt werden','Der Markt war tot','Werbung hilft nie','Er hat recht'],a:0,w:'Neue Ansätze öffnen auch erschöpfte Märkte.'},
  {t:'match',q:'Ordne die Stufen der Marktreife zu.',p:[['Stufe 1','direkt versprechen'],['Stufe 2','überbieten'],['Stufe 3','neuer Mechanismus'],['Stufe 5','Identifikation']]}],
 ex:{q:'Fasse die fünf Stufen der Marktreife zusammen und nenne für jede die passende Strategie.',k:['Stufe 1: Erster im Markt, einfach und direkt versprechen','Stufe 2: das Versprechen vergrößern und überbieten','Stufe 3: einen neuen Mechanismus in die Headline stellen; Stufe 4: den Mechanismus ausbauen','Stufe 5: Markt glaubt nichts mehr, Identifikation statt Versprechen']}}
]},
{key:'b4',col:'ink',title:'Die Headline schärfen',sub:'Verbalisierung und kreatives Planen',lessons:[
 {title:'Verbalisierung',cards:[
  ['Vom Was zum Wie','Bisher ging es um den Inhalt der Headline. Verbalisierung ist die Kunst, die Wirkung durch die Art der Formulierung zu steigern. Bist du Erster, ist die nackte Aussage am besten. Sonst bindest du zusätzliche Bilder an das Versprechen.'],
  ['Drei Ziele','Das Versprechen stärken: vergrößern, messen, lebendiger machen. Es wieder frisch machen: verdrehen, neu betrachten, als Geschichte erzählen. Den Leser in den Text ziehen: Information versprechen, fragen, den Mechanismus andeuten.'],
  ['Messen und vergleichen','Die Größe messen. Die Geschwindigkeit messen. Mit etwas vergleichen. Vorher und nachher zeigen. Detailliert zeigen, wie viel Arbeit das Produkt erledigt, etwa wie viele Beschwerden es gleichzeitig lindert.'],
  ['Bilder und Sinne','Eine Metapher („schmilzt Fett weg“). Die Sinne ansprechen: schmecken, fühlen, hören. Ein Paradebeispiel zeigen, etwa ein Boxer, der einen Pappbecher nicht zerdrücken kann. Das Ergebnis dramatisieren. Ein Symbol statt einer Zahl.'],
  ['Den Leser einbinden','Als Frage stellen. Als Herausforderung. Als Zitat aus einem Fall. Den Interessenten direkt ansprechen. Sogar die ansprechen, die nicht kaufen können. Seine einschränkenden Überzeugungen angreifen, etwa: Du bist klüger, als du denkst.'],
  ['Neu, exklusiv, grenzenlos','Neuheit betonen. Exklusivität betonen. Grenzen entfernen („ohne Operation“). Mechanismus und Versprechen verbinden. Der Erwartung widersprechen. Dem Problem einen Namen geben. Vor Fallstricken warnen. Schwartz nennt 38 solcher Wege, aber die Liste ist unendlich.']],
 qs:[
  {t:'mc',q:'Was versteht Schwartz unter Verbalisierung?',o:['Die Wirkung einer Headline durch die Art der Formulierung steigern','Die Wahl des Wunsches','Das Layout','Die Übersetzung'],a:0,w:'Der Inhalt steht fest, jetzt geht es um das Wie.'},
  {t:'sc',s:'Headline-Idee: „In 30 Sekunden zum perfekten Milchschaum“.',q:'Welche Technik wird genutzt?',o:['Die Geschwindigkeit des Versprechens messen','Ein Paradox','Den Leser herausfordern','Eine Warnung'],a:0,w:'Eine konkrete Zeitangabe macht das Versprechen greifbar.'},
  {t:'sc',s:'Headline-Idee: „Wie ein Koch, der nie kocht, mein Abendessen rettete“.',q:'Welche Technik wird genutzt?',o:['Das Versprechen als Paradox formulieren','Eine Messung','Ein Preisvergleich','Exklusivität'],a:0,w:'Der Widerspruch zwingt zum Weiterlesen.'},
  {t:'sc',s:'Headline-Idee: „Falls Sie Ihren Urlaub schon gebucht haben, lesen Sie das besser nicht.“',q:'Welche Technik wird genutzt?',o:['Die ansprechen, die nicht kaufen können','Eine Metapher','Eine Messung','Ein Expertenzitat'],a:0,w:'Gerade die Ausgeschlossenen lesen neugierig weiter, und die anderen erst recht.'},
  {t:'tf',q:'Wenn du der Erste im Markt bist, ist die schlichte, unverzierte Aussage am besten.',a:true,w:'Verbalisierung braucht es vor allem im Wettbewerb oder bei komplizierten Gedanken.'},
  {t:'mc',q:'Welche drei Ziele kann Verbalisierung haben?',o:['Versprechen stärken, wieder frisch machen, Leser in den Text ziehen','Kürzen, übersetzen, illustrieren','Billiger, schneller, lauter','Reimen, zählen, betonen'],a:0,w:'Dazu werden Bilder und Variationen an das Hauptversprechen gebunden.'},
  {t:'why',q:'Warum braucht man in umkämpften Märkten Verbalisierung?',o:['Weil das nackte Versprechen schon oft gehört wurde und neue Kraft braucht','Weil Leser schlechter lesen','Weil es Pflicht ist','Weil Bilder teuer sind'],a:0,w:'Die Formulierung macht dasselbe Versprechen stärker oder frischer.'},
  {t:'err',s:'Ein Texter sagt: „Ich lerne die 38 Wege auswendig, dann muss ich nie wieder über eine Headline nachdenken.“',q:'Was würde Schwartz sagen?',o:['Die Liste sind Wegweiser für die Formulierung, keine Ersatz für die Analyse von Markt und Produkt','Genau so','Die Liste ist falsch','Er sollte nur 10 nutzen'],a:0,w:'Erst kommt der richtige Inhalt, dann die beste Form.'}],
 ex:{q:'Nimm die Aussage „Diese Matratze sorgt für besseren Schlaf“ und beschreibe zwei Verbalisierungs-Techniken, die du anwenden würdest, und warum.',k:['Der Kerninhalt bleibt gleich, nur die Formulierung wird verstärkt','Mindestens zwei konkrete Techniken (z. B. messen, Sinne ansprechen, Paradox, Frage, Grenzen entfernen, Vorher-nachher)','Begründung, welches Ziel sie erfüllen: stärken, frisch machen oder in den Text ziehen','Bezug zur Lage im Markt: Je mehr Konkurrenz, desto mehr Verbalisierung nötig']}},
 {title:'Kreatives Planen',cards:[
  ['Drei Ebenen der Kreativität','1. Wortersatz: eine bewährte Headline nehmen und den Produktnamen austauschen. 2. Formeln: Regeln auswendig lernen und die Idee hineingießen. 3. Analyse: mit Fragen und Wegweisern das Einzigartige in Produkt, Markt und Zeitpunkt finden.'],
  ['Echo-Anzeigen','Wortersatz funktioniert nur, wenn Produkt, Markt und Zeitpunkt gleich sind. Sonst entstehen Echo-Anzeigen, die an ein anderes Produkt erinnern. Texter, die sich selbst kopieren, sinken laut Schwartz auf Aktenschrank-Niveau.'],
  ['Motivationsforschung','Sie zeigt versteckte Wünsche, Tabus und Spaltungen im Markt und testet Formulierungen. Aber ein Forschungsergebnis ist keine Headline, nur eine Richtung. Die Idee daraus zu machen, bleibt Arbeit des Texters.'],
  ['Die Persönlichkeit eines Produkts','Produkte haben für Kunden eine Persönlichkeit aus vielen Zügen. Einer fasst sie am besten zusammen, beim Cadillac die Qualität. Andere Züge werden darauf bezogen.'],
  ['Vorbeugung verkaufen','Menschen stellen sich künftiges Unglück nicht für sich selbst vor, aber sehr wohl für Kinder, Partner oder Familie. Deshalb wirkt Kariesschutz bei Kindern und Lebensversicherung mit dem Blick auf die Familie.'],
  ['Splittermärkte und 5 bis 10 Worte','Märkte sind nicht aus einem Guss: Abnehmen fürs Aussehen ist etwas anderes als für die Gesundheit. Kleine Firmen können ein Segment wählen. Am Ende wochenlanger Planung stehen oft nur 5 bis 10 Worte, die rund 90 Prozent des Werts der Anzeige ausmachen.']],
 qs:[
  {t:'mc',q:'Welche Ebene der Kreativität hält Schwartz für die richtige?',o:['Die analytische: das Einzigartige in Produkt, Markt und Zeitpunkt suchen','Den Wortersatz','Das Auswendiglernen von Formeln','Den Zufall'],a:0,w:'Kompasse statt Gussformen.'},
  {t:'mc',q:'Was ist eine Echo-Anzeige?',o:['Eine kopierte Headline, die an ein anderes Produkt erinnert','Eine Radiowerbung','Eine Wiederholung derselben Anzeige','Eine Antwort auf Konkurrenz'],a:0,w:'Sie verliert die Stärken der einzigartigen Situation.'},
  {t:'tf',q:'Ein Ergebnis der Motivationsforschung ist bereits eine fertige Headline.',a:false,w:'Es zeigt nur die Richtung. Die Idee muss der Texter entwickeln.'},
  {t:'sc',s:'Eine Versicherung zeigt nicht den Tod des Kunden, sondern seine Familie, die ohne Absicherung dasteht.',q:'Welches Prinzip nutzt sie?',o:['Vorbeugung über die Sorge um andere verkaufen','Splittermarkt','Wortersatz','Produktpersönlichkeit'],a:0,w:'Für sich selbst stellen sich Menschen Unglück kaum vor, für Angehörige schon.'},
  {t:'sc',s:'Ein kleiner Hersteller eines Abnehmmittels wirbt nur in Gesundheitsmagazinen mit Sicherheit und Dauerhaftigkeit statt mit schnellen Ergebnissen.',q:'Was tut er?',o:['Er konzentriert sich auf einen Splittermarkt, um der großen Konkurrenz auszuweichen','Er verschwendet Geld','Wortersatz','Er nutzt Stufe 1'],a:0,w:'Später kann der Erfolg dort zum Unterscheidungsmerkmal werden.'},
  {t:'gap',q:'Am Ende der Planung stehen oft nur 5 bis 10 Worte, die etwa ___ Prozent des Werts ausmachen.',o:['90','10','50','5'],a:0,w:'Deshalb verdient die Planung so viel Zeit.'},
  {t:'why',q:'Warum funktioniert eine kopierte Headline in einem anderen Markt oft nicht?',o:['Weil sie die einzigartige Beziehung von Produkt, Markt und Zeitpunkt ignoriert','Weil Kopieren verboten ist','Weil sie zu lang ist','Weil Leser sich erinnern'],a:0,w:'Die Lösung für das Einzigartige liegt nur in ihm selbst.'},
  {t:'err',s:'Ein erfolgreicher Texter sagt: „Ich schau einfach in meine alten Ordner, da steht schon die passende Headline.“',q:'Was hält Schwartz davon?',o:['Sich selbst zu kopieren führt in die Mittelmäßigkeit, jede Aufgabe braucht eine eigene Lösung','Kluge Effizienz','Nur bei Autos sinnvoll','Er sollte ältere Ordner nutzen'],a:0,w:'Gerade erfolgreiche Texter sind dafür besonders anfällig.'}],
 ex:{q:'Warum hält Schwartz den Wortersatz für gefährlich, und welchen Ansatz setzt er dagegen?',k:['Beim Wortersatz wird eine bewährte Headline kopiert und nur der Produktname getauscht','Das klappt nur bei gleichem Produkt, Markt und Zeitpunkt, sonst entstehen Echo-Anzeigen','Er setzt auf Analyse: Markt und Produkt gründlich untersuchen und das Einzigartige finden','Formeln und Listen sind nur Wegweiser für die Formulierung, keine Lösung']}}
]},
{key:'b5',col:'red',title:'Intensivierung',sub:'Den Wunsch so lebendig machen, dass der Preis klein wirkt',lessons:[
 {title:'Drei Dimensionen des Kopfes',cards:[
  ['Ab jetzt verkauft der Text','Die Headline stoppt den Leser. Ab dem ersten Absatz verkauft der Text. Er verändert das Bild, das der Leser von der Wirklichkeit hat, und erschafft eine Welt, in der das Produkt seinen stärksten Wunsch erfüllt.'],
  ['Wie lang ein Text sein muss','So lang, wie nötig ist, um den Wunsch auf volle Stärke zu bringen. Plus so viel, dass der Leser sich mit dem Produkt wohl und geschmeichelt fühlt. Plus so viel, dass er glaubt, was du sagst, trotz seiner Vorurteile.'],
  ['1. Wünsche','Körperlich, materiell, sinnlich. Sie existieren schon. Du kannst sie nicht schaffen oder bekämpfen, aber erweitern, schärfen, lenken und ihnen ein Ziel geben. Die Technik dafür heißt Intensivierung.'],
  ['2. Identifikationen','Die Rollen, die der Leser im Leben spielen will, sein Status, seine Persönlichkeit. Fast nie offen ausgesprochen, aber enorm stark. Das Produkt soll ihm helfen, diese Rollen auszudrücken.'],
  ['3. Überzeugungen','Meinungen, Haltungen, Vorurteile, sein Bild der Welt. Werbung streitet nicht mit ihnen, sie ist keine Erziehung. Du baust auf ihnen auf und benutzt seine Logik, nicht deine.'],
  ['Die sieben Techniken','Intensivierung, Identifikation, Graduierung, Neudefinition, Mechanisierung, Konzentration und Tarnung. Am Ende werden sie zu einem fließenden Gedankengang verwoben.']],
 qs:[
  {t:'mc',q:'Welche drei Dimensionen des Kopfes unterscheidet Schwartz?',o:['Wünsche, Identifikationen, Überzeugungen','Verstand, Gefühl, Körper','Vergangenheit, Gegenwart, Zukunft','Sehen, Hören, Fühlen'],a:0,w:'Jede braucht eigene Techniken.'},
  {t:'tf',q:'Werbung sollte die falschen Überzeugungen ihrer Leser direkt widerlegen.',a:false,w:'Sie baut auf den vorhandenen Überzeugungen auf und nutzt die Logik des Lesers.'},
  {t:'mc',q:'Wovon hängt die nötige Länge eines Textes ab?',o:['Wie viel nötig ist für Wunsch, Identifikation und Glauben','Vom Budget allein','Von der Schriftgröße','Von der Jahreszeit'],a:0,w:'Drei Fragen bestimmen Länge, Aufbau und Tempo.'},
  {t:'sc',s:'Eine Anzeige für ein Sportauto zeigt den Fahrer, wie Nachbarn ihn bewundernd ansehen.',q:'Welche Dimension wird vor allem angesprochen?',o:['Identifikation: die Rolle, die er spielen will','Überzeugung','Reiner körperlicher Wunsch','Keine'],a:0,w:'Es geht um Status und Selbstbild, nicht nur ums Fahren.'},
  {t:'gap',q:'Die Technik, Wünsche zu schärfen und ihnen ein Ziel zu geben, heißt ___.',o:['Intensivierung','Tarnung','Konzentration','Neudefinition'],a:0,w:'Sie ist die erste der sieben Techniken.'},
  {t:'why',q:'Warum streitet Werbung nicht mit den Überzeugungen des Lesers?',o:['Weil kein Werbetreibender die Zeit und Mittel hat, Überzeugungen zu ändern, und Widerspruch Ablehnung auslöst','Weil Überzeugungen egal sind','Weil es verboten ist','Weil Leser keine Überzeugungen haben'],a:0,w:'Werbung ist keine Erziehung, sie nutzt die Wirklichkeit, wie sie ist.'},
  {t:'err',s:'Ein Texter sagt: „Wenn der Wunsch stark genug ist, muss ich mich um Glaubwürdigkeit nicht kümmern.“',q:'Was fehlt ihm?',o:['Ohne Glauben wird aus Wunsch keine Überzeugung, und es kommt nicht zum Kauf','Nichts','Er braucht mehr Bilder','Glaubwürdigkeit ist Sache des Herstellers'],a:0,w:'Alle drei Dimensionen müssen zusammenwirken.'}],
 ex:{q:'Nenne die drei Dimensionen des Kopfes nach Schwartz und erkläre, was der Text in jeder tun muss.',k:['Wünsche: verstärken, schärfen und auf das Produkt lenken','Identifikationen: das Produkt mit den Rollen und dem Selbstbild verbinden, die der Leser will','Überzeugungen: auf vorhandenen Überzeugungen aufbauen und mit seiner Logik Glauben schaffen','Die drei müssen am Ende zusammenwirken']}},
 {title:'Bilder der Erfüllung',cards:[
  ['Werbung als Wunschbuch','Wünsche sind verschwommen. Der Texter füllt sie mit konkreten Bildern und zeigt jede Art, wie sie sich erfüllen. Er ist der Drehbuchautor der Träume seines Lesers. Je schärfer und zahlreicher die Bilder, desto unwichtiger wirkt der Preis.'],
  ['Nicht wiederholen, verstärken','Der Leser nimmt nur eine Grundidee mit. Aber jede neue Perspektive auf diese Idee macht sie realer und gefühlsmäßig schwerer. Dieselbe Beschreibung zweimal langweilt dagegen und kostet Leser.'],
  ['1. Direkt beschreiben, 2. in Aktion zeigen','Erst das Produkt oder sein Ergebnis ausführlich beschreiben. Dann das Produkt in Aktion zeigen: nicht nur wie es aussieht, sondern wie genau es seinen Nutzen bringt.'],
  ['3. Den Leser hineinversetzen, 4. ein Test','Den Leser mitten in die Szene setzen: Was passiert an seinem ersten Tag mit dem Produkt? Dann einen Test beschreiben, mit dem er die Leistung selbst nachprüfen kann.'],
  ['5. In die Zeit dehnen','Den Nutzen nicht nur für eine Stunde, sondern über Wochen und Monate zeigen, Phase für Phase.'],
  ['6. Publikum, 7. staunende Experten','Andere Menschen bringen neue Perspektiven: Prominente, ganz normale Leute in Fallgeschichten. Oder Experten, deren Erstaunen besonders überzeugend ist.']],
 qs:[
  {t:'mc',q:'Was ist laut Schwartz die Kernaufgabe der Intensivierung?',o:['Den vagen Wunsch mit immer neuen, konkreten Bildern der Erfüllung füllen','Den Preis betonen','Die Konkurrenz angreifen','Den Mechanismus erklären'],a:0,w:'Der Texter zeigt dem Leser im Detail all die Tage, die das Produkt möglich macht.'},
  {t:'tf',q:'Man sollte dieselbe Beschreibung mehrmals wörtlich wiederholen, damit sie sich einprägt.',a:false,w:'Wiederholung langweilt. Neue Perspektiven auf dieselbe Idee verstärken.'},
  {t:'sc',s:'„Stell dir vor: Nächsten Samstag stehst du in der Küche, drückst einen Knopf, und 20 Sekunden später duftet es nach frischem Espresso …“',q:'Welche Technik ist das?',o:['Den Leser in die Szene versetzen','Experten staunen lassen','Vergleich mit der Konkurrenz','Garantie'],a:0,w:'Der Leser erlebt seinen ersten Tag mit dem Produkt.'},
  {t:'sc',s:'„Nimm heute Abend Seite 39, lies acht Seiten und schreib danach 20 Fakten auswendig auf.“',q:'Welche Technik ist das?',o:['Ein Test, mit dem der Leser die Leistung selbst prüft','Zeitdehnung','Publikum','Metapher'],a:0,w:'Der Leser stellt sich vor, wie er den Beweis selbst erbringt.'},
  {t:'sc',s:'„Schon im ersten Monat wachsen die Pflanzen kräftig, nach zwei Wochen beginnt die zweite Phase, und im Sommer …“',q:'Welche Technik ist das?',o:['Den Nutzen in die Zeit dehnen','Den Leser testen lassen','Experten','Preisvergleich'],a:0,w:'Ein fortlaufender Strom von Vorteilen über Wochen und Monate.'},
  {t:'gap',q:'Laut Schwartz ist nichts so erstaunlich wie das Erstaunen von ___.',o:['Experten','Kindern','Nachbarn','Kunden'],a:0,w:'Überraschte Fachleute verbinden Wettbewerb, Entdeckung und Überraschung.'},
  {t:'why',q:'Warum wirkt der Preis kleiner, je mehr Bilder der Erfüllung der Text zeigt?',o:['Weil der Wunsch stärker wird und der Leser mehr bekommt, wofür er zahlt','Weil Bilder den Preis verdecken','Weil Leser nicht rechnen','Zufall'],a:0,w:'Der Wert wächst mit jedem konkreten Bild.'},
  {t:'err',s:'Ein Texter schreibt drei Absätze, die alle sagen: „Dieses Kissen ist wirklich sehr bequem.“',q:'Was ist das Problem?',o:['Er wiederholt statt zu verstärken; jede neue Perspektive bräuchte ein neues Bild','Kissen sind nie bequem','Drei Absätze sind zu kurz','Nichts'],a:0,w:'Zum Beispiel: in Aktion, erste Nacht, nach einem Monat, was Gäste sagen.'}],
 ex:{q:'Du verkaufst ein Massagekissen. Beschreibe, wie du mit mindestens drei Intensivierungs-Techniken den Wunsch verstärkst.',k:['Dieselbe Grundidee aus verschiedenen Perspektiven statt Wiederholung','Konkrete, sinnliche Bilder der Erfüllung statt bloßer Behauptungen','Mindestens drei Techniken (z. B. in Aktion zeigen, erster Tag, Selbsttest, Zeitdehnung, andere Menschen, Experten)','Ziel: Der Wunsch wird so stark, dass der Preis klein wirkt']}},
 {title:'Mehr Wege und Kampagnen',cards:[
  ['8. Vergleichen','Alt gegen neu, nebeneinander gestellt. Ein Buchclub verglich, was Freunde im Laden zahlen, mit dem Clubpreis, Buch für Buch.'],
  ['9. Himmel oder Hölle','Das Elend mit dem alten Produkt drastisch zeigen und dann das neue dagegen stellen, etwa verdreckte, verschlissene Zündkerzen gegen eine neue Lösung.'],
  ['10. bis 13.','Zeigen, wie leicht man den Nutzen bekommt. Metapher, Analogie, Fantasie nutzen. Am Ende alles zusammenfassen. Und die Garantie als Verkaufsargument einsetzen, mit konkreten Zusagen.'],
  ['Einzelanzeige gegen Kampagne','Versandhandel sagt alles in einer Anzeige und friert erfolgreiche Anzeigen ein. Markenwerbung läuft ständig. Ihr Problem: eine zentrale Idee so verdichten, dass sie beim ersten Mal verkauft und bei Wiederholung weiter wirkt, und sie dann in immer neuen Varianten zeigen.'],
  ['Regel und Beispiel','Eine Möglichkeit: immer derselbe Satz, darüber immer neue Bilder. Eine andere: wechselnde Eröffnungen vor einer feststehenden Botschaft, wie der unsichtbare Schutzschild einer Zahnpasta.'],
  ['Der Fokus auf das Produkt','Die VW-Kampagne wiederholte keinen Slogan. Jede Anzeige zeigte nur das Auto und einen neuen Fakt. Zusammen ergaben sie das Bild eines ehrlichen Autos. Das kreative Wagnis: Produkt und Leistung standen oft nicht in der Headline.']],
 qs:[
  {t:'sc',s:'Eine Anzeige zeigt eine verkalkte, stinkende alte Kaffeemaschine und daneben eine neue, die sich selbst reinigt.',q:'Welche Technik ist das?',o:['Himmel oder Hölle','Zeitdehnung','Experten','Publikum'],a:0,w:'Das Elend des Alten macht das Neue strahlender.'},
  {t:'mc',q:'Worin unterscheidet sich Intensivierung in der Markenwerbung vom Versandhandel?',o:['Sie verteilt sich auf eine Serie von Anzeigen statt alles in eine zu packen','Es gibt keinen Unterschied','Markenwerbung braucht keine Intensivierung','Versandhandel ist kürzer'],a:0,w:'Die zentrale Idee bleibt, die Varianten wechseln.'},
  {t:'mc',q:'Was ist „Regel und Beispiel“?',o:['Dieselbe Headline mit immer neuen Bildern','Eine Garantie','Ein Vergleich','Eine Preisregel'],a:0,w:'Die Beispiele beweisen die Regel und machen sie neu.'},
  {t:'tf',q:'Die VW-Anzeigen wiederholten in jeder Anzeige denselben Slogan.',a:false,w:'Sie hielten den Fokus auf das Auto und zeigten jedes Mal einen neuen Fakt.'},
  {t:'gap',q:'Eine Garantie kann man als ___ einsetzen, nicht nur als Pflichtangabe.',o:['Verkaufsargument','Kleingedrucktes','Ausrede','Rabatt'],a:0,w:'Konkrete Zusagen stärken den Abschluss.'},
  {t:'why',q:'Warum darf in einer Kampagne nicht immer dieselbe Headline stehen?',o:['Weil die Anzeigen dann unlesbar langweilig werden','Weil es teuer ist','Weil es verboten ist','Weil Kunden es vergessen'],a:0,w:'Kontinuität braucht Variation, damit die Idee frisch bleibt.'},
  {t:'err',s:'Eine Marke wechselt in jeder Anzeige die Kernbotschaft, damit es nie langweilig wird.',q:'Was geht dabei verloren?',o:['Die Kontinuität: Der Wunsch aus früheren Anzeigen wird nicht genutzt','Nichts','Die Farbe','Der Preis'],a:0,w:'Eine zentrale Idee in neuen Varianten verbindet beides.'},
  {t:'match',q:'Ordne die Techniken zu.',p:[['Erster Tag','Leser hineinversetzen'],['Selbstprüfung','Test'],['Altes Elend','Himmel oder Hölle'],['Wochen und Monate','Zeitdehnung']]}],
 ex:{q:'Erkläre, wie sich Intensivierung in einer Kampagne von der in einer einzelnen Versandhandelsanzeige unterscheidet.',k:['Versandhandel packt alles in eine Anzeige und friert sie bei Erfolg ein','Markenwerbung muss den Wunsch über eine ganze Serie aufbauen','Die zentrale Idee muss so verdichtet sein, dass sie auch bei Wiederholung wirkt','Sie wird in immer neuen Varianten gezeigt (z. B. Regel und Beispiel, wechselnde Fakten)']}}
]},
{key:'b6',col:'teal',title:'Identifikation',sub:'Eine verkaufsstarke Persönlichkeit für dein Produkt',lessons:[
 {title:'Die Rollen des Kunden',cards:[
  ['Ausdruck statt Befriedigung','Neben körperlichen Wünschen gibt es einen zweiten, feineren, teils unbewussten Wunsch: den nach Ausdruck. Menschen wollen Rollen spielen und sich nach außen definieren.'],
  ['Zwei Gründe zu kaufen','Jedes Produkt sollte zwei Gründe bieten: ein Bedürfnis erfüllen und es auf eine Weise erfüllen, die den Käufer als bestimmten Menschen ausweist. Diese überfunktionale Rolle entsteht durch Vermarktung, nicht durch Technik.'],
  ['Charakterrollen','Meist Adjektive: fortschrittlich, belesen, charmant. Ein Produkt kann helfen, sie zu erreichen (Philosophiebuch), sie abzukürzen (Schnelllesekurs) oder sie zu zeigen (das schöne Bücherregal).'],
  ['Leicht geglaubt','Charakterrollen werden selten ausgesprochen und nie überprüft. Deshalb glaubt man sie viel leichter als Leistungsversprechen. Ein Sportwagen für 250 km/h im Stau macht nur Sinn, weil er die Rolle „Sportsmann“ verleiht.'],
  ['Leistungsrollen','Meist Substantive und Titel: Führungskraft, Hausbesitzer, Aufsteiger. Sie sind unsichtbar und müssen deshalb gezeigt werden, durch Dinge, die man kauft. So entsteht eine materielle Persönlichkeit, etwa der Umstieg auf ein größeres Auto mit jeder Beförderung.'],
  ['Wann Rollen entscheiden','Wenn Produkte dasselbe leisten und der Preis keine Rolle spielt, entscheidet fast nur noch die Rolle, die das Produkt bietet. Die stärksten Rollen sah Schwartz damals in: attraktiv, aufregend, beliebt, wichtig, modern und vor allem erfolgreich.']],
 qs:[
  {t:'mc',q:'Welche zwei Gründe zu kaufen sollte ein Produkt laut Schwartz bieten?',o:['Ein Bedürfnis erfüllen und den Käufer als bestimmten Menschen ausweisen','Billig und schnell','Neu und bekannt','Schön und groß'],a:0,w:'Der zweite Grund ist die überfunktionale Rolle.'},
  {t:'mc',q:'Wodurch unterscheiden sich Charakter- und Leistungsrollen?',o:['Charakterrollen sind Eigenschaften (Adjektive), Leistungsrollen Positionen und Titel (Substantive)','Es gibt keinen Unterschied','Leistungsrollen sind unbewusst','Charakterrollen kann man kaufen, Leistungsrollen nicht'],a:0,w:'Belesen ist eine Charakterrolle, Führungskraft eine Leistungsrolle.'},
  {t:'tf',q:'Charakterrollen werden in der Werbung leichter geglaubt als Leistungsversprechen.',a:true,w:'Sie werden nie offen behauptet und nie überprüft.'},
  {t:'sc',s:'Jemand kauft nach seiner Beförderung eine teure Uhr, obwohl seine alte gut funktioniert.',q:'Was steckt dahinter?',o:['Eine Leistungsrolle soll sichtbar gemacht werden','Ein körperliches Bedürfnis','Reine Neugier','Ein Mechanismus'],a:0,w:'Unsichtbare Erfolge werden durch Produkte gezeigt.'},
  {t:'mc',q:'Wann entscheidet die Rolle fast allein über den Kauf?',o:['Wenn Produkte gleich gut sind und der Preis keine Rolle spielt','Wenn das Produkt neu ist','Bei Lebensmitteln nie','Wenn es Rabatt gibt'],a:0,w:'Dann ist die Rolle der einzige Unterschied.'},
  {t:'why',q:'Warum werden Charakterrollen so leicht angenommen?',o:['Weil sie nur angedeutet, nie behauptet und nie an der Realität geprüft werden','Weil sie billig sind','Weil sie wahr sind','Weil sie im Gesetz stehen'],a:0,w:'Trost ohne Kosten, wie Schwartz es beschreibt.'},
  {t:'err',s:'Ein Hersteller sagt: „Unser Produkt ist technisch genauso gut wie die Konkurrenz, also können wir uns nicht abheben.“',q:'Was übersieht er?',o:['Er kann sich über die Rolle abheben, die das Produkt dem Käufer bietet','Er muss billiger werden','Er hat recht','Er braucht eine neue Fabrik'],a:0,w:'Gerade bei gleicher Leistung entscheidet die Rolle.'}],
 ex:{q:'Erkläre den Unterschied zwischen Charakterrollen und Leistungsrollen und warum Charakterrollen in der Werbung so leicht geglaubt werden.',k:['Charakterrollen sind Persönlichkeitszüge (Adjektive wie belesen, sportlich)','Leistungsrollen sind Positionen und Titel (Substantive wie Führungskraft, Hausbesitzer), die gezeigt werden müssen','Charakterrollen werden nur angedeutet, oft in Bildern, und nie überprüft','Deshalb sind sie leichter anzunehmen als Leistungsversprechen']}},
 {title:'Das primäre Bild',cards:[
  ['Jedes Produkt hat schon ein Bild','Ein Produkt hat bereits eine Persönlichkeit, wenn du es bekommst: die Zigarette wirkt männlich, der Kolbenring präzise, das Haushaltsgerät zeitsparend. Das ist sein primäres Bild.'],
  ['Nicht einfach ersetzen','Ein negatives oder neutrales Bild einfach gegen ein schöneres zu tauschen, funktioniert nicht. Menschen glauben nicht, dass ein Produkt ist, was es nicht ist. Werbung kann akzeptierte Bilder nicht widerlegen.'],
  ['Schritt 1: Intensität ändern','Ist das primäre Bild günstig, verstärke es. Eine Zigarettenmarke zeigte männliche Männer, in Berufen, die Männlichkeit verlangen, und dazu ein Tattoo, ein uraltes Symbol der Männlichkeit. Ist es ungünstig, schwäche es ab.'],
  ['Schritt 2: eine Brücke bauen','Nutze das primäre Bild als logische Brücke zu günstigeren Bildern. Die neuen Bilder müssen aus dem primären hervorgehen und zu ihm passen. So kamen zum Zigarettenmann später Erfolg, Abenteuer und Kultur dazu.'],
