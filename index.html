        <div class="tbl-wrap" style="margin-top:6px"><table class="data"><thead><tr><th>Quartal</th><th>Marke</th><th style="text-align:left">Memo</th></tr></thead><tbody>${MK.memos.filter(m=>m.q>0).map(m=>`<tr><td>Q${m.q+1}</td><td style="font-family:var(--f-body)">${esc(mName(m.id))}</td><td style="white-space:normal;text-align:left;font-family:var(--f-body)">${esc(m.txt)}</td></tr>`).join('')}</tbody></table></div></div>
        <div class="ai-box"><div class="ai-label">CMO-Debriefing</div>${AI.state==='on'?`<div class="out" id="mkDeb">${esc(MK.debrief)}</div><div class="row" style="margin-top:10px"><button class="btn sm" id="mkD" ${MK.dBusy?'disabled':''}>${MK.dBusy?'<span class="thinking">Analysiert</span>':MK.debrief?'Neu analysieren':'Debriefing anfordern'}</button></div>`:'<p class="note">Braucht die KI-Verbindung.</p>'}</div>
        <div class="row"><button class="btn primary" id="mkAgain">Neue Partie</button><button class="btn" data-go="kompass">Zum Kompass</button></div></div>`}
    h+='</div>'}
  $('#view').innerHTML=h;bindGo();
  $('#mkReset').onclick=()=>{if(!MK.busy){newMarkt();viewMarkt()}};const ag=$('#mkAgain');if(ag)ag.onclick=()=>{newMarkt();viewMarkt()};
  const db=$('#mkD');if(db)db.onclick=marktDebrief;
  if(MK.done||!$('#mkP'))return;
  const upd=()=>{const u=mUsed();$('#mkU').textContent=u+'k / 100k €';$('#mkU').classList.toggle('over',u>100);const b=$('#mkB');b.style.width=Math.min(100,u)+'%';b.style.background=u>100?'var(--bad)':'';$('#mkGo').disabled=u>100||MK.busy};
  $$('[data-pos]').forEach(b=>b.onclick=()=>{y.pos=b.dataset.pos;$$('[data-pos]').forEach(x=>x.classList.toggle('on',x===b))});
  const p=$('#mkP');p.oninput=()=>{y.price=+p.value;$('#mkPV').textContent=eur(y.price);$('#mkM').textContent=eur(y.price-(MEV[MK.q].cost||MK.cost))};
  $$('[data-mk]').forEach(sl=>sl.oninput=()=>{y[sl.dataset.mk]=+sl.value;$('#mkv_'+sl.dataset.mk).textContent=sl.value+'k €';upd()});
  $('#mkUp').onchange=e=>{y.up=e.target.checked;upd()};const r=$('#mkR');if(r)r.onchange=e=>{MK.buyR=e.target.checked;upd()};
  $('#mkGo').onclick=marktPlay}

/* ========== LEXIKON: Fachbegriffe ========== */
const GLOSS=[
 {k:'kohorte',t:'Kohorte',f:'Cohort',de:'Gruppe mit gleichem Startzeitpunkt',c:'Analytics & KI',g:'tycoon',al:['Kohorten','Kohortenanalyse','Kohortentabelle'],d:'Alle Kund:innen, die im selben Zeitraum gewonnen wurden, etwa im selben Monat. Eine Kohortenanalyse verfolgt, wie viele davon nach 1, 2, 3 … Monaten noch kaufen. So sieht man, ob neue Kund:innen besser oder schlechter bleiben als frühere.',ex:'Die Januar-Kohorte hat nach 6 Monaten 55 % Aktive, die mit Rabatt gewonnene Februar-Kohorte nur 28 %.',r:['retention','clv','payback']},
 {k:'kapitalbindung',t:'Kapitalbindung',f:'Working Capital',de:'Geld, das in Waren und Forderungen steckt',c:'Strategie',g:'tycoon',al:['Working Capital','Umlaufvermögen'],d:'Ware im Lager ist bezahlt, aber noch nicht verkauft. Dieses Geld steht dir nicht für Marketing oder Gehälter zur Verfügung. Wachstum braucht deshalb mehr Kapital, als der Gewinn auf dem Papier zeigt: Erst muss eingekauft werden, dann wird verkauft.',ex:'Bei 1,5 Monaten Reichweite und 20.000 Bestellungen pro Monat liegen rund 200.000 € im Regal.',r:['runway','jkurve']},
 {k:'sicherheitsbestand',t:'Sicherheitsbestand',f:'Safety Stock',de:'Reserve, damit dir die Ware nicht ausgeht',c:'Strategie',g:'tycoon',al:['Reichweite','Lieferengpass'],d:'Eine Reserve im Lager, die Nachfragespitzen und Lieferverzögerungen abfängt. Zu klein: Leerstand, entgangene Verkäufe und enttäuschte Kund:innen. Zu groß: Geld ist gebunden und Lagerkosten steigen. Bei einem Monat Lieferzeit brauchst du mindestens einen Monat Reichweite.',ex:'Eine Lieferung kommt einen Monat später: Wer nur 0,7 Monate Reichweite hat, verkauft in der Zwischenzeit ins Leere.',r:['kapitalbindung','runway']},
 {k:'preiskampf',t:'Preiskampf',f:'Price War',de:'Wettbewerb über immer niedrigere Preise',c:'Strategie',g:'tycoon',al:['Preiskrieg','Preiskriege'],d:'Anbieter unterbieten sich gegenseitig, bis die Margen schrumpfen. Wer mehr Marke, Zufriedenheit und Kapital hat, hält länger durch. Oft ist es klüger, über Qualität und Bekanntheit zu gewinnen, statt jeden Preisschritt mitzugehen.',ex:'Dentara senkt auf 18 €: Wenn du mitgehst, sinkt deine Marge pro Paket von 12 € auf 4 €.',r:['ltvcac','nps']},
 {k:'payback',t:'Amortisation',f:'CAC Payback Period',de:'Zeit, bis eine Kundin ihre Akquisekosten eingespielt hat',c:'Kennzahlen',g:'tycoon',al:['Payback','Amortisationsdauer'],fx:'Amortisation ≈ CAC ÷ (Deckungsbeitrag pro Monat und Kundin)',ex:'30 € CAC, 7,15 € Deckungsbeitrag pro Monat → gut 4 Monate.',d:'Wie viele Monate es dauert, bis der Deckungsbeitrag einer Kundin ihre Akquisekosten gedeckt hat. Je länger, desto mehr Cash bindet Wachstum.',r:['cac','clv','runway']},
 {k:'ltvcac',t:'LTV:CAC',f:'Lifetime Value to Customer Acquisition Cost',de:'Kundenwert im Verhältnis zu den Akquisekosten',c:'Kennzahlen',g:'tycoon',al:['Kundenwert : CAC','LTV/CAC'],fx:'LTV:CAC = Kundenwert ÷ Akquisekosten pro Kundin',d:'Wie viel Deckungsbeitrag eine Kundin über ihre Lebenszeit im Verhältnis zu ihren Akquisekosten bringt. Faustregel: ab etwa 3 : 1 gesund. Unter 1 : 1 vernichtet jede neue Kundin Geld.',r:['clv','cac','payback']},
 {k:'runway',t:'Runway',de:'Reichweite des Geldes',c:'Kennzahlen',g:'tycoon',al:['Reichweite des Geldes','Burn-Rate','Burn Rate'],fx:'Runway = Kasse ÷ monatlicher Verlust (Burn-Rate)',d:'Wie viele Monate das vorhandene Geld beim aktuellen Verlust noch reicht. Die Burn-Rate ist der monatliche Verlust. Unter 6 Monaten Runway wird es eng, weil Finanzierungen Zeit brauchen.',r:['payback','jkurve']},
 {k:'jkurve',t:'J-Kurve',de:'erst Verlust, dann Gewinn',c:'Strategie',g:'tycoon',d:'Typischer Verlauf wachsender Abo- und E-Commerce-Firmen: Neukund:innen kosten sofort Geld, zahlen aber erst über Monate zurück. Deshalb fällt der Gewinn beim Wachstum zunächst und steigt später stark an. Wer zu schnell wächst, ohne genug Geld, rutscht in der Tiefe der Kurve in die Insolvenz.',r:['runway','payback']},
 {k:'multiple',t:'Bewertungs-Multiple',de:'Vielfaches für den Unternehmenswert',c:'Strategie',g:'tycoon',al:['Multiple','Unternehmensbewertung','ARR'],d:'Junge Firmen werden oft als Vielfaches ihres Jahresumsatzes (ARR, annual run rate) bewertet. Das Multiple steigt mit Wachstum, Marge und gesunden Unit Economics. Agenturen werden eher als Vielfaches ihres Gewinns bewertet.',r:['ltvcac','jkurve']},
 {k:'nps',t:'Kundenzufriedenheit',a:'NPS',f:'Net Promoter Score',de:'Weiterempfehlungsbereitschaft',c:'Kennzahlen',g:'tycoon',al:['Zufriedenheit'],d:'Der Net Promoter Score misst, wie wahrscheinlich Kund:innen ein Unternehmen weiterempfehlen (Promotoren minus Kritiker, Skala −100 bis +100). In den Simulationen steht Zufriedenheit für Bindung, Empfehlungen und Bewertungen, die in Zeiten von KI-Shopping-Assistenten noch wichtiger werden.',r:['retention','socialproof']},
 {k:'auslastung',t:'Auslastung',f:'Utilization',de:'Anteil verkaufter Arbeitszeit',c:'Kennzahlen',g:'agency',d:'In Agenturen der Anteil der Arbeitszeit, der an Kund:innen abgerechnet wird. Unter etwa 70 % zahlst du Gehälter für leere Stunden, über 100 % leidet Qualität, und Mitarbeitende brennen aus.',r:['retainer','stundensatz']},
 {k:'retainer',t:'Retainer',de:'monatliches Pauschalhonorar',c:'Strategie',g:'agency',d:'Fester monatlicher Betrag, den ein Kunde einer Agentur für einen vereinbarten Leistungsumfang zahlt. Planbar für beide Seiten, aber riskant, wenn der Aufwand still wächst (Scope Creep).',r:['auslastung','stundensatz']},
 {k:'stundensatz',t:'Stundensatz',de:'Preis pro Arbeitsstunde',c:'Pricing',g:'agency',d:'Was eine Agentur pro Stunde berechnet. Er muss Gehalt, Nebenkosten, nicht abrechenbare Zeit und Gewinn tragen. Faustregel: Ein Stundensatz liegt meist beim Zwei- bis Dreifachen der reinen Gehaltskosten pro Stunde.',r:['auslastung','retainer','pitch']},
 {k:'pitch',t:'Pitch',de:'Wettbewerbspräsentation um einen Auftrag',c:'Strategie',g:'agency',d:'Mehrere Agenturen präsentieren Ideen und Angebote, der Kunde wählt eine aus. Pitches kosten viel unbezahlte Zeit. Die Gewinnchance hängt von Reputation, passender Erfahrung, Chemie und Preis ab.',r:['retainer','stundensatz']},
 {k:'bass',t:'Bass-Modell',f:'Bass Diffusion Model',de:'Modell der Produktverbreitung',c:'Strategie',g:'bass',al:['Innovatoren','Imitatoren','Diffusion'],d:'Von Frank Bass 1969 entwickelt: Neue Produkte verbreiten sich durch Innovatoren, die von sich aus kaufen (etwa durch Werbung), und Imitatoren, die kaufen, weil andere es schon haben. Zusammen ergibt das die typische S-Kurve der Verbreitung.',fx:'Neue Käufer = (p + q × Anteil bisheriger Käufer) × verbleibender Markt\np = Innovationskoeffizient, q = Imitationskoeffizient',r:['lernkurve','skurve']},
 {k:'lernkurve',t:'Erfahrungskurve',f:'Experience Curve',de:'sinkende Stückkosten mit wachsender Menge',c:'Pricing',g:'bass',al:['Lernkurve','Lernkurveneffekt'],d:'Mit jeder Verdopplung der insgesamt produzierten Menge sinken die Stückkosten um einen festen Prozentsatz, oft 10 bis 30 %. Wer früh viel verkauft, wird günstiger als die Konkurrenz.',r:['bass','skimming']},
 {k:'skimming',t:'Abschöpfungsstrategie',f:'Price Skimming',de:'hoher Einführungspreis',c:'Pricing',g:'bass',al:['Skimming','Penetrationsstrategie','Penetrationspreis'],d:'Abschöpfung: hoher Einstiegspreis für zahlungsbereite Früh-Käufer, später Senkung. Penetration: niedriger Preis für schnelle Verbreitung und Kostenvorteile über die Erfahrungskurve. Welche Strategie passt, hängt von Konkurrenz, Kapazität und Kostenstruktur ab.',r:['lernkurve','elastizitaet']},
 {k:'cro',t:'Conversion-Optimierung',a:'CRO',f:'Conversion Rate Optimization',de:'systematische Verbesserung der Conversion',c:'Statistik & Tests',g:'funnel',al:['Funnel-Analyse','Drop-off'],d:'Systematisch herausfinden, wo und warum Besucher im Funnel abspringen, und das gezielt beheben: messen (Analytics, Segmente), verstehen (Nutzertests, Aufnahmen, Umfragen), priorisieren (Wirkung, Reichweite, Aufwand) und mit Tests absichern.',r:['abtest','messagematch','cr']},
 {k:'messagematch',t:'Message Match',de:'Anzeige und Landingpage sagen dasselbe',c:'Creative',g:'funnel',d:'Was die Anzeige verspricht, muss auf der Zielseite sofort sichtbar sein: gleiches Angebot, gleiche Worte, gleiches Bild. Fehlt das, springen Besucher ab, weil sie nicht finden, wofür sie geklickt haben.',r:['cro','headline']},
 {k:'batna',t:'BATNA',f:'Best Alternative to a Negotiated Agreement',de:'beste Alternative ohne Einigung',c:'Kommunikation',g:'nego',d:'Was du tust, wenn die Verhandlung scheitert. Je besser deine Alternative, desto stärker deine Position. Eine schwache Alternative verrät man besser nicht.',r:['zopa','anker']},
 {k:'zopa',t:'ZOPA',f:'Zone of Possible Agreement',de:'Einigungsbereich',c:'Kommunikation',g:'nego',al:['Einigungsbereich'],d:'Der Bereich zwischen der Untergrenze der einen und der Obergrenze der anderen Seite. Nur dort ist ein Deal möglich. Gute Verhandler:innen holen einen großen Teil dieses Bereichs auf ihre Seite und erweitern ihn durch Tauschgeschäfte.',r:['batna','anker']},
 {k:'wkz',t:'Werbekostenzuschuss',a:'WKZ',de:'Zahlung des Herstellers an den Handel',c:'Pricing',g:'nego',al:['Listungsgebühr'],d:'Hersteller zahlen dem Handel Geld für Werbung, Platzierung oder Prospekte, oft als Prozent vom Umsatz. Dazu kommen bei Neulistungen manchmal einmalige Listungsgebühren. Beides gehört in die Kalkulation wie die Händlermarge.',r:['marge','zopa']},
 {k:'nutzungsrechte',t:'Nutzungsrechte',f:'Usage Rights',de:'Recht, Inhalte weiterzuverwenden',c:'Recht & Ethik',g:'nego',d:'Bei Creator-Kooperationen das Recht der Marke, die Inhalte selbst zu nutzen, etwa als Anzeige. Wird meist nach Dauer, Kanälen und Regionen bezahlt. Ohne vereinbarte Nutzungsrechte darf die Marke Creator-Videos nicht einfach bewerben.',r:['influencer','ugc']},
 {k:'awareness',t:'Awareness-Stufen',f:'Stages of Awareness (Eugene Schwartz)',de:'Bewusstseinsstufen vor dem Kauf',c:'Strategie',g:'social',al:['Awareness-Treppe','Awareness','Unbewusst','Problembewusst','Lösungsbewusst','Produktbewusst','Kaufbereit','Kaufbereite','Problembewusste','Lösungsbewusste','Produktbewusste','Unbewusste'],d:'Modell aus Eugene Schwartz’ Buch „Breakthrough Advertising“ (1966): Menschen sind unbewusst, problembewusst, lösungsbewusst, produktbewusst oder kaufbereit. Jede Stufe braucht andere Botschaften. Je weiter vorne jemand steht, desto mehr Erklärung und Vertrauen braucht er vor einem Angebot.',ex:'Eine Person mit gereizter Haut, die noch nie über ihre Pflege nachgedacht hat, ist unbewusst. Sie reagiert auf ein überraschendes Video, nicht auf „−20 % auf das Starter-Set“.',r:['contentmix','funnel','socialproof']},
 {k:'contentmix',t:'Content-Mix',de:'Verteilung der Inhalte nach Zweck',c:'Strategie',g:'social',al:['Content-Pillar','Content-Pillars','Content-Säulen','Redaktionsplan'],d:'Die geplante Mischung aus Content-Typen über eine Woche oder einen Monat, oft in Content-Säulen (Pillars) gegliedert, zum Beispiel Wissen, Einblicke, Kund:innen, Angebot. Ein guter Mix bedient alle Awareness-Stufen und hält Angebote bei etwa 10 bis 20 %.',r:['awareness','herohubhelp']},
 {k:'herohubhelp',t:'Hero, Hub, Help',de:'Content-Modell nach Zweck und Häufigkeit',c:'Strategie',g:'social',d:'Ursprünglich ein YouTube-Modell: Hero-Content sind seltene große Aktionen für Reichweite, Hub-Content regelmäßige Formate, die Fans zurückholen, und Help-Content beantwortet konkrete Fragen und wird über die Suche gefunden.',r:['contentmix','evergreen']},
 {k:'saves',t:'Saves',f:'Gespeicherte Beiträge',de:'Speicherungen',c:'Kennzahlen',g:'social',al:['Speicherungen'],d:'Wie oft ein Beitrag gespeichert wurde. Signal für „nützlich, will ich wiederfinden“. Typisch für Anleitungen, Checklisten und Karussells. Plattformen werten Saves als starkes Qualitätssignal.',r:['shares','contentmix']},
 {k:'shares',t:'Shares',f:'Sends, Weiterleitungen',de:'Teilen',c:'Kennzahlen',g:'social',al:['Sends','Weiterleitungen'],d:'Wie oft ein Beitrag geteilt oder per Direktnachricht weitergeleitet wurde. Signal für „das muss jemand sehen“. Auf Instagram zählen Weiterleitungen zu den wichtigsten Signalen für Reichweite bei Nicht-Followern.',r:['saves','nonfollower']},
 {k:'nonfollower',t:'Nicht-Follower-Reichweite',de:'Reichweite über die eigenen Follower hinaus',c:'Kennzahlen',g:'social',al:['Nicht-Follower','Nicht-Followern'],d:'Anteil der Views von Menschen, die dir noch nicht folgen. Kurzvideo-Plattformen verteilen gute Inhalte stark an Nicht-Follower. Für Wachstum wichtig, für lokale Betriebe aber nur wertvoll, wenn die Menschen aus der Region kommen.',r:['shares','reichweite']},
 {k:'retentionrate',t:'Wiedergabedauer',f:'Watch Time, Retention',de:'wie lange Zuschauer dranbleiben',c:'Kennzahlen',g:'social',al:['Ø Wiedergabe','Watch Time','Wiedergabezeit'],d:'Durchschnittlich gesehener Anteil eines Videos. Eines der wichtigsten Signale auf TikTok, Instagram und YouTube. Kurze Videos erreichen leichter hohe Werte, lange Videos sammeln mehr absolute Wiedergabezeit.',r:['hookrate','holdrate']},
 {k:'evergreen',t:'Evergreen-Content',de:'langlebiger Inhalt',c:'Strategie',g:'social',al:['Evergreen'],d:'Inhalte, die über Monate gefunden werden, weil sie dauerhafte Fragen beantworten, etwa YouTube-Tutorials oder Suchanfragen. Kurzvideos verlieren meist nach Tagen an Reichweite, Langvideos können über die Suche lange nachwirken.',r:['herohubhelp','seo']},
 {k:'trendcontent',t:'Trend-Format',f:'Trend Sound, Trend Format',de:'aktuell virales Format oder Audio',c:'Creative',g:'social',al:['Trend-Sound','Trend-Formate','Trend-Video'],d:'Ein Format oder Sound, der gerade auf TikTok oder Instagram viral geht. Bringt kurzfristig zusätzliche Reichweite, wenn man schnell ist und es zur Marke passt. Ohne Bezug zur Marke entsteht Reichweite ohne Wirkung.',r:['nonfollower','creative']},
 {k:'repurposing',t:'Repurposing',de:'Inhalte mehrfach verwerten',c:'Creative',g:'social',d:'Einen Inhalt für mehrere Plattformen und Formate weiterverwenden, etwa ein YouTube-Langvideo in fünf Shorts und ein LinkedIn-Karussell zerlegen. Spart Zeit, funktioniert aber nur, wenn jede Version an Format und Logik der Plattform angepasst wird.',r:['evergreen','placement']},
 {k:'employerbranding',t:'Employer Branding',de:'Arbeitgebermarke',c:'Strategie',g:'social',d:'Alles, was ein Unternehmen als Arbeitgeber attraktiv und unterscheidbar macht. Auf Social Media wirken echte Einblicke und Stimmen von Mitarbeitenden und Azubis meist viel stärker als Stellenanzeigen.',r:['corporateinfluencer','awareness']},
 {k:'personalbranding',t:'Personal Branding',de:'Personenmarke',c:'Strategie',g:'social',al:['Personal Brand','Personal Brands'],d:'Eine Person wird selbst zur Marke, etwa Coaches, Gründer:innen oder Expert:innen. Menschen folgen Menschen: Persönliche Geschichten und Haltung bauen schneller Vertrauen auf als Unternehmensaccounts.',r:['corporateinfluencer','socialproof']},
 {k:'corporateinfluencer',t:'Corporate Influencer',de:'Mitarbeitende als Markenstimme',c:'Strategie',g:'social',d:'Mitarbeitende oder Führungskräfte, die auf ihren eigenen Profilen über ihre Arbeit sprechen. Besonders auf LinkedIn erreichen persönliche Profile meist deutlich mehr Menschen als Unternehmensseiten.',r:['personalbranding','employerbranding']},
 {k:'socialproof',t:'Social Proof',de:'soziale Bewährtheit',c:'Creative',g:'social',al:['Kundenstimme','Kundenstimmen'],d:'Menschen orientieren sich an anderen: Bewertungen, Kundenstimmen, Fallstudien, Nutzerzahlen. Besonders wirksam bei Produktbewussten, die dich kennen, aber noch zweifeln.',ex:'„Agentur Nordlicht spart 11 Stunden pro Monat“ überzeugt mehr als „Wir sparen dir Zeit“.',r:['awareness','ugc']},
 {k:'community',t:'Community-Management',de:'Pflege der Gemeinschaft',c:'Kommunikation',g:'social',al:['Community'],d:'Antworten auf Kommentare und Nachrichten, Q&As, Umfragen, Lives. Baut Nähe und Vertrauen auf, und Plattformen werten echte Gespräche unter Beiträgen als Qualitätssignal.',r:['socialproof','shitstorm']},
 {k:'hookrate',t:'Hook-Rate',f:'Thumbstop Ratio',de:'Anteil, der länger als 3 Sekunden schaut',c:'Kennzahlen',g:'meta',al:['Thumbstop','Thumbstop-Rate','Hook'],d:'Wie viele Menschen, die dein Video sehen, bleiben mindestens 3 Sekunden dran? Misst, ob der Anfang den Daumen stoppt. Meta weist die Kennzahl nicht direkt aus, man berechnet sie aus den 3-Sekunden-Videoaufrufen.',fx:'Hook-Rate = 3-Sekunden-Videoaufrufe ÷ Impressionen',ex:'100.000 Impressionen, 28.000 Aufrufe über 3 Sekunden → Hook-Rate 28 %. Ab etwa 25 bis 30 % gilt sie als gut.',tr:'Eine hohe Hook-Rate allein verkauft nichts. Clickbait-Hooks ohne Bezug zum Produkt holen die Falschen.',r:['holdrate','ctr','creative']},
 {k:'holdrate',t:'Hold-Rate',de:'Anteil, der nach dem Hook dranbleibt',c:'Kennzahlen',g:'meta',al:['ThruPlay','ThruPlays'],d:'Wie viele derjenigen, die die ersten 3 Sekunden geschaut haben, bleiben länger dran? Misst, ob die Mitte des Videos trägt.',fx:'Hold-Rate = ThruPlays (15 Sekunden oder ganz) ÷ 3-Sekunden-Aufrufe',ex:'28.000 schauen 3 Sekunden, 9.000 schauen 15 Sekunden → Hold-Rate 32 %.',r:['hookrate','creative']},
 {k:'lernphase',t:'Lernphase',f:'Learning Phase',de:'Einlernzeit des Algorithmus',c:'Media',g:'meta',al:['Lernphase eingeschränkt','Learning Limited'],d:'Nach dem Start oder einer größeren Änderung testet Meta, wem die Anzeigen gezeigt werden. Die Ergebnisse schwanken und sind oft teurer. Als Faustregel braucht eine Anzeigengruppe rund 50 Optimierungsereignisse (etwa Käufe) innerhalb von 7 Tagen, um die Lernphase zu verlassen. Schafft sie das nicht, steht dort „Lernphase eingeschränkt“.',ex:'10 Anzeigengruppen à 700 € pro Woche bei 30 € CPA: je etwa 23 Käufe. Alle bleiben eingeschränkt. Eine Gruppe mit 7.000 € schafft rund 230.',tr:'Zu viele kleine Anzeigengruppen teilen das Budget so auf, dass keine genug Daten bekommt.',r:['anzeigengruppe','advantage']},
 {k:'anzeigengruppe',t:'Anzeigengruppe',f:'Ad Set',de:'Ebene für Zielgruppe, Budget und Platzierung',c:'Media',g:'meta',d:'Meta hat drei Ebenen: Kampagne (Ziel), Anzeigengruppe (Zielgruppe, Budget, Platzierungen, Optimierung) und Anzeige (Creative). Weniger, dafür größere Anzeigengruppen geben dem Algorithmus mehr Daten.',r:['lernphase','broad']},
 {k:'cbo',t:'Kampagnenbudget',a:'CBO',f:'Campaign Budget Optimization, heute Advantage+ Kampagnenbudget',de:'Meta verteilt das Budget auf die Anzeigengruppen',c:'Media',g:'meta',al:['Advantage+ Kampagnenbudget'],d:'Du legst nur ein Gesamtbudget für die Kampagne fest. Meta verschiebt es laufend zu den Anzeigengruppen, die gerade die günstigsten Ergebnisse versprechen. Stark bei mehreren Gruppen, weil Geld automatisch dorthin fließt, wo es wirkt. Schwäche: Kleine oder neue Gruppen, etwa Retargeting, bekommen manchmal kaum etwas.',ex:'Gruppe „Schlaf“ liefert Käufe für 24 €, „Wellness“ für 41 €. Meta gibt „Schlaf“ den Großteil des Budgets.',r:['abo','anzeigengruppe','lernphase']},
 {k:'abo',t:'Anzeigengruppen-Budget',a:'ABO',f:'Ad Set Budget Optimization',de:'eigenes Budget je Anzeigengruppe',c:'Media',g:'meta',al:['Budget pro Anzeigengruppe'],d:'Jede Anzeigengruppe bekommt ein festes Budget, das du selbst setzt. Du hast volle Kontrolle, etwa um einen Test sicher zu finanzieren oder Retargeting ein Mindestbudget zu geben. Dafür musst du selbst umschichten: Gruppen mit gutem CPA hoch, schlechte runter, in Schritten von höchstens 20 bis 30 %, sonst startet die Lernphase neu.',r:['cbo','anzeigengruppe','retargeting']},
 {k:'advantage',t:'Advantage+',de:'Metas KI-Automatisierung',c:'Media',g:'meta',al:['Advantage+ Zielgruppe','Advantage+ Kampagne'],d:'Sammelbegriff für Metas automatisierte Funktionen: Zielgruppe, Platzierungen, Budgetverteilung und Creative-Varianten steuert der Algorithmus. Vollautomatische Advantage+-Kampagnen für Verkäufe bündeln Neukunden und Bestandskunden in einer Struktur.',tr:'Automatisierung ersetzt kein Denken: Sie optimiert auf das Signal und die Creatives, die du ihr gibst.',r:['broad','smartbidding','lernphase']},
 {k:'broad',t:'Broad Targeting',de:'offene Zielgruppe ohne Interessen',c:'Media',g:'meta',al:['Broad','Broad-Targeting'],d:'Nur Grundeinstellungen wie Land und Alter, keine Interessen. Der Algorithmus findet Käufer selbst, anhand von Kaufsignalen und daran, wer auf welches Creative reagiert. Funktioniert gut mit starken, vielfältigen Creatives und sauberem Tracking.',ex:'Ein Video über Schnarch-Partner findet andere Menschen als eines über Schichtarbeit, ohne dass du das als Interesse einstellst.',r:['andromeda','advantage','lookalike']},
 {k:'andromeda',t:'Andromeda',de:'Metas Anzeigenauswahl-System',c:'Analytics & KI',g:'meta',d:'Das KI-System, mit dem Meta seit Ende 2024 vorauswählt, welche Anzeigen für eine Person überhaupt in Frage kommen. Es kann deutlich mehr Anzeigen bewerten und belohnt Creatives, die sich wirklich unterscheiden. Deshalb zählen unterschiedliche Konzepte mehr als viele kleine Varianten desselben Motivs.',r:['broad','vielfalt','creative']},
 {k:'vielfalt',t:'Creative-Vielfalt',de:'Anzahl wirklich unterschiedlicher Konzepte',c:'Creative',g:'meta',al:['Creative-Diversität','Konzeptvielfalt','unterschiedliche Konzepte'],d:'Verschiedene Angles (Problem, Beweis, Demo, Angebot, Story), Formate (Video, Bild, Karussell) und Personen erreichen verschiedene Menschen. Eine andere Hintergrundfarbe ist kein neues Konzept.',ex:'5 Konzepte mit je 2 Varianten schlagen meist 1 Konzept mit 30 Varianten.',r:['andromeda','creativefatigue']},
 {k:'capi',t:'Conversions API',a:'CAPI',de:'serverseitige Datenübertragung an Meta',c:'Recht & Ethik',g:'meta',d:'Der Shop sendet Kaufereignisse direkt vom Server an Meta, zusätzlich zum Browser-Pixel. Gleicht Signalverluste durch Werbeblocker und Tracking-Schutz aus, damit der Algorithmus besser optimieren kann. Braucht wie das Pixel eine Einwilligung.',r:['pixel','dsgvo','firstparty']},
 {k:'pixel',t:'Meta-Pixel',f:'Meta Pixel',de:'Tracking-Code im Browser',c:'Recht & Ethik',g:'meta',al:['Pixel'],d:'Ein Code-Schnipsel auf der Website, der Aktionen wie „Kauf“ an Meta meldet. Wird durch Werbeblocker, Browser-Schutz und fehlende Einwilligungen teilweise blockiert.',r:['capi','cookies']},
 {k:'frequenz',t:'Frequenz',f:'Frequency',de:'durchschnittliche Kontakte pro Person',c:'Kennzahlen',g:'meta',fx:'Frequenz = Impressionen ÷ Reichweite',d:'Wie oft eine Person deine Anzeige im Schnitt gesehen hat. Steigt sie stark, sehen dieselben Menschen dieselbe Anzeige immer wieder.',tr:'Steigende Frequenz plus steigender CPA ist das typische Zeichen für Creative-Ermüdung.',r:['creativefatigue','reichweite']},
 {k:'creativefatigue',t:'Creative-Ermüdung',f:'Creative Fatigue',de:'Abnutzung einer Anzeige',c:'Creative',g:'meta',al:['Ermüdung','Creative Fatigue','Ad Fatigue'],d:'Je öfter eine Zielgruppe dieselbe Anzeige sieht, desto weniger reagiert sie: CTR sinkt, CPA steigt. Gegenmittel: regelmäßig neue Konzepte nachliefern, nicht nur Farben tauschen.',r:['frequenz','vielfalt']},
 {k:'ugc',t:'UGC',f:'User-Generated Content',de:'Inhalte im Stil echter Nutzer',c:'Creative',g:'meta',al:['UGC-Video','UGC-Stil','UGC-Look'],d:'Videos oder Bilder, die aussehen, als hätten echte Kund:innen sie gemacht: Handy, Gesicht, eigene Worte. Wirken im Feed oft natürlicher als Studio-Produktionen und sind günstiger, deshalb kann man mehr Konzepte testen.',tr:'Bezahlte Creator-Inhalte müssen als Werbung erkennbar sein und dürfen keine erfundenen Erfahrungen vortäuschen.',r:['creative','vielfalt']},
 {k:'placement',t:'Placement',de:'Werbeplatz',c:'Media',g:'meta',al:['Placements','Platzierungen','Reels','Stories'],d:'Wo eine Anzeige erscheint: Feed (am besten 4:5), Stories und Reels (9:16, Vollbild) und weitere Plätze. Hochformat nutzt den Bildschirm aus. Achte auf Safe Zones: Oben und unten überdecken Bedienelemente den Inhalt.',r:['ugc','creative']},
 {k:'karussell',t:'Karussell',f:'Carousel Ad',de:'Anzeige mit mehreren wischbaren Karten',c:'Creative',g:'meta',al:['Karussell-Anzeige','Karussells'],d:'Bis zu zehn Bilder oder Videos zum Durchwischen. Gut für mehrere Produkte, Schritt-für-Schritt-Erklärungen und Bewertungen, besonders bei Menschen, die die Marke schon kennen.',r:['retargeting','creative']},
 {k:'breakevencpa',t:'Break-even-CPA',de:'maximal tragbare Kosten pro Kauf',c:'Kennzahlen',g:'meta',d:'Der CPA, bei dem Werbung genau null Gewinn bringt: so hoch wie der Deckungsbeitrag einer Bestellung vor Werbekosten. Darunter verdienst du schon am ersten Kauf, darüber nur, wenn Wiederkäufe den Verlust ausgleichen.',fx:'Break-even-CPA = Deckungsbeitrag pro Bestellung',ex:'Lumo: 59 € Preis, 32 € Deckungsbeitrag → Break-even-CPA 32 €.',r:['cpa','clv','poas']},
 {k:'poas',t:'POAS',f:'Profit on Ad Spend',de:'Deckungsbeitrag pro Werbe-Euro',c:'Kennzahlen',g:'budget',d:'Misst, wie viel Deckungsbeitrag (nicht Umsatz) jeder ausgegebene Werbe-Euro zurückbringt. Ehrlicher als der ROAS, weil Produktkosten schon abgezogen sind. Ab einem POAS über 1,0 verdient die Werbung Geld.',fx:'POAS = Deckungsbeitrag ÷ Werbekosten',ex:'10.000 € Spend bringen 150 Conversions à 80 € Deckungsbeitrag = 12.000 €. POAS = 1,2: Jeder Euro bringt 1,20 € zurück, also 20 Cent Gewinn.',tr:'Ein hoher Durchschnitts-POAS sagt nichts über die nächsten Euros. Dafür brauchst du den Grenz-ROAS.',r:['roas','mroas','deckungsbeitrag','blended']},
 {k:'roas',t:'ROAS',f:'Return on Ad Spend',de:'Umsatz pro Werbe-Euro',c:'Kennzahlen',g:'budget',d:'Umsatz geteilt durch Werbekosten. Die gängigste Kennzahl im Performance Marketing, ignoriert aber Margen: Ein hoher ROAS kann trotzdem Verlust bedeuten.',fx:'ROAS = Umsatz ÷ Werbekosten',ex:'ROAS 4 bei 25 % Marge: 4 € Umsatz bringen 1 € Rohertrag pro Werbe-Euro. Das ist genau Break-even.',tr:'ROAS 9 bei Brand-Search klingt großartig, misst aber oft Käufe, die ohnehin passiert wären.',r:['poas','inkrementalitaet','brandsearch']},
 {k:'mroas',t:'Grenz-ROAS',a:'mROAS',f:'marginal Return on Ad Spend',de:'Rendite der nächsten Werbe-Euros',c:'Kennzahlen',g:'budget',al:['Grenz-POAS','marginaler ROAS'],d:'Was bringen die nächsten 1.000 € in einem Kanal zusätzlich? Wegen Sättigung sinkt dieser Wert mit jedem Euro. Optimal ist ein Budget-Mix, bei dem alle aktiven Kanäle denselben Grenzwert haben und dieser über dem Break-even liegt. Im Marktlabor wird er auf Basis des Deckungsbeitrags gerechnet.',fx:'mROAS ≈ (Ertrag bei x + 1.000 € − Ertrag bei x) ÷ 1.000 €',ex:'Search hat einen Durchschnitts-POAS von 3,0, aber die nächsten 1.000 € bringen nur 0,7. Jeder weitere Euro verliert Geld, obwohl der Kanal im Schnitt glänzt.',r:['grenzertrag','saettigung','mmm']},
 {k:'grenzertrag',t:'Grenzertrag',de:'Zusatzertrag der letzten Einheit',c:'Kennzahlen',g:'budget',al:['abnehmende Grenzerträge','abnehmenden Grenzerträgen'],d:'Der zusätzliche Ertrag, den eine weitere Einheit Input bringt, etwa weitere 1.000 € Budget. Bei fast allen Marketingkanälen sinkt er mit steigendem Einsatz.',ex:'Die ersten 10.000 € in Search bringen 200 Conversions, die nächsten 10.000 € nur 80, die dritten 30.',r:['mroas','saettigung']},
 {k:'saettigung',t:'Sättigung',f:'Saturation',de:'Abflachen der Wirkung',c:'Media',g:'budget',al:['Sättigungskurve','Antwortkurve','Response-Kurve'],d:'Ein Kanal erreicht irgendwann alle gut erreichbaren Menschen. Danach kostet jede zusätzliche Conversion mehr. Die Sättigungskurve zeigt den Ertrag abhängig vom Spend und flacht nach oben ab.',fx:'Hill-Funktion: Ertrag = a · xˢ ÷ (xˢ + hˢ)\nh = Spend bei halber Sättigung, s = Form der Kurve',r:['grenzertrag','skurve','mmm']},
 {k:'skurve',t:'S-Kurve',de:'Wirkung erst ab kritischer Masse',c:'Media',g:'budget',al:['kritische Masse','kritischer Masse','kritischen Masse'],d:'Manche Kanäle wie TV oder Influencer wirken erst ab einer Mindestintensität. Darunter verpufft das Geld, darüber steigt die Wirkung stark, bis die Sättigung einsetzt. Deshalb sind solche Kanäle oft „ganz oder gar nicht“.',ex:'Connected TV mit 5.000 € im Monat: kaum messbar. Mit 60.000 €: deutlicher Effekt.',r:['saettigung','ctv','influencer']},
 {k:'adstock',t:'Adstock',de:'Werbe-Nachhall',c:'Media',g:'budget',al:['Nachhall'],d:'Werbung wirkt über den Schaltzeitraum hinaus. Ein Teil der Wirkung lagert sich ein und klingt über Wochen ab. TV und Video haben langen Adstock, Search fast keinen.',fx:'Adstockₜ = Spendₜ + λ · Adstockₜ₋₁\nλ = Abklingrate zwischen 0 und 1',ex:'λ = 0,7: Ein TV-Flight mit 100.000 € wirkt im Folgemonat wie 70.000 €, danach wie 49.000 €.',tr:'Ohne Adstock wirken langsame Kanäle ineffizient und werden zu früh gestrichen.',r:['mmm','ctv']},
 {k:'mmm',t:'Marketing-Mix-Modelling',a:'MMM',f:'Marketing Mix Modeling',de:'statistische Wirkungsanalyse des Marketing-Mix',c:'Analytics & KI',g:'budget',al:['Marketing-Mix-Modell','KI-MMM','Bayes-MMM','MMM-Schätzung'],d:'Ein Regressionsmodell auf Zeitreihen (Spend je Kanal, Absatz, Saison, Preise), das schätzt, wie viel jeder Kanal beiträgt. Braucht keine Nutzerdaten oder Cookies und bildet Sättigung und Adstock ab. Moderne Varianten arbeiten bayesianisch und werden mit Experimenten kalibriert, zum Beispiel die Open-Source-Werkzeuge Meridian von Google und Robyn von Meta.',ex:'Aus zwei Jahren Wochendaten schätzt das MMM: TV trägt 18 % zum Absatz bei, mit einem Grenz-ROAS von 1,4.',tr:'Mit wenig Daten oder ohne Variation im Spend ist ein MMM unsicher. Kalibriere es mit Holdout-Tests.',r:['attribution','adstock','saettigung','holdout']},
 {k:'attribution',t:'Attribution',de:'Zuordnung des Erfolgs zu Werbekontakten',c:'Analytics & KI',g:'quiz',al:['Klick-Attribution','Multi-Touch-Attribution'],d:'Verteilt den Wert einer Conversion auf die Werbekontakte davor. Modelle: Last-Click, First-Click, linear, positionsbasiert, datengetrieben. Attribution beschreibt Kontakte, beweist aber keine Wirkung.',r:['lastclick','mmm','inkrementalitaet']},
 {k:'lastclick',t:'Last-Click-Attribution',de:'Letzter Klick bekommt alles',c:'Analytics & KI',g:'thron',al:['Last-Click','Last Click'],d:'Der letzte geklickte Kanal vor dem Kauf bekommt 100 % des Erfolgs. Bevorzugt Kanäle am Ende der Customer Journey (Brand-Search, Retargeting, E-Mail) und benachteiligt alles, was Nachfrage erst erzeugt.',tr:'Wenn Display laut Last-Click „nichts bringt“, heißt das nicht, dass es nichts bringt.',r:['attribution','funnel','holdout']},
 {k:'inkrementalitaet',t:'Inkrementalität',f:'Incrementality',de:'echter Zusatzeffekt',c:'Analytics & KI',g:'thron',al:['inkrementell','Zusatzeffekt'],d:'Der Teil eines Ergebnisses, der ohne die Maßnahme nicht passiert wäre. Die eigentliche Frage jeder Werbewirkung: Was hat die Kampagne zusätzlich bewirkt?',fx:'Inkrementelle Conversions = Conversions Testgruppe − Conversions Kontrollgruppe (auf gleiche Größe gerechnet)',ex:'Retargeting-Gruppe kauft zu 4,0 %, der Holdout ohne Retargeting zu 3,6 %. Nur 0,4 Prozentpunkte, also 10 % der zugeschriebenen Käufe, sind inkrementell.',r:['holdout','uplift','kausal']},
 {k:'holdout',t:'Holdout',de:'zurückgehaltene Kontrollgruppe',c:'Statistik & Tests',g:'thron',al:['Holdout-Gruppe','Holdout-Test','Kontrollgruppe'],d:'Eine zufällig ausgewählte Gruppe, die die Maßnahme bewusst nicht bekommt. Ihr Verhalten zeigt, was ohne Maßnahme passiert wäre. Der Goldstandard der Wirkungsmessung.',ex:'10 % der Kunden bekommen keine Rabatt-Mail. Kaufen sie fast genauso oft, war der Rabatt weitgehend verschenkt.',r:['geolift','inkrementalitaet','abtest']},
 {k:'geolift',t:'Geo-Lift-Test',de:'regionales Experiment',c:'Statistik & Tests',g:'quiz',al:['Geo-Lift','Geo-Holdout','Geo-Holdout-Test','Geo-Experiment'],d:'Experiment auf Regionsebene: In zufällig gewählten Regionen läuft eine Kampagne, in vergleichbaren Regionen nicht. Funktioniert ohne Nutzertracking und eignet sich für TV, Plakat oder ganze Kanäle.',ex:'TV läuft in 6 von 12 Regionen. Dort steigt der Absatz um 7 % gegenüber den Kontrollregionen. So groß ist der TV-Effekt.',r:['holdout','mmm']},
 {k:'kausal',t:'Kausalität',de:'Ursache-Wirkungs-Beziehung',c:'Statistik & Tests',g:'ab',al:['kausal','kausale','Korrelation'],d:'Korrelation heißt, zwei Dinge treten gemeinsam auf. Kausalität heißt, das eine verursacht das andere. Ob eine Kampagne wirkt, zeigen nur Experimente oder sorgfältige quasi-experimentelle Methoden.',ex:'Eisverkauf und Sonnenbrand korrelieren stark. Ursache für beides ist das Wetter.',r:['abtest','holdout']},
 {k:'abtest',t:'A/B-Test',f:'Split Test',de:'kontrolliertes Experiment',c:'Statistik & Tests',g:'ab',al:['A/B-Testing','Split-Test'],d:'Nutzer werden zufällig Variante A (Kontrolle) oder B (Änderung) zugeteilt. Weil sich nur die Variante unterscheidet, ist ein Unterschied im Ergebnis kausal.',tr:'Laufzeit und Stichprobe vorher festlegen, sonst droht Peeking.',r:['pwert','power','peeking','aatest']},
 {k:'aatest',t:'A/A-Test',de:'Test mit zwei identischen Varianten',c:'Statistik & Tests',g:'ab',d:'Beide Gruppen bekommen dieselbe Variante. Prüft, ob Test-Setup und Statistik sauber sind. Etwa 5 % aller A/A-Tests sind trotzdem „signifikant“, reiner Zufall.',r:['abtest','signifikanz']},
 {k:'pwert',t:'p-Wert',f:'p-value',de:'Überraschungsmaß unter der Nullhypothese',c:'Statistik & Tests',g:'ab',d:'Wie wahrscheinlich wären Daten mindestens so extrem wie die beobachteten, wenn es in Wahrheit keinen Effekt gäbe? Ein kleiner Wert (üblich: unter 0,05) heißt: Die Daten passen schlecht zu „kein Effekt“.',ex:'p = 0,03: Ohne echten Effekt sähe man so einen Unterschied nur in 3 % der Fälle.',tr:'Der p-Wert ist nicht die Wahrscheinlichkeit, dass B besser ist, und sagt nichts über die Größe des Effekts.',r:['signifikanz','konfidenz','power']},
 {k:'signifikanz',t:'Signifikanz',de:'statistische Bedeutsamkeit',c:'Statistik & Tests',g:'ab',al:['signifikant','Signifikanzniveau'],d:'Ein Ergebnis heißt statistisch signifikant, wenn der p-Wert unter einer vorher festgelegten Schwelle liegt, meist 5 %. Dann ist es unwahrscheinlich, dass der Unterschied reiner Zufall ist.',tr:'Signifikant heißt nicht relevant. Mit riesigen Stichproben werden auch winzige, wirtschaftlich bedeutungslose Effekte signifikant.',r:['pwert','power']},
 {k:'konfidenz',t:'Konfidenzintervall',f:'Confidence Interval (CI)',de:'Vertrauensbereich',c:'Statistik & Tests',g:'ab',al:['95 %-Konfidenzintervall'],d:'Bereich, in dem der wahre Effekt mit hoher Sicherheit liegt, meist 95 %. Breit bei wenig Daten, schmal bei vielen. Schließt es die Null ein, ist der Effekt nicht signifikant. In Statistik-Texten wird es oft „KI“ abgekürzt, nicht zu verwechseln mit künstlicher Intelligenz.',ex:'Lift +4 %, 95 %-Konfidenzintervall von −1 % bis +9 %: Der Effekt könnte auch null sein.',r:['pwert','stichprobe']},
 {k:'power',t:'Teststärke',a:'Power',f:'Statistical Power',de:'Trefferwahrscheinlichkeit eines Tests',c:'Statistik & Tests',g:'ab',al:['80 % Power'],d:'Wahrscheinlichkeit, einen tatsächlich vorhandenen Effekt bestimmter Größe auch als signifikant zu erkennen. Üblich sind 80 %. Zu kleine Tests haben wenig Power und übersehen echte Gewinner.',fx:'n je Variante ≈ (1,96 + 0,84)² · [p₁(1−p₁) + p₂(1−p₂)] ÷ (p₂ − p₁)²',ex:'Conversion Rate 3 %, erwarteter Lift +10 % (auf 3,3 %): rund 53.000 Besucher je Variante nötig.',r:['mde','stichprobe','abtest']},
 {k:'mde',t:'Minimal nachweisbarer Effekt',a:'MDE',f:'Minimum Detectable Effect',de:'kleinster erkennbarer Effekt',c:'Statistik & Tests',g:'ab',d:'Der kleinste Effekt, den ein Test mit gegebener Stichprobe und Power zuverlässig erkennen kann. Wird vor dem Test festgelegt und bestimmt die nötige Laufzeit.',r:['power','stichprobe']},
 {k:'stichprobe',t:'Stichprobe',f:'Sample',de:'beobachtete Teilmenge',c:'Statistik & Tests',g:'ab',al:['Stichprobengröße'],d:'Die Menge der beobachteten Fälle. Je größer, desto genauer die Schätzung. Die Unsicherheit sinkt mit der Wurzel der Stichprobengröße: Vierfache Datenmenge halbiert das Rauschen.',r:['power','konfidenz']},
 {k:'peeking',t:'Peeking',de:'vorzeitiges Hineinschauen',c:'Statistik & Tests',g:'ab',d:'Laufend auf die Testergebnisse schauen und stoppen, sobald p < 0,05 erscheint. Das erhöht die Fehlalarmquote massiv, bei täglichem Nachsehen leicht auf 20 bis 30 %.',tr:'Lösung: Laufzeit vorab festlegen oder sequentielle Testverfahren nutzen.',r:['sequentiell','aatest','pwert']},
 {k:'sequentiell',t:'Sequentielles Testen',f:'Sequential Testing',de:'Tests mit erlaubten Zwischenblicken',c:'Statistik & Tests',g:'ab',al:['sequentielle Testverfahren','sequentiellen Testverfahren','sequentielle Tests'],d:'Statistische Verfahren, die mehrfaches Hineinschauen während eines Tests erlauben, ohne die Fehlerquote aufzublähen. Die Lösung für das Peeking-Problem.',r:['peeking']},
 {k:'lift',t:'Lift',al:['Uplift'],de:'relative Verbesserung',c:'Statistik & Tests',g:'ab',d:'Die relative Verbesserung der Variante gegenüber der Kontrolle.',fx:'Lift = (CR_B − CR_A) ÷ CR_A',ex:'Conversion Rate A 3,0 %, B 3,3 % → Lift +10 %, Differenz 0,3 Prozentpunkte.',r:['pp','abtest']},
 {k:'pp',t:'Prozentpunkte',a:'pp',f:'percentage points',de:'absolute Differenz zweier Prozentwerte',c:'Statistik & Tests',g:'ab',al:['Prozentpunkt'],d:'Die absolute Differenz zwischen zwei Prozentwerten. Von 3 % auf 4 % sind +1 Prozentpunkt, aber +33 Prozent.',r:['lift']},
 {k:'hypothese',t:'Hypothese',de:'prüfbare Vermutung',c:'Statistik & Tests',g:'ab',d:'Eine prüfbare Vermutung mit erwarteter Wirkung und Begründung: „Wenn wir X ändern, steigt Y, weil Z.“ Grundlage jedes guten Tests.',r:['abtest']},
 {k:'bandit',t:'Multi-Armed-Bandit',de:'adaptives Testverfahren',c:'Analytics & KI',g:'quiz',al:['Multi-Armed Bandit','Bandit-Test','Bandit'],d:'Verschiebt während des Tests automatisch mehr Traffic zu den besser laufenden Varianten, etwa mit Thompson Sampling. Spart Lernkosten bei vielen Varianten, liefert aber weniger saubere Effektschätzungen als ein klassischer A/B-Test.',ex:'40 Creatives: Nach drei Tagen laufen 70 % des Budgets auf den fünf stärksten, die übrigen bekommen nur noch Test-Traffic.',r:['abtest','creative']},
 {k:'uplift',t:'Uplift-Modelling',de:'Wirkungsprognose pro Person',c:'Analytics & KI',g:'churn',al:['Uplift-Modell','Uplift-Modellen','Uplift-Modelling'],d:'Schätzt pro Person den zusätzlichen Effekt einer Maßnahme, nicht nur die Reaktionswahrscheinlichkeit. Teilt Kunden in vier Typen: Persuadables (umstimmbar), Sure Things (kaufen sowieso), Lost Causes (nie) und Sleeping Dogs (reagieren negativ auf Kontakt). Nur Persuadables lohnen sich.',ex:'Gutschein an alle: 1.000 Einlösungen, aber 700 hätten sowieso gekauft. Uplift-Targeting schreibt nur die an, die sich umstimmen lassen.',r:['inkrementalitaet','churn']},
 {k:'conversion',t:'Conversion',de:'Umwandlung in eine Zielhandlung',c:'Kennzahlen',g:'budget',al:['Konversion','Conv.'],d:'Eine gewünschte Handlung: Kauf, Anmeldung, Download, Lead. Was als Conversion zählt, legst du fest, und genau darauf optimieren Algorithmen dann.',r:['cr','cpa','cac']},
 {k:'cr',t:'Conversion Rate',a:'CR',de:'Umwandlungsquote',c:'Kennzahlen',g:'ab',al:['Conversion-Rate','Conv.-Rate','Konversionsrate','Kaufquote'],fx:'CR = Conversions ÷ Besucher (oder Klicks)',ex:'25.000 Besucher, 750 Käufe → Conversion Rate 3 %.',d:'Der Anteil der Besucher oder Klicks, der zur Conversion wird.',r:['conversion','lift']},
 {k:'ctr',t:'Klickrate',a:'CTR',f:'Click-Through-Rate',de:'Anteil der Klicks an den Einblendungen',c:'Kennzahlen',g:'arena',al:['CTR-Prognose'],d:'Wie oft eine Anzeige angeklickt wird, gemessen an ihren Einblendungen.',fx:'CTR = Klicks ÷ Impressionen',ex:'50.000 Impressionen, 600 Klicks → CTR 1,2 %.',tr:'Hohe CTR bei schlechter Conversion ist oft Clickbait (Goodharts Gesetz).',r:['impression','goodhart','benchmark']},
 {k:'cpc',t:'CPC',f:'Cost per Click',de:'Kosten pro Klick',c:'Kennzahlen',g:'budget',fx:'CPC = Werbekosten ÷ Klicks',d:'Was ein einzelner Klick auf eine Anzeige kostet. Typische Abrechnungsart in Search und vielen Social-Plattformen.',r:['ctr','cpm']},
 {k:'cpm',t:'CPM',f:'Cost per Mille',de:'Kosten pro 1.000 Impressionen',c:'Kennzahlen',g:'budget',al:['TKP','Tausenderkontaktpreis'],fx:'CPM = Werbekosten ÷ Impressionen × 1.000',d:'Preis für 1.000 Einblendungen einer Anzeige. Auf Deutsch auch TKP (Tausenderkontaktpreis). Typisch für Reichweitenkanäle wie Display, Video und TV.',r:['impression','reichweite']},
 {k:'cpa',t:'CPA',f:'Cost per Acquisition',de:'Kosten pro Abschluss',c:'Kennzahlen',g:'budget',fx:'CPA = Werbekosten ÷ Conversions',d:'Werbekosten pro Conversion. Ähnlich wie CAC, bezieht sich aber auf jede Conversion, nicht nur auf Neukunden.',r:['cac','conversion']},
 {k:'cac',t:'CAC',f:'Customer Acquisition Cost',de:'Kosten pro gewonnenem Neukunden',c:'Kennzahlen',g:'budget',d:'Was es kostet, einen neuen Kunden zu gewinnen, inklusive aller Marketingkosten.',fx:'CAC = Marketingkosten ÷ Neukunden',ex:'20.000 € Spend, 250 Neukunden → CAC 80 €.',tr:'CAC immer zusammen mit dem CLV betrachten: 80 € sind teuer bei 60 € Kundenwert und billig bei 400 €.',r:['clv','cpa']},
 {k:'clv',t:'Customer Lifetime Value',a:'CLV',f:'Customer Lifetime Value (auch LTV)',de:'Kundenwert über die gesamte Beziehung',c:'Kennzahlen',g:'churn',al:['Kundenwert','Predictive CLV','CLV-Analyse','LTV'],d:'Der gesamte Deckungsbeitrag, den ein Kunde über die Dauer der Beziehung bringt. Predictive CLV schätzt ihn per Machine Learning aus frühen Signalen, um Gebote und Service danach zu steuern.',fx:'CLV ≈ Marge pro Periode × Bindungsrate ÷ (1 + Zins − Bindungsrate)',ex:'15 € Marge im Monat, 90 % bleiben jeden Monat, 1 % Zins: CLV ≈ 15 × 0,9 ÷ 0,11 ≈ 123 €.',r:['cac','retention','churn']},
 {k:'deckungsbeitrag',t:'Deckungsbeitrag',a:'DB',la:false,f:'Contribution Margin',de:'Umsatz minus variable Kosten',c:'Kennzahlen',g:'budget',d:'Umsatz minus variable Kosten wie Ware, Versand und Zahlungsgebühren. Das Geld, das für Fixkosten und Werbung übrig bleibt, und damit die richtige Basis für Werbeentscheidungen.',ex:'Kopfhörer für 89 €, Stückkosten 42 € → Deckungsbeitrag 47 € pro Stück.',r:['marge','poas']},
 {k:'marge',t:'Marge',f:'Margin',de:'Gewinnspanne',c:'Pricing',g:'preis',d:'Was vom Preis nach Abzug der Kosten übrig bleibt. Im Spiel meist als Betrag pro Stück: Preis minus Stückkosten.',r:['deckungsbeitrag','elastizitaet']},
 {k:'blended',t:'Blended',de:'über alle Kanäle gemittelt',c:'Kennzahlen',g:'budget',al:['Blended POAS','Blended ROAS','Blended CAC'],d:'Über alle Kanäle hinweg gemittelt, statt pro Kanal zugeordnet. Robust gegen Attributionsfehler, verdeckt aber, welcher Kanal gut oder schlecht läuft.',fx:'Blended POAS = gesamter Deckungsbeitrag ÷ gesamter Spend',r:['poas','attribution']},
 {k:'kpi',t:'KPI',f:'Key Performance Indicator',de:'Schlüsselkennzahl',c:'Kennzahlen',g:'kompass',d:'Eine Kennzahl, an der Erfolg gemessen und gesteuert wird. Gute KPIs liegen nah am Geschäftsergebnis.',r:['goodhart']},
 {k:'churn',t:'Churn',de:'Kundenabwanderung',c:'Analytics & KI',g:'churn',al:['Abwanderung','Churn-Modell','Churn-Score','Churn-Prognose','Kündiger'],d:'Kunden, die kündigen oder nicht mehr kaufen. Churn-Modelle sagen per Machine Learning voraus, wer bald abwandert, damit man gezielt gegensteuern kann.',r:['churnrate','retention','uplift','precision']},
 {k:'churnrate',t:'Churn-Rate',de:'Kündigungsquote',c:'Kennzahlen',g:'churn',al:['Churn Rate','Kündigungsrate','Abwanderungsrate'],d:'Anteil der Kunden, die in einem Zeitraum verloren gehen.',fx:'Churn-Rate = verlorene Kunden ÷ Kunden zu Periodenbeginn',ex:'3.000 Abonnenten, 240 kündigen im Quartal → 8 % Churn, Bindungsrate 92 %.',r:['retention','clv']},
 {k:'retention',t:'Retention',de:'Kundenbindung',c:'Strategie',g:'markt',al:['Kundenbindung','Kundenbindungsrate','Bindungsrate'],d:'Der Anteil der Kunden, die bleiben, und alle Maßnahmen, die dafür sorgen. Bestandskunden zu halten ist meist deutlich günstiger, als neue zu gewinnen.',fx:'Bindungsrate = 1 − Churn-Rate',r:['churnrate','clv']},
 {k:'rettung',t:'Rettungsquote',f:'Save Rate',de:'Anteil erfolgreich gehaltener Kündiger',c:'Analytics & KI',g:'churn',d:'Anteil der angesprochenen Kündiger, die durch die Maßnahme tatsächlich bleiben. Bestimmt zusammen mit CLV und Kontaktkosten, ob sich eine Halte-Aktion lohnt.',r:['schwelle','churn']},
 {k:'precision',t:'Precision',de:'Treffergenauigkeit',c:'Analytics & KI',g:'churn',d:'Von allen, die das Modell als positiv markiert (zum Beispiel „kündigt“), wie viele sind es wirklich? Wichtig, wenn jede Maßnahme teuer ist.',fx:'Precision = TP ÷ (TP + FP)',ex:'Das Modell markiert 400 Kunden, 260 kündigen wirklich → Precision 65 %.',r:['recall','confusion','schwelle']},
 {k:'recall',t:'Recall',de:'Trefferquote, Sensitivität',c:'Analytics & KI',g:'churn',d:'Von allen echten Positiven (zum Beispiel tatsächlichen Kündigern), wie viele findet das Modell? Wichtig, wenn jeder verpasste Fall teuer ist, etwa bei sehr wertvollen Kunden.',fx:'Recall = TP ÷ (TP + FN)',ex:'300 Kunden kündigen, das Modell erwischt 240 → Recall 80 %.',tr:'Precision und Recall ziehen in entgegengesetzte Richtungen. Über die Schwelle entscheidest du, welcher Fehler dich weniger kostet.',r:['precision','confusion','schwelle']},
 {k:'accuracy',t:'Accuracy',de:'Anteil aller richtigen Vorhersagen',c:'Analytics & KI',g:'quiz',fx:'Accuracy = (TP + TN) ÷ alle Fälle',d:'Wie viele Vorhersagen insgesamt stimmen.',tr:'Bei seltenen Ereignissen irreführend: Bei 5 % Churn erreicht ein Modell, das nie Churn vorhersagt, 95 % Accuracy.',r:['precision','recall','auc']},
 {k:'auc',t:'AUC',f:'Area Under the ROC Curve',de:'Fläche unter der ROC-Kurve',c:'Analytics & KI',g:'churn',al:['Modell-AUC'],d:'Wie gut trennt ein Modell Positive von Negativen über alle Schwellen hinweg? 0,5 ist Zufall, 1,0 perfekt. Anschaulich: die Wahrscheinlichkeit, dass ein zufälliger Kündiger einen höheren Score hat als ein zufälliger Bleibender.',ex:'AUC 0,85: In 85 % aller Paare aus Kündiger und Bleibendem liegt der Kündiger vorn.',tr:'Die AUC sagt nicht, welche Schwelle profitabel ist. Das entscheidet die Kostenstruktur.',r:['schwelle','precision']},
 {k:'confusion',t:'Konfusionsmatrix',f:'Confusion Matrix',de:'Wahrheitstabelle eines Modells',c:'Analytics & KI',g:'churn',al:['Confusion Matrix','TP','FP','FN','TN','True Positive','False Positive','Fehlalarm'],d:'Vergleicht Modellvorhersagen mit der Wirklichkeit. TP (True Positive): richtig erkannt. FP (False Positive): Fehlalarm. FN (False Negative): übersehen. TN (True Negative): richtig verneint.',ex:'Im Churn-Radar ist ein FP ein Kunde, der ein Halte-Angebot bekommt, aber sowieso geblieben wäre. Kostet Geld ohne Nutzen.',r:['precision','recall']},
 {k:'schwelle',t:'Schwelle',f:'Threshold',de:'Entscheidungsgrenze',c:'Analytics & KI',g:'churn',al:['Schwellenwert','Entscheidungsschwelle'],d:'Ab welchem Modell-Score gilt ein Fall als positiv? Die Schwelle verwandelt eine Wahrscheinlichkeit in eine Entscheidung. Die beste Schwelle hängt von Kosten und Nutzen ab, nicht von der Statistik.',fx:'Kontakt lohnt, wenn P(Churn) × CLV × Rettungsquote > Kosten je Kontakt',ex:'CLV 220 €, Rettungsquote 30 %, Kosten 45 €: lohnt ab P(Churn) > 45 ÷ 66 ≈ 0,68.',r:['precision','recall','auc']},
 {k:'ml',t:'Machine Learning',a:'ML',de:'maschinelles Lernen',c:'Analytics & KI',g:'churn',al:['maschinelles Lernen','Machine-Learning-Modell'],d:'Verfahren, die Muster aus Daten lernen, statt fest programmierte Regeln zu befolgen. Im Marketing: Churn-Prognosen, Kundenwert, Gebotsoptimierung, Empfehlungen, Segmentierung.',r:['churn','clustering','smartbidding']},
 {k:'ki',t:'Künstliche Intelligenz',a:'KI',f:'Artificial Intelligence (AI)',de:'Künstliche Intelligenz',c:'Analytics & KI',g:'quiz',no:true,d:'Oberbegriff für Systeme, die Aufgaben lösen, für die sonst menschliche Intelligenz nötig ist: Sprache verstehen, Muster erkennen, Entscheidungen vorschlagen. Im Marketing heute vor allem Machine Learning und große Sprachmodelle.',r:['ml','llm']},
 {k:'llm',t:'LLM',f:'Large Language Model',de:'großes Sprachmodell',c:'Analytics & KI',g:'arena',al:['Sprachmodell','LLM-Texte'],d:'KI-Modell, das auf riesigen Textmengen trainiert wurde und Text versteht und erzeugt, etwa Claude. Im Marketing: Texte, Zusammenfassungen, Analysen, Chatbots, Recherche.',tr:'LLMs können plausibel klingende Falschaussagen erzeugen.',r:['halluzination','prompt','rag']},
 {k:'prompt',t:'Prompt',f:'Prompt',de:'Anweisung an ein KI-Modell',c:'Analytics & KI',g:'arena',al:['Prompt-Engineering','Prompting'],d:'Die Anweisung an ein KI-Modell. Ein guter Prompt ist ein gutes Briefing: Rolle, Ziel, Zielgruppe, Kontext, gewünschtes Format und Grenzen.',ex:'Schwach: „Schreib eine Anzeige für Hafermilch.“ Stark: Rolle, Zielgruppe, Kanal-Limits, drei Varianten, Tonalität und No-Gos.',r:['llm','halluzination']},
 {k:'halluzination',t:'Halluzination',f:'Hallucination',de:'erfundene KI-Aussage',c:'Analytics & KI',g:'quiz',al:['halluziniert','halluzinierte'],d:'Ein KI-Modell erfindet Fakten, Zahlen oder Quellen, die plausibel klingen, aber falsch sind. Im Marketing gefährlich bei Produktversprechen, Preisen und rechtlichen Aussagen.',r:['rag','llm']},
 {k:'rag',t:'RAG',f:'Retrieval-Augmented Generation',de:'Antworten mit Nachschlagen in geprüften Quellen',c:'Analytics & KI',g:'quiz',al:['Grounding'],d:'Die KI sucht vor der Antwort passende Informationen aus geprüften Quellen (Produktdatenbank, Handbuch) und stützt sich darauf. Reduziert Halluzinationen und hält Antworten aktuell.',r:['halluzination','llm']},
 {k:'smartbidding',t:'Smart Bidding',de:'KI-gesteuerte Gebotsabgabe',c:'Media',g:'thron',al:['KI-Bidding','Gebotsoptimierung','Gebotsstrategie'],d:'Werbeplattformen setzen per Machine Learning für jede Auktion ein eigenes Gebot, basierend auf vorhergesagter Conversion-Wahrscheinlichkeit und Wert. Die KI optimiert genau auf das Signal, das du ihr gibst.',tr:'Mit Umsatz als Ziel pusht sie margenschwache Produkte. Besser: Deckungsbeitrag oder Kundenwert übermitteln.',r:['goodhart','deckungsbeitrag']},
 {k:'lookalike',t:'Lookalike Audience',de:'statistische Zwillinge',c:'Media',g:'quiz',al:['Lookalike Audiences','Lookalikes','Lookalike','Seed-Liste'],d:'Die Werbeplattform sucht Menschen, die einer Ausgangsliste (Seed) ähneln. Die Qualität hängt fast nur vom Seed ab.',ex:'Seed aus den 1.000 Kunden mit dem höchsten CLV statt aus allen Newsletter-Abonnenten.',r:['clv','segment']},
 {k:'retargeting',t:'Retargeting',f:'auch Remarketing',de:'erneute Ansprache von Interessenten',c:'Media',g:'quiz',al:['Remarketing'],d:'Werbung an Menschen, die schon Kontakt hatten, zum Beispiel die Website besucht oder den Warenkorb abgebrochen haben. Sieht in der Attribution oft stark aus, weil diese Menschen ohnehin nah am Kauf sind.',r:['inkrementalitaet','lastclick']},
 {k:'brandsearch',t:'Brand-Search',de:'Suchanzeigen auf den eigenen Markennamen',c:'Media',g:'thron',al:['Brand Search','Markensuche','Brand-Keywords'],d:'Suchanzeigen, die erscheinen, wenn jemand nach deinem Markennamen sucht. Sehr hoher ROAS, aber viele dieser Klicks kämen auch über das kostenlose Suchergebnis.',tr:'Erst Inkrementalität messen, dann mehr Budget geben.',r:['roas','inkrementalitaet']},
 {k:'searchads',t:'Search Ads',a:'SEA',f:'Search Engine Advertising',de:'Suchmaschinenwerbung',c:'Media',g:'budget',al:['Search','Suchmaschinenwerbung','Suchanzeigen'],d:'Bezahlte Anzeigen in Suchmaschinen, ausgespielt nach Suchbegriff. Erreicht Menschen mit konkreter Kaufabsicht, sättigt aber früh, weil die Zahl relevanter Suchen begrenzt ist.',r:['brandsearch','cpc','seo']},
 {k:'paidsocial',t:'Paid Social',de:'bezahlte Social-Media-Werbung',c:'Media',g:'budget',d:'Bezahlte Werbung auf Plattformen wie Instagram, TikTok oder LinkedIn. Große Reichweite und feines Targeting. Die Leistung hängt stark vom Creative ab.',r:['creative','lookalike']},
 {k:'programmatic',t:'Programmatic',f:'Programmatic Advertising',de:'automatisierter Werbeeinkauf',c:'Media',g:'budget',al:['Programmatic Display','Display'],d:'Automatisierter Einkauf von Werbeplätzen (Banner, Video) in Echtzeit-Auktionen über viele Websites. Günstige Reichweite, aber oft schwache Aufmerksamkeit und abhängig von Tracking-Daten wie Cookies.',r:['cookies','cpm']},
 {k:'ctv',t:'Connected TV',a:'CTV',de:'vernetztes Fernsehen',c:'Media',g:'budget',d:'TV-Werbung über internetfähige Fernseher und Streaming-Dienste. Verbindet TV-Wirkung mit digitalem Targeting. Hohe Einstiegskosten, langer Nachhall.',r:['adstock','skurve']},
 {k:'crm',t:'CRM',f:'Customer Relationship Management',de:'Kundenbeziehungsmanagement',c:'Media',g:'budget',d:'Systeme und Maßnahmen für bestehende Kunden: E-Mail, Newsletter, Treueprogramme, Personalisierung. Sehr günstig pro Kontakt, aber auf die eigene Kundenbasis begrenzt.',r:['retention','firstparty']},
 {k:'influencer',t:'Influencer-Marketing',de:'Werbung über Personen mit Reichweite',c:'Media',g:'budget',al:['Influencer','Influencerin','Micro-Creator','Micro-Influencer','Creator'],d:'Werbung über Personen mit eigener Reichweite. Micro-Creator mit 10.000 bis 100.000 Followern haben oft deutlich höhere Engagement-Raten und Glaubwürdigkeit als Stars.',r:['engagement','skurve']},
 {k:'engagement',t:'Engagement-Rate',de:'Interaktionsrate',c:'Kennzahlen',g:'thron',al:['Engagement','Interaktionsrate'],d:'Wie stark ein Publikum mit Inhalten interagiert.',fx:'Engagement-Rate = Interaktionen (Likes, Kommentare, Shares) ÷ Follower oder Reichweite',ex:'2,1 Mio. Follower mit 0,4 % = 8.400 Interaktionen. Zehn Micro-Creator mit je 50.000 Followern und 5 % = 25.000.',r:['influencer']},
 {k:'impression',t:'Impression',de:'Einblendung',c:'Kennzahlen',g:'budget',al:['Impressionen','Impressions'],d:'Eine einzelne Einblendung einer Anzeige. Sagt nichts darüber, ob sie wirklich gesehen wurde.',r:['ctr','cpm','reichweite']},
 {k:'reichweite',t:'Reichweite',f:'Reach',de:'erreichte Personen',c:'Media',g:'budget',d:'Anzahl unterschiedlicher Personen, die eine Botschaft mindestens einmal gesehen haben. Zusammen mit der Frequenz (wie oft) bestimmt sie den Werbedruck.',r:['impression','cpm']},
 {k:'funnel',t:'Funnel',f:'Marketing Funnel',de:'Kaufentscheidungs-Trichter',c:'Strategie',g:'thron',al:['Upper Funnel','Upper-Funnel','Lower Funnel','Customer Journey','Marketing-Funnel'],d:'Modell der Kaufentscheidung von Aufmerksamkeit über Interesse bis zum Kauf. Upper-Funnel-Maßnahmen (TV, Video, Influencer) erzeugen Nachfrage, Lower-Funnel-Maßnahmen (Search, Retargeting) ernten sie.',r:['lastclick','brand']},
 {k:'performance',t:'Performance Marketing',de:'leistungsorientiertes Marketing',c:'Strategie',g:'budget',al:['Performance-Marketing','Performance'],d:'Werbung, die auf direkt messbare Reaktionen wie Klick, Kauf oder Lead optimiert ist und laufend nach Kennzahlen gesteuert wird.',r:['brand','roas']},
 {k:'brand',t:'Markenaufbau',f:'Brand Building',de:'langfristige Markenpflege',c:'Strategie',g:'markt',al:['Brand Marketing','Brand-Kampagnen','Brand-Kampagne','Markenwirkung'],d:'Investitionen in Bekanntheit und Image einer Marke. Wirkt langsam und langfristig, senkt später die Kosten pro Kunde und erhöht die Preisbereitschaft. Die Forschung von Binet und Field nennt als Faustregel etwa 60 % Marke und 40 % Aktivierung.',r:['performance','funnel','positionierung']},
 {k:'segment',t:'Segmentierung',de:'Aufteilung des Marktes in Gruppen',c:'Strategie',g:'markt',al:['Segment','Kundensegmentierung','Marktsegment'],d:'Aufteilung eines Marktes in Gruppen mit ähnlichen Bedürfnissen und Reaktionen. Gute Segmente sind groß genug, erreichbar und reagieren unterschiedlich auf Marketing. KI-Clustering findet Segmente in Verhaltensdaten.',r:['positionierung','clustering','persona']},
 {k:'positionierung',t:'Positionierung',f:'Positioning',de:'Platz der Marke im Kopf der Zielgruppe',c:'Strategie',g:'markt',d:'Wofür eine Marke in den Köpfen der Zielgruppe stehen soll, in Abgrenzung zum Wettbewerb. Eine klare Positionierung gewinnt ein Segment stark, statt alle ein bisschen.',r:['segment','brand']},
 {k:'conjoint',t:'Conjoint-Analyse',de:'Präferenzmessung über Auswahlentscheidungen',c:'Strategie',g:'markt',al:['Conjoint-Studie','Conjoint'],d:'Marktforschungsmethode: Befragte wählen zwischen Produktvarianten mit unterschiedlichen Merkmalen und Preisen. Daraus berechnet man, wie viel Nutzen jedes Merkmal stiftet und wie preissensibel einzelne Segmente sind.',r:['segment','elastizitaet']},
 {k:'marktanteil',t:'Marktanteil',f:'Market Share',de:'Anteil am Gesamtmarkt',c:'Strategie',g:'markt',d:'Anteil eines Anbieters am Gesamtabsatz oder -umsatz eines Marktes. Wachstum über Marktanteil ist teuer, wenn der Wettbewerb über Preise reagiert.',r:['spieltheorie']},
 {k:'spieltheorie',t:'Spieltheorie',f:'Game Theory',de:'Lehre strategischer Entscheidungen',c:'Strategie',g:'preis',d:'Analysiert Entscheidungen, deren Ergebnis vom Verhalten anderer abhängt. Klassiker im Marketing: der Preiskrieg als Gefangenendilemma. Beide wären mit hohen Preisen besser dran, aber jeder hat einen Anreiz zu senken.',r:['elastizitaet','marktanteil']},
 {k:'unternehmenswert',t:'Unternehmenswert',de:'Wert des Geschäfts',c:'Strategie',g:'markt',d:'Im Marktkampf: kumulierter Gewinn plus Wert der Kundenbasis (Kunden × Marge pro Monat × verbleibende Laufzeit). Spiegelt, dass Bestandskunden Kapital sind.',r:['clv','retention']},
 {k:'elastizitaet',t:'Preiselastizität',f:'Price Elasticity of Demand',de:'Preisempfindlichkeit der Nachfrage',c:'Pricing',g:'preis',al:['Elastizität','elastisch','Preissensibilität'],d:'Wie stark die Nachfrage auf eine Preisänderung reagiert.',fx:'Elastizität = prozentuale Mengenänderung ÷ prozentuale Preisänderung',ex:'Preis +10 %, Absatz −15 % → Elastizität −1,5. Elastisch: Eine Preiserhöhung senkt den Umsatz.',tr:'Echte Daten mischen den Preiseffekt mit Wettbewerb, Saison und Werbung. Ohne Variation im Preis lässt sich Elastizität gar nicht messen.',r:['referenzpreis','marge','spieltheorie']},
 {k:'referenzpreis',t:'Referenzpreis',f:'Reference Price',de:'innerer Vergleichspreis',c:'Pricing',g:'preis',d:'Der Preis, den Kunden im Kopf als „normal“ abgespeichert haben. Preise darüber fühlen sich als Verlust an, darunter als Gewinn. Häufige Rabatte senken ihn dauerhaft.',r:['verlustaversion','anker']},
 {k:'verlustaversion',t:'Verlustaversion',f:'Loss Aversion',de:'Verluste wiegen schwerer als Gewinne',c:'Pricing',g:'preis',d:'Verluste wiegen psychologisch etwa doppelt so schwer wie gleich große Gewinne (Kahneman und Tversky). Deshalb schadet eine Preiserhöhung stärker, als ein gleich großer Rabatt hilft.',r:['referenzpreis','anker']},
 {k:'anker',t:'Ankereffekt',f:'Anchoring',de:'erste Zahl prägt das Urteil',c:'Pricing',g:'preis',al:['Streichpreis','Anker'],d:'Die erste gesehene Zahl prägt die Bewertung aller folgenden. Ein durchgestrichener Originalpreis lässt den aktuellen Preis günstiger wirken.',tr:'In Deutschland muss ein Streichpreis bei Preisermäßigungen der niedrigste Preis der letzten 30 Tage sein (Preisangabenverordnung).',r:['referenzpreis','verlustaversion']},
 {k:'personalpreis',t:'Personalisierte Preise',de:'Preise je Kunde',c:'Pricing',g:'thron',al:['personalisierte Preise','Preisdifferenzierung'],d:'Unterschiedliche Preise für unterschiedliche Kunden auf Basis ihrer Daten. In der EU muss auf personalisierte Preise hingewiesen werden. Fliegt es auf, leidet das Vertrauen massiv.',r:['dsgvo']},
 {k:'treue',t:'Treueprogramm',f:'Loyalty Program',de:'Kundenbindungsprogramm',c:'Strategie',g:'thron',al:['Loyalty-Programm','Loyalty'],d:'Belohnt wiederholte Käufe mit Punkten, Rabatten oder Vorteilen. Lohnt sich, wenn Mitglieder mehr zusätzlichen Deckungsbeitrag bringen, als das Programm kostet.',r:['retention','clv']},
 {k:'cookies',t:'Third-Party-Cookies',de:'Cookies fremder Anbieter',c:'Recht & Ethik',g:'budget',al:['Third-Party-Cookie','Drittanbieter-Cookies','Cookies','Cookie-Aus'],d:'Cookies, die von fremden Domains wie Werbenetzwerken gesetzt werden, um Nutzer über viele Websites hinweg zu verfolgen. Safari und Firefox blockieren sie standardmäßig, Einwilligungspflichten schränken sie weiter ein. Targeting und Messung verlagern sich auf First-Party-Daten, Kontext und Modelle wie MMM.',r:['firstparty','mmm','dsgvo']},
 {k:'firstparty',t:'First-Party-Daten',f:'First-Party Data',de:'eigene Kundendaten',c:'Recht & Ethik',g:'markt',al:['First-Party-Data'],d:'Daten, die ein Unternehmen direkt von seinen Kunden erhebt, etwa Käufe, Logins oder Newsletter-Klicks. Wertvoller und rechtlich besser beherrschbar als zugekaufte Daten.',r:['cookies','crm']},
 {k:'dsgvo',t:'DSGVO',f:'Datenschutz-Grundverordnung (englisch: GDPR)',de:'EU-Datenschutzgesetz',c:'Recht & Ethik',g:'thron',al:['Datenschutz-Grundverordnung','GDPR','DSGVO-Verstoß'],d:'EU-Gesetz zum Schutz personenbezogener Daten. Jede Verarbeitung braucht eine Rechtsgrundlage, etwa Einwilligung, Vertrag oder berechtigtes Interesse. Verstöße können bis zu 20 Mio. € oder 4 % des weltweiten Jahresumsatzes kosten.',tr:'Gehashte E-Mail-Adressen sind nur pseudonymisiert, nicht anonym, und fallen weiter unter die DSGVO.',r:['avv','aiact','cookies']},
 {k:'avv',t:'Auftragsverarbeitungsvertrag',a:'AVV',f:'Data Processing Agreement (DPA)',de:'Datenschutzvertrag mit Dienstleistern',c:'Recht & Ethik',g:'thron',al:['AV-Vertrag'],d:'Vertrag nach Art. 28 DSGVO, wenn ein Dienstleister personenbezogene Daten in deinem Auftrag verarbeitet, etwa ein KI-Tool, ein Newsletter-Anbieter oder ein Cloud-Dienst. Ohne ihn darfst du Kundendaten dort nicht verarbeiten lassen.',r:['dsgvo']},
 {k:'aiact',t:'EU AI Act',de:'KI-Verordnung der EU',c:'Recht & Ethik',g:'thron',al:['AI Act','KI-Verordnung'],d:'EU-Verordnung über künstliche Intelligenz, deren Pflichten seit 2025 gestaffelt gelten. Sie stuft KI-Systeme nach Risiko ein. Für Marketing besonders relevant sind Transparenzpflichten: Menschen müssen erfahren, wenn sie mit einer KI sprechen, und Deepfakes müssen gekennzeichnet sein.',r:['deepfake','dsgvo']},
 {k:'deepfake',t:'Deepfake',de:'täuschend echte KI-Fälschung',c:'Recht & Ethik',g:'krise',al:['KI-Avatare','KI-Avatar'],d:'KI-erzeugte oder manipulierte Bilder, Videos oder Stimmen, die echt wirken. Nach dem EU AI Act müssen sie gekennzeichnet werden.',r:['aiact']},
