   const f=Math.floor(t*4);pxPerson(c,96,66,{cloth:'#6A4A30',work:1,beard:'#5A3A20'},f);if(f%2){for(let i=0;i<6;i++)pxR(c,'#F8C040',118+pxHash(i+f)*16,32-pxHash(i*3+f)*10,1,1)}pxTorch(c,40,24,t);pxTorch(c,210,24,t);pxPerson(c,160,66,{cloth:'#2A3A6A',hat:'hood',robe:1},f)}},
 kompass:{era:'ren',lab:'Auf großer Fahrt, 1520',draw(c,t){pxSky(c,['#3A78C8','#6AA0E0','#A8D0F0'],44);pxCloud(c,40-t*5,6,1);pxCloud(c,180-t*5,14,1);pxWater(c,46,t,'#1E5898');const b=Math.sin(t*2)*2;pxShip(c,110,52+b,'#F0EADA',0);pxR(c,'#3A2010',95,50+b,40,6);pxR(c,'#5A3010',97,50+b,36,2)}},
 saves:{era:'med',lab:'Speicherkristall',draw(c,t){pxR(c,'#14102A',0,0,PXW,PXH);pxStars(c,t,30);pxR(c,'#2A2440',0,56,PXW,16);const g=0.5+0.5*Math.sin(t*3),x=120,y=14;c.fillStyle=`rgba(120,220,255,${0.12+0.12*g})`;c.beginPath();c.arc(x+8,y+20,26,0,7);c.fill();
   c.fillStyle='#78D8F8';c.beginPath();c.moveTo(x+8,y);c.lineTo(x+16,y+20);c.lineTo(x+8,y+40);c.lineTo(x,y+20);c.fill();c.fillStyle='#C8F0FF';c.beginPath();c.moveTo(x+8,y+2);c.lineTo(x+12,y+20);c.lineTo(x+8,y+36);c.fill();for(let i=0;i<6;i++){const ph=(t*0.5+i/6)%1;pxR(c,'#C8F0FF',x-10+pxHash(i)*36,y+40-ph*40,1,2)}}}};
const PXMAP={budget:'budget',ab:'ab',churn:'churn',arena:'arena',quiz:'quiz',mentor:'mentor',thron:'thron',preis:'preis',krise:'krise',markt:'markt',meta:'meta',social:'social',tycoon:'tycoon',agency:'agency',bass:'bass',funnel:'funnel',attr:'attr',nego:'nego',exam:'exam',kompass:'kompass',akademie:'akademie',lesson:'lesson',lexikon:'lexikon',saves:'saves'};
const PXPORT={rome:{hat:'laurel',cloth:'#F0F0E8'},egypt:{hat:'nemes',cloth:'#F0F0E0'},med:{hat:'hood',cloth:'#6A4A30',robe:1},ren:{hat:'beret',cloth:'#3A2A5A',beard:'#E0E0E0'},ind:{hat:'tophat',cloth:'#3A3A48',beard:'#5A4030'},twen:{hat:'fedora',cloth:'#5A5A70'},now:{hat:'cap',cloth:'#40B080'},mix:{hat:'cap',cloth:'#E04848'}};
function pxPortrait(c,t){const sc=PXS[PXMAP[current]]||PXS.home,o=PXPORT[sc.era]||PXPORT.mix;pxR(c,'#2C3E9A',0,0,32,32);pxR(c,'#3A50B8',0,0,32,10);c.save();c.scale(2,2);pxPerson(c,4,17,Object.assign({bob:1},o),Math.floor(t*2));c.restore()}
function pxBanner(key){const s=PXS[key];if(!s)return'';return `<div class="pxban"><canvas class="pxs" data-scene="${key}" width="${PXW}" height="${PXH}" aria-hidden="true"></canvas><span class="pxera">${esc(PXERA[s.era]||'')} · ${esc(s.lab)}</span></div>`}
/* Laufzeit */
const PXRT={vis:new Set(),hov:new Set(),last:0};
const fxLevel=()=>{const v=P.fx&&P.fx.level;if(v)return v;try{return matchMedia('(prefers-reduced-motion: reduce)').matches?'calm':'full'}catch(e){return'full'}};
const pxIO=('IntersectionObserver' in window)?new IntersectionObserver(es=>es.forEach(e=>{e.isIntersecting?PXRT.vis.add(e.target):PXRT.vis.delete(e.target)})):null;
function pxDraw(cv,t){const key=cv.dataset.scene;const c=cv.getContext('2d');c.imageSmoothingEnabled=false;try{if(key==='portrait')pxPortrait(c,t);else{const s=PXS[key];if(s)s.draw(c,t)}}catch(e){}}
function pxMount(root){(root||document).querySelectorAll('canvas.pxs:not([data-m])').forEach(cv=>{cv.dataset.m='1';pxDraw(cv,1.3);if(pxIO&&!cv.dataset.static)pxIO.observe(cv);if(cv.dataset.static){const card=cv.closest('.mod');if(card){card.addEventListener('pointerenter',()=>PXRT.hov.add(cv));card.addEventListener('pointerleave',()=>{PXRT.hov.delete(cv);pxDraw(cv,1.3)})}}})}
function pxLoop(ts){requestAnimationFrame(pxLoop);if(document.hidden||fxLevel()!=='full')return;if(ts-PXRT.last<83)return;PXRT.last=ts;const t=ts/1000;
  PXRT.vis.forEach(cv=>{if(!cv.isConnected){PXRT.vis.delete(cv);return}pxDraw(cv,t)});PXRT.hov.forEach(cv=>{if(!cv.isConnected){PXRT.hov.delete(cv);return}pxDraw(cv,t)})}

/* ========== EFFEKTE & SOUND ========== */
const SFX={ctx:null,on(){return!(P.fx&&P.fx.mute)},
  ac(){if(!this.ctx){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});return this.ctx},
  tone(f,d,type,vol,when){const a=this.ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+(when||0);o.type=type||'square';o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(vol||0.05,t0);g.gain.exponentialRampToValueAtTime(0.0008,t0+d);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d+0.02)},
  seq(notes,type,vol,step){if(!this.on())return;notes.forEach((f,i)=>{if(f)this.tone(f,(step||0.07)*1.6,type,vol,i*(step||0.07))})},
  coin(){this.seq([988,1319],'square',0.045,0.06)},up(){this.seq([523,659,784,1047],'square',0.04,0.06)},down(){this.seq([392,311,247,196],'triangle',0.08,0.09)},
  levelup(){this.seq([523,523,523,659,784,0,659,784,1047],'square',0.045,0.08)},chest(){this.seq([392,494,587,784,988,1175],'square',0.04,0.06)},
  blip(){this.seq([1568],'square',0.02,0.03)},wrong(){this.seq([220,185],'sawtooth',0.035,0.1)}};
const FX={
  layer(){let l=$('#fxLayer');if(!l){l=document.createElement('div');l.id='fxLayer';l.setAttribute('aria-hidden','true');document.body.appendChild(l)}return l},
  pt(el){if(el&&el.getBoundingClientRect){const r=el.getBoundingClientRect();if(r.width)return[r.left+r.width/2,r.top+r.height/2]}return[innerWidth/2,innerHeight*0.38]},
  float(text,kind,el){if(fxLevel()==='off')return;const [x,y]=this.pt(el);const d=document.createElement('div');d.className='fxf '+(kind||'gain')+(fxLevel()==='full'?'':' calm');d.textContent=text;const n=this.layer().querySelectorAll('.fxf').length;d.style.left=(x+(n?(n%2?24:-24):0))+'px';d.style.top=(y-n*30)+'px';this.layer().appendChild(d);setTimeout(()=>d.remove(),1300)},
  coins(n,el){if(fxLevel()!=='full')return;const [x,y]=this.pt(el);const L=this.layer();for(let i=0;i<Math.min(n,14);i++){const d=document.createElement('i');d.className='fxc';d.style.left=x+'px';d.style.top=y+'px';d.style.setProperty('--dx',(Math.random()*160-80)+'px');d.style.setProperty('--dy',(-60-Math.random()*90)+'px');d.style.animationDelay=(i*25)+'ms';L.appendChild(d);setTimeout(()=>d.remove(),1200)}},
  flash(kind){if(fxLevel()==='off')return;const d=document.createElement('div');d.className='fxflash '+kind;this.layer().appendChild(d);setTimeout(()=>d.remove(),600)},
  shake(){if(fxLevel()!=='full')return;const v=$('#view');v.classList.remove('shake');void v.offsetWidth;v.classList.add('shake');setTimeout(()=>v.classList.remove('shake'),420)},
  banner(title,sub,kind,art){if(fxLevel()==='off'){toast(title+(sub?' · '+sub:''));return}const d=document.createElement('div');d.className='fxban '+(kind||'');d.innerHTML=`${art?`<canvas class="pxs" data-scene="${art}" width="${PXW}" height="${PXH}"></canvas>`:''}<b>${esc(title)}</b>${sub?`<span>${esc(sub)}</span>`:''}`;this.layer().appendChild(d);pxMount(d);d.querySelectorAll('canvas').forEach(cv=>PXRT.hov.add(cv));setTimeout(()=>{d.classList.add('out');setTimeout(()=>{d.querySelectorAll('canvas').forEach(cv=>PXRT.hov.delete(cv));d.remove()},400)},1900)},
  gain(amount,label,el){this.float('+'+label,'gain',el);this.coins(6+Math.min(8,Math.round(Math.log10(Math.max(10,Math.abs(amount))))),el);this.flash('good');SFX.coin()},
  loss(label,el,big){this.float('−'+label,'loss',el);this.flash('bad');if(big)this.shake();SFX.down()},
  result(delta,fmt,el){if(delta>0)this.gain(delta,fmt(Math.abs(delta)),el);else if(delta<0)this.loss(fmt(Math.abs(delta)),el)},
  right(el){this.float('Richtig!','gain',el);this.coins(5,el);SFX.up()},wrong(el){this.float('Daneben','loss',el);this.shake();SFX.wrong()}};
/* Zahlen hochzählen + spürbare Ergebnisse */
const CNT={prev:new Map(),view:null,first:true,vseen:new Set()};
const CNT_FLOW=/^(Gewinn( (Woche|Monat|Quartal))?|Deckungsbeitrag − Spend|Veränderung)$/,CNT_STOCK=/^(Kasse|Gewinn (gesamt|kumuliert)|Unternehmenswert|Punkte diesen Sprint|Follower gesamt|Neue Follower|Kund:innen gesamt|Kundenbasis|Marktanteil|Honorare pro Monat)$/;
function cntParse(s){const m=String(s).trim().match(/^([−-]?)([\d.]+)(?:,(\d+))?\s*(.*)$/);if(!m)return null;const v=parseFloat(m[2].replace(/\./g,'')+(m[3]?'.'+m[3]:''))*(m[1]?-1:1);return{v,dec:m[3]?m[3].length:0,unit:m[4]}}
function cntRun(){const key=current;if(CNT.view!==key){CNT.prev.clear();CNT.vseen.clear();CNT.view=key;CNT.first=true}const lvl=fxLevel();let ev=null;const occ={};
  $$('#view .kpi').forEach(k=>{const lab=k.querySelector('.k'),val=k.querySelector('.v');if(!lab||!val||val.dataset.cnt)return;const name=lab.textContent.trim();occ[name]=(occ[name]||0)+1;const id=name+'#'+occ[name];const txt=val.textContent.trim(),cur=cntParse(txt),old=CNT.prev.get(id);CNT.prev.set(id,txt);val.dataset.cnt='1';
    if(!old||old===txt||!cur)return;const o=cntParse(old);if(!o||o.unit!==cur.unit||o.dec!==cur.dec)return;const up=cur.v>o.v;val.classList.add(up?'cnt-up':'cnt-down');setTimeout(()=>val.classList.remove('cnt-up','cnt-down'),900);
    const fmt=v=>(v<0?'−':'')+de(Math.abs(v),cur.dec)+(cur.unit?' '+cur.unit:'');
    if(!ev){if(CNT_FLOW.test(name))ev={d:cur.v,txt:fmt(Math.abs(cur.v)),el:val,big:cur.v<0&&o.v>=0};else if(CNT_STOCK.test(name)&&cur.v!==o.v)ev={d:cur.v-o.v,txt:fmt(Math.abs(cur.v-o.v)),el:val,big:Math.abs(cur.v-o.v)>Math.abs(o.v)*0.12}}
    if(lvl==='off')return;const t0=performance.now(),dur=650;
    const step=n=>{const p=Math.min(1,(n-t0)/dur),e=1-Math.pow(1-p,3);val.textContent=fmt(o.v+(cur.v-o.v)*e);if(p<1&&val.isConnected)requestAnimationFrame(step);else val.textContent=txt};requestAnimationFrame(step)});
  let vd=null;$$('#view .verdict').forEach(v=>{const sig=v.className+'|'+v.textContent.trim().slice(0,80);if(CNT.vseen.has(sig))return;CNT.vseen.add(sig);if(!CNT.first&&!vd)vd=v});
  CNT.first=false;
  if(vd){if(vd.classList.contains('ok'))FX.right(vd);else if(vd.classList.contains('mid')){FX.float('Okay','mid',vd);SFX.blip()}else FX.wrong(vd)}
  else if(ev){if(ev.d>0)FX.gain(ev.d,ev.txt,ev.el);else if(ev.d<0)FX.loss(ev.txt,ev.el,ev.big)}}
/* Einstellungen */
function fxSettingsHtml(){const l=fxLevel(),m=P.fx&&P.fx.mute;return `<div class="fxset" id="fxSet" hidden><b>Effekte</b><div class="seg">${[['full','Voll'],['calm','Dezent'],['off','Aus']].map(([k,n])=>`<button data-fxl="${k}" class="${l===k?'on':''}">${n}</button>`).join('')}</div><b>Ton</b><div class="seg"><button data-fxm="0" class="${m?'':'on'}">An</button><button data-fxm="1" class="${m?'on':''}">Aus</button></div><span class="note">Dezent: keine Bewegung im Hintergrund, kein Wackeln. Zahlen und Rückmeldungen bleiben.</span></div>`}
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('[data-fxl],[data-fxm]');if(!t)return;if(!P.fx)P.fx={};if(t.dataset.fxl)P.fx.level=t.dataset.fxl;if(t.dataset.fxm)P.fx.mute=t.dataset.fxm==='1';save();const s=$('#fxSet');if(s){s.outerHTML=fxSettingsHtml();$('#fxSet').hidden=false}SFX.blip()});
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button.btn.primary,button.opt,.mod');if(b&&!b.disabled)SFX.blip()},true);


function pxThumbs(){if(current!=='home')return;$$('#view .mod[data-go]').forEach(m=>{if(m.querySelector('.pxthumb'))return;const k=PXMAP[m.dataset.go];if(!k||!PXS[k])return;m.insertAdjacentHTML('afterbegin',`<canvas class="pxs pxthumb" data-scene="${k}" data-static="1" width="${PXW}" height="${PXH}" aria-hidden="true"></canvas>`)})}
let pxPend=false;function pxAfter(){if(pxPend)return;pxPend=true;requestAnimationFrame(()=>{pxPend=false;try{const v=$('#view');if(PXMAP[current]&&current!=='home'&&v.firstElementChild&&!v.querySelector('.pxban'))v.insertAdjacentHTML('afterbegin',pxBanner(PXMAP[current]));pxThumbs();pxMount($('#view'));cntRun()}catch(e){console.error(e)}})}

const GAMES=Object.assign({},GNAME,{kompass:'Kompetenz-Kompass'});
svLoadLocal();if(!P.fx)P.fx={};$('#fxSetWrap').innerHTML=fxSettingsHtml();new MutationObserver(pxAfter).observe($('#view'),{childList:true,subtree:true});startLinking();renderTop();home();svBadge();pxAfter();requestAnimationFrame(pxLoop);
$('#fxBtn').addEventListener('click',e=>{e.stopPropagation();const s=$('#fxSet');s.hidden=!s.hidden;$('#fxBtn').setAttribute('aria-expanded',String(!s.hidden))});document.addEventListener('click',e=>{const s=$('#fxSet');if(s&&!s.hidden&&e.target.isConnected&&!e.target.closest('#fxSet,#fxBtn'))s.hidden=true});
new MutationObserver(()=>svSchedule()).observe($('#view'),{childList:true,subtree:true});
