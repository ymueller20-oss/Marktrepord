function glClose(){if(GLS.ctl){GLS.ctl.abort();GLS.ctl=null}$('#glBack').hidden=true;document.body.style.overflow='';const f=GLS.from;GLS.from=null;if(f&&document.contains(f))f.focus()}
async function glDeep(e){if(!AI.fn)return;const box=$('#glAiBox'),out=$('#glAi'),btn=$('#glDeep');box.hidden=false;btn.disabled=true;out.innerHTML='<span class="thinking">Claude erklärt</span>';
  GLS.ctl=new AbortController();
  const prompt=`Erkläre den Marketing-Fachbegriff „${e.t}“${e.a?` (Abkürzung ${e.a}${e.f?', ausgeschrieben '+e.f:''})`:''} für eine lernende Person auf Level „${level().name}“. Die Basisdefinition kennt sie schon: „${e.d}“
Schreibe auf Deutsch, höchstens 150 Wörter, ohne Markdown-Überschriften, in vier kurzen Absätzen:
1) Die Intuition in einem Satz, mit einem Vergleich aus dem Alltag.
2) Ein neues, konkretes Rechen- oder Praxisbeispiel mit Zahlen${e.ex?' (nicht dieses: '+e.ex+')':''}.
3) Wie KI diesen Begriff in der Marketing-Praxis nutzt oder verändert.
4) Eine typische Frage aus einem Bewerbungsgespräch dazu, ohne Lösung.`;
  try{await AI.fn(prompt,{signal:GLS.ctl.signal,onText:({text})=>{out.textContent=text}})}
  catch(err){if(err&&err.code!=='cancelled')out.textContent=((err&&err.text)||'')+(err&&err.text?'\n\n':'')+aiErrText(err)}
  GLS.ctl=null;if(btn)btn.disabled=false}
async function glLookup(q){q=q.trim();if(!q||!AI.fn)return;const k='x_'+q.toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'_');
  if(P.gx[k]){glOpen(k);return}
  LX.busy=true;LX.err='';viewLexikon();
  const prompt=`Erkläre den Fachbegriff „${q}“ im Kontext von Marketing, Analytics oder KI für eine lernende Person. Falls es eine Abkürzung ist, schreibe sie aus. Falls der Begriff kein Marketing-Bezug hat, erkläre ihn trotzdem knapp und nenne den nächstliegenden Marketing-Bezug.
Antworte ausschließlich mit JSON auf Deutsch, leere Strings für Felder, die nicht passen:
{"begriff":"korrekte Schreibweise","abk":"Abkürzung oder leer","ausgeschrieben":"ausgeschriebene Form (oft Englisch) oder leer","deutsch":"kurze deutsche Übersetzung","kategorie":"eine von: ${GCATS.join(', ')}","definition":"2–3 Sätze","formel":"Formel oder leer","beispiel":"konkretes Beispiel mit Zahlen","falle":"typischer Denkfehler oder leer"}`;
  try{const r=await AI.fn.json(prompt,{});if(!r||!r.definition)throw{code:'invalid_json'};
    P.gx[k]={k,custom:true,t:String(r.begriff||q),a:r.abk?String(r.abk):'',f:String(r.ausgeschrieben||''),de:String(r.deutsch||''),c:GCATS.includes(r.kategorie)?r.kategorie:'Fachbegriff',d:String(r.definition),fx:String(r.formel||''),ex:String(r.beispiel||''),tr:String(r.falle||'')};save();
    LX.busy=false;LX.q='';viewLexikon();glOpen(k)}
  catch(e){LX.busy=false;LX.err=aiErrText(e);viewLexikon()}}
let LX={q:'',cat:'',busy:false,err:''};
function viewLexikon(){
  const all=[...GLOSS,...Object.values(P.gx||{})];const q=LX.q.trim().toLowerCase();
  const hit=e=>!q||[e.t,e.a,e.f,e.de,...(e.al||[])].some(x=>x&&String(x).toLowerCase().includes(q));
  const list=all.filter(e=>hit(e)&&(!LX.cat||e.c===LX.cat)).sort((a,b)=>(a.a&&a.la!==false?a.a:a.t).localeCompare(b.a&&b.la!==false?b.a:b.t,'de'));
  let h=`${backBtn}<div class="ghead"><div><div class="eyebrow">Nachschlagen</div><h2>Lexikon</h2></div><span class="xp-pill">${P.seen.filter(k=>GL[k]).length} / ${GLOSS.length} entdeckt</span></div>
  <p class="lead">Alle Fachbegriffe und Kürzel aus dem Marktlabor. In den Spielen sind sie gepunktet unterstrichen: einfach antippen.</p>
  <div class="panel stack" style="margin-top:14px">
    <label class="fld" for="lxQ">Suchen<input type="text" id="lxQ" value="${esc(LX.q)}" placeholder="z. B. POAS, Churn, p-Wert, Ankereffekt" autocomplete="off"></label>
    <div class="chips"><button class="chip ${LX.cat?'':'on'}" data-cat="">Alle</button>${GCATS.map(c=>`<button class="chip ${LX.cat===c?'on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  </div>
  <div id="lxList" class="lx-list" style="margin-top:14px">${lxRows(list)}</div>
  <div id="lxMiss">${lxMiss(list)}</div>`;
  $('#view').innerHTML=h;bindGo();
  const inp=$('#lxQ');inp.oninput=()=>{LX.q=inp.value;const q2=LX.q.trim().toLowerCase();const l2=all.filter(e=>(!q2||[e.t,e.a,e.f,e.de,...(e.al||[])].some(x=>x&&String(x).toLowerCase().includes(q2)))&&(!LX.cat||e.c===LX.cat)).sort((a,b)=>(a.a&&a.la!==false?a.a:a.t).localeCompare(b.a&&b.la!==false?b.a:b.t,'de'));$('#lxList').innerHTML=lxRows(l2);$('#lxMiss').innerHTML=lxMiss(l2);bindLx()};
  inp.onkeydown=e=>{if(e.key==='Enter'){const l=$$('[data-gl]');if(l.length===1)glOpen(l[0].dataset.gl);else if(!l.length&&AI.state==='on')glLookup(LX.q)}};
  $$('[data-cat]').forEach(b=>b.onclick=()=>{LX.cat=b.dataset.cat;viewLexikon()});
  bindLx();if(LX.q)inp.focus()}
function lxRows(list){if(!list.length)return '';return list.map(e=>`<button class="lx-row" data-gl="${esc(e.k)}"><span class="lx-t">${e.a&&e.la!==false?`<b class="mono">${esc(e.a)}</b> <span>${esc(e.t)}</span>`:`<b>${esc(e.t)}</b>`}</span><span class="lx-de">${esc(e.de||e.f||'')}</span><span class="lx-dot ${P.seen.includes(e.k)?'on':''}" aria-label="${P.seen.includes(e.k)?'entdeckt':'neu'}"></span></button>`).join('')}
function lxMiss(list){if(LX.err)return `<p class="note" style="margin-top:10px">${esc(LX.err)}</p>`;if(LX.busy)return `<div class="panel" style="margin-top:10px"><p class="thinking">Claude schlägt nach</p></div>`;
  if(list.length||!LX.q.trim())return '';return `<div class="panel stack" style="margin-top:10px"><p>„${esc(LX.q.trim())}“ steht noch nicht im Lexikon.</p>${AI.state==='on'?`<div class="row"><button class="btn primary" id="lxAsk">Von Claude erklären lassen</button></div><p class="note">Die Erklärung wird in deinem Lexikon gespeichert.</p>`:'<p class="note">Mit KI-Verbindung kann Claude jeden Begriff erklären.</p>'}</div>`}
function bindLx(){$$('[data-gl]').forEach(b=>b.onclick=()=>glOpen(b.dataset.gl));const a=$('#lxAsk');if(a)a.onclick=()=>glLookup(LX.q)}
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('.term');if(t){e.preventDefault();e.stopPropagation();glOpen(t.dataset.term)}},true);
document.addEventListener('keydown',e=>{const t=e.target.closest&&e.target.closest('.term');if(t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();glOpen(t.dataset.term);return}
  if(e.key==='Escape'&&!$('#glBack').hidden)glClose()});

/* ========== AKADEMIE: Lektionen ========== */
const tbl=(head,rows)=>`<div class="tbl-wrap"><table class="data"><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const LESSONS=[
{k:'zahlen',t:'Zahlen lesen wie ein Profi',sub:'Fünf Fragen, die du jeder Zahl stellst',min:4,g:null,dim:null,steps:[
 {type:'text',h:'Warum du dich beim Raten ertappst',body:`<p>Eine Zahl allein sagt fast nichts. „ROAS 4“, „p = 0,03“ oder „+12 % Umsatz“ werden erst durch die richtige Frage zu einer Information. Profis haben dafür eine feste Routine aus fünf Fragen. Wenn du sie verinnerlichst, hörst du auf zu raten.</p>
  <ol class="steps"><li><b>Im Vergleich wozu?</b> Vorperiode, Kontrollgruppe, Benchmark.</li><li><b>Durchschnitt oder Grenzwert?</b> Was war im Schnitt, oder was bringt der nächste Euro?</li><li><b>Prozent oder Prozentpunkte?</b></li><li><b>Signal oder Rauschen?</b> Wie viele Daten stecken dahinter?</li><li><b>Korrelation oder Ursache?</b></li></ol>
  <p>Jede der folgenden Übungen trainiert eine dieser Fragen. Falsche Antworten kosten nichts, die Erklärung danach ist das Wichtigste.</p>`},
 {type:'q',h:'Frage 3: Prozent oder Prozentpunkte?',body:`<p>Die Conversion Rate steigt von <b>2 %</b> auf <b>3 %</b>. Welche Aussage stimmt?</p>`,opts:['Sie ist um 1 Prozentpunkt gestiegen, also um 50 %','Sie ist um 1 % gestiegen','Sie ist um 3 % gestiegen','Sie ist um 33 % gestiegen'],ex:`<p>Die <b>absolute</b> Differenz ist 1 Prozentpunkt (3 − 2). Die <b>relative</b> Veränderung ist (3 − 2) ÷ 2 = <b>+50 %</b>. Wer „+1 %“ sagt, untertreibt den Effekt um das Fünfzigfache. Im A/B-Labor heißt die relative Veränderung „Lift“, die absolute steht in Prozentpunkten (pp).</p>`},
 {type:'q',h:'Frage 1: Im Vergleich wozu?',body:`<p>Nach einer Kampagne im November steigt der Umsatz um <b>12 %</b> gegenüber Oktober. Was weißt du über die Wirkung der Kampagne?</p>`,opts:['Noch nichts sicher: Ohne Vergleich, wie der November ohne Kampagne gelaufen wäre, ist das Saison plus Kampagne','Die Kampagne hat 12 % Umsatz gebracht','Die Kampagne hat mindestens 12 % gebracht','Die Kampagne war ein Misserfolg'],ex:`<p>November ist wegen Black Friday fast immer stärker als Oktober. Die 12 % mischen Saison, Trend und Kampagne. Die Wirkung misst du nur gegen ein <b>Kontrafaktum</b>: eine Kontrollgruppe ohne Kampagne, Vergleichsregionen oder den Vorjahres-November mit Trendbereinigung.</p><p class="note">Merksatz: Eine Zahl ohne Vergleich ist eine Anekdote.</p>`},
 {type:'q',h:'Frage 2: Durchschnitt oder Grenzwert?',body:`${tbl(['Kanal','Spend','ROAS (Durchschnitt)'],[['A','50.000 €','4,0'],['B','10.000 €','2,5']])}<p>Du hast 10.000 € extra. Gehören sie zu Kanal A, weil A den höheren ROAS hat?</p>`,opts:['Nicht unbedingt: Entscheidend ist, was die nächsten 10.000 € bringen, und A ist mit 50.000 € vielleicht schon gesättigt','Ja, A ist eindeutig besser','Nein, man sollte immer den kleineren Kanal stärken','Ja, aber nur 5.000 €'],ex:`<p>Der Durchschnitts-ROAS beschreibt <b>alle bisherigen</b> Euros. Die ersten Euros in einem Kanal wirken am besten, danach flacht die Wirkung ab (Sättigung). Es kann sein, dass die letzten 10.000 € in Kanal A nur noch ROAS 1,2 gebracht haben, während B noch steil ansteigt. Für Budgetentscheidungen zählt der <b>Grenz-ROAS</b>. Das ist die wichtigste Lektion im Budget-Simulator.</p>`},
 {type:'q',h:'Frage 4: Signal oder Rauschen?',body:`<p>Zwei Newsletter-Varianten mit je 300 Empfängern. Variante A: <b>6 Käufe</b>. Variante B: <b>9 Käufe</b>. Ist B um 50 % besser?</p>`,opts:['Das kann reiner Zufall sein: Bei so wenigen Käufen schwanken Ergebnisse stark','Ja, 9 ist 50 % mehr als 6','Ja, aber nur bei Newslettern','Nein, A ist besser'],ex:`<p>Bei 300 Empfängern und rund 2 % Kaufrate erwartest du etwa 6 Käufe, aber Werte zwischen 2 und 11 sind allein durch Zufall völlig normal. Ein Unterschied von 3 Käufen ist darin nicht zu erkennen. Faustregel: <b>Je kleiner die Zahlen, desto größer das Rauschen.</b> Bei 10-fach größeren Gruppen halbiert sich die Unsicherheit nur etwa um den Faktor 3.</p>`},
 {type:'q',h:'Frage 5: Korrelation oder Ursache?',body:`<p>Kunden mit der App kaufen <b>dreimal so viel</b> wie Kunden ohne App. Sollten wir alle Kunden zur App drängen, um den Umsatz zu verdreifachen?</p>`,opts:['Nein: Wahrscheinlich laden vor allem ohnehin treue Kunden die App. Ob die App selbst den Umsatz steigert, zeigt nur ein Test','Ja, die App verdreifacht den Umsatz','Ja, aber nur bei Neukunden','Nein, Apps schaden dem Umsatz'],ex:`<p>Das ist <b>Selektion</b>: Wer ohnehin viel kauft, installiert eher die App. Die App kann trotzdem helfen, aber wie stark, sagt diese Zahl nicht. Lösung: Einer zufälligen Hälfte einen App-Anreiz geben und die Käufe beider Hälften vergleichen.</p>`},
 {type:'rules',h:'Deine Routine für jede Zahl',items:['<b>Vergleich:</b> Wogegen messe ich? Ohne Vergleich keine Aussage.','<b>Grenzwert:</b> Entscheide nach dem, was der nächste Euro bringt, nicht nach dem Durchschnitt.','<b>Einheit:</b> Prozentpunkte (absolut) und Prozent (relativ) nie verwechseln.','<b>Datenmenge:</b> Kleine Zahlen schwanken stark. Erst die Stichprobe ansehen, dann den Unterschied.','<b>Ursache:</b> Gemeinsames Auftreten beweist nichts. Wirkung zeigt ein Test mit Kontrollgruppe.']}]},
{k:'media',t:'Budget verteilen',sub:'Sättigung, Grenzwerte, kritische Masse',min:5,g:'budget',dim:'media',steps:[
 {type:'text',h:'Die eigentliche Frage',body:`<p>Im Budget-Simulator fragst du dich vermutlich: „Welcher Kanal ist der beste?“ Das ist die falsche Frage. Die richtige lautet: <b>Wo bringt der nächste Euro am meisten?</b></p><p>Jeder Kanal hat eine Sättigungskurve. Die ersten Euros erreichen die interessiertesten Menschen, danach wird es immer teurer. Deshalb kann ein Kanal im Schnitt glänzen und trotzdem mit jedem zusätzlichen Euro Geld verlieren. Probier es im nächsten Schritt aus.</p>`},
 {type:'widget',w:'sat',h:'Spiel mit der Kurve',body:`<p>Schieb den Regler und beobachte zwei Werte: den <b>Ø-POAS</b> (alle bisherigen Euros) und den <b>Grenz-POAS</b> (nur die nächsten 1.000 €). Die gestrichelte Linie ist Break-even: Darüber verdienst du. Wechsle dann zu „Influencer“ und schau, was bei kleinem Budget passiert.</p>`},
 {type:'q',h:'Wohin mit den nächsten 5.000 €?',body:`${tbl(['Kanal','Spend','Ø-POAS','Grenz-POAS'],[['Search Ads','40.000 €','2,1','0,8'],['Paid Social','15.000 €','1,4','1,6']])}`,opts:['Paid Social','Search Ads, wegen des höheren Ø-POAS','Gleichmäßig auf beide','Gar nicht ausgeben'],ex:`<p>Der Ø-POAS beschreibt die Vergangenheit, der Grenz-POAS die Zukunft. Bei Search bringen weitere Euros nur 0,80 € zurück, also 20 Cent Verlust pro Euro. Bei Social bringen sie 1,60 €. Du solltest sogar Budget <b>von Search zu Social verschieben</b>, bis die Grenzwerte ungefähr gleich sind. Genau so arbeitet das KI-Optimum im Spiel.</p>`},
 {type:'q',h:'Kritische Masse',body:`<p>Du hast 10.000 € in Influencer gesteckt. POAS: <b>0,56</b>. Was folgt daraus?</p>`,opts:['Vielleicht liegt das Budget unter der kritischen Masse: entweder deutlich mehr testen (z. B. 40.000 €) oder ganz streichen','Der Kanal funktioniert nicht, nie wieder nutzen','Budget halbieren auf 5.000 €','Genau so lassen und abwarten'],ex:`<p>Kanäle mit S-Kurve (Influencer, TV) wirken erst ab einer Mindestintensität. Halbieren ist die schlechteste Option: Dann bist du noch tiefer im flachen Teil der Kurve. Bei S-Kurven gilt <b>ganz oder gar nicht</b>. Im Widget hast du das gesehen: Influencer mit 10.000 € liegt unter Break-even, mit 45.000 € deutlich darüber.</p>`},
 {type:'q',h:'Der Nachhall',body:`<p>Du setzt Connected TV im April auf 0 €. Trotzdem meldet der Kanal <b>310 Conversions</b>. Was ist passiert?</p>`,opts:['Adstock: Die TV-Werbung aus dem März wirkt noch nach','Ein Messfehler','Das sind organische Käufe ohne Werbung','Die Plattform rechnet sich schön'],ex:`<p>Werbung wirkt über den Schaltmonat hinaus. Bei TV klingt die Wirkung über Wochen ab. Zwei Folgen für dich: Der POAS eines Monats enthält auch Wirkung aus dem Vormonat, und Pausen fallen nicht sofort auf. Deshalb sieht ein Kanal mit Nachhall direkt nach einer Kürzung besser aus, als er ist.</p>`},
 {type:'q',h:'Nicht ausgeben ist erlaubt',body:`<p>Alle Kanäle haben laut KI-MMM einen Grenz-POAS unter 1,0. Du hast noch 20.000 € unverplant. Was tust du?</p>`,opts:['Behalten: Jeder weitere Euro würde Geld verlieren','Auf den Kanal mit dem höchsten Ø-POAS legen','Gleichmäßig verteilen','In den günstigsten Kanal stecken'],ex:`<p>Budget ist kein Auftrag, sondern eine Obergrenze. Im Spiel zählt Gewinn: Nicht ausgegebenes Geld bleibt Gewinn, Geld mit Grenz-POAS 0,7 verliert 30 Cent pro Euro. Genau diese Disziplin unterscheidet Profis von Budget-Ausgebern.</p>`},
 {type:'rules',h:'Deine Checkliste für den Budget-Simulator',items:['<b>Monat 1 ist ein Messmonat:</b> Verteile breit, damit du von jedem Kanal Daten bekommst.','<b>Lies den POAS je Kanal:</b> Unter 1,0 kostet der Kanal im Schnitt Geld.','<b>Ab Monat 2 das KI-MMM kaufen:</b> Es zeigt den Grenz-POAS jedes Kanals, live beim Verschieben.','<b>Umschichten in 5.000-€-Schritten</b> vom niedrigsten zum höchsten Grenz-POAS, bis sich die Werte angleichen.','<b>S-Kurven-Kanäle</b> (Influencer, TV): mindestens 30.000 bis 45.000 € oder 0.','<b>Ereignisse lesen:</b> Mehr Nachfrage heißt, die Sättigung setzt später ein. Mehr Budget lohnt sich dann.','<b>Nicht ausgeben</b>, wenn kein Kanal mehr über 1,0 liegt.']}]},
{k:'experimente',t:'A/B-Tests richtig lesen',sub:'Rauschen, p-Wert, Konfidenzintervall',min:6,g:'ab',dim:'experimente',steps:[
 {type:'text',h:'Zufall erzeugt Unterschiede',body:`<p>Wirf zweimal 100 Münzen. Einmal kommt 47-mal Kopf, einmal 55-mal. Die Münzen sind identisch, der Unterschied ist reiner Zufall. Genau das passiert in A/B-Tests: Selbst zwei identische Varianten zeigen fast nie dieselbe Conversion Rate.</p><p>Die ganze Statistik eines A/B-Tests beantwortet nur eine Frage: <b>Ist der Unterschied größer als das, was Zufall allein erzeugen würde?</b></p>`},
 {type:'widget',w:'noise',h:'Sieh dir den Zufall an',body:`<p>Hier laufen <b>A/A-Tests</b>: Beide Varianten haben exakt 4 % Conversion Rate. Simuliere 20 Tests und schau, wie stark die Differenz schwankt. Dann erhöhe die Stichprobe.</p>`},
 {type:'text',h:'So liest du die drei Zahlen im Labor',body:`<p>Im A/B-Labor siehst du drei Kennzahlen. Lies sie immer in dieser Reihenfolge:</p><ol class="steps"><li><b>Besucher je Variante:</b> Wie groß ist das Rauschband? Bei 600 Besuchern schwankt die Differenz zufällig um gut ±2 Prozentpunkte, bei 25.000 nur um ±0,35.</li><li><b>p-Wert:</b> Liegt er unter 0,05, ist der beobachtete Unterschied größer als das typische Rauschen. Liegt er darüber, kann es Zufall sein.</li><li><b>Konfidenzintervall:</b> die Spanne, in der der echte Effekt plausibel liegt. Liegt es komplett über 0, ist B besser. Komplett unter 0: B ist schlechter. Schließt es die 0 ein: unklar.</li></ol><p>Danach eine Frage: <b>Ist das ein Zwischenstand?</b> Dann nicht entscheiden.</p>`},
 {type:'q',h:'Fall 1',body:`${tbl(['','Besucher','Käufe','CR'],[['A','600','24','4,0 %'],['B','600','31','5,2 %']])}<p>p = 0,32 · Konfidenzintervall −1,2 … +3,6 pp · Tag 14 von 14</p>`,opts:['Weitertesten','B ausrollen','A behalten'],ex:`<p><b>Schritt 1:</b> 600 Besucher sind wenig, das Rauschband ist breit. <b>Schritt 2:</b> p = 0,32, der Unterschied ist gut durch Zufall erklärbar. <b>Schritt 3:</b> Das Intervall reicht von −1,2 bis +3,6 pp: B könnte schlechter oder deutlich besser sein.</p><p>„Nicht signifikant“ heißt hier <b>nicht</b> „kein Effekt“, sondern „zu wenig Daten“. Für einen Effekt dieser Größe bräuchtest du etwa 4.800 Besucher je Variante. Also: weitertesten.</p>`},
 {type:'q',h:'Fall 2',body:`${tbl(['','Besucher','Käufe','CR'],[['A','25.000','1.000','4,00 %'],['B','25.000','1.090','4,36 %']])}<p>p = 0,04 · Konfidenzintervall +0,01 … +0,71 pp · Tag 14 von 14</p>`,opts:['B ausrollen','Weitertesten','A behalten'],ex:`<p>Große Stichprobe, p unter 0,05, und das ganze Intervall liegt über 0. Der Lift beträgt rund +9 %. Der Effekt ist klein, aber belastbar. Ausrollen.</p>`},
 {type:'q',h:'Fall 3',body:`${tbl(['','Besucher','Käufe','CR'],[['A','25.000','1.000','4,00 %'],['B','25.000','1.012','4,05 %']])}<p>p = 0,79 · Konfidenzintervall −0,30 … +0,39 pp · Tag 14 von 14</p>`,opts:['A behalten','Weitertesten','B ausrollen'],ex:`<p>Riesige Stichprobe, kein erkennbarer Effekt. Das Intervall zeigt: Selbst im besten Fall wäre der Effekt winzig (+0,39 pp). Weitertesten kostet nur Zeit, Ausrollen kostet Aufwand ohne Nutzen. A behalten und den nächsten Test starten.</p>`},
 {type:'q',h:'Fall 4',body:`${tbl(['','Besucher','Käufe','CR'],[['A','700','25','3,6 %'],['B','700','41','5,9 %']])}<p>p = 0,04 · <b>Tag 2 von 14 · Zwischenstand</b></p>`,opts:['Weitertesten','B ausrollen','A behalten'],ex:`<p>Das ist <b>Peeking</b>. Wer täglich hineinschaut und beim ersten p unter 0,05 stoppt, erzeugt bei Tests ohne echten Effekt in bis zu 30 % der Fälle einen Fehlalarm statt in 5 %. Die Laufzeit wurde vorher auf 14 Tage festgelegt, also läuft der Test weiter.</p>`},
 {type:'q',h:'Entscheidung oder Ergebnis?',body:`<p>Du rollst nach sauberer Analyse B aus (p = 0,01, große Stichprobe). Monate später zeigt sich: Der Effekt war null. War deine Entscheidung falsch?</p>`,opts:['Nein. Bei p unter 0,05 passiert so ein Fehlalarm gelegentlich. Entscheidungen bewertet man nach dem Prozess, nicht nach dem Ausgang','Ja, das Ergebnis zeigt es','Ja, man hätte länger testen müssen','Nein, weil der p-Wert nie falsch ist'],ex:`<p>Gute Entscheidungen können schlecht ausgehen, und Glück kann schlechte Entscheidungen belohnen. Das A/B-Labor bewertet dich deshalb nach der <b>Qualität deiner Lesart</b>. Die Wahrheit hinter dem Test bekommst du danach zu sehen, als Lernstoff, nicht als Note.</p>`},
 {type:'rules',h:'Dein Entscheidungsbaum',items:['<b>Zwischenstand?</b> → weitertesten. Immer.','<b>p unter 0,05 und Intervall komplett über 0</b> → B ausrollen.','<b>p unter 0,05 und Intervall komplett unter 0</b> → A behalten (B schadet).','<b>p über 0,05 und kleine Stichprobe</b> (bis ca. 2.500 je Variante) → weitertesten. Zu wenig Daten.','<b>p über 0,05 und große Stichprobe</b> → A behalten. Ein Effekt wäre, wenn überhaupt, winzig.','<b>Mittlere Stichprobe</b> (ca. 8.000) und nicht signifikant → beides vertretbar: A behalten oder weitertesten.']}]},
{k:'analytics',t:'Modelle in Geld übersetzen',sub:'Score, Schwelle, Precision, Recall',min:6,g:'churn',dim:'analytics',steps:[
 {type:'text',h:'Was ein Churn-Modell wirklich liefert',body:`<p>Ein Machine-Learning-Modell sagt nicht „Kunde X kündigt“. Es liefert einen <b>Score</b> zwischen 0 und 1: je höher, desto wahrscheinlicher die Kündigung. Die Entscheidung triffst du: Ab welchem Score bekommt jemand ein Halte-Angebot? Das ist die <b>Schwelle</b>.</p><p>Jede Schwelle erzeugt zwei Arten von Fehlern. <b>Fehlalarme</b> (FP): Du bezahlst ein Angebot für jemanden, der sowieso geblieben wäre. <b>Übersehene</b> (FN): Du verlierst einen Kunden, den du hättest halten können. Welcher Fehler teurer ist, entscheidet das Geld, nicht die Statistik.</p>`},
 {type:'widget',w:'dots',h:'Verschieb die Schwelle',body:`<p>40 Kunden, sortiert nach Score. Gefüllte Punkte kündigen wirklich, leere bleiben. Alles rechts von der Linie bekommt ein Angebot (Kosten 15 €, Kundenwert 220 €, 35 % lassen sich halten). Such die Schwelle mit dem höchsten Gewinn.</p>`},
 {type:'q',h:'Precision und Recall lesen',body:`<p>Dein Modell hat bei der gewählten Schwelle <b>Precision 40 %</b> und <b>Recall 90 %</b>. Was heißt das?</p>`,opts:['Du erreichst fast alle Kündiger, aber 6 von 10 Angeschriebenen wären geblieben','Das Modell liegt in 40 % der Fälle richtig','90 % der Angeschriebenen kündigen','Du verlierst 40 % deiner Kunden'],ex:`<p><b>Precision</b> schaut auf die Angeschriebenen: 40 % davon kündigen wirklich, 60 % sind Fehlalarme. <b>Recall</b> schaut auf alle Kündiger: 90 % davon erreichst du. Niedrige Schwelle bedeutet hohen Recall und niedrige Precision. Ob das gut ist, hängt davon ab, was ein Kontakt kostet.</p>`},
 {type:'q',h:'Die Break-even-Rechnung',body:`<p>Streaming-Abo: Kundenwert <b>220 €</b>, Rettungsquote <b>35 %</b>, ein Kontakt kostet <b>15 €</b>. Ab welcher Kündigungswahrscheinlichkeit lohnt sich ein Kontakt?</p>`,opts:['Ab etwa 20 %','Ab etwa 7 %','Ab etwa 50 %','Ab etwa 68 %'],ex:`<p>Ein Kontakt bringt im Erwartungswert: Wahrscheinlichkeit × Kundenwert × Rettungsquote. Er lohnt, sobald das mehr ist als die Kosten:</p><div class="gl-fx">P × 220 € × 0,35 > 15 €\nP > 15 ÷ 77 ≈ 0,19</div><p>Schon Kunden mit rund 20 % Kündigungsrisiko lohnen sich. Günstiger Kontakt bedeutet niedrige Schwelle.</p>`},
 {type:'q',h:'Teurer Kontakt',body:`<p>Mobilfunk: gleicher Kundenwert 220 €, Rettungsquote <b>30 %</b>, aber ein Rückruf mit Gerätebonus kostet <b>45 €</b>. Ab welcher Wahrscheinlichkeit lohnt sich der Kontakt jetzt?</p>`,opts:['Ab etwa 68 %','Ab etwa 20 %','Ab etwa 35 %','Ab etwa 90 %'],ex:`<div class="gl-fx">P > 45 ÷ (220 × 0,30) = 45 ÷ 66 ≈ 0,68</div><p>Teure Kontakte verlangen eine hohe Schwelle und damit hohe Precision. Im Churn-Radar zeigt dir der Coach, wie viele Kunden knapp an deiner Schwelle wirklich kündigen. Liegt dieser Anteil über dem Break-even, senk die Schwelle. Liegt er darunter, erhöhe sie.</p>`},
 {type:'q',h:'Was die AUC nicht sagt',body:`<p>Dein Modell hat eine AUC von <b>0,85</b>. Welche Schwelle ist optimal?</p>`,opts:['Das lässt sich aus der AUC nicht ablesen: Das entscheiden Kosten, Kundenwert und Rettungsquote','0,85','0,5','0,15'],ex:`<p>Die AUC misst, wie gut das Modell Kündiger und Bleibende <b>sortiert</b>. Sie ist eine Eigenschaft des Modells, keine Geschäftsentscheidung. Dasselbe Modell braucht beim Streaming-Abo eine niedrige und beim Mobilfunk eine hohe Schwelle.</p>`},
 {type:'rules',h:'Deine Checkliste für das Churn-Radar',items:['<b>Rechne zuerst den Break-even:</b> P* = Kosten ÷ (Kundenwert × Rettungsquote).','<b>Schau auf die Grenzkunden:</b> Wie viele Kunden knapp über deiner Schwelle kündigen wirklich? Der Coach zeigt es dir.','<b>Anteil Kündiger an der Schwelle über P*</b> → Schwelle senken. Darunter → Schwelle erhöhen.','<b>Teurer Kontakt</b> → hohe Schwelle, Precision zählt.','<b>Wertvoller Kunde</b> → niedrige Schwelle, Recall zählt.','<b>AUC</b> sagt, wie gut das Modell sortiert, nicht wo du schneiden sollst.']}]},
{k:'pricing',t:'Preise setzen',sub:'Marge mal Menge, Elastizität, Referenzpreis',min:5,g:'preis',dim:'pricing',steps:[
 {type:'text',h:'Die Grundgleichung',body:`<p>Gewinn = (Preis − Stückkosten) × Absatz. Ein höherer Preis erhöht die Marge pro Stück und senkt den Absatz. Ein niedrigerer Preis macht das Gegenteil. Irgendwo dazwischen liegt der Preis mit dem höchsten Gewinn, und der ist fast nie der niedrigste oder der höchste.</p>`},
 {type:'widget',w:'price',h:'Finde den Gewinn-Gipfel',body:`<p>Ein vereinfachter Markt: Stückkosten 42 €, Sonix bleibt fest bei 89 €. Schieb den Preis und beobachte „Gewinn bei +1 €“. Ist der Wert positiv, lohnt ein höherer Preis. Ist er negativ, ein niedrigerer.</p>`},
 {type:'q',h:'Rechne nach',body:`<p>Du erhöhst den Preis von <b>80 € auf 88 €</b> (+10 %). Der Absatz sinkt von <b>1.000 auf 870 Stück</b> (−13 %). Stückkosten: 42 €. Was passiert mit dem Gewinn?</p>`,opts:['Er steigt von 38.000 € auf 40.020 €','Er sinkt, weil der Absatz stärker fällt als der Preis steigt','Er bleibt gleich','Er sinkt um 13 %'],ex:`<div class="gl-fx">Vorher: (80 − 42) × 1.000 = 38.000 €\nNachher: (88 − 42) × 870 = 40.020 €</div><p>Die Preiselastizität ist −1,3 (−13 % ÷ +10 %). Der <b>Umsatz</b> sinkt sogar leicht, der <b>Gewinn</b> steigt trotzdem, weil die Marge pro Stück um 21 % wächst. Elastizität allein entscheidet nicht, die Marge gehört immer dazu.</p>`},
 {type:'q',h:'Der Wettbewerber reagiert',body:`<p>Du senkst von 89 € auf 79 €. Sonix zieht zur Hälfte nach und geht auf 84 €. Was passiert typischerweise?</p>`,opts:['Dein Absatzgewinn fällt kleiner aus als erhofft, weil dein Preisvorsprung schrumpft, und du verdienst 10 € weniger pro Stück','Du gewinnst den ganzen Markt','Nichts, Wettbewerber reagieren nie','Sonix verliert Geld, du nicht'],ex:`<p>Preissenkungen sind am leichtesten zu kopieren. Du rechnest mit 10 € Vorsprung, bekommst aber nur 5 €, bei 10 € weniger Marge auf jedes Stück. Das ist der Kern eines Preiskriegs: Am Ende haben beide ähnliche Anteile und weniger Gewinn.</p>`},
 {type:'q',h:'Rabatte mit Nebenwirkung',body:`<p>Du machst jede zweite Woche −20 %. Welche Folge ist am wahrscheinlichsten?</p>`,opts:['Der Referenzpreis sinkt und Kunden warten auf die nächste Aktion. Normale Wochen verkaufen schlechter','Kunden kaufen dauerhaft mehr','Gar keine','Der Referenzpreis steigt'],ex:`<p>Kunden speichern einen „normalen“ Preis im Kopf. Häufige Rabatte senken ihn. Danach fühlt sich dein Listenpreis wie ein Aufschlag an, und Verluste wiegen psychologisch schwerer als Gewinne. Im Preiskrieg siehst du den Referenzpreis als graue Linie.</p>`},
 {type:'rules',h:'Deine Checkliste für den Preiskrieg',items:['<b>Rechne immer Marge × Menge</b>, nie nur Absatz oder Umsatz.','<b>Nutze den Prognose-Rechner des Coaches:</b> Er zeigt Absatz und Gewinn bei ±3 und ±6 € für diese Woche.','<b>Variiere bewusst</b> in kleinen Schritten, sonst kannst du keine Elastizität messen.','<b>Rechne mit der Reaktion von Sonix:</b> Senkungen werden zur Hälfte kopiert.','<b>Rabatte sparsam:</b> Jede Aktion senkt den Referenzpreis. Wenn überhaupt, dann wenn Kunden sie ohnehin erwarten (Black Week).','<b>Ereignisse:</b> Ist der Wettbewerber vorübergehend stärker, nicht panisch senken.']}]},
{k:'strategie',t:'Positionieren und gewinnen',sub:'Segmente, Marge, Kundenbasis',min:5,g:'markt',dim:'strategie',steps:[
 {type:'text',h:'Alle ein bisschen ist niemand richtig',body:`<p>Ein Markt besteht aus Segmenten, die Unterschiedliches wollen. Im Marktkampf: <b>Preisbewusste</b> (groß, reagieren stark auf Preis), <b>Genießer</b> (zahlen mehr, reagieren auf Marke) und <b>Nachhaltige</b>. Deine Positionierung entscheidet, in welchem Segment du stark bist. Drei Fragen helfen: Wie groß ist das Segment? Was verdiene ich pro Kunde? Wer kämpft dort schon?</p>`},
 {type:'q',h:'Marge schlägt Menge',body:`<p>Kosten pro Abo-Monat: 11 €. Wie viele Kunden brauchst du bei <b>18 €</b>, um denselben Gewinn zu machen wie mit <b>1.000 Kunden bei 27 €</b>?</p>`,opts:['Rund 2.300','Rund 1.500','Rund 1.000','Rund 3.500'],ex:`<div class="gl-fx">27 € − 11 € = 16 € Marge × 1.000 = 16.000 €\n18 € − 11 € = 7 € Marge → 16.000 ÷ 7 ≈ 2.286 Kunden</div><p>Im Preissegment brauchst du 2,3-mal so viele Kunden, und dort kämpft bereits BeanBot mit KI-gesteuerten Niedrigpreisen. Das heißt nicht, dass Preis falsch ist, aber du musst die Rechnung kennen.</p>`},
 {type:'q',h:'Kundenbasis ist Kapital',body:`<p>3.000 Bestandskunden, keine Neukunden. Kundenbindung pro Quartal: <b>80 %</b> oder <b>88 %</b>. Wie viele Kunden hast du jeweils nach vier Quartalen?</p>`,opts:['Rund 1.230 gegenüber rund 1.800','Rund 2.400 gegenüber rund 2.640','Rund 600 gegenüber rund 360','Bei beiden etwa gleich viele'],ex:`<div class="gl-fx">3.000 × 0,80⁴ ≈ 1.229\n3.000 × 0,88⁴ ≈ 1.799</div><p>8 Prozentpunkte mehr Bindung bedeuten nach einem Jahr fast 50 % mehr Kunden. Retention-Budget wirkt leise, aber es verzinst sich. Im Marktkampf zählt die Kundenbasis am Ende in den Unternehmenswert.</p>`},
 {type:'q',h:'Marke wirkt langsam',body:`<p>Du streichst im Marktkampf das Markenbudget komplett. Was passiert?</p>`,opts:['Der Markenbestand verfällt jedes Quartal um 30 %: Die Wirkung lässt erst langsam, dann deutlich nach','Sofortiger Einbruch der Neukunden','Gar nichts, Marke wirkt nicht','Mehr Gewinn ohne Nachteile'],ex:`<p>Markenbudget baut einen Bestand auf, der von Quartal zu Quartal nachwirkt. Kürzt du, sparst du sofort Geld, der Schaden kommt verzögert. Deshalb wird Marke in Krisen oft zu früh gestrichen. Im letzten Quartal ist die Lage anders: Dann wirkt neue Marke kaum noch nach.</p>`},
 {type:'q',h:'Auf KI-Konkurrenz reagieren',body:`<p>BeanBot senkt zum dritten Mal den Preis. Du bist als Genuss-Marke positioniert. Was ist die beste erste Reaktion?</p>`,opts:['Prüfen, ob du im Genuss-Segment Neukunden verlierst. Preisbewusste sind ohnehin nicht deine Kernzielgruppe','Sofort auch den Preis senken','Ins Preissegment wechseln','Das Werbebudget verdoppeln'],ex:`<p>Erst die Daten lesen: In der Segment-Grafik siehst du, wo du Anteile verlierst. Ein Discounter-Preiskampf trifft vor allem das Preissegment. Wer reflexhaft mitzieht, verliert Marge in dem Segment, das ihm eigentlich gehört.</p>`},
 {type:'rules',h:'Deine Checkliste für den Marktkampf',items:['<b>Wähle ein Segment, in dem du dich abheben kannst</b>, und bleib dabei. Wechsel kosten Glaubwürdigkeit.','<b>Rechne die Marge:</b> Preis − Kosten, mal drei Monate pro Quartal.','<b>Lies die Segment-Grafik:</b> Wo verlierst du Anteile, und an wen?','<b>Retention ist Kapital:</b> Jeder Prozentpunkt mehr Bindung verzinst sich über die Quartale.','<b>Marke früh aufbauen</b>, im letzten Quartal kaum noch.','<b>Ereignisse einpreisen:</b> Kostenanstieg (Q3), mehr Nachfrage (Q4), KI-Preisvergleich (Q5).']}]},
{k:'creative',t:'Anzeigen und Prompts bauen',sub:'Anatomie einer Anzeige, Prompt-Formel',min:4,g:'arena',dim:'creative',steps:[
 {type:'text',h:'Die Anatomie einer Anzeige',body:`<p>Starke Performance-Anzeigen haben fast immer vier Bausteine:</p><div class="ad-preview"><div class="h"><mark class="hk">Schäumt wie Milch.</mark> Ist keine.</div><div><mark class="nu">Nordhalm Barista hält den Milchschaum im Cappuccino</mark>, <mark class="be">getestet von 200 Baristas in Hamburg.</mark> <mark class="ct">Jetzt im Kühlregal probieren.</mark></div></div><ul class="legendlist"><li><mark class="hk">Hook</mark> stoppt den Daumen und trifft das Problem der Zielgruppe (wässriger Pflanzendrink).</li><li><mark class="nu">Nutzen</mark> ist konkret und aus Sicht der Kundin formuliert.</li><li><mark class="be">Beleg</mark> macht das Versprechen glaubwürdig: Zahl, Test, Kundenstimme.</li><li><mark class="ct">Call-to-Action</mark> sagt genau, was jetzt zu tun ist.</li></ul><p>Dazu kommen die Limits des Kanals: In einer Story-Ad liest niemand 300 Zeichen.</p>`},
 {type:'q',h:'Welche Headline?',body:`<p>LinkedIn-Anzeige für Ledgerly, Zielgruppe: Geschäftsführer:innen kleiner Agenturen, Belege liegen verstreut in Mails.</p>`,opts:['„Belege aus Mails, automatisch gebucht. In 2 Minuten.“','„Ledgerly: die smarte Buchhaltungslösung“','„Innovation trifft Buchhaltung“','„Jetzt neu: Ledgerly 3.0“'],ex:`<p>Die erste Headline nennt das konkrete Problem (Belege in Mails), den Nutzen (automatisch gebucht) und einen Beleg für Tempo (2 Minuten). Die anderen beschreiben das Produkt aus Sicht des Herstellers. „Smart“ und „Innovation“ sind Behauptungen ohne Inhalt.</p>`},
 {type:'q',h:'Der stärkste CTA',body:`<p>Ziel der Anzeige: Demo-Termin buchen. Welche Handlungsaufforderung ist am stärksten?</p>`,opts:['„20-Minuten-Demo buchen“','„Mehr erfahren“','„Klick hier“','„Wir freuen uns auf Sie“'],ex:`<p>Ein guter CTA nennt die konkrete Handlung und senkt die Hürde: „20 Minuten“ macht den Aufwand greifbar. „Mehr erfahren“ passt eher zu Anzeigen, die Interesse wecken sollen, nicht zu Buchungszielen.</p>`},
 {type:'q',h:'Was fehlt dem Prompt?',body:`<div class="ad-preview mono" style="font-size:13px">Schreib mir drei coole Instagram-Texte für unseren Haferdrink.</div>`,opts:['Zielgruppe, Ziel, Zeichenlimits und Tonalität','Nur eine höfliche Bitte','Mehr Emojis','Nichts, der Prompt ist vollständig'],ex:`<p>Ein Prompt ist ein Briefing. Die Formel: <b>Rolle · Ziel · Zielgruppe · Kontext · Format · Grenzen</b>. Beispiel: „Du bist Performance-Texter:in. Ziel: Testkäufe. Zielgruppe: Kaffeefans 25–35, genervt von wässrigem Pflanzendrink. Kanal: Story-Ad, Headline max. 40 Zeichen. Liefere 3 Varianten mit unterschiedlichem Hook. Keine Superlative, keine Gesundheitsversprechen.“</p>`},
 {type:'rules',h:'Deine Checkliste für die KI-Arena',items:['<b>Hook:</b> Trifft die erste Zeile ein Problem der Zielgruppe?','<b>Nutzen:</b> konkret, aus Sicht der Kund:innen, nicht „smart“ oder „innovativ“.','<b>Beleg:</b> Zahl, Test oder Kundenstimme.','<b>CTA:</b> konkrete Handlung, passend zum Ziel.','<b>Limits</b> des Kanals einhalten.','<b>Prompts:</b> Rolle · Ziel · Zielgruppe · Kontext · Format · Grenzen.']}]},
{k:'krise',t:'Krisen führen',sub:'Die ersten Stunden entscheiden',min:3,g:'krise',dim:'krise',steps:[
 {type:'text',h:'Vier Prinzipien, vier Fallen',body:`<p>In einer Krise misst du drei Dinge: <b>Vertrauen</b> (der langfristige Schaden), <b>Sentiment</b> (die Stimmung jetzt) und <b>Erwähnungen pro Stunde</b> (wie schnell sich die Welle ausbreitet). Was sie verbessert:</p><ol class="steps"><li><b>Schnell:</b> Wer schweigt, überlässt anderen die Geschichte.</li><li><b>Ehrlich:</b> Belegte Fehler zugeben, nichts behaupten, was sich widerlegen lässt.</li><li><b>Verantwortung:</b> Konkrete Konsequenzen statt „Wir bedauern, falls“.</li><li><b>Wiedergutmachung:</b> Betroffenen aktiv helfen, nicht erst auf Nachfrage.</li></ol><p>Was sie zerstört: <b>Leugnen, Schweigen, Relativieren, Lügen.</b> Eine Lüge macht aus einem Fehler einen Skandal.</p>`},
 {type:'q',h:'Erste Reaktion',body:`<p>Ein Screenshot belegt: Euer Chatbot hat einen Kunden beleidigt. 3.000 Erwähnungen pro Stunde. Was tust du zuerst?</p>`,opts:['Innerhalb einer Stunde öffentlich entschuldigen, den Bot pausieren und erklären, was ihr prüft','Erst intern klären, dann in zwei Tagen reagieren','Darauf hinweisen, dass es nur ein Einzelfall ist','Den Screenshot als Fälschung bezeichnen'],ex:`<p>Der Fehler ist belegt, also hilft nur Tempo plus Verantwortung plus eine konkrete Maßnahme (Bot pausieren). „Einzelfall“ relativiert, und eine Fälschungsbehauptung, die sich widerlegen lässt, ist das Schlimmste, was passieren kann.</p>`},
 {type:'rules',h:'Deine Checkliste für den Krisenstab',items:['<b>Prüfe jede Option an vier Fragen:</b> schnell? ehrlich? übernimmt Verantwortung? hilft Betroffenen?','<b>Wähle nie</b> Leugnen, Schweigen, Relativieren oder unbelegte Behauptungen.','<b>Bei Zeitdruck:</b> Keine Entscheidung ist auch eine, meist die schlechteste.','<b>Nach der Welle:</b> Lerngeschichte erzählen, Kritiker einbinden, Prozess ändern.']}]},
{k:'ki',t:'KI im Marketing',sub:'Wo sie hilft, wo sie gefährlich wird',min:4,g:'quiz',dim:'ki',steps:[
 {type:'text',h:'Vier Einsatzfelder',body:`${tbl(['Feld','Beispiele','Hauptrisiko'],[['Vorhersagen','Churn, Kundenwert, Nachfrage','Falsche Schwelle, verzerrte Daten'],['Optimieren','Smart Bidding, Bandits, Budget-Allokation','Optimiert das falsche Ziel (Goodhart)'],['Erzeugen','Texte, Bilder, Varianten','Halluzinationen, Recht, Einheitsbrei'],['Analysieren','MMM, Sentiment, Segmentierung','Korrelation mit Wirkung verwechselt']])}<p>Fast jedes KI-Problem im Marketing gehört zu einer dieser Spalten. Wenn du bei einer Quizfrage unsicher bist, frag dich: Welches Feld ist das, und was ist dort das typische Risiko?</p>`},
 {type:'q',h:'Das richtige Signal',body:`<p>Eure KI-Gebotsstrategie optimiert auf Umsatz. Der Umsatz steigt, der Gewinn sinkt. Was ist am wahrscheinlichsten passiert?</p>`,opts:['Die KI pusht margenschwache Produkte, weil sie nur Umsatz sieht. Sie braucht Deckungsbeitrag als Ziel','Die KI ist kaputt','Die Konkurrenz bietet mehr','Der Umsatz ist falsch gemessen'],ex:`<p>Eine KI optimiert exakt auf das Signal, das du ihr gibst. Das ist Goodharts Gesetz in Aktion. Übermittle Deckungsbeitrag oder Kundenwert statt Umsatz, dann optimiert sie, was dich wirklich interessiert.</p>`},
 {type:'q',h:'Daten und Recht',body:`<p>Eine Kollegin will die Kundenliste mit Namen und Kaufhistorie in ein frei zugängliches KI-Tool laden, um Personas zu bauen. Was ist das Hauptproblem?</p>`,opts:['Personenbezogene Daten ohne Rechtsgrundlage und ohne Auftragsverarbeitungsvertrag an einen Dritten zu geben','Das Tool ist zu langsam','Personas sind veraltet','KI kann keine Personas'],ex:`<p>Nach DSGVO brauchst du für jede Verarbeitung eine Rechtsgrundlage und bei Dienstleistern in der Regel einen AV-Vertrag. Lösung: anonymisieren oder pseudonymisieren, oder ein freigegebenes Unternehmens-Tool nutzen.</p>`},
 {type:'rules',h:'Deine Checkliste für KI-Fragen',items:['<b>Welches Feld?</b> Vorhersagen, Optimieren, Erzeugen oder Analysieren.','<b>Welches Ziel optimiert die KI wirklich?</b> Ist es nah am Geschäftsergebnis?','<b>Welche Daten fließen wohin?</b> Rechtsgrundlage, AV-Vertrag, Pseudonymisierung.','<b>Wer prüft die Ausgabe?</b> Menschliches Review bei Claims, Preisen und Recht.','<b>Wie wird die Wirkung gemessen?</b> Holdout oder Experiment statt Bauchgefühl.','<b>Transparenz:</b> KI-Chatbots und Deepfakes kennzeichnen (EU AI Act).']}]}];
const META_LESSON={k:'meta',t:'Meta Ads verstehen',sub:'Creatives, Video-Aufbau, Struktur, Skalierung',min:7,g:'meta',dim:'media',steps:[
 {type:'text',h:'Wie Meta heute funktioniert',body:`<p>Früher war Meta-Werbung Zielgruppen-Basteln: Interessen stapeln, Alter eingrenzen, viele kleine Anzeigengruppen. Heute findet der Algorithmus Käufer meist besser selbst. Seit Ende 2024 wählt ein neues KI-System (Andromeda) aus deutlich mehr Anzeigen aus und belohnt Creatives, die sich wirklich unterscheiden.</p>
  <p>Deine Aufgabe hat sich verschoben. Du lieferst drei Dinge:</p><ol class="steps"><li><b>Das richtige Signal:</b> Kampagnenziel „Umsatz“ und sauberes Tracking (Pixel plus Conversions API).</li><li><b>Eine Struktur, die lernen kann:</b> wenige Anzeigengruppen mit genug Budget für rund 50 Käufe pro Woche.</li><li><b>Viele unterschiedliche Creatives:</b> Das Creative ist das neue Targeting. Ein Video über Schnarch-Partner erreicht andere Menschen als eines über Schichtarbeit.</li></ol>`},
 {type:'text',h:'Die Formel hinter jedem CPA',body:`<div class="gl-fx">CPA = CPM ÷ (1.000 × CTR × CVR)</div><p>Beispiel: CPM 9 €, CTR 1,5 %, CVR 2 % → 9 ÷ (1.000 × 0,015 × 0,02) = 9 ÷ 0,3 = <b>30 €</b>.</p>
  ${tbl(['Hebel','Was ihn bewegt','Wo du ihn siehst'],[['CPM','Auktion, Saison, Format (9:16 ist oft günstiger), Zielgruppengröße','Werbeanzeigenmanager'],['CTR','Creative: Hook, Nutzen, Call-to-Action','Klickrate, bei Video zusätzlich Hook- und Hold-Rate'],['CVR','Angebot, Beweis, Landingpage, passendes Versprechen','Käufe ÷ Klicks']])}
  <p>Bei Videos kommen zwei Frühindikatoren dazu: Die <b>Hook-Rate</b> (wie viele schauen länger als 3 Sekunden?) und die <b>Hold-Rate</b> (wie viele bleiben danach dran?). Faustregel: Hook-Rate ab etwa 25 bis 30 % ist gut.</p>`},
 {type:'q',h:'Diagnose 1',body:`<p>Ein Video hat <b>Hook-Rate 14 %</b>, <b>Hold-Rate 45 %</b>, <b>CTR 0,6 %</b>. Wo liegt das Problem?</p>`,opts:['In den ersten 3 Sekunden: Kaum jemand bleibt hängen, aber wer bleibt, schaut weiter','In der Mitte des Videos','Auf der Landingpage','Im Budget'],ex:`<p>Die Hold-Rate ist gut: Wer drin ist, bleibt. Aber nur 14 % kommen über die ersten 3 Sekunden. Lösung: neuer Einstieg, zum Beispiel eine Problem-Frage, ein überraschendes Bild oder ein Gesicht, das direkt spricht. Den Rest des Videos kannst du behalten.</p>`},
 {type:'q',h:'Diagnose 2',body:`<p>Ein Creative hat <b>CTR 2,1 %</b>, aber eine <b>CVR von 0,5 %</b>. Was ist am wahrscheinlichsten?</p>`,opts:['Das Versprechen holt Neugierige, aber keine Käufer: Anzeige und Landingpage oder Angebot passen nicht zusammen','Das Creative ist großartig, einfach mehr Budget','Der CPM ist zu hoch','Die Hook-Rate ist zu niedrig'],ex:`<p>Viele Klicks, kaum Käufe: Das ist oft Clickbait oder ein Bruch zwischen Anzeige und Seite. Prüfe: Hält die Seite, was die Anzeige verspricht? Fehlt Beweis (Bewertungen, Garantie)? Ist der Preis eine Überraschung?</p>`},
 {type:'text',h:'So baust du ein Video',body:`<p>Für Performance-Videos auf Meta hat sich dieser Aufbau bewährt:</p>
  ${tbl(['Zeit','Abschnitt','Aufgabe'],[['0–3 s','Hook','Daumen stoppen: Problem-Frage, Pattern Interrupt, Gesicht'],['3–8 s','Problem oder Nutzen','„Das kenne ich“ auslösen'],['8–20 s','Demo und Beweis','Zeigen, dass es funktioniert: Anwendung, Bewertungen, Zahlen'],['Ende','Call-to-Action','Genau sagen, was jetzt zu tun ist']])}
  <ul class="checks"><li><b>Hochformat:</b> 9:16 für Reels und Stories, 4:5 für den Feed.</li><li><b>Untertitel:</b> Viele schauen ohne Ton.</li><li><b>Länge:</b> 15 bis 30 Sekunden für Verkäufe. 60 Sekunden verlieren die meisten Zuschauer.</li><li><b>Kein Logo-Intro:</b> Die ersten Sekunden gehören dem Problem der Zuschauer, nicht der Marke.</li><li><b>UGC-Look</b> (Handy, echte Person) wirkt im Feed oft natürlicher als Hochglanz und ist viel günstiger.</li></ul>`},
 {type:'q',h:'Welcher Aufbau?',body:`<p>Welche Reihenfolge der vier Abschnitte passt am besten zu einem 15-Sekunden-Reel für Neukunden?</p>`,opts:['Problem-Frage → Demo → Bewertungen → Call-to-Action','Logo-Intro → Markenstory → Demo → Angebot','Call-to-Action → Demo → Problem → Logo','Markenstory → Bewertungen → Logo → Angebot'],ex:`<p>Der Hook muss vorne stehen, Demo und Beweis in die Mitte, der Call-to-Action ans Ende. Logo-Intros und Markenstorys am Anfang kosten die wertvollsten Sekunden.</p>`},
 {type:'q',h:'Masse oder Creatives?',body:`<p>Du hast <b>3.000 €</b> Produktionsbudget für den Launch. Was bringt am meisten?</p>`,opts:['5 bis 7 unterschiedliche Konzepte (verschiedene Angles und Formate) im UGC-Stil','1 aufwendiges Studio-Video','30 Varianten desselben Videos mit anderer Farbe und Musik','Kein Creative-Budget, dafür mehr Anzeigengruppen'],ex:`<p>Am Anfang weißt du nicht, welches Konzept zündet. Mehrere günstige, wirklich unterschiedliche Ideen testen schlägt eine teure Wette. Farbvarianten zählen für Meta kaum als neues Creative. Wenn ein Konzept gewinnt, baust du davon Varianten und kannst es dann auch hochwertiger produzieren.</p>`},
 {type:'q',h:'Video oder Bild?',body:`<p>Welche Zuordnung ist für eine neue, erklärungsbedürftige Schlafmaske am sinnvollsten?</p>`,opts:['Neukunden: Videos mit Demo und Problem. Website-Besucher ohne Kauf: Bilder und Karussells mit Bewertungen oder Angebot','Neukunden: Produktfoto. Website-Besucher: 60-Sekunden-Markenfilm','Überall nur Bilder, weil sie billiger sind','Überall nur Videos, weil sie mehr Aufmerksamkeit bekommen'],ex:`<p>Wer dich nicht kennt, braucht Erklärung: Video zeigt Problem und Lösung. Wer schon auf der Seite war, kennt das Produkt und braucht einen letzten Anstoß: Bewertungen, Vergleich, Angebot. Dafür reichen Bilder und Karussells, und sie sind günstig. Statische Bilder können aber auch bei Neukunden gewinnen, wenn die Botschaft in einem Satz funktioniert.</p>`},
 {type:'q',h:'Struktur',body:`<p>Eine Kampagne hat <b>10 Anzeigengruppen</b> mit je <b>700 € pro Woche</b>. Der CPA liegt bei 30 €. Was passiert?</p>`,opts:['Jede Gruppe kommt nur auf etwa 23 Käufe pro Woche und bleibt in der Lernphase eingeschränkt. Konsolidieren','Alles gut, mehr Gruppen bedeuten mehr Reichweite','Die Gruppen lernen voneinander','Der CPA sinkt automatisch'],ex:`<div class="gl-fx">700 € ÷ 30 € ≈ 23 Käufe pro Gruppe und Woche (Ziel: rund 50)</div><p>Eine Gruppe mit 7.000 € käme auf rund 230 Käufe und würde stabil lernen. Weniger, größere Anzeigengruppen geben dem Algorithmus mehr Daten.</p>`},
 {type:'q',h:'Skalieren',body:`<p>Deine Kampagne läuft profitabel mit <b>1.000 € pro Tag</b>. Wie skalierst du?</p>`,opts:['Schrittweise, etwa 20 % alle paar Tage, und parallel neue Creatives nachliefern','Sofort auf 3.000 € pro Tag','Die Kampagne duplizieren, fünfmal','Gar nicht, sonst geht alles kaputt'],ex:`<p>Große Sprünge sind eine wesentliche Änderung und können die Lernphase neu starten. Mehr Budget erreicht außerdem Menschen, die weniger interessiert sind, also steigt der CPA etwas. Neue Konzepte öffnen neue Zielgruppen-Taschen und halten den CPA stabil.</p>`},
 {type:'rules',h:'Deine Checkliste für Meta Ads',items:['<b>Ziel „Umsatz“</b> und Pixel plus Conversions API.','<b>Wenige Anzeigengruppen</b>, Broad statt Interessen-Stapel. Rund 50 Käufe pro Gruppe und Woche.','<b>Retargeting</b> klein halten (10 bis 20 % des Budgets) und mit Bildern, Karussells und Bewertungen bespielen.','<b>3 bis 6 wirklich unterschiedliche Konzepte</b> pro Anzeigengruppe: verschiedene Angles, Formate, Personen.','<b>Video-Aufbau:</b> Hook in 0–3 s, Problem, Demo und Beweis, Call-to-Action. 9:16 oder 4:5, Untertitel, 15 bis 30 s.','<b>Lies die Kette:</b> Hook-Rate → Hold-Rate → CTR → CVR → CPA. Der erste schwache Wert zeigt das Problem.','<b>Break-even-CPA kennen:</b> Deckungsbeitrag pro Bestellung.','<b>Skalieren in 20-%-Schritten</b> und jede Woche neue Konzepte nachliefern. Steigende Frequenz plus steigender CPA heißt Ermüdung.']}]};
LESSONS.splice(2,0,META_LESSON);
const SOCIAL_LESSON={k:'social',t:'Social Media und Content',sub:'Awareness-Stufen, Plattformen, Formate, Content-Mix',min:8,g:'social',dim:'strategie',steps:[
 {type:'text',h:'Die fünf Awareness-Stufen',body:`<p>Der Werbetexter Eugene Schwartz hat 1966 beschrieben, dass Menschen auf unterschiedlichen Stufen stehen, bevor sie kaufen. Das Modell ist heute die beste Landkarte für Content:</p>
  ${tbl(['Stufe','Was die Person denkt','Was sie braucht'],[['1 · Unbewusst','„Passt doch alles.“','Aufmerksamkeit: Unterhaltung, Trend, überraschender Blickwinkel'],['2 · Problembewusst','„Irgendwas nervt, aber was hilft?“','Edukation: Ursachen erklären, Problem benennen, Meinung'],['3 · Lösungsbewusst','„Es gibt Lösungen, welche ist gut?“','Demo, Vergleich, Behind the Scenes'],['4 · Produktbewusst','„Kenne ich, aber stimmt das?“','Kundenstimmen, Story, Community, Nähe'],['5 · Kaufbereit','„Ich will, wann und wie?“','Angebot, klarer Call-to-Action']])}
  <p>Der häufigste Fehler: Fast alle Posts zielen auf Stufe 5, obwohl 80 bis 95 % des Marktes auf Stufe 1 bis 3 stehen. Das Ergebnis sind Angebote, die niemand will, und sinkendes Vertrauen.</p>`},
 {type:'widget',w:'matrix',h:'Welcher Content wirkt wo?',body:`<p>Das ist die Wirkungsmatrix aus dem Social-Media-Simulator. Je dunkler ein Feld, desto mehr Menschen bewegt dieser Content-Typ pro View von einer Stufe zur nächsten, bereits angepasst an den Betrieb. Wechsle zwischen den Betrieben und vergleiche.</p>`},
 {type:'q',h:'Warum verkauft das nicht?',body:`<p>Eine neue Hautpflege-Marke postet zu 70 % Rabattaktionen. Die Posts bekommen wenig Reichweite, verkaufen kaum, und Follower springen ab. Was ist das Kernproblem?</p>`,opts:['Angebote erreichen nur Kaufbereite. Davon gibt es bei einer unbekannten Marke kaum welche. Erst Edukation, Demos und Kundenstimmen füllen die Stufen davor','Die Rabatte sind nicht hoch genug','Sie posten zu selten','Sie brauchen professionellere Fotos'],ex:`<p>Bei einer neuen Marke stehen die meisten Menschen auf Stufe 1 bis 3. Ein Angebot spricht nur Stufe 5 an. Dazu kommt: Plattformen verbreiten Werbe-Posts schlechter, weil sie wenig geteilt und gespeichert werden. Und wer ständig verkauft, verliert Vertrauen. Im Simulator siehst du genau das in der Awareness-Treppe.</p>`},
 {type:'text',h:'Jede Plattform hat ihre eigene Logik',body:`${tbl(['Plattform','Wer','Was der Algorithmus belohnt','Starke Formate'],[['TikTok','breit, Schwerpunkt unter 35','Wiedergabedauer, Wiederholungen, Shares. Starke Reichweite bei Nicht-Followern','Kurzvideo lo-fi, Trends, Foto-Karussell'],['Instagram','18 bis 44','Wiedergabezeit, Likes und vor allem Weiterleitungen per Direktnachricht','Reels für Reichweite, Karussells für Saves, Stories für Nähe'],['LinkedIn','Berufstätige, B2B','Verweildauer, Kommentare, persönliche Profile','Text-Post mit starker erster Zeile, Dokument-Karussell'],['YouTube','alle Altersgruppen','Wiedergabezeit, Suche. Langvideos werden noch Monate später gefunden','Tutorials, Vergleiche, Shorts als Einstieg'],['Facebook','eher 35+','Lokale Gruppen, Interaktion unter Bekannten','Lokale Gruppen-Beiträge, Videos']])}
  <p>Zwei Folgen: Poste dort, wo dein Markt ist, nicht dort, wo es gerade angesagt ist. Und bau Inhalte für die Logik der Plattform: Ein Querformat-Video mit Logo-Intro funktioniert auf TikTok nicht.</p>`},
 {type:'q',h:'Plattform für B2B',body:`<p>Ledgerly verkauft Buchhaltungssoftware an Agenturen. Wo sollten 2 Stunden Content pro Woche zuerst hin?</p>`,opts:['LinkedIn-Posts vom persönlichen Profil der Gründerin: Erfahrungen, Meinungen, kleine Anleitungen','TikTok-Trends, weil dort die meiste Reichweite ist','Facebook-Gruppenbeiträge','Instagram-Stories'],ex:`<p>Die Zielgruppe (Agentur-Chef:innen) ist auf LinkedIn. Dort wirken persönliche Profile meist deutlich stärker als Unternehmensseiten, und Edukation sowie Meinungs-Posts bewegen Problembewusste. Reichweite auf TikTok wäre zum großen Teil Fehlstreuung.</p>`},
 {type:'text',h:'Der Hook entscheidet über alles danach',body:`<p>Auf jeder Plattform entscheidet der Anfang, ob jemand bleibt: die ersten 1 bis 3 Sekunden im Video, die erste Zeile im Text-Post, das Titelbild im Karussell. Wirksame Hook-Muster:</p>
  <ul class="checks"><li><b>Ergebnis zuerst:</b> „So sieht die Haut nach 4 Wochen aus“, dann der Weg dorthin.</li><li><b>Problem oder Frage:</b> „Warum brennt deine Creme?“</li><li><b>Pattern Interrupt:</b> ein überraschendes Bild oder eine unerwartete Bewegung.</li><li><b>Steile These:</b> „10.000 Schritte sind überschätzt.“ Bringt Kommentare, kann aber Vertrauen kosten, wenn sie nicht hält.</li><li><b>Trend-Format:</b> kurzfristig viel Reichweite, wenn es zur Marke passt.</li></ul>
  <p>Was fast immer verliert: „Hallo und herzlich willkommen, heute möchte ich …“ und Logo-Intros.</p>
  <p><b>Länge folgt dem Inhalt:</b> Unterhaltung und Angebote 7 bis 15 Sekunden. Erklären, Demo und Story brauchen 20 bis 90 Sekunden, sonst fehlt die Substanz. Für Tiefe und Vertrauen gibt es Langvideos auf YouTube.</p>`},
 {type:'q',h:'Zahlen lesen',body:`<p>Ein Reel des Cafés: <b>120.000 Views</b>, 92 % von Nicht-Followern, <b>40 neue Follower</b>, keine Reaktion im Laden. Was ist passiert?</p>`,opts:['Viral, aber ohne Bezug: Der Inhalt hat unterhalten, viele Views kamen von außerhalb der Region, und nichts hat die Zuschauer mit dem Café verbunden','Ein großer Erfolg, das Café wird bald voll sein','Der Algorithmus hat einen Fehler gemacht','Die Follower kommen später automatisch'],ex:`<p>Für einen lokalen Betrieb zählt nur die Reichweite in der Region. 40 Follower auf 120.000 Views zeigen: Das Video hat nicht mit dem Café verbunden. Besser wären lokale Bezüge und Inhalte, die zeigen, warum man genau hierher kommen sollte.</p>`},
 {type:'q',h:'Saves oder Shares?',body:`<p>Ein Karussell „5 Fehler beim Milchschäumen“ bekommt viele <b>Saves</b>. Ein Sketch-Reel bekommt viele <b>Shares</b>. Was sagen die beiden Signale?</p>`,opts:['Saves heißen „nützlich, will ich wiederfinden“ (Edukation). Shares heißen „das muss jemand sehen“ (Unterhaltung, Meinung). Beides treibt Reichweite, nur auf andere Art','Beides ist dasselbe','Saves sind wertlos, nur Shares zählen','Shares zeigen Kaufbereitschaft'],ex:`<p>Saves zeigen Wert und bauen Vertrauen auf, sie passen zu Problembewussten. Shares bringen neue Menschen, meist Unbewusste. Ein gesunder Content-Mix erzeugt beides.</p>`},
 {type:'q',h:'Recruiting im Handwerk',body:`<p>Elektro Brandt sucht Azubis. Was bringt auf TikTok und Instagram am meisten Bewerbungen?</p>`,opts:['Echte Einblicke: Azubis zeigen ihren Tag, Challenges im Team, ehrliche Zahlen zum Gehalt. Dazu ab und zu ein klarer Aufruf mit einfachem Bewerbungsweg','Jede Woche die Stellenanzeige als Bild posten','Ein Hochglanz-Imagefilm mit Drohnenaufnahmen','Nichts posten und auf Jobportale setzen'],ex:`<p>Junge Menschen bewerben sich bei Menschen, nicht bei Stellenanzeigen. Behind-the-Scenes-Inhalte und Stimmen von Azubis zeigen, wie es wirklich ist, und genau das ist Employer Branding. Die Stellenanzeige ist das Angebot für die wenigen Kaufbereiten. Ein einfacher Bewerbungsweg (zum Beispiel per WhatsApp) senkt die Hürde.</p>`},
 {type:'q',h:'Der Content-Mix',body:`<p>Wie viel deines Contents sollten direkte Angebote sein?</p>`,opts:['Ein kleiner Teil, etwa 10 bis 20 %. Der Rest hilft, unterhält oder schafft Vertrauen und füllt die Stufen davor','Mindestens die Hälfte, sonst verkauft man nichts','Gar keine, Social Media ist nur für Marke','Jeder Post sollte ein Angebot enthalten'],ex:`<p>Angebote ernten, was der übrige Content gesät hat. Ohne Angebote verschenkst du Kaufbereite, mit zu vielen verbrennst du Vertrauen und Reichweite. Viele Teams nutzen Content-Säulen (Pillars), etwa: Wissen, Einblicke, Kund:innen, Angebot.</p>`},
 {type:'rules',h:'Deine Checkliste für Social Media',items:['<b>Markt verstehen:</b> Auf welcher Awareness-Stufe steht der Großteil? Dort den meisten Content ansetzen.','<b>Content nach Stufe:</b> Unterhaltung → Unbewusste, Edukation und Meinung → Problembewusste, Demo und Einblicke → Lösungsbewusste, Kundenstimmen und Story → Produktbewusste, Angebot → Kaufbereite.','<b>Plattform nach Zielgruppe</b>, nicht nach Hype. Lokale Betriebe brauchen lokale Reichweite.','<b>Hook in jedem Format</b>, keine Begrüßung. Länge passend zum Inhalt.','<b>Lo-fi reicht</b> auf TikTok und Instagram. Hochglanz lohnt sich am ehesten bei YouTube-Langvideos.','<b>Angebote bei 10 bis 20 %</b> halten. Ein klarer Call-to-Action, wenn du ernten willst.','<b>Signale lesen:</b> Saves = nützlich, Shares = teilenswert, Kommentare = Nähe, Follower = Bezug zur Marke. Ziel-Conversions = Wirkung.','<b>Konstanz:</b> Regelmäßig auf den Hauptplattformen posten baut Momentum auf. Lieber 5 gute Posts pro Woche als 15 hastige.']}]};
LESSONS.splice(3,0,SOCIAL_LESSON);

const LMAP={};LESSONS.forEach(l=>LMAP[l.k]=l);
const GAME_LESSON={social:'social',meta:'meta',budget:'media',ab:'experimente',churn:'analytics',preis:'pricing',markt:'strategie',arena:'creative',krise:'krise',quiz:'ki',thron:'zahlen'};
const DIM_LESSON={media:'media',experimente:'experimente',analytics:'analytics',pricing:'pricing',strategie:'strategie',creative:'creative',krise:'krise',ki:'ki'};
const lessonDone=k=>!!(P.lessons&&P.lessons[k]);
const coachOn=()=>P.coach!==false;
function rulesHtml(k,open){const L=LMAP[k];if(!L)return'';const r=L.steps.find(s=>s.type==='rules');return r?`<details class="concept coach-rules" ${open?'open':''}><summary>Profi-Checkliste: ${esc(L.t)}</summary><ul class="checks">${r.items.map(i=>`<li>${i}</li>`).join('')}</ul></details>`:''}
function coachBox(title,items,k){if(!coachOn())return'';return `<section class="coach" aria-label="Coach"><div class="coach-h"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8"/><path d="M10 6v5M10 14v.01"/></svg><canvas class="pxs" data-scene="portrait" width="32" height="32" aria-hidden="true"></canvas>Coach · ${esc(title)}</div><ul>${items.filter(Boolean).map(i=>`<li>${i}</li>`).join('')}</ul>${k?rulesHtml(k):''}</section>`}
const backBtn={toString(){const l=GAME_LESSON[current];const L=l&&LMAP[l];const done=L&&lessonDone(l);
  return (PXMAP[current]?pxBanner(PXMAP[current]):'')+`<div class="gbar"><button class="back" data-go="home">← Startseite</button>${L?`<div class="row" style="gap:6px"><button class="btn sm ghost" data-lesson="${l}">${done?'Tutorial ansehen':'Tutorial'}</button><button class="btn sm coach-tog ${coachOn()?'on':''}" data-coach aria-pressed="${coachOn()}">Coach ${coachOn()?'an':'aus'}</button></div>`:''}</div>`
   +(L&&!done&&!(P.tutSkip&&P.tutSkip[l])?`<div class="tutban"><div><b>Neu hier?</b> Das Tutorial „${esc(L.t)}“ zeigt dir in ${L.min} Minuten, wie du die Zahlen in diesem Spiel liest, mit Übungen statt Theorie.</div><div class="row" style="gap:8px"><button class="btn primary sm" data-lesson="${l}">Tutorial starten</button><button class="btn sm ghost" data-tutskip="${l}">Direkt spielen</button></div></div>`:'')}};

let LS=null;
function openLesson(k){const L=LMAP[k];if(!L)return;LS={k,i:0,ans:{},first:{},order:{},back:current};
  L.steps.forEach((s,i)=>{if(s.type==='q')LS.order[i]=shuffle(s.opts.map((_,j)=>j))});go('lesson')}
function viewAkademie(){
  const done=LESSONS.filter(l=>lessonDone(l.k)).length;const nxt=LESSONS.find(l=>!lessonDone(l.k));
  let h=`${backBtn}<div class="ghead"><div><div class="eyebrow">Lernen, bevor du spielst</div><h2>Akademie</h2></div><span class="xp-pill">${done} / ${LESSONS.length} Lektionen</span></div>

const BEV_TIP=['Erster Monat: Verteile breit, um von jedem Kanal Daten zu sammeln. Influencer und TV entweder mit mindestens 30.000 € oder gar nicht.','Weniger Nachfrage: Alle Kurven flachen ab, der Break-even rückt näher. Gesamtbudget eher senken.','Programmatic verliert 30 % Wirkung: Sein Grenz-POAS sinkt. Budget dort kürzen und umschichten.','Paid Social wirkt 25 % stärker: Sein Grenz-POAS steigt. Hier lohnt sich mehr Budget.','Sale mit 45 % mehr Nachfrage: Die Sättigung setzt später ein. Mehr Gesamtbudget lohnt sich jetzt fast überall.','Search verliert 15 %: Grenz-POAS dort prüfen und gegebenenfalls umschichten.'];
function budgetCoach(){if(!coachOn()||B.done)return'';const last=B.hist[B.hist.length-1];const it=[`<b>${EVENTS[B.r].t}:</b> ${BEV_TIP[B.r]}`];

    if(rows.length){const bst=rows[0],wst=rows[rows.length-1];it.push(`<b>Letzter Monat:</b> ${bst.c.name} hatte den höchsten POAS (${de(bst.po,2)}), ${wst.c.name} den niedrigsten (${de(wst.po,2)}).`);
      const loss=rows.filter(r=>r.po<1);if(loss.length)it.push(`<b>Unter 1,0:</b> ${loss.map(r=>r.c.name).join(', ')}. Diese Kanäle haben im Schnitt Geld verloren. Kürzen, oder bei Influencer und TV prüfen, ob du unter der kritischen Masse liegst.`)}
    const zero=CH.filter(c=>last.ch[c.id].x===0&&last.ch[c.id].k>0);if(zero.length)it.push(`<b>Nachhall:</b> ${zero.map(c=>c.name).join(', ')} brachte Conversions ohne Spend. Das ist Adstock aus dem Vormonat, keine Gratis-Wirkung.`);

  else if(B.r>=1)it.push('<b>Tipp:</b> Kauf das KI-MMM für 3.000 €. Ohne Grenzwerte schätzt du nur.');

/* --- Coach: A/B --- */
function abCoach(c){if(!coachOn()||A.hard||A.choice)return'';const s=c.s;const pbar=(s.pA+s.pB)/2;const band=1.96*Math.sqrt(2*pbar*(1-pbar)/c.n)*100;const diff=(s.pB-s.pA)*100;
  const ci=s.lo>0?'liegt komplett über 0: B ist sehr wahrscheinlich besser.':s.hi<0?'liegt komplett unter 0: B ist sehr wahrscheinlich schlechter.':'schließt die 0 ein: Der echte Effekt könnte positiv, null oder negativ sein.';
  return coachBox('Lies den Test in vier Schritten',[
    `<b>1 · Stichprobe:</b> ${de(c.n)} Besucher je Variante. Zufall allein erzeugt hier Differenzen bis etwa ±${de(band,2)} Prozentpunkte. ${c.n<=2500?'Das ist wenig.':c.n>=25000?'Das ist viel.':'Das ist mittel.'}`,
    `<b>2 · Differenz:</b> B liegt ${diff>=0?'+':''}${de(diff,2)} pp vor A. Das ist ${Math.abs(diff)>band?'<b>größer</b>':'<b>kleiner</b>'} als das Rauschband.`,
    `<b>3 · p-Wert ${de(s.p,3)}:</b> ${s.p<0.05?'unter 0,05, also kaum durch Zufall erklärbar.':'über 0,05, also gut durch Zufall erklärbar.'}`,
    `<b>4 · Konfidenzintervall</b> ${de(s.lo*100,2)} … ${de(s.hi*100,2)} pp ${ci}`,
    c.peek?`<b>Achtung: Zwischenstand</b> (Tag ${c.day} von ${c.days}). Egal was die Zahlen sagen: Vor dem geplanten Ende wird nicht entschieden.`:''],'experimente')}

/* --- Coach: Churn --- */

  const prevDay=Math.floor(S.t);S.t+=dt;const day=Math.floor(S.t);if(day!==prevDay){for(let d=prevDay+1;d<=day;d++)miDay(S,d)}
  /* geplante Ausflüge */
  while(RT.sched.length&&RT.sched[0].t<=S.t){const e=RT.sched.shift();if(e.k==='v')miVisitor(S);else miStartTrip(S,e.pi,e.k)}
  const sp=1.5*dt*MIDAY;/* Kacheln pro Spieltag-Anteil: 1,5 Kacheln pro Sekunde bei 1× */
  for(const w of RT.walk)miWalk(S,w,sp);RT.walk=RT.walk.filter(w=>!w.gone);
  for(const v of RT.veh)miDrive(S,v,sp*1.5);RT.veh=RT.veh.filter(v=>!v.gone);
  for(const pr of RT.prom)miPromStep(S,pr,sp*0.6);
  for(const o of S.o){if(o.q&&o.q.length!==undefined)miServe(S,o,dt)}
  RT.flt=RT.flt.filter(f=>(f.l+=dt*MIDAY)<1.6)}
function miDir(dx,dy){return dx>0?0:dx<0?2:dy>0?1:3}
function miWalk(S,w,sp){if(w.inq){w.an+=0.02;return}if(w.wait>0){w.wait-=sp/1.5/MIDAY;if(w.wait<=0&&w.hide){w.hide=false}return}
  const cx=w.tx+0.5+(w.dir===0||w.dir===2?0:w.lane),cy=w.ty+0.5+(w.dir===1||w.dir===3?0:w.lane),dx=cx-w.x,dy=cy-w.y,dd=Math.hypot(dx,dy);
  if(dd>sp){w.x+=dx/dd*sp;w.y+=dy/dd*sp;w.an+=sp*6;return}
  w.x=cx;w.y=cy;const i=w.ty*MIN+w.tx;RT.foot[i]+=1;
  /* Kontakte mit Werbung und Läden */
  miExpose(S,w,i);
  const d=w.ff[i];if(d===0){miArrive(S,w);return}
  if(d<0){w.gone=true;if(w.pi>=0)RT.out.delete(w.pi);return}
  let best=-1,bd=d;const opts=[];for(const [ax,ay] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=w.tx+ax,ny=w.ty+ay;if(nx<0||ny<0||nx>=MIN||ny>=MIN)continue;const n=ny*MIN+nx,v=w.ff[n];if(v>=0&&v<bd)opts.push([nx,ny,ax,ay])}
  if(!opts.length){w.gone=true;if(w.pi>=0)RT.out.delete(w.pi);return}const o=opts[(w.pi>=0?w.pi:7)%opts.length];w.tx=o[0];w.ty=o[1];w.dir=miDir(o[2],o[3])}
function miExpose(S,w,i){const p=miPerson(w),cov=RT.cov[i];if(cov)for(const id of cov){if(w.seen.has(id))continue;w.seen.add(id);const o=RT.byId.get(id);if(!o||o.b>0)continue;const T=MIT[o.t],st=(T.str||0.9);
    if(o.o==='me'){const before=p.a;p.a=Math.min(1,p.a+(1-p.a)*0.07*st);if(o.c&&o.c.ct!=null){o.c.ct++;if(w.pi>=0){let s=RT.adRs.get(id);if(!s){s=new Set();RT.adRs.set(id,s)}s.add(w.pi)}}if(before<0.2&&p.a>=0.2&&!p.src)p.src=T.cat==='shop'?5:1;if(w.pi>=0&&Math.random()<0.08)miThink(p,'adMe')}
    else if(o.o==='riv'){p.r=Math.min(1,p.r+(1-p.r)*0.06*st);if(w.pi>=0&&Math.random()<0.03)miThink(p,'adRiv')}}
  /* Läden am Weg wahrnehmen und spontan hineingehen */
  const x=w.tx,y=w.ty;for(const [ax,ay] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+ax,ny=y+ay;if(nx<0||ny<0||nx>=MIN||ny>=MIN)continue;const id=RT.occ[ny*MIN+nx];if(id<0||w.seen.has('s'+id))continue;w.seen.add('s'+id);const o=RT.byId.get(id);if(!o||MIT[o.t].cat!=='shop'||o.b>0)continue;
    if(o.o==='me'){const before=p.a;p.a=Math.min(1,p.a+(1-p.a)*0.05);if(before<0.18&&p.a>=0.18){if(!p.src)p.src=5;if(w.pi>=0)miThink(p,'seeShop')}
      if((w.mode==='errand'||w.mode==='visit')&&p.q>=0.5&&o.sf>0&&!o.cl&&w.dest!==o){const opt=miOptions(S,p,[x,y]).find(c=>c.o===o);if(opt&&opt.U>0.1&&Math.random()<0.55){w.mode=w.pi>=0?'shop':'visitshop';w.dest=o;w.b='me';w.ff=miFFObj(o,false);if(w.pi>=0)miThink(p,'impulse')}}}
    else if(o.o==='riv'){p.r=Math.min(1,p.r+(1-p.r)*0.03)}}
  if(w.pi>=0&&Math.random()<0.004){const a=miAtmTile(x,y);if(a>=4)miThink(p,'nice')}}
function miAtmTile(x,y){let a=0;for(let yy=y-2;yy<=y+2;yy++)for(let xx=x-2;xx<=x+2;xx++){if(xx<0||yy<0||xx>=MIN||yy>=MIN)continue;const id=RT.occ[yy*MIN+xx];if(id<0)continue;const q=RT.byId.get(id);if(q&&MIT[q.t].atm)a+=MIT[q.t].atm}return a}
function miArrive(S,w){const o=w.dest,p=miPerson(w);
  if(w.mode==='home'){w.gone=true;if(w.pi>=0)RT.out.delete(w.pi);return}
  if(MIT[o.t].cat==='shop'&&(w.mode==='shop'||w.mode==='visitshop')){if(!S.o.includes(o)||o.cl||((o.o==='me'||o.o==='riv')&&!(o.sf>0))){if(w.pi>=0)miThink(p,'closed');miGoHome(S,w);return}
    if(o.c)o.c.vis++;if(o.o==='me')S.mon.vis++;const ql=o.q.length;if(ql>=6&&Math.random()<0.8){if(w.pi>=0)miThink(p,'queue');if(o.c)o.c.qf++;if(o.o==='me'){S.mon.cpl++;p.f=Math.max(-1,p.f-0.06)}miGoHome(S,w);return}
    w.inq=o;w.qt=S.t;o.q.push(w);return}
  /* Ausflugsziel erreicht: kurz verweilen, dann zurück */
  if(w.mode==='visit'||w.mode==='errand'){w.wait=0.08+Math.random()*0.25;w.hide=o.t!=='brunnen'&&o.t!=='bank';w.mode='return';w.ff=w.ret?miFFObj(w.ret,false):miFFHome(p);if(!w.ff){w.gone=true;if(w.pi>=0)RT.out.delete(w.pi)}return}
  if(w.mode==='return'){w.gone=true;if(w.pi>=0)RT.out.delete(w.pi);return}
  miGoHome(S,w)}
function miFFHome(p){const h=RT.byId.get(p.h);if(!h)return null;return miFFObj(h,false)}
function miGoHome(S,w){w.inq=null;w.mode=w.v?'return':'home';const p=miPerson(w);w.ff=w.ret?miFFObj(w.ret,false):miFFHome(p);if(!w.ff){w.gone=true;if(w.pi>=0)RT.out.delete(w.pi)}}
/* Kassen: so viele gleichzeitige Bedienungen wie Personal */
function miServe(S,o,dt){if(!o.q.length)return;const T=MIT[o.t],servers=o.o==='me'?(o.sf||0):o.o==='riv'?(o.sf||2):3;if(!servers){o.q.forEach(w=>{const p=miPerson(w);if(w.pi>=0)miThink(p,'closed');miGoHome(S,w)});o.q=[];return}
  o.sv=o.sv||[];const rate=o.o==='me'?1:1;for(let k=0;k<servers&&k<o.q.length;k++){const w=o.q[k];w.sv=(w.sv||0)+dt*rate;if(w.sv>=0.075){o.q.splice(k,1);k--;miBuy(S,o,w)}}
  /* Geduld */
  for(let k=servers;k<o.q.length;k++){const w=o.q[k];if(S.t-w.qt>0.6){o.q.splice(k,1);k--;const p=miPerson(w);if(w.pi>=0)miThink(p,'queue');if(o.c)o.c.qf++;if(o.o==='me'){S.mon.cpl++;p.f=Math.max(-1,p.f-0.08)}miGoHome(S,w)}}}
function miBuy(S,o,w){const p=miPerson(w),waited=S.t-w.qt;let brand=o.o==='me'?'me':o.o==='riv'?'riv':o.t==='markt'?'gen':(w.b==='drogMe'?'me':'riv');
  if(brand==='me'){const st=o.st||{};const seg=MISEG[p.s];
    /* Preisschwelle: zu teuer? */
    const idx=miPrice(S,'brush')/MIREF.brush;const tol=seg.beta>1.5?1.25:seg.beta>0.9?1.6:2.1;if(idx>tol*(1+p.f*0.3)&&Math.random()<0.7){if(w.pi>=0)miThink(p,'tooExp');if(o.c)o.c.exp=(o.c.exp||0)+1;S.mon.cpl++;p.f=Math.max(-1,p.f-0.03);miGoHome(S,w);return}
    if((st.brush||0)<MIK){if(w.pi>=0)miThink(p,'sold');if(o.c)o.c.lost++;S.mon.lost++;S.mon.cpl++;p.f=Math.max(-1,p.f-0.15);p.bad=o.i;miGoHome(S,w);return}
    const r=miBasket(S,p,o,'me',st);const isDrog=o.t==='drog';if(isDrog)S.mon.revDrog+=r.rev;else S.mon.rev+=r.rev;S.cash+=r.rev;if(o.c){o.c.buy++;o.c.rev+=r.rev;o.c.wt+=waited}S.mon.buy++;S.mon.sales.me++;
    if(p.l===0&&w.pi>=0)S.mon.newC++;p.l++;p.k=1;p.q=0;p.bad=0;
    const sat=0.55+MIPROD.brush.q*0.3-Math.min(0.4,waited*0.9)-Math.max(0,idx-1.3)*0.25*seg.beta+miAtm(o)*0.02+(MIT[o.t].aura?0.1:0)+(S.rs.done.includes('karte')?0.04:0);
    p.f=Math.max(-1,Math.min(1,p.f+(sat-0.5)*0.35));p.a=Math.min(1,p.a+0.05);
    if(w.pi>=0)miThink(p,p.l>=4&&Math.random()<0.4?'loyal':waited>0.35?'slow':'buyMe',sat>0.65?'Gute Qualität.':sat>0.45?'Passt schon.':'Na ja.');
    RT.flt.push({x:o.x+MIT[o.t].w/2,y:o.y+MIT[o.t].d/2,z:MIT[o.t].w>1?60:34,txt:'+'+eur(r.rev),l:0});
    w.bag=MIBR.me.main;
    /* Mundpropaganda */
    if(sat>0.62&&w.pi>=0&&Math.random()<0.28){const mates=S.ps.filter((q,ix)=>q.h===p.h&&q!==p);const pool=mates.length&&Math.random()<0.6?mates:S.ps;const q=pool[(Math.random()*pool.length)|0];if(q&&q!==p){const b=q.a;q.a=Math.min(1,q.a+0.18);q.f=Math.min(1,q.f+0.05);if(b<0.2&&q.a>=0.2&&!q.src)q.src=2;if(Math.random()<0.5)miThink(q,'wom',RT.look[w.pi].name.split(' ')[0])}}}
  else{if(brand==='riv'){S.mon.sales.riv++;p.k=2;p.n++;p.d=Math.min(1,p.d+0.02);if(w.pi>=0)miThink(p,o.t==='drog'?'buyDrog':'buyRiv','Dentara');w.bag=o.t==='drog'?MIBR.drog.main:MIBR.riv.main;S.riv.cash+=(S.riv.pr.brush+S.riv.pr.paste*0.75)*MIK*0.45}
    else{S.mon.sales.gen++;p.k=3;if(w.pi>=0)miThink(p,'buyGen');w.bag=MIBR.markt.main}p.q=0}
  miGoHome(S,w)}
/* Promoter:innen laufen in der Nähe ihres Ladens und verteilen Proben */
function miPromStep(S,pr,sp){const o=RT.byId.get(pr.store);if(!o){pr.gone=1;return}if(!pr.x){const d=miDoor(o);if(d<0)return;pr.x=d%MIN+0.5;pr.y=((d/MIN)|0)+0.5;pr.tx=d%MIN;pr.ty=(d/MIN)|0;pr.dir=0;pr.an=0}
  const dx=pr.tx+0.5-pr.x,dy=pr.ty+0.5-pr.y,dd=Math.hypot(dx,dy);if(dd>sp){pr.x+=dx/dd*sp;pr.y+=dy/dd*sp;pr.an+=sp*6;return}pr.x=pr.tx+0.5;pr.y=pr.ty+0.5;
  const opts=[];for(const [ax,ay] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=pr.tx+ax,ny=pr.ty+ay;if(nx<0||ny<0||nx>=MIN||ny>=MIN)continue;if(!MIWALK[+S.g[ny*MIN+nx]])continue;if(Math.abs(nx-o.x)>5||Math.abs(ny-o.y)>5)continue;opts.push([nx,ny,ax,ay])}
  if(opts.length){const c=opts[(Math.random()*opts.length)|0];pr.tx=c[0];pr.ty=c[1];pr.dir=miDir(c[2],c[3])}
  for(const w of RT.walk){if(w.inq||w.hide)continue;if(Math.abs(w.x-pr.x)+Math.abs(w.y-pr.y)<1.3&&!w.seen.has('pr')){w.seen.add('pr');const p=miPerson(w);const b=p.a;p.a=Math.min(1,p.a+0.12);p.f=Math.min(1,p.f+0.03);p.q=Math.min(1.2,p.q+0.15);if(b<0.2&&p.a>=0.2&&!p.src)p.src=3;if(w.pi>=0&&Math.random()<0.5)miThink(p,'sample')}}}
function miDrive(S,v,sp){const cx=v.tx+0.5,cy=v.ty+0.5,dx=cx-v.x,dy=cy-v.y,dd=Math.hypot(dx,dy);if(dd>sp){v.x+=dx/dd*sp;v.y+=dy/dd*sp;return}v.x=cx;v.y=cy;const i=v.ty*MIN+v.tx,d=v.ff[i];
  if(d===0){if(v.state==='go'){v.state='back';if(v.truck&&v.load){const o=v.dest;if(S.o.includes(o)){o.st=o.st||{};Object.entries(v.load).forEach(([k,n])=>o.st[k]=(o.st[k]||0)+n)}else Object.entries(v.load).forEach(([k,n])=>S.wh[k]+=n);v.load=null}
      if(v.supply){Object.entries(v.supply).forEach(([k,n])=>S.wh[k]=(S.wh[k]||0)+n);v.gone=true;return}
      if(v.from){v.ff=miFFObj(v.from,true);v.dest=v.from}else{v.gone=true}return}else{v.gone=true;return}}
  if(d<0){v.gone=true;if(v.load)Object.entries(v.load).forEach(([k,n])=>S.wh[k]+=n);return}
  for(const [ax,ay] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=v.tx+ax,ny=v.ty+ay;if(nx<0||ny<0||nx>=MIN||ny>=MIN)continue;const n=ny*MIN+nx;if(v.ff[n]>=0&&v.ff[n]<d){v.tx=nx;v.ty=ny;v.dir=miDir(ax,ay);return}}v.gone=true}
/* ---------- Tageswechsel ---------- */
function miDay(S,day){const D=miDate(day),seg=MISEG;
  /* Fixkosten anteilig pro Tag */
  let rent=0,wage=S.drv*MIWAGE.drv+S.prom.length*MIWAGE.prom,ads=0;for(const o of S.o){if(o.o!=='me')continue;const T=MIT[o.t];if(o.b>0)continue;if(T.cat==='ad')ads+=T.rent||0;else rent+=T.rent||0;if(o.sf)wage+=o.sf*MIWAGE.sf}
  const res=MIRESLV[S.rs.lv].c,int=S.loan*0.06/12,camp=S.camp.reduce((s,c)=>s+(MICAMP[c.k].c||0)*30/7,0);
  const pd=x=>x/30;S.mon.rent+=pd(rent);S.mon.wage+=pd(wage);S.mon.ads+=pd(ads);S.mon.res+=pd(res);S.mon.int+=pd(int);S.mon.camp+=pd(camp);S.cash-=pd(rent+wage+ads+res+int+camp);
  /* Baustellen */
  for(const o of S.o)if(o.b>0){o.b--;if(o.b===0){if(MIT[o.t].rad||MIT[o.t].aura)miCov();if(o.o==='me')miNews(S,'Fertig gebaut',MIT[o.t].n+' ist eröffnet.'+(MIT[o.t].cat==='shop'?' Vergiss nicht, Personal einzustellen.':''),[o.x,o.y],'good');else if(o.o==='riv'&&MIT[o.t].cat==='shop')miNews(S,'Dentara eröffnet',`Dentara hat einen neuen ${MIT[o.t].n.replace('Fjord-','')} eröffnet.`,[o.x,o.y],'bad')}}
  /* Wetter */
  if(--S.wx.d<=0){const winter=D.m<2||D.m>9,r=Math.random();S.wx.k=r<(winter?0.38:0.22)?'rain':r<0.55?'cloud':'sun';S.wx.d=2+((Math.random()*4)|0)}
  /* Forschung */
  if(S.rs.cur&&!S.rs.done.includes(S.rs.cur)){const lab=S.o.some(o=>o.t==='labor'&&o.o==='me'&&!o.b);S.rs.prog+=MIRESLV[S.rs.lv].p*(lab?1.5:1);const it=MIRES.find(r=>r.k===S.rs.cur);if(it&&S.rs.prog>=it.p){S.rs.done.push(it.k);S.rs.prog=0;miNews(S,'Forschung abgeschlossen',it.n+': '+it.d,null,'good');const nx=MIRES.find(r=>!S.rs.done.includes(r.k));S.rs.cur=nx?nx.k:null}}
  /* Kampagnen */
  const boost=S.o.some(o=>o.t==='buero'&&o.o==='me'&&!o.b)?1.25:1;
  S.camp=S.camp.filter(c=>{if(c.end<=day){miNews(S,'Kampagne beendet',MICAMP[c.k].n+' ist ausgelaufen.',null);return false}return true});
  for(const c of S.camp){const n=S.ps.length;if(c.k==='social'){const w=[0.6,1,1.2,1.5];S.ps.forEach(p=>{if(Math.random()<0.03*w[p.s]*boost){const b=p.a;p.a=Math.min(1,p.a+(1-p.a)*0.12);if(b<0.2&&p.a>=0.2&&!p.src)p.src=4;if(Math.random()<0.15)miThink(p,'social')}})}
    if(c.k==='infl'){S.ps.forEach(p=>{if(p.s===c.seg&&Math.random()<0.05*boost){const b=p.a;p.a=Math.min(1,p.a+(1-p.a)*0.18);p.f=Math.min(1,p.f+0.04);if(b<0.2&&p.a>=0.2&&!p.src)p.src=4;if(Math.random()<0.2)miThink(p,'infl')}})}
    if(c.k==='radio'){S.ps.forEach(p=>{if(Math.random()<0.04*boost){const b=p.a;p.a=Math.min(1,p.a+(1-p.a)*0.08);if(b<0.2&&p.a>=0.2&&!p.src)p.src=4;if(Math.random()<0.1)miThink(p,'radio')}})}
    if(c.k==='flyer'){const o=RT.byId.get(c.store);if(o)S.ps.forEach(p=>{const h=RT.byId.get(p.h);if(h&&Math.abs(h.x-o.x)+Math.abs(h.y-o.y)<9&&Math.random()<0.06*boost){p.a=Math.min(1,p.a+0.08);p.q=Math.min(1.2,p.q+0.3);if(!p.src&&p.a>=0.2)p.src=4;if(Math.random()<0.3)miThink(p,'flyer')}})}}
  /* Bedürfnisse, Vergessen, Tagesplan */
  RT.walk.forEach(w=>{w.age=(w.age||0)+1;if(w.age>4){w.gone=true;if(w.inq&&w.inq.q)w.inq.q=w.inq.q.filter(x=>x!==w)}});RT.walk.filter(w=>w.gone).forEach(w=>{if(w.pi>=0)RT.out.delete(w.pi)});RT.walk=RT.walk.filter(w=>!w.gone);
  RT.sched=RT.sched.filter(e=>e.t>day);const rain=S.wx.k==='rain';
  S.ps.forEach((p,i)=>{p.q+=1/22*(0.7+Math.random()*0.6)+(D.m===10&&D.day>=24?0.03:0);p.a*=0.9965;p.r*=0.9985;p.f*=0.998;p.d*=0.999;
    if(p.q>=1&&!RT.out.has(i)){if(rain&&Math.random()<0.4){if(Math.random()<0.05)miThink(p,'rain');return}RT.sched.push({t:day+0.05+Math.random()*0.85,pi:i,k:'shop'})}
    else if(!RT.out.has(i)&&Math.random()<(rain?0.03:0.075))RT.sched.push({t:day+Math.random()*0.95,pi:i,k:'errand'})});
  const vis=Math.round((rain?6:14)*(0.6+S.rating/1000));for(let k=0;k<vis;k++)RT.sched.push({t:day+Math.random()*0.95,k:'v'});
  RT.sched.sort((a,b)=>a.t-b.t);
  /* Lieferant: wöchentliche Bestellung, Lieferung nach 5 Tagen */
  const lg=S.o.find(o=>o.t==='lager'&&o.o==='me'&&!o.b);
  S.ord=S.ord.filter(od=>{if(od.due<=day){if(lg){const edge=S.o.find(o=>o===lg);const v=miSendVanFromEdge(S,lg,od.items);if(!v)Object.entries(od.items).forEach(([k,n])=>S.wh[k]=(S.wh[k]||0)+n)}return false}return true});
  if(lg&&day%7===0){const items={};let sum=0,tot=Object.values(S.wh).reduce((a,b)=>a+b,0)+S.ord.reduce((a,od)=>a+Object.values(od.items).reduce((x,y)=>x+y,0),0);
    Object.keys(MIPROD).forEach(k=>{if(!miHas(S,k))return;const inc=S.ord.reduce((a,od)=>a+(od.items[k]||0),0),n=Math.max(0,Math.min(S.tgt[k]-(S.wh[k]||0)-inc,MIT.lager.cap-tot-sum));if(n>0){items[k]=n;sum+=n}});
    if(sum>0){const cost=Object.entries(items).reduce((s,[k,n])=>s+n*MIPROD[k].cost,0);S.cash-=cost;S.mon.cogs+=cost;S.ord.push({due:day+5+(S.evd.includes('delay')&&D.mon===4?7:0),items})}}
  miDispatch(S);
  /* Konkurrenz */
  miRivalDay(S,day);
  /* Anteile und Bewertung */
  const L=S.mon.sales,pv=S.hist[S.hist.length-1],tot=(L.me+L.riv+L.gen)+(pv?pv.sales.me+pv.sales.riv+pv.sales.gen:0);if(tot>0){const sm=(L.me+(pv?pv.sales.me:0))/tot,sr=(L.riv+(pv?pv.sales.riv:0))/tot;S.share={me:sm,riv:sr,gen:1-sm-sr}}
  S.rating=Math.round(S.rating*0.85+miRating(S)*0.15);
  /* Ereignisse und Monatswechsel */
  miEvents(S,day);

function miAdvice(S){const it=[],M=S.mon,shops=miShops(S,'me').filter(o=>!o.b),aw=miAvg(S,p=>p.a);

  if(shops.some(o=>!o.sf))it.push(['Laden ohne Personal','Ein Laden ohne Kassenkraft bleibt zu. Öffne das Ladenfenster und stelle jemanden ein.']);
  if(aw<0.15&&S.t>10)it.push(['Kaum jemand kennt Fjord',`Nur ${pct(aw,0)} der Menschen kennen Fjord. Bekanntheit ist die erste Stufe im Trichter: Ohne sie kauft niemand. Plakate an belebten Wegen, Promoter:innen und Kampagnen helfen.`]);
  const q=shops.filter(o=>o.c&&o.c.qf>3);if(q.length)it.push(['Lange Schlangen',`In ${q.length===1?'einem Laden':q.length+' Läden'} gehen Menschen wieder, weil die Schlange zu lang ist. Mehr Kassenkräfte oder ein zweiter Laden in der Nähe verteilen die Nachfrage.`]);
  const so=shops.filter(o=>o.c&&o.c.lost>0);if(so.length)it.push(['Ausverkauft',`Leere Regale verärgern Kund:innen, und sie meiden den Laden danach. Erhöhe die Zielmenge im Lager oder stelle mehr Fahrer:innen ein.`]);

  if(!it.length)it.push(['Alles im Griff','Schau in die Marktanalyse: Der Trichter zeigt, wo du am meisten gewinnen kannst.']);return it}

function miLoop(ts){MIV.raf=requestAnimationFrame(miLoop);if(current!=='tycoon'||!MI||!$('#miCv')){cancelAnimationFrame(MIV.raf);MIV.raf=0;MIV.speed=0;return}

  if(S.dec&&!MIV.wins.find(w=>w.k==='dec')){miSpeed(0);miOpenWin('dec')}
  if(RT.monthEnd){RT.monthEnd=false;miSnap();if(S.done){miSpeed(0);miFinish();viewTycoon();return}}

/* ========== SIM: PRODUKTLEBENSZYKLUS (BASS) ========== */
const BSQ=20;
const BSEV={5:{t:'Wettbewerber',txt:'Ein großer Elektronikkonzern bringt einen eigenen Smart-Ring. Er greift ein Drittel des verbleibenden Marktes an.',comp:0.33},9:{t:'Billig-Anbieter',txt:'Günstige Smart-Ringe aus Fernost kommen auf den Markt. Preisbewusste Käufer wandern ab, wenn dein Preis hoch ist.',cheap:1},13:{t:'Sättigung',txt:'Die Medien schreiben: „Smart-Ringe sind Mainstream.“ Neugierige Erstkäufer werden seltener.',sat:1}};
function bsNew(){return{q:0,price:299,ad:400000,ref:false,cap:40000,capQ:[],gen2:0,gen2Done:false,N:0,N2:0,cum:0,cash:3000000,hist:[],done:false,comp:0,cheap:false,news:[{q:0,t:'Launch',txt:'Pulse, ein Smart-Ring für Schlaf- und Fitnessdaten, kommt in Deutschland, Österreich und der Schweiz auf den Markt. 3 Mio. € Budget, 5 Jahre. Der Handel behält 40 % vom Verkaufspreis.'}]}}
function bsM(S,price,g2){return (g2?0.8e6:1.2e6)*Math.pow(299/price,0.9)}
function bsQuarter(S,noise){const ev=BSEV[S.q]||{};if(ev.comp)S.comp=ev.comp;if(ev.cheap)S.cheap=true;
  const p=(0.004+0.03*(1-Math.exp(-S.ad/1.5e6)))*(ev.sat||S.q>13?0.6:1),q=0.32+(S.ref?0.08:0)+(S.gen2Done?0.04:0);
  let M=bsM(S,S.price,false)*(1-S.comp)*(S.cheap&&S.price>249?0.85:1);
  const rem=Math.max(0,M-S.N),demand=(p+q*S.N/Math.max(M,1))*rem,innov=p*rem,imit=demand-innov;
  let d2=0;if(S.gen2Done){const M2=bsM(S,S.price,true)*(1-S.comp*0.5);d2=(0.02+0.25*S.N2/M2)*Math.max(0,M2-S.N2)+S.N*0.04}
  let dem=demand+d2;if(noise)dem*=1+0.05*gauss();const sold=Math.min(dem,S.cap),lost=dem-sold;
  const shareNew=dem>0?sold/dem:1;S.N+=demand*shareNew;S.N2+=d2*shareNew;
  const uc=115*Math.pow(Math.max(1,(S.cum+sold)/50000),-0.234)+(S.ref?6:0);S.cum+=sold;
  const rev=sold*S.price*0.6,cogs=sold*uc,capCost=S.cap*6,profit=rev-cogs-S.ad-capCost-(S.gen2>0&&!S.gen2Done?S.gen2:0);S.cash+=profit;
  S.capQ=S.capQ.filter(c=>{c.w--;if(c.w<=0){S.cap+=c.u;return false}return true});
  if(S.gen2>0&&!S.gen2Done){S.g2acc=(S.g2acc||0)+S.gen2;if(S.g2acc>=2500000){S.gen2Done=true;S.news.push({q:S.q,t:'Generation 2',txt:'Pulse 2 mit Blutsauerstoff-Messung kommt auf den Markt. Ein neuer Markt öffnet sich, bestehende Kund:innen rüsten auf.'})}}
